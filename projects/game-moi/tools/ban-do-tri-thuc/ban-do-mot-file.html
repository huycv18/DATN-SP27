t gấp | Giờ giao thương | `de-xuat-ca-cang-kieu-dave.md` mục 4 (ước) |\n| Đếm số Tally ở kết thúc giờ giao thương | 1,5 giây, bấm một lần để hiện ngay | 1 đến 2 | Chậm | Mất cảm giác gom | Giờ giao thương | ước |\n| Camera giờ giao thương | Một màn 1280x720, không cuộn, thấy kho, ô quầy và 3 cửa neo | | | | Giờ giao thương | demo bot 2026-11-20, gd-world xác nhận |\n| Thời gian phản hồi nhấn | 0,1 giây | dưới 0,2 | | | Mọi màn | [S6] |\n| Thời gian chờ không có phản hồi mới | 10 giây | | | | Mọi màn | [S6] |\n| Cảnh truyện bỏ qua | 1 lần bấm | | | | Truyện | gốc `cot-truyen.md` luật 8 |\n| Tần số cập nhật HUD đồng đội | 5 lần mỗi giây | 2 đến 20 | Mượt, tốn mạng | Giật | Co-op | ước, gd-tech xác nhận |\n\nNúm gap: cỡ chữ tối thiểu, ngưỡng nhấp nháy và giờ tự tính ở lại là ba tham số nối ý đồ trợ năng và co-op với con số. Chỉnh bằng playtest.","he-thong/ux-ui.md",""],["4. Trường hợp biên",2,272,9,2.84,"| Ca | Xử lý |\n|---|---|\n| Oxy bằng 0 khi túi đang mở | Túi đổi sang chế độ UI-34 ngay trong cùng khung hình, không đóng rồi mở |\n| Ngạt trong lúc đang bắn, đang giữ phím | Mọi thao tác giữ hủy (theo `nguoi-choi.md` 2.3), vòng HUD-14 vỡ |\n| Hai ping cùng lúc ở một chỗ | Gộp thành một biểu tượng có số người, ghi tên người ping gần nhất |\n| Người chơi đã dùng hết 3 ping rồi bấm T | Bánh ping hiện mờ với chữ \"Hết ping\" |\n| Đổi thiết bị giữa chừng (chuột sang tay cầm) | Glyph đổi trong một khung hình, con trỏ ẩn |\n| Phím gán trùng | Báo hành động trùng và cho Hoán đổi, không tự ghi đè |\n| Chữ 200% làm HUD tràn | Ẩn HUD-12 và HUD-13 trước, thu HUD-07 còn 2 hàng, HUD-01 đến HUD-05 luôn giữ trong lề |\n| Đổi cỡ chữ giữa chuyến | Áp ngay, không dừng, HUD sắp lại trong một khung hình |\n| Tên người chơi quá dài | Cắt ở 16 ký tự kèm dấu ba chấm, đầy đủ ở UI-03 |\n| Nhóm 4 người, cả 3 đồng đội cùng ngạt | HUD-07 hiện đủ 3 hàng, thứ tự theo thời gian còn lại, hàng ngạt gần hết nhất lên đầu |\n| Mất kết nối giữa lúc giữ phím sửa khoang | Tiến độ giữ nguyên (khớp `tram-va-cang.md` luật 3), hiện chữ Mất kết nối |\n| Mở menu giữa giờ giao thương khi từ 2 người | Đồng hồ ca không dừng, khung menu có biểu tượng \"Thời gian vẫn chạy\" |\n| Tàu hết kiên nhẫn đúng lúc người chơi bấm giao | Thùng trên tay về kho, hiện \"Tàu đã rời, thùng về kho\", không trừ Tally |\n| Hai người cùng bấm nhặt một thùng | Người bấm trước nhận, người kia thấy ô quầy trống và không có thông báo lỗi |\n| Danh mục hết sạch giữa ca | Mọi mục xám kèm \"Hết\", không tàu mới vào, ca kết thúc khi tàu cuối rời |\n| Chữ 200% làm HUD giờ giao thương tràn | Ẩn HCH-03 trước, rồi HCH-02, danh mục còn thu thành số, HCH-01 và HCH-05 luôn giữ |\n| Hai người cùng nhìn UI-44 và một người nâng cấp | Dữ liệu chung, người kia thấy số đổi, nút mờ cập nhật trong 1 giây |\n| Người vào sau trong lúc nhóm đang ở UI-36 | Vào UI-20, thấy \"Nhóm vừa về\", xem lại tóm tắt khi bấm vào chip |\n| Cảnh truyện bị bỏ qua giữa chừng | Sổ tay ghi tóm tắt một câu (khớp `cot-truyen.md` luật 8) |\n| Gợi ý T14 (né) đang hiện khi Oxy xuống dưới 25% | Gợi ý tắt ngay, nhường chỗ cho cảnh báo Oxy |\n| Tutorial trigger nhưng điều kiện luật chưa đạt (ví dụ chưa có Dùi xung) | Bước không kích, giữ chờ, ghi sự kiện để gd-tech phát hiện chuỗi kẹt |\n| Một mình mở Menu giữa chuyến | Thời gian dừng, tiêu đề đổi thành Tạm dừng. Từ 2 người tiêu đề là Menu |\n| Cỡ chữ 200% và 1280x720 cùng lúc | Mọi màn T vẫn lọt trong lề, danh sách dài cuộn một chiều |\n| Chuỗi thiếu trong bảng strings | Hiện chữ dự phòng tiếng Anh ngắn, ghi nhật ký, không treo màn |","he-thong/ux-ui.md",""],["5. Ràng buộc vật lý của luật",2,272,9,1.19,"- HUD không che quá 25% chiều ngang trung tâm (320 px ở 720p, từ 480 đến 800 px). HUD-05 (Dưới giữa) là ngoại lệ vì nằm sát mép dưới, cao tối đa 72 px ở 720p và không chiếm vùng bay. Cột trái HUD tối đa 400 px (64 + 400 = 464 px, còn dưới 480). Đo bằng ảnh chụp ở cỡ chữ 200% trong tiêu chí 5.\n- Tổng hàng chữ ở HUD bay tối đa 10 dòng ở 100%. Ở 200% phải ẩn bớt theo thứ tự ở mục 4.\n- Mỗi người một màn hình, không có chia đôi màn (C5). 4 người nghĩa là 4 máy, giao diện không cần chia khung.\n- Vùng nhìn tối thiểu 17,8 x 10,0 u. Đòn vào màn từ mép ở tổng tốc độ tới 18 u/s (12 của hazard cộng 6 của người bay ngược) đi hết nửa ngang 8,9 u trong 0,49 giây, ít hơn báo trước cũ 0,5 giây. Đã xử xong: gd-combat nâng báo trước tối thiểu lên 0,7 giây (đòn hẹp) và 1,0 giây (đòn vùng), gd-world nâng báo trước hazard lên 1 giây, cả hai tính từ lúc chỉ báo mép hiện và đều có chỉ báo mép (HUD-06). Phép tính giản lược, chưa đo trên prototype.\n- 35 màn do một artist dựng bằng một bộ kit dùng chung. Mỗi màn mới phải tái dùng thành phần của kit (nút, khung, thanh, danh sách, bảng).","he-thong/ux-ui.md",""],["6. Yêu cầu cho engineer / tool",2,272,9,1.67,"Đầu vào: dữ liệu từ các hệ thống (Oxy, tải, trạng thái người chơi, danh sách tàu, danh sách khoang, kho), cấu hình input. Đầu ra: giao diện và sự kiện theo dõi.\n\n- Bảng strings: `projects/game-moi/strings/strings.tsv` do gd-ux giữ, cột key, text, giới hạn, màn. Chuỗi không hardcode trong code. Dev chọn UI toolkit.\n- Một nhà cung cấp glyph theo thiết bị. Một nhà cung cấp gán phím có lưu theo hồ sơ máy.\n- Vạch \"đủ về\" (HUD-02) tính ở một chỗ duy nhất theo công thức `nguoi-choi.md` mục 3, UI chỉ đọc kết quả.\n- Tiến độ tutorial lưu theo hồ sơ máy dạng tập các ID bước đã hiện.\n- Cài đặt giữ ở hồ sơ máy, không đồng bộ qua mạng.\n\nSự kiện cho Event Tracking (gd-tech giữ tab):\n\n| Sự kiện | Tham số |\n|---|---|\n| ux_screen_open | screen_id, device, thời điểm trong ngày |\n| ux_tut_step_shown, ux_tut_step_done, ux_tut_step_skipped | step_id, thời gian trong bước, số chuyến đã đi |\n| ux_hud_warning | ngưỡng Oxy (50, 25, 10), có đủ về không |\n| ux_pin_changed | món, tự động hay người chơi |\n| ux_input_device_change | từ, tới |\n| ux_settings_change | key, giá trị |\n| ux_dead_end | screen_id, thời gian đứng yên trên 20 giây |\n| ux_catalog_confirm | số loại, tổng thùng, số tàu thiếu hàng, đơn đặt trước có trong danh mục hay không (đề xuất cho gd-tech) |\n| ux_wrong_dock | cửa neo, số lần trong ca (đề xuất) |\n| ux_pump | xong hay hủy, thời gian giữ (đề xuất) |\n\nNơi luật phải cùng đổi: bảng 2.2, 2.4, 2.5, bảng strings, `ux/kiem-ux.mjs`, `nguoi-choi.md` bảng phím 2.7, Sheet WIREFRAME và Tutorials.","he-thong/ux-ui.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,272,9,2.06,"Một artist, vector, ưu tiên bộ kit tái dùng. Số của bảng dưới theo mức ưu tiên của MVP.\n\n| Sự kiện hay thứ | Hình | Âm | Text, tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Bộ kit UI | Khung, nút 5 trạng thái (thường, hover, nhấn, focus, khóa), thanh, danh sách, bảng, vòng tiến độ | Click, hover, xác nhận, hủy | | MVP |\n| Font | Một font sans đủ dấu tiếng Việt, số có độ rộng đều cho Oxy và Tally | | Cỡ 12 px ở 720p là tối thiểu | MVP |\n| Màu và hình slot | 4 màu và 4 hình (tròn, tam giác, vuông, thoi) kiểm tương phản, mô phỏng mù màu | | | MVP |\n| Biểu tượng ping | 4 biểu tượng: Tới đây, Cảnh báo, Cần Oxy, Tìm thấy | Mỗi ping một âm ngắn khác nhau | Chữ trên bánh | MVP |\n| Biểu tượng la bàn | Ember (trạm), Recall Beacon (tháp), đồng đội (hình slot), điểm ping | | | MVP |\n| Bậc hiếm | 4 bậc khác nhau cả màu, viền và hình | Cao độ nhặt theo bậc | Chú giải ở Kho | MVP |\n| Biểu tượng trạng thái Oxy | Bình đủ, 50%, 25%, 10%, vạch đủ về sọc chéo | Bíp theo ngưỡng | | MVP |\n| Biểu tượng thùng | 1 cỡ, nhãn loại hàng, viền và số theo cửa neo 1 đến 3, thùng đặt trước có nhãn riêng | | | MVP |\n| Cửa neo và ô quầy | 3 cửa neo có số lớn và màu khác màu slot, ô quầy cùng số cùng màu | Tiếng cập bến | | MVP |\n| Bong bóng gọi món và thanh kiên nhẫn | Bong bóng có hình thùng, vòng đếm 3 giây, thanh có vạch mốc 2/3 và 1/3, chip Bơm khí | Tích tắc dưới 1/3, xì khí khi bơm | | MVP |\n| Chân dung thương nhân | TA01 Tikko và TA02 dân Oru ở MVP, các tàu khác Sau MVP | | Tên theo `cot-truyen.md` | MVP |\n| Khoang mặt cắt | Hỏng (tối, khung đỏ), Hoạt động (sáng), Đang nâng cấp (giàn giáo) cho 8 khoang MVP (KH01 đến KH07 và KH13) | Máy khởi động theo khoang | | MVP |\n| Glyph | Bộ bàn phím, Xbox, PlayStation | | | MVP |\n| Cảnh bỏ qua | Nút Bỏ qua luôn hiện ở góc | | | MVP |\n| Biểu tượng sự cố | Rò khí, chập điện, Driftlife sổng | Còi ngắn | | Sau MVP |","he-thong/ux-ui.md",""],["7b. Cảm giác (game feel)",2,272,9,0.6,"- Tham chiếu: khoảnh khắc cuối ca hiện tổng doanh thu và lời khách của Dave the Diver (đã nêu ở `tram-va-cang.md` 7b), thanh tiến độ hiện rõ khi giữ phím thoát Escape Pod 6 giây của Dave (`06-dave-the-diver-cau-truc.md` D9). Cảm giác nhặt thùng, giao và nhận Tally nhanh như thả món vào ô giao trong Overcooked (tham chiếu của gd-quan).\n- Phản tham chiếu: đếm ngược hét lên, chữ Thất bại, popup chặn màn khi đang bay, HUD phủ kín màn.\n- Thời gian phản hồi, từng lớp và từng khoảnh khắc ở bảng 2.11. Tham số bật tắt từng lớp ở prototype.","he-thong/ux-ui.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,272,9,3.17,"Chỉ số kết quả và trải nghiệm (đều chưa đo, mục tiêu là ước):\n\n| Chỉ số | Mục tiêu ước | Ai đo |\n|---|---|---|\n| Người chơi mới đọc HUD-01 và HUD-02 nói được \"còn đủ về không\" trong 5 giây | Từ 3 trên 5 người | gd-qa playtest |\n| Tỉ lệ người chơi ghim món trước lần ngạt đầu | Trên 70% sau tutorial (khớp `nguoi-choi.md` mục 8) | gd-qa |\n| Tỉ lệ người chơi mới hoàn tất T01 tới T24 trong buổi chơi đầu | Đo trước, đặt mục tiêu sau 5 buổi playtest | gd-qa, gd-tech |\n| Người chơi mới lập danh mục và giao thùng đầu tiên ở ca đầu không hỏi, không nhìn bảng phím | Từ 4 trên 5 người (ước) | gd-qa playtest |\n| Bước tutorial có nhiều người bỏ qua hoặc kẹt nhất | Đo trước, đặt mục tiêu sau 5 buổi playtest | gd-tech funnel |\n| Thời gian từ vào thế giới mới tới lần đầu ra cửa khí | Dưới 3 phút (ước) | gd-qa |\n| Số lần người chơi hỏi hoặc nhìn bảng phím trong chuyến đầu | Đo trước, đặt mục tiêu sau 5 buổi playtest | gd-qa |\n\nTiêu chí nghiệm thu (gd-qa pass hoặc fail):\n1. `node projects/game-moi/ux/kiem-ux.mjs` thoát 0: mọi màn ở bảng 2.2 có đủ ba câu, hành động chính và năm trạng thái, mọi key có giới hạn và không vượt giới hạn, mọi luật K và C trong bảng 2.12 trỏ tới màn có thật.\n2. Không màn nào cụt: mỗi màn có đường ra và đi được bằng bàn phím chuột lẫn gamepad.\n3. Mọi cảnh báo có ít nhất hai kênh (hình cộng chữ hay âm), kiểm bằng mô phỏng mù màu ở bốn nhóm phổ biến.\n4. Chữ nhỏ nhất đo được từ 12 px ở 720p, tương phản chữ cỡ chuẩn từ 4,5:1 trên nền thật, đo bằng script của art.\n5. Ở 1280x720 và cỡ chữ 200%, HUD-01 đến HUD-05 vẫn trong lề an toàn.\n6. Đổi phím: mọi hành động ở bảng 2.9 đổi được, trùng phím báo, Esc cố định.\n7. Không có hộp thoại chặn màn khi có Driftlife trong 10 u, hazard đang báo trước hay Oxy dưới 25%. Ở Oxy dưới 25% chỉ T09, T15, T20, T34, T36 được hiện gợi ý một dòng, các bước khác hoãn. T13, T14, T18 được hiện cùng Driftlife.\n8. Bot gd-tech đi chương 1 theo kịch bản: mỗi bước T01 đến T37 có trigger kích được ít nhất một lần, không bước nào kẹt.\n9. Giờ giao thương không có chữ Thất bại hay Thua ở bất cứ chuỗi nào.\n10. Co-op 2 người: HUD-07 hiện trạng thái đồng đội với trễ dưới 0,5 giây, Menu không dừng thời gian, một mình thì dừng.\n11. Esc đóng màn con trước rồi mới mở menu, Start luôn mở menu, UI-34 không đóng được bằng Esc (luật 21).\n12. Bốn thanh âm lượng tách và chú thích âm bật tắt được ở UI-51, MVP không có giọng đọc (luật 22).\n13. Mọi chữ in nháy trong bảng 2.5 có key trong bảng 2.13, kiểm bằng `kiem-ux.mjs`.\n14. Thoát giữa chuyến luôn qua hộp xác nhận nêu hệ quả (luật 23), lưu lỗi ở UI-44 luôn có lối ra.\n15. Giờ giao thương: ba màu cửa neo kiểm tương phản với bốn màu slot và mỗi cửa neo có số lớn (luật 30 mục 2.1). Màn lập danh mục không nhận số thùng vượt hàng có trong kho.\n16. Bot gd-tech chạy ca đầu cố định: mỗi bước T21 đến T26 kích đúng một lần theo thứ tự, T37 kích ở lần đầu bảng tàu có đơn đặt trước.","he-thong/ux-ui.md",""],["10. Câu hỏi mở",2,272,9,2.65,"| # | Câu hỏi | Phương án đề xuất | Ai quyết |\n|---|---|---|---|\n| 1 | ĐÃ CHỐT 2026-11-20: Kết nhanh giữ Q (gamepad B), E chỉ Tương tác | Theo trả lời của gd-combat, Q và B không trùng phím nào ở bảng 2.7 của `nguoi-choi.md` | gd-combat |\n| 2 | ĐÃ CHỐT 2026-11-20 (gd-quan, `tram-va-cang.md` luật 59 tới 61): vào buồng ngủ đông là xác nhận sẵn sàng. Đếm 30 giây từ người đầu tiên vào buồng, người chưa vào tự tính sẵn sàng và nhân vật tự về buồng. Người đã vào được ra lại để hủy, đồng hồ không dừng. Người rời phiên không tính. Không có quyền riêng của host (P3) | GDM đã đưa vào K23 (log dòng 63) | GDM |\n| 3 | ĐÃ CHỐT 2026-11-20: Bản đồ chuyến (UI-33) vào MVP | gd-world cấp mỗi chuyến lưới mảnh, ô mỗi người đã vào (gộp cả nhóm), beacon đã thấy, lối vào map nhánh đã biết (`map.md` mục 6.1 và 7) | gd-world, gd-tech |\n| 4 | ĐÃ CHỐT 2026-11-20: camera ngoài không gian 10,0 u cao, 17,8 u ngang | gd-world dựng greybox theo khung này (`map.md` mục 6.4), mảnh 40 x 24 u khoảng 2,2 x 2,4 màn hình nên không chỉnh mảnh. Con số 15% của `map.md` chỉ dùng trong sim, không hiện HUD | gd-world |\n| 5 | ĐÃ CHỐT (K23, log dòng 65): game tự lưu sau mỗi chuyến khi mọi người đã về, sau giờ giao thương và lúc ngủ. Thoát giữa chuyến hay giữa ca thì mất phần đang dở từ điểm lưu gần nhất | UI-44, UI-50 và HTR-03 theo ba điểm lưu này | GDM |\n| 6 | ĐÃ CHỐT (C10, log dòng 64): rời phiên giữa chuyến tính như bị kéo về. `nguoi-choi.md` do gd-character sửa ở đợt 4 | UI-50 hộp xác nhận đã theo C10 | gd-character |\n| 7 | Ba màu cửa neo của demo (hổ phách, ngọc, tím) gần cam, lam ngọc, hồng tím của slot người chơi. Co-op 4 người cầm thùng viền màu dễ nhầm với slot | ĐÃ CHỐT 2026-11-20 (A): đổi sang bộ màu khác độ sáng và luôn kèm số lớn 1 đến 3 (đề xuất). B: bỏ màu, chỉ dùng số và hình | GDM, Artist |\n| 8 | Tùy chọn trợ năng \"tự nhặt thùng\": bấm chuột vào cửa neo thì chạy tới quầy lấy thùng của tàu đó rồi giao | ĐÃ CHỐT 2026-11-20: Sau MVP, không viết vào MVP. Nếu mở lại, gd-tech chạy lại sim đo rảnh | GDM |\n| 9 | Giao sai cửa neo thì thùng ở lại tay tới khi giao đúng hoặc tàu rời. Có cho đặt thùng về ô quầy không | ĐÃ CHỐT 2026-11-20 (A): không đặt thùng xuống, giữ nguyên demo, xem lại sau playtest co-op | gd-quan |\n| 10 | Nút Ghim hàng và HUD-12 trong luật giờ giao thương mới | ĐÃ CHỐT 2026-11-20 (A): giữ Ghim, ghim loại hàng còn thiếu cho danh mục (khớp `tram-va-cang.md` mục 2.9) | gd-quan, GDM |","he-thong/ux-ui.md",""],["Co-op 1 đến 4 người",2,272,9,1.54,"Nguyên tắc: một bộ giao diện cho mọi N. Thêm người thì thêm hàng ở HUD-07, không có màn riêng cho co-op.\n\n| Mục | 1 người | 2 người (MVP) | 3 người (Sau MVP) | 4 người (Sau MVP) |\n|---|---|---|---|---|\n| Tạo thế giới (UI-02) | Chọn 1, bỏ qua sảnh | Chọn 2, vào sảnh chờ bạn | Chọn 3 | Chọn 4 |\n| Bạn vào sau (UI-04) | Vào làm người thứ 2 | Người thứ 3 | Người thứ 4 | Phòng đầy |\n| HUD đồng đội HUD-07 | Ẩn | 1 hàng | 2 hàng | 3 hàng |\n| Ping (UI-32) | Dùng được, ghi chú cho mình | Có | Có | Có |\n| Xác nhận ra cửa khí (UI-11) | Một mình xác nhận | Tick 2 người | Tick 3 người | Tick 4 người |\n| Menu (UI-50) | Tạm dừng, tiêu đề Tạm dừng | Không dừng, biểu tượng Thời gian vẫn chạy | Như 2 người | Như 2 người |\n| Chờ nhóm (UI-20) | Không xuất hiện | Có khi một người về sớm | Có | Có |\n| Cuối ngày (UI-44) | Tự ngủ khi bấm | Tick 2 người | Tick 3 người | Tick 4 người |\n| Bảng tàu và danh mục (UI-14) | Số tàu theo 1 người | Số tàu theo 2 người | Số tàu theo 3 người | Số tàu theo 4 người, chỉ ghi chú không có số riêng |\n| Giờ giao thương (UI-40) | Một người mang mọi thùng | Hai người cùng mang, HCH-02 và HCH-03 chung | Như 2 người | Như 2 người |\n| FTUE | Đủ 37 bước | Mỗi người nhận gợi ý riêng theo hồ sơ | Như 2 người | Như 2 người |\n| Sổ tay (UI-19) | Một bản | Chung cả nhóm | Chung | Chung |\n\nKiểm: không giao diện nào hỏi \"có đúng N người không\", mọi số tham số không đổi theo N.","he-thong/ux-ui.md",""],["Kỹ thuật",1,0,10,17.51,"Cầu nối giữa GDD và 4 dev Unity. File này chốt cách dữ liệu đi từ Sheet và GDD vào Unity (schema JSON sang ScriptableObject), trạng thái nào phải đồng bộ trong co-op và ai nắm quyền, chuyện gì xảy ra khi người vào giữa chừng, người rời, host rớt mạng, và bộ sự kiện ghi cho playtest offline. Phần máy chấm (validator, 3 sim) nằm ở `projects/game-moi/tools/`, lệnh chạy ở `tools/README.md`.","he-thong/ky-thuat.md","GDD hệ thống: Kỹ thuật (máy chấm GDD, sim, schema dữ liệu, đồng bộ co-op, Event Tracking)"],["Hiện hành",2,298,10,1.78,"| Thứ | Trạng thái | Nguồn |\n|---|---|---|\n| Validator chéo GDD | Chạy được, 10 file, thoát 1 khi lỗi | `tools/validate-gdd.mjs`, kết quả `tools/ket-qua/validate-gdd.md` |\n| Sim chuyến | Chạy được, theo chương 1 đến 5, 4 kịch bản (tệ, trung bình, tốt, tham), 1 đến 4 người | `tools/sim-chuyen.mjs`, `tools/ket-qua/sim-chuyen.md` |\n| Sim giờ giao thương | Chạy được, theo khung Dave: 1 đến 4 người chia việc, quét số tàu và số cửa neo theo N, trễ phản xạ 1 đến 3 giây, 3 kiểu danh mục, bơm khí | `tools/sim-ca-cang.mjs`, `tools/ket-qua/sim-ca-cang.md` |\n| Sim combat | Chạy được, S1 phần trận, S2 phần thời gian và ròng, S3, S4, S5 cho BS-1. S6 lý thuyết ở prototype | `tools/sim-combat.mjs`, `tools/ket-qua/sim-combat.md` |\n| Schema dữ liệu | Bản của gd-tech ở mục 2.1 (schema thuộc thẩm quyền gd-tech, GDM duyệt khi giao dev) | file này |\n| Đồng bộ co-op | Mô hình host nắm quyền, mục 2.2 | file này |\n| Netcode | Dev chọn, bảng so sánh ở mục 6.3 | file này |\n| Event Tracking | 73 sự kiện, mục 2.4: 46 gộp từ các GDD, 20 bổ sung, 5 của `ux-ui.md`, 2 của giờ giao thương khung Dave. Tab Sheet là bản đọc sửa tay, không sinh lại bằng `tools/xuat-event-tracking.mjs` | file này, tab Event Tracking |\n| Prototype bay | Chạy được: bay 8 hướng, hãm, lướt, Oxy, túi, thử né S6, 16 thanh chỉnh, xuất JSON. Số bậc 0 khớp `nguoi-choi.md` (đo trong trình duyệt: buông từ vmax dừng sau 0,51 giây và 1,5 u, hãm dừng sau 0,18 giây, lướt 15 u/s) | `tools/prototype/bay.html` |\n\nSố và kết luận của sim chỉ nằm ở file kết quả (`tools/ket-qua/sim-chuyen.md`, `sim-ca-cang.md`, `sim-combat.md`), mỗi file có mục đối chiếu mục tiêu.","he-thong/ky-thuat.md",""],["1. Mục đích với người chơi",2,298,10,0.47,"Người chơi chỉ thấy kết quả của hệ thống này:\n- Co-op mượt: bạn vào giữa chừng không phải chờ, đồng đội bay không giật, thùng không bị nhân đôi hay biến mất khi hai người cùng nhặt hoặc giao.\n- Luật mạng rõ ràng: rời phiên hay mất kết nối giữa chuyến không phải đường về an toàn (C10), host thoát thì thế giới về điểm lưu gần nhất (K23).\n- Số trong game khớp số trong GDD vì dữ liệu đi một đường từ Sheet vào game, có máy kiểm.","he-thong/ky-thuat.md",""],["2. Luật",2,298,10,21.4,"","he-thong/ky-thuat.md",""],["2.1 Dữ liệu: một nguồn, một đường vào Unity",3,301,10,10.5,"1. Nguồn chuẩn của mọi số và danh mục là markdown trong repo: các bảng và khối máy sinh `` của GDD hệ thống, cùng script sinh bảng của vai (ví dụ `sim/vat-pham.mjs`). Sheet GDD là bản dán từ repo bằng `/gdd-sheet-sync` sau khi gd-qa chấm ĐẠT. Ngoại lệ: tab Lead sửa tay thì kéo bản Sheet về repo trước khi soạn tiếp (CLAUDE.md nguyên tắc 12). Unity không giữ số gõ tay trong prefab hay code.\n2. Đường đi: khối markdown trong `gdd/he-thong/` -> `tools/xuat-data.mjs` (chưa làm, việc tiếp theo) -> `data/*.json` -> importer trong Unity Editor -> ScriptableObject. Exporter đọc thẳng khối markdown như các sim đang làm, không qua TSV của Sheet. Chạy importer chỉ lúc editor, game không gọi mạng khi chạy (game chơi offline được). Đổi sang Sheet làm nguồn chỉ khi GDM ghi DECISIONS.\n3. ID là chuỗi ổn định do vai chủ tên đặt (khung mục 8), không dùng số thứ tự dòng. Tham chiếu giữa các bảng bằng ID. Đổi tên hiển thị không đổi ID. Mỗi thứ chỉ có một hệ ID (luật 7 dưới).\n4. Exporter đọc cột theo tên header. Header lạ hoặc thiếu thì dừng, không đoán. Mọi khóa JSON và trường C# là ASCII không dấu.\n5. Mỗi lần xuất chạy validator trước. Validator đỏ thì không xuất.\n6. Round-trip: JSON xuất ra rồi đọc lại phải trùng từng trường. Selftest giữ phép kiểm này.\n7. Nâng cấp dùng một hệ ID duy nhất là `UPG-<họ>-<bậc>` của gd-items (`vat-pham.md`). Các nhãn T-OXY, T-VO, T-DAY, T-TUI, T-DUNGCU ở `nguoi-choi.md` và `kinh-te-tien-trinh.md` chỉ là tên trục hiển thị, đổi một lần qua bảng ánh xạ trong `UpgradeData.truc`.\n8. ScriptableObject ở bản build chỉ đọc. Trạng thái thế giới lưu bằng file save riêng (mục 2.3b), không ghi vào ScriptableObject.\n\nSchema đề xuất (mỗi bảng một loại ScriptableObject, một asset mỗi dòng trừ khi ghi khác). Mọi loại có trường `nhan` (MVP, SauMVP) để dev lọc phạm vi.\n\n| Loại SO | Trường chính (kiểu) | Nguồn | Nhãn |\n|---|---|---|---|\n| `ItemData` | id (string), tenVi, tenEn, nhom (enum), doHiem (enum), cachMang (tui, mang, keo, khong), khoi (float, chỉ khi cachMang là tui), coKien (Nho, Vua, Lon, chỉ CGO), canChe (bool, chỉ CGO), giayDong (float, chỉ CGO), hieuUng, giayDung, toiDaMoiChuyen (chỉ nhóm CON dùng trong chuyến: ví dụ CON-101 hồi 40 Oxy, 1,5 giây, tối đa 2 bình mỗi chuyến, chiếm túi theo khoi. Trần Oxy hồi cả chuyến theo K26 nằm ở `PlayerTuning`), giaTally (int, nếu bán được), giaTheoLoai (bool, true cho lồng sống CGO-121, 221, 321: giá một lồng bằng GTĐ mẫu sống của loài bên trong nhân 10 Tally, cộng hệ số tàu, theo `kinh-te-tien-trinh.md`. Khi đó giaTally bỏ trống), gtd (float), dai (enum), nhan | `vat-pham.md` khối ITEM, CGOSIZE, `kinh-te-tien-trinh.md` khối gia-kien | MVP |\n| `ItemGroupData` | id, thanhVien (list itemId) | nhóm ID trong công thức kiểu \"một trong SMP-212 tới 215\" ở `vat-pham.md` | MVP (RCP-124, RCP-126 dùng nhóm ID ở chương 1) |\n| `RecipeData` | id, noiChe (enum khoang), dauVao (list {itemId hoặc itemGroupId, soLuong}), dauRa ({itemId, soLuong}), giay (float, -1 là qua đêm), moBang (chương, người vớt, BPR id) | `vat-pham.md` khối RECIPE | MVP |\n| `SalvageNodeData` | id, dai, dungCu (TOL id hoặc Tay), doCung (int), giayBac1 (float), soLanQuay (int), bangRoi (list {itemId, trongSo, soLuong}) | `vat-pham.md` khối NODE | MVP |\n| `ToolData` | id, vaiTro (enum), bac (int), dmg, diemChoang, diemMe, tre, nhip, tam, vung, tieuHao (CON id) | `vat-pham.md` khối TOOL, `combat-driftlife.md` 3.3 | MVP |\n| `UpgradeData` | id (UPG-xxx-n), ho (enum OXY, BAG, THR, ENV, RACK, MIN, HAR, NET), truc (nhãn T-xxx hiển thị), loai (BoDo, DungCu), bac, hieuUng (list {thamSo, giaTri}), giaTally, vatLieu (list), moBang (BPR id hoặc chương), nhan | `vat-pham.md` khối UPG, `kinh-te-tien-trinh.md` | MVP |\n| `ShopEntryData` | itemId hoặc upgradeId, giaTally, chuongMo, hangCan, vatLieu (list) | `kinh-te-tien-trinh.md` bảng thứ mua | MVP |\n| `EnemyData` | id (DL-xxx hoặc WD-xx), ten, phe (Driftlife, Wardens), dai, co (S, M, L), kieuHanhVi (enum), sinhLuc, nguongChoang, nguongMe (vô cực là miễn), mien (flags), khien (hướng, nếu có), vungPhatHien, khoangBoDuoi, tocDo, tocDoDuoi, kieuSinh (đơn, đàn, tổ), soConMoiDiem, batSong (enum cách bắt), nuoi (bool), bangRoiHa, mauSong (itemId), attacks (list `AttackData`), nhan | `combat-driftlife.md` Danh mục, 3.4, 3.4b, 3.6, Điểm sinh và rơi | MVP |\n| `AttackData` (nhúng) | ten, kieu (can, xa, vung, tiepXuc, nuot), hinhVung, tam, dmgOxy, baoTruoc, thoiGianDanh, hoi, hoiChieu, canVe (bool), lucDay | `combat-driftlife.md` 3.4b | MVP |\n| `BossData` | id (BS-n), ten, noi (BranchMap id), sinhLuc (một mình), heSoCoop, cacPha (list {nguong, coChe}), cachKet (list {kieu, roi}), thoiLuongMucTieu, nhan | `combat-driftlife.md` 3.7 | MVP cho BS-1 |\n| `ZoneData` (dải) | id (Z1..3), tu, toi (u), soCot, soHang, moiTruong (E0..E3), tiLeSPR, tiLeSPD, tiLeHazard, soBeacon, aCoop (a của k(N)), loai (list EnemyData id), nhomTaiNguyen (list SLV id theo loại mảnh) | `map.md` 3.1, 3.3, 3.6, 3.8 | MVP |\n| `TileData` (mảnh) | id, dai, loai (enum Mo, HanhLang, O, XacLon, Thuong, CoDinh), cong (4 bool), khe (list {loai SP-R/D/H/B, viTri, choPhep}), nuaNgoai (bool), prefab | `map.md` 6.1 | MVP |\n| `HazardData` | id (H01..), loai, dmgOxy, choang (giây), lucDay, baoTruoc, giayBat, giayTat, kichThuocVung, soManh, daiMo, nhan | `map.md` 3.5 | MVP |\n| `BranchMapData` (map nhánh) | id (N1..), scene, dai, chuong, nguoiVot (RS id), boss (BS id), khoa (list {cua, chia: TOL id}), thoiLuongMoiLanVao, khe (list {ma M1.. hoặc V1.., viTri}), trangThaiLuu (list khóa: cửa, vách, đường tắt), nhan | `map.md` 2.10, `vat-pham.md` luật T7, `cot-truyen.md` | MVP cho N1 |\n| `ClueData` (vật truyện) | ma (MM hoặc V), itemId (STY), chuong, mocHien, branchMapId, khe, mucSoTay | `cot-truyen.md` mục 2.5, mục 6 | MVP cho chương 1 |\n| `ShipTypeData` | id (TA01..), luuBen bỏ, kienNhan (giây kiên nhẫn), tipHeSo, trongSo, thichHang (list {thungId, trongSo}), mePhan (thungId tip gấp đôi), moChuong, moHang, thuongNhan (TR id), luatRieng ({kieu, thamSo}), nhan. Đề xuất của gd-tech theo khung Dave, chờ gd-quan khớp với tab Customer | `tram-va-cang.md` loại tàu | MVP cho tàu mở đầu |\n| `CargoGroupData` | id (HC01..), kien (list CGO id), moChuong (int). Thùng là kiện chia hệ số thùng, giá thùng đọc từ giá kiện, lồng sống không chia | `tram-va-cang.md` Nhóm hàng, `vat-pham.md` | MVP |\n| `RoomData` (khoang) | id (KH01..), ten, chuongMo, nguoiVot (RS id), capSua (list {vatLieu, giay}), viTriMatCat ({tang, cot}) | `tram-va-cang.md` Danh mục, 2.6, 2.6b | MVP |\n| `PortRankData` | hang (int), nguongDiem, tranChuong, mo (list) | `tram-va-cang.md` 2.5 | MVP |\n| `StoryBeatData` | id (C1.x), chuong, dongChuong (bool, K25: chỉ mốc đóng chương mở dải mới), giaiDoanDongCo (giai đoạn động cơ phải lắp xong, chỉ khi dongChuong), truoc (list), dieuKien (list {loai, thamSo}, mọi điều kiện cùng đúng, không có \"hoặc\"), noi, canh, mo (list) | `cot-truyen.md` mục 6 (18 loại điều kiện) | MVP cho chương 1 |\n| `AreaData` (địa danh) | id (A01..), ten (list tên khu hiển thị), branchMapId hoặc zoneId, nhan | `map.md` danh mục A01 đến A05 | MVP cho A01 |\n| `CharacterProfile` | id (PC, RS, TR, NP, WD-P), ten, mau, preset, chieuCao | `ho-so-nhan-vat.md` mục 6 | MVP |\n| `PlayerTuning`, `PortTuning`, `CombatTuning`, `EconomyTuning` (một asset mỗi loại) | tham số mục 3 của `nguoi-choi.md`, `tram-va-cang.md`, `combat-driftlife.md` 3.1, 3.2, 6b, `kinh-te-tien-trinh.md` | các file đó | MVP |\n| Chuỗi và bước tutorial | Không thành SO ở bản này. gd-ux giữ `strings/strings.tsv` và bảng bước T01.. ở `ux-ui.md`, dev đọc thẳng. Câu hỏi mở 3 | `ux-ui.md` | MVP |\n\nDữ liệu động (không phải SO): `ItemInstance` (itemId, soLuong, sao 1 đến 3, loaiBenTrong cho lồng sống). Đầu ca: `CatalogEntry` (thungId, soLuong, daBan), tối đa M loại, lập ở khoang liên lạc trước ca. Lịch tàu sinh lúc mở giao thương từ `ShipTypeData`, danh mục và seed của ngày. `ShipInstance`: tauId (TA id), thuTu, gioDen, trangThai (vào, chờ ngoài, cập, giao xong, rời chưa giao), cuaNeo, thungId (một thùng mỗi tàu), datTruoc (bool), kienNhanCon (float). Thùng ở quầy: `CounterCrate` (cuaNeo, thungId, ai đang giữ chỗ). Danh mục và lịch tàu nằm trong file save (mục 2.3b), `ShipInstance` và `CounterCrate` chỉ sống trong ca.","he-thong/ky-thuat.md",""],["2.2 Đồng bộ co-op: ai nắm quyền",3,301,10,7.61,"9. Mô hình: host nắm quyền (listen server). Host là máy của người tạo thế giới (C2). Không có máy chủ riêng.\n10. Phân quyền theo trạng thái:\n\n| Hệ thống | Trạng thái | Ai nắm quyền | Gửi | Ghi chú |\n|---|---|---|---|---|\n| Người chơi | Vị trí, vận tốc, hướng, lướt | Máy của người đó | 20 lần mỗi giây, máy khác nội suy trễ 100 ms | Trả lời điểm chờ gd-tech của `nguoi-choi.md`: 20 Hz. Host kiểm tốc độ, vượt vmax cộng lực ngoài quá dung sai (mục 3) thì kéo về vị trí host |\n| Người chơi | Oxy, túi đồ, tải | Máy của người đó tính, host kiểm | Khi đổi và 5 lần mỗi giây | Host quyết ngạt, kéo về, chia Oxy (theo `nguoi-choi.md`). Host giữ bộ đếm Oxy đã hồi từ vật tiêu hao trong chuyến của từng người, từ chối khi vượt 25% dung lượng bình, khi đang ngạt, hoặc khi bình đầy (K26) |\n| Người chơi | Ngạt, được cứu, bị kéo về, Recall Beacon, Giữ chỗ | Host | Sự kiện tin cậy | |\n| Người chơi | Trao đồ giữa hai người, thả đồ | Host | Yêu cầu gửi host, host chuyển và trả kết quả cho hai máy. Host từ chối khi người trao hoặc người thả đang ngạt (K27) | Không máy nào tự trừ túi trước khi host đồng ý |\n| Vật kéo | Buồng ngủ đông, Lồng mẫu, kiện nổ, vật nặng | Người đang giữ nắm vị trí. Từ 2 người cùng kéo thì host nắm | 20 lần mỗi giây | Khớp luật kéo chung của `nguoi-choi.md` 2.1 |\n| Chuyến | Seed, danh sách mảnh, khe đã kích hoạt, beacon | Host | Lúc bắt đầu chuyến, rồi chỉ gửi khe đã dùng | Mọi máy dựng map giống nhau từ seed (`map.md` 6.1) |\n| Chuyến | Pha chu kỳ của hazard (H02, H03, H04...) | Tính từ seed chuyến cộng giờ host | Không gửi, mỗi máy tự tính | Lệch giờ máy khách sửa theo giờ host gửi kèm gói |\n| Chuyến | Xác nhận ra chuyến (C5, 30 giây), xác nhận ngủ (K23, 30 giây), Bộ đếm ngày (số chuyến đã đi K22, ai đã về C9, ca đã mở) | Host giữ đồng hồ, tính từ lúc người đầu tiên xác nhận | Sự kiện tin cậy | Không trả lời trong 30 giây tính là đồng ý |\n| Khai thác | Node đang bị ai giữ, lượng còn | Host | Sự kiện | Khóa node cho một người (theo `vat-pham.md`) |\n| Combat | Sinh lực, thanh Choáng, thanh Mê, trạng thái, vé tấn công của mọi kẻ địch | Host | 10 lần mỗi giây và sự kiện | Máy người bắn hiện hiệu ứng trúng ngay, host xác nhận (theo `combat-driftlife.md`) |\n| Combat | Vị trí kẻ địch | Host | 10 lần mỗi giây, nội suy | |\n| Trạm | Cấp và trạng thái khoang, giai đoạn động cơ, kho, hàng đợi xưởng, ô nuôi | Host | Sự kiện tin cậy | |\n| Giờ giao thương | Đồng hồ ca và chờ ngoài, danh mục và số thùng còn, lịch tàu, trạng thái từng tàu và thanh kiên nhẫn, thùng ở quầy, bơm khí đang giữ | Host | Sự kiện tin cậy, đồng hồ theo giờ host, thanh kiên nhẫn host tính và máy người chơi nội suy | Chi tiết ở mục 2.5 |\n| Giờ giao thương | Thùng trên tay | Người mang giữ vị trí, host giữ sự tồn tại | Nhặt, giao, bắt đầu bơm khí là yêu cầu gửi host | Hai người cùng nhặt một thùng: yêu cầu tới host trước được nhận, người sau bị từ chối và đi tiếp việc khác. Tàu rời lúc đang cầm thùng của nó thì thùng về danh mục và tay trống |\n| Kinh tế | Tally, điểm cảng, Hạng cảng, thứ đã mua, cấp trang bị chung | Host | Sự kiện tin cậy | Một ví chung (C3, C4) |\n| Truyện | Mốc đã xong, vật manh mối đã nhặt, người vớt đã tỉnh | Host | Sự kiện tin cậy | Mốc là trạng thái thế giới. Cảnh là trình bày: mỗi máy có hàng chờ cảnh và danh sách cảnh đã xem riêng, phát ở điểm nghỉ (theo `cot-truyen.md` mục 6) |\n| Giao tiếp | Ghim món, Ping | Máy của người đó | Sự kiện, không tin cậy | |\n| Giao diện | Menu, bảng, cài đặt | Từng máy | Không gửi | Không tạm dừng toàn cục khi có từ 2 người (C7) |\n\n11. Mọi thao tác đổi trạng thái chung (nhặt, bốc, sửa, mua, chế, trao đồ) là yêu cầu gửi host. Máy người chơi được hiện kết quả dự đoán. Host trả lời trong cửa sổ trả lời (mục 3), sai thì máy người chơi lùi lại.","he-thong/ky-thuat.md",""],["2.3 Vào giữa chừng, số người N, rời phiên, mất kết nối",3,301,10,7.27,"12. Vào phiên: host cấp cho mỗi người một mã slot (1 đến 4) lúc vào lần đầu, lưu trong thế giới. Người vào lại được nhận ra bằng mã slot gắn với tài khoản của người đó. Tài khoản là ID người chơi của nền tảng mà netcode dùng (Steam ID nếu bán trên Steam, hoặc ID của dịch vụ lobby được chọn ở mục 6.3), không phải tài khoản riêng của game. Người mới lấy slot trống thấp nhất. Hết 4 slot thì từ chối với lời báo \"Phòng đầy\". Host xóa được nhân vật của người đã rời (theo `nguoi-choi.md` 2.9).\n13. Người mới vào giữa chừng: buồng của người đó được đưa về trạm ở điểm nghỉ kế tiếp (cảnh của `cot-truyen.md` 2.7), không lấp buồng đã tắt của Ember. Trong lúc chờ, người đó ở trạng thái Chờ vào: xem được, chưa điều khiển. Nếu đang giờ giao thương thì vào ca ngay khi buồng về, số tàu của ca đang chạy không đổi.\n14. Số người N cho hệ số theo số người lấy lúc sinh và không đổi tới hết thứ đó:\n\n| Ngữ cảnh | N là | Nguồn |\n|---|---|---|\n| Chuyến (k(N) của dải) | Số người đã xác nhận ra chuyến lúc chuyến bắt đầu (C5), không tính người ở lại | `map.md` 3.8, C5 |\n| Kẻ địch (Sinh lực, ngưỡng) | Số người đang ở ngoài trong cùng map lúc kẻ địch sinh hoặc lúc vào phòng boss | `combat-driftlife.md` 6b |\n| Giờ giao thương (số tàu trong ca, số cửa neo, điểm) | Số người online lúc mở giao thương | `tram-va-cang.md` mục giờ giao thương, `sim-ca-cang.md` mục 4 |\n\n15. Người rời phiên chủ động: nhân vật ở lại trạm (C2). Rời khi đang ngoài chuyến thì tính như bị kéo về (K2, chỉ giữ 1 món), theo C10.\n16. Mất kết nối: mất gói liên tục quá thời gian phát hiện (mục 3) mới tính là rớt. Người rớt giữa chuyến vào Giữ chỗ 15 giây theo `nguoi-choi.md` 2.9 (đề xuất gửi gd-character: Giữ chỗ tối đa 1 lần mỗi chuyến cho mỗi người, lần thứ hai tính như bị kéo về ngay, để không dùng rút mạng dừng đồng hồ ngạt). Quá 15 giây thì tính như bị kéo về (K2), theo C10. Vào lại trong 15 giây bằng cùng mã slot thì nhận lại nhân vật. Người rớt là người cuối còn ngoài thì chuyến chung chờ tối đa 15 giây đó. Trong trạm và giờ giao thương dùng cùng cửa sổ 15 giây: hết hạn thì kiện trên tay rơi tại chỗ, host giữ.\n17. Host mất kết nối hoặc thoát: phiên kết thúc với mọi người. Mặc định không chuyển host, vì thế giới thuộc về host (C2) và chuyển host là việc riêng của stack mạng. Dev được đề nghị chuyển host nếu stack chọn hỗ trợ sẵn với chi phí thấp (câu hỏi mở 2). Mọi người về menu, thế giới trở về điểm lưu gần nhất trong ba điểm của luật 18 (K23, C10), chuyến hay ca đang dở bị mất. Đây là câu trả lời cho điểm chờ gd-tech của `nguoi-choi.md` và `map.md`.","he-thong/ky-thuat.md",""],["2.3b Lưu",3,301,10,4.88,"18. Tự lưu ở ba điểm (K23, khung sửa lần 5, log 65): sau mỗi chuyến khi mọi người đã về trạm, sau giờ giao thương, và lúc ngủ. Không có lưu tay. Thoát giữa một chuyến hoặc giữa giờ giao thương, kể cả chơi một mình, thì lần sau vào lại ở điểm lưu gần nhất, mất phần đang dở. Ba điểm lưu dùng chung một file và cùng cách ghi an toàn của luật 20.\n18b. Bố cục map của từng chuyến lưu theo ngày và số thứ tự chuyến: `seedChuyen = hash(worldSeed, ngay, soThuTuChuyen)`. Nạp lại ở điểm lưu sau chuyến 1 rồi đi chuyến 2 thì bố cục chuyến 2 giống hệt lần trước, không lưu lại chuyến để đổi bố cục. Bộ sinh dùng RNG riêng theo luật tất định ở mục 7 (`map.md` 6.1, bản tham chiếu `sim/bo_cuc.py`).\n19. File save theo thế giới, chỉ trên máy host. Khách giữ bản sao hồ sơ máy (cài đặt, phím, tiến độ tutorial), không đồng bộ qua mạng.\n20. Ghi an toàn: ghi ra file tạm rồi đổi tên đè file chính. Giữ một bản `.bak` của lần lưu trước. File chính hỏng thì mở `.bak` và báo người chơi lùi về điểm lưu trước đó. Lưu lỗi 3 lần liền thì cho người chơi thoát, báo rõ lùi về điểm lưu cuối ghi được (khớp UI-44 của `ux-ui.md`).\n21. File save có số phiên bản dữ liệu. Bản build đổi dữ liệu thì chạy bước migrate có ghi log. Không migrate được thì không mở và báo.\n22. Trường của file save (gộp từ 8 GDD):\n\n| Nhóm | Trường | Kiểu | Nguồn |\n|---|---|---|---|\n| Thế giới | phienBanSave, worldId, worldSeed, ngay, daySeed, playSecondsTotal, daKetGame (K24, chơi tiếp được ở ngày cuối) | số, chuỗi, bool | khung K23, K24 |\n| Ngày | soChuyenDaDi (K22, tối đa 2), caDaMo, caDaXong, diemLuu (sau chuyến 1, sau chuyến 2, sau ca, ngủ), seedChuyen theo số thứ tự chuyến đã sinh trong ngày | số, bool, enum | khung K22, K23, `tram-va-cang.md` luật 63, 65 |\n| Người chơi theo slot | maSlot, ten, mau, preset, viTriTrongTram, daRoi | | C2, `nguoi-choi.md` 2.9 |\n| Trang bị chung | cấp từng UPG đã mua, bản thiết kế, dụng cụ đã mở | list | C4, `vat-pham.md` |\n| Kho | list `ItemInstance` | | `vat-pham.md` |\n| Trạm | trạng thái và cấp từng khoang, giai đoạn động cơ, hàng đợi xưởng (gồm mẻ qua đêm), ô nuôi {loài, tuổi, đã cho ăn} | | `tram-va-cang.md` mục 6 |\n| Cảng | Tally, điểm cảng, Hạng cảng, thứ đã mua, số lần cập bến của tàu có tên, danh mục bán đã lập, lịch tàu của ngày (sinh lại từ daySeed được, lưu để kiểm) | | `kinh-te-tien-trinh.md` mục 6, `tram-va-cang.md` |\n| Truyện | mốc đã xong, vật manh mối đã nhặt, người vớt đã tỉnh, quest đã mở. Theo từng slot: hàng chờ cảnh, danh sách cảnh đã xem | | `cot-truyen.md` mục 6 |\n| Map nhánh | theo từng N: cửa, vách, đường tắt đã mở, buồng đã vớt, boss đã kết và cách kết | | `map.md` 6.1 |","he-thong/ky-thuat.md",""],["2.4 Event Tracking cho playtest offline",3,301,10,8.0,"23. Game ghi sự kiện ra file JSON Lines cục bộ, mỗi phiên một file, trong thư mục save. Không gửi mạng (bán đứt, offline, không telemetry ngoài). Người chơi playtest gửi file khi được hỏi.\n24. Trường chung của mọi sự kiện: `session_id`, `world_id`, `world_seed`, `build`, `t` (giây từ đầu phiên), `play_seconds_total` (giờ chơi cộng dồn của thế giới, để đo thời lượng chương qua nhiều phiên), `day`, `chapter`, `n_players`, `slot`. Bảng dưới chỉ ghi tham số riêng.\n25. Máy nào ghi: sự kiện do host nắm (Tally, giờ giao thương, mốc, khoang, combat) chỉ máy host ghi. Sự kiện của người chơi (Oxy, lướt, nhặt, giao diện, mạng) mỗi máy tự ghi của mình. Gộp file các máy theo `session_id` không đếm trùng.\n26. Tên sự kiện tiếng Anh snake_case, tiền tố theo nhóm. Tên nhóm (Session, Day, Trip, Item, Combat, Port, Station, Economy, Story, UX, Net) là quyết định của gd-tech, khác danh sách nhóm của khuôn Dungeon Builder. Các tên tiếng Việt trong GDD khác (ví dụ `trung_don_nguoi_choi`) đổi theo bảng này. Mỗi sự kiện gắn một câu hỏi playtest ở cột Dùng để, sự kiện không trả lời câu nào thì không thêm.\n27. Khi dán tab Event Tracking: bỏ cột Nguồn, cột Dùng để dán vào cột Description của khuôn (`gdd-sheet-khuon-indie.md` mục 6). Tham số và kiểu ghép theo thứ tự, mỗi tham số một kiểu.\n\n| No | Group | Event Name | When To Send | Event Params Key | Dùng để | Value Type | Nguồn |\n|---|---|---|---|---|---|---|---|\n| 1 | Session | session_start | Mở thế giới | world_id, is_host, input_device | Đếm phiên, thiết bị | string, bool, string | mới |\n| 2 | Session | session_end | Thoát hoặc rớt | reason (quit, host_lost, crash), minutes | Phiên dài bao lâu, rớt mạng bao nhiêu | string, float | mới |\n| 3 | Session | player_join | Người vào giữa chừng | player_id, phase | Vào giữa chừng có chờ lâu không | string, string | mới |\n| 4 | Session | player_leave | Người rời | player_id, phase, reason | | string, string, string | mới |\n| : đồng hồ, danh mục và số thùng còn, lịch tàu (sinh lúc mở giao thương từ seed ngày, số tàu theo số người N lúc mở giao thương), trạng thái từng tàu, kiên nhẫn từng tàu, thùng ở quầy. Máy người chơi chỉ gửi ba yêu cầu: nhặt thùng ở ô quầy, giao thùng ở cửa neo, bắt đầu hoặc dừng giữ bơm khí.\n30. Hai người cùng nhặt một thùng hay cùng giữ bơm khí một tàu: yêu cầu tới host trước được nhận. Người sau nhận từ chối, máy đó hiện lại tay trống và đi việc khác, không mất gì. Giao thùng vào đúng lúc tàu hết kiên nhẫn: host quyết, máy người chơi lùi lại như luật 11.\n31. Người vào giữa ca không đổi lịch ca đó (luật 13). Người rớt giữa ca khi đang cầm thùng: thùng rơi tại chỗ, host giữ, người khác nhặt được, hết Giữ chỗ mà tàu đã rời thì thùng về danh mục.\n32. Sự kiện một ca theo thứ tự: `port_catalog_set` (trước ca), `port_shift_start`, rồi mỗi tàu `ship_docked`, `ship_called`, `crate_delivered` hoặc `ship_left_unserved`, thêm `air_pump_done` khi có, cuối ca `port_shift_end` và `port_player_idle` mỗi người một dòng. Sự kiện 30, 32 tới 37 do host ghi, 73 do máy của người đó ghi (luật 25). Tỉ lệ tàu phục vụ xong tính bằng số `crate_delivered` chia số tàu trong lịch (`ships` của `port_shift_start`). Tip trong Tally tính bằng tổng `tip` và `patience_gain` của bơm khí chia tổng Tally ca.\n33. `PortTuning` cần các khóa: soTauTheoN (4 giá trị), cuaNeoTheoN (4 giá trị), caToiDa (300 giây, luật 34), choNgoai, thungHienSau, tuoiRoiGiuCua, kienNhan theo loại tàu, heSoHangHayGoi theo loại tàu (Tikko đồ Trái Đất 6, phế liệu 1), chiGoi theo loại tàu (Tàu vội chỉ gọi nhóm băng và khoáng, luật 24), doGoiTheoBacGia (Hàng chợ 3, sinh học 2, chế 1,5, sống 1, hiếm 1), giaThung theo món và giaLongTheoLoai (khối giaThung của gd-economy), tipToiDa, bom {batLucCap (50%, luật 28), sau, giu, hoi, tally}, datTruoc {thuTu, heSo}, caDau (2 tàu Loose Bolt, luật 67). Giá trị đặt theo kết quả sim, giá do gd-economy đặt.","he-thong/ky-thuat.md",""],["3. Tham số",2,298,10,1.59,"| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nhóm tác động | Nguồn |\n|---|---|---|---|---|---|---|\n| Tần số gửi vị trí người chơi | 20 lần mỗi giây | 15 đến 30 | Mượt hơn, tốn băng thông | Giật | Co-op | đề xuất, dev chỉnh khi chọn stack |\n| Trễ nội suy | 100 ms | 50 đến 150 | Mượt, trễ hình | Giật khi mất gói | Co-op | đề xuất, dev chỉnh |\n| Tần số gửi trạng thái Driftlife | 10 lần mỗi giây | 5 đến 20 | | | Co-op, combat | đề xuất, dev chỉnh |\n| Thời gian phát hiện mất kết nối | 4 giây mất gói liên tục | 3 đến 5 | Ít báo nhầm | Phát hiện nhanh | Co-op | đề xuất, chờ dev |\n| Dung sai host kiểm tốc độ | 15% trên vmax cộng lực ngoài | 10 đến 25% | Ít kéo giật | Chặn gian lận chặt hơn | Co-op | đề xuất, chờ dev |\n| Cửa sổ host trả lời yêu cầu | 250 ms | 150 đến 500 | Chịu mạng kém | Phản hồi nhanh hơn | Co-op | đề xuất, chờ dev |\n| Số lần Giữ chỗ mỗi người mỗi chuyến | 1 | 1 đến 2 | Tha thứ mạng | Chặn rút mạng dừng ngạt | Co-op | đề xuất gửi gd-character (luật 16) |\n| Số người tối đa | 4 | cố định | | | Co-op | C1 |\n| Giữ chỗ khi rớt mạng | 15 giây | 10 đến 30 | | | Co-op | `nguoi-choi.md` 3 |\n| Số lần sim mỗi ô | chuyến 2000, ca 300, combat 2000 | từ 200 | Số ổn định hơn | Nhanh hơn | Máy chấm | `tools/tham-so/*.json` |\n\nTham số của từng sim nằm ở `tools/tham-so/chuyen.json`, `ca-cang.json`, `combat.json`, mỗi khóa có `_nguon`, số tự đặt có nhãn `[GIẢ ĐỊNH]` và được in lại ở đầu file kết quả.","he-thong/ky-thuat.md",""],["4. Trường hợp biên",2,298,10,1.65,"| Tình huống | Xử lý |\n|---|---|\n| Hai người cùng nhặt một node hay một kiện cùng khung hình | Yêu cầu tới host trước được nhận, người sau nhận từ chối và vật ở lại |\n| Người vào giữa chừng khi cả nhóm đang ngạt hết | Ở trạng thái Chờ vào tới điểm nghỉ kế (luật 13) |\n| Host rớt khi khách đang chia Oxy | Phiên kết thúc, thế giới về điểm lưu gần nhất (luật 17, 18, K23). Người được chia Oxy không giữ gì của chuyến đó |\n| Khách rớt giữa giờ giao thương khi đang cầm thùng | Thùng rơi xuống sàn tại chỗ, host giữ, người khác nhặt được |\n| Khách rớt rồi vào lại trong 15 giây | Nhận lại nhân vật đang Giữ chỗ, không mất gì |\n| Seed chuyến cho map khác nhau trên hai máy | Không xảy ra nếu mọi máy cùng phiên bản dữ liệu. Snapshot lúc vào phiên có hash dữ liệu, lệch hash thì không cho vào, báo cập nhật |\n| Validator đỏ khi cần xuất gấp | Không xuất. Sửa nguồn hoặc xuất bản cũ trong repo |\n| Sheet có cột Lead chèn tay | Exporter đọc theo tên header, cột lạ được bỏ qua và in cảnh báo, cột thiếu thì dừng |\n| Người đang ngạt rút mạng rồi vào lại để dừng đồng hồ ngạt | Giữ chỗ lần đầu dừng đồng hồ, lần thứ hai trong cùng chuyến tính như bị kéo về ngay (luật 16) |\n| File save chính hỏng khi mở | Mở bản `.bak`, báo người chơi lùi về điểm lưu trước (luật 20) |\n| Hai người cùng kéo một buồng ngủ đông, một người rớt | Host giữ vị trí vật, người còn lại kéo tiếp ở hệ số một người |\n| Số trong GDD đổi sau khi sim chạy | Kết quả sim ghi giờ chạy. Vai đổi số chạy lại lệnh trong `tools/README.md` |","he-thong/ky-thuat.md",""],["5. Ràng buộc vật lý của luật",2,298,10,0.82,"| Ràng buộc | Số hoặc lý do |\n|---|---|\n| Băng thông 4 người | 3 người khách nhận vị trí của 3 người khác, 20 lần mỗi giây, cỡ khoảng 30 byte mỗi gói vị trí: dưới 10 KB mỗi giây mỗi máy, chưa tính Driftlife. Không là ràng buộc ở PC |\n| Tất định của map theo seed | Bộ sinh map phải dùng RNG riêng có seed, không dùng `UnityEngine.Random` dùng chung, không phụ thuộc thứ tự khung hình |\n| Vật lý | Vật lý trong Unity chạy theo fixed timestep (mặc định 0,02 giây). Host là nguồn sự thật cho vật lý của Driftlife và kiện rơi. Chuyển động người chơi chạy trên máy người đó |\n| Sim là mô hình rút gọn | Mọi sim trong `tools/` bỏ qua phần không có số trong GDD (ghi ở đầu mỗi file sim). Khi có build, so số sim với Event Tracking của playtest |","he-thong/ky-thuat.md",""],["6. Yêu cầu cho engineer và tool",2,298,10,3.21,"","he-thong/ky-thuat.md",""],["6.1 Máy chấm có sẵn",3,311,10,1.45,"| Lệnh | Làm gì |\n|---|---|\n| `node projects/game-moi/tools/validate-gdd.mjs --ra projects/game-moi/tools/ket-qua/validate-gdd.md` | Kiểm chéo 10 GDD: ID mọi họ (vật phẩm, nâng cấp UPG, loài, kẻ địch, boss, hazard, dải, map nhánh N, vật truyện MM, trục T-, khoang, tàu, nhóm hàng, hồ sơ) có trong file chủ. ID không trùng trong bảng định nghĩa và khối dữ liệu. ID định nghĩa có nhãn MVP. Kiện CGO thuộc đúng một nhóm HC và có giá. Ngưỡng Hạng khớp. Vật truyện có ID STY, khe có trên map, mốc có định nghĩa. Luật khung K, C được GDD nhắc. Tên riêng khớp `cot-truyen.md`, tên loài đi đúng mã, không còn tên cũ, số túi và ô đai cũ, câu trái C10. Dấu chờ chỉ còn của gd-economy, gd-ux. Không còn tên biến cố cũ đã đổi thành The Scattering (log 75), không còn điểm treo đợi GDM quyết (thay bằng số dòng log), không còn cụm phản diện cũ Lead đã bỏ (GD-033, kiểm cả `gdd/sheet/*.tsv`). Thoát 1 khi lỗi |\n| `node projects/game-moi/tools/sim-chuyen.mjs --ra projects/game-moi/tools/ket-qua/sim-chuyen.md` | Sim chuyến |\n| `node projects/game-moi/tools/sim-ca-cang.mjs --ra projects/game-moi/tools/ket-qua/sim-ca-cang.md` | Sim giờ giao thương |\n| `node projects/game-moi/tools/sim-combat.mjs --ra projects/game-moi/tools/ket-qua/sim-combat.md` | Sim combat |\n| `node projects/game-moi/tools/selftest.mjs` | Selftest mọi tool |","he-thong/ky-thuat.md",""],["6.2 Việc kỹ thuật tiếp theo (chưa làm)",3,311,10,1.81,"1. `tools/xuat-data.mjs`: khối dữ liệu markdown trong `gdd/he-thong/` sang `data/*.json` theo schema mục 2.1, có round-trip. Sheet chỉ là bản dán (điểm tự quyết 9).\n2. Importer Unity Editor: JSON sang ScriptableObject, chạy bằng menu, giữ GUID asset theo ID để prefab không mất tham chiếu.\n3. Prototype bay (`tools/prototype/bay.html`, mở qua http, ví dụ `python -m http.server` ở thư mục đó): còn thiếu kéo vật, Recall Beacon, gamepad. Người chơi thật chơi thử để chốt cảm giác. Lý thuyết S6 trong trang (đứng yên, phản xạ 0,27 giây, vùng trúng bán kính 2,5 u như phóng điện của Arc Eel): bay ra cần 0,92 giây báo trước, lướt ra cần 0,46 giây, nên báo trước 0,5 giây chỉ đủ khi lướt và lướt không đang hồi chiêu. Đã gửi gd-combat.","he-thong/ky-thuat.md",""],["6.3 Lựa chọn netcode Unity (để 4 dev quyết)",3,311,10,3.16,"Kiểm giá và giấy phép trên trang chính thức trước khi chọn.\n\n| Lựa chọn | Mô hình | Điểm mạnh với game này | Điểm cần cân | Chi phí cố định khi bán đứt (cần kiểm trang chính thức) |\n|---|---|---|---|---|\n| Netcode for GameObjects + Unity Relay, Lobby | Host, server, có chế độ quyền phân tán | Của Unity, tài liệu chính chủ, Relay vượt NAT không cần mở cổng | Relay và Lobby là dịch vụ trả theo dùng (có mức miễn phí), cần kiểm chi phí khi bán đứt lâu dài | Relay và Lobby trả theo lượng dùng, game bán đứt vẫn tốn tiền theo số người chơi lâu dài |\n| Mirror | Host, server | Mã nguồn mở, cộng đồng lớn, có transport cho Steam | Không có dịch vụ relay riêng, ghép với Steam hoặc tự lo | Không có phí thư viện. Relay phải tự lo hoặc dùng của Steam |\n| FishNet | Host, server | Mã nguồn mở, có sẵn dự đoán phía client | Cộng đồng nhỏ hơn Mirror | Không có phí thư viện. Relay phải tự lo hoặc dùng của Steam |\n| Photon Fusion | Host, chế độ chia sẻ | Có relay và dự đoán sẵn, nhanh làm co-op | Thương mại, giá theo số người online cùng lúc | Phí theo số người online cùng lúc, tốn tiền suốt đời game bán đứt |\n| Steamworks (Steam Networking Sockets) làm transport | Host | Relay của Steam, mời bạn qua danh sách bạn Steam, hợp game bán trên Steam | Gắn với Steam, đa nền tảng sau này cần lớp khác | Không phí thêm khi bán trên Steam |\n\nCâu cần dev trả lời trước khi chọn: game có bán ngoài Steam không, có cần chơi chéo nền tảng không (khung để ngỏ đa nền tảng), ai trong 4 dev đã làm netcode Unity.","he-thong/ky-thuat.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,298,10,0.26,"- UI: biểu tượng trạng thái mạng của từng đồng đội (ổn, trễ, đang Giữ chỗ). Thông báo khi host thoát rằng thế giới về điểm lưu gần nhất. Thông báo lệch phiên bản dữ liệu khi vào phiên. gd-ux đặt vị trí.\n- Không cần art hay audio riêng.","he-thong/ky-thuat.md",""],["7b. Cảm giác (game feel)",2,298,10,0.16,"Không có khoảnh khắc riêng. Mục tiêu là người chơi không nhận ra mạng: đồng đội bay mượt, nhặt và bốc phản hồi ngay trên máy mình, lùi lại hiếm.","he-thong/ky-thuat.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,298,10,1.96,"| Tiêu chí | Cách kiểm |\n|---|---|\n| Mọi tool có selftest và chạy bằng một lệnh | `node projects/game-moi/tools/selftest.mjs` thoát 0 |\n| Cùng seed cho cùng kết quả | Có trong selftest cho cả 3 sim |\n| Sim có ca tính tay | Có trong selftest cho cả 3 sim |\n| Tool không tự thêm luật, giả định được in | Đầu mỗi file kết quả liệt kê `[GIẢ ĐỊNH]` |\n| Validator bắt các loại lỗi đã có ca cài trong selftest | Selftest có ca cố ý cho: ID lạ, thiếu nhãn MVP, dấu chờ, tên cũ, tên riêng, tên loài, CGO thuộc nhóm, số túi cũ, câu trái C10, vật truyện, ID trùng trong bảng định nghĩa (RCP, UPG, SLV, KH), ID lạ họ N, MM, T- |\n| Schema phủ mọi bảng dữ liệu các GDD xin | Đối chiếu mục 6 của 10 GDD với bảng mục 2.1. Loại còn thiếu ghi ở câu hỏi mở |\n| Khi có build, co-op: hai người cùng nhặt một node | 1000 lần thử, đúng 1 người nhận mỗi lần |\n| Khi có build, co-op: thùng không nhân đôi hay mất | 100 lần nhặt, giao có rớt mạng giữa chừng, tổng thùng không đổi |\n| Khi có build, mất kết nối 15 giây | Vào lại đúng nhân vật theo mã slot. Quá 15 giây thì bị tính như kéo về (C10) |\n| Khi có build, host thoát | Thoát ở 4 thời điểm (giữa chuyến 1, sau chuyến 1, giữa ca, sau ca): mở lại đúng điểm lưu gần nhất (K23), bố cục chuyến kế giống lần trước |\n| Khi có build, vào giữa chừng | Thử ở 3 pha (chuyến, ca, cuối ngày), người mới vào đúng luật 13 |\n| Khi có build, file save | Cắt điện giữa lúc ghi: mở lại được bản trước (luật 20) |\n| Khi có build, dữ liệu | Xuất rồi nhập lại: 0 trường lệch |\n| Khi có build, số playtest khớp sim | Thời lượng chuyến (`trip_end.minutes`), tỉ lệ tàu phục vụ xong, tip, rảnh mỗi người (`crate_delivered`, `ship_left_unserved`, `port_player_idle`), tỉ lệ kéo về (`player_choking_end`) lệch không quá 20% so với file kết quả sim cùng cấu hình |","he-thong/ky-thuat.md",""],["10. Câu hỏi mở",2,298,10,0.67,"| Câu | Ai trả lời | Đề xuất |\n|---|---|---|\n| Netcode nào | 4 dev | Bảng 6.3 |\n| Có chuyển host khi host thoát không (luật 17) | 4 dev, GDM | Mặc định không. Dev đề nghị nếu stack chọn hỗ trợ sẵn |\n| Chuỗi và bước tutorial có thành ScriptableObject không | gd-ux, dev | Chưa. Dev đọc thẳng `strings/strings.tsv` và bảng bước của `ux-ui.md` |\n| Giữ chỗ tối đa 1 lần mỗi chuyến (luật 16) | gd-character | Đề xuất, chưa nhận. `nguoi-choi.md` 2.9 chưa có trần, luật 16 áp khi gd-character ghi vào |\n| Ai chơi thử prototype bay để chốt cảm giác | GDM | Lead hoặc gd-qa chơi 10 phút, xuất JSON gửi gd-character |","he-thong/ky-thuat.md",""],["Co-op 1 đến 4 người",2,298,10,0.17,"File này là phần co-op kỹ thuật của mọi hệ thống: mục 2.2 và 2.3. Không luật nào cần đúng N người. Hệ số theo N lấy lúc sinh, không đổi giữa chừng (luật 14).","he-thong/ky-thuat.md",""]],"x":[[110,125,2],[32,37,2],[32,36,3],[35,40,2],[72,74,2],[280,281,2],[68,70,3],[146,242,1],[182,184,2],[6,14,2],[14,16,2],[5,14,2],[35,36,2],[36,115,1],[40,110,1],[36,112,1],[73,151,1],[74,151,1],[161,270,1],[240,306,1],[303,304,2],[153,305,1],[145,302,1],[150,151,2],[71,172,1],[89,105,6],[89,90,4],[95,208,1],[90,96,2],[208,215,2],[207,208,2],[205,207,2],[215,218,3],[274,276,2],[281,286,5],[282,286,3],[186,286,1],[183,281,1],[185,280,1],[277,287,2],[277,282,2],[276,282,2],[182,187,2],[182,193,2],[186,187,2],[182,186,5],[184,186,5],[183,186,3],[185,186,5],[183,185,2],[36,114,1],[35,113,1],[36,117,1],[35,127,1],[245,302,1],[37,112,1],[149,304,1],[32,115,1],[105,210,1],[185,286,1],[68,246,1],[72,240,1],[193,276,1],[70,304,2],[96,214,1],[182,285,1],[90,214,1],[187,287,1]],"meta":{"commit":"e350ae2f01d19da7430b1aa0701a239675897636","mapped":240}}</script>

      <div class="ttl"><span class="orb" style="box-shadow:0 0 10px 3px ${c}, 0 0 20px 6px ${c}55"></span><div><h2>${esc(plain(s))}</h2>${s.full ? `<p class="full">${esc(s.full.replace(/^GDD hệ thống:\s*/, ''))}</p>` : ''}</div></div>
      <div class="meta">${s.lv > 1 ? `<span>${esc(sysOf(s).t)}</span>` : ''}${s.kids.length ? `<span>${s.kids.length} nhánh${open.has(s.i) ? ' đang mở' : ''}</span>` : ''}${s.link.length ? `<span>${s.link.length} liên hệ</span>` : ''}${s.f ? `<span>${esc(s.f.replace('he-thong/', ''))}</span>` : ''}</div>`;
    const list = (ids, label) => ids.length ? `<div class="sec"><h3>${label}</h3><ul class="kids">${ids.map((j) => { const n = S[j]; const d = 3 + 8 * n.imp; return `<li><button type="button" data-go="${j}"><span class="dot"><i style="width:${d}px;height:${d}px;box-shadow:0 0 ${3 + 7 * n.imp}px 1px ${tint(n)};opacity:${0.5 + 0.5 * n.lum}"></i></span>${esc(plain(n))}${n.kids.length ? `<em>${n.kids.length} nhánh</em>` : ''}</button></li>`; }).join('')}</ul></div>` : '';
    const body = s.body.trim(); let html = '';
    if (body) {
      const long = body.length > 9000; const part = long ? body.slice(0, body.lastIndexOf('\n', 9000)) : body;
      html = `<div class="sec"><h3>${s.lv <= 1 ? 'Tóm tắt' : 'Nội dung'}</h3><div class="md" id="md">${md(part)}</div>${long ? '<button class="more" type="button" id="more">Đọc hết mục này</button>' : ''}</div>`;
    } else if (s.lv >= 2) html = '<p class="note">Mục này gom các nhánh con bên dưới.</p>';
    const cross = s.link.slice().sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    $('pb').innerHTML = (s.lv <= 1 ? list(s.kids, s.lv === 0 ? 'Các hệ thống' : 'Các nhánh') + html : html + list(s.kids, 'Đọc sâu hơn')) + list(cross, 'Liên hệ với phần khác');
    $('pb').scrollTop = 0;
    const more = $('more'); if (more) more.onclick = () => { $('md').innerHTML = md(body); more.remove(); };
  }
  function md(t) {
    return marked.parse(t, { gfm: true }).replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, '</table></div>').replace(/<h[1-6]/g, '<h4').replace(/<\/h[1-6]>/g, '</h4>');
  }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) { choose(+b.dataset.go); $('res').hidden = true; } });
  $('close').onclick = () => $('panel').classList.add('off');
  $('fit').onclick = () => fly(visibleStars());
  $('fold').onclick = () => { collapse(0); sel = 0; render(); fly(visibleStars()); };
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.activeElement !== $('q') && sel != null && S[sel].p >= 0) choose(S[sel].p); });

  // chuột: dò sao đang hiện gần nhất, đo trên màn hình
  const HIT = [28, 22, 12, 8];
  function pick(ev) {
    const [mx, my] = d3.pointer(ev, cv); const wx = (mx - T.x) / T.k, wy = (my - T.y) / T.k;
    let best = null, bs = Infinity;
    for (const s of S) {
      if (s.v < 0.6) continue;
      const d = Math.hypot(s.x - wx, s.y - wy) * T.k; const lim = Math.max(s.r * T.k * 1.8, HIT[s.lv]);
      if (d < lim && d / lim < bs) { bs = d / lim; best = s; }
    }
    return best;
  }
  const tip = $('tip');
  const place = (ev) => { tip.style.left = Math.min(ev.clientX + 14, innerWidth - 330) + 'px'; tip.style.top = ev.clientY + 14 + 'px'; };
  cv.addEventListener('pointermove', (ev) => {
    const s = pick(ev); hov = s ? s.i : null; cv.classList.toggle('hover', !!s);
    if (s) {
      const hint = s.kids.length && s.lv > 0 ? (open.has(s.i) ? 'nháy đúp để thu nhánh' : `bấm để mở ${s.kids.length} nhánh`) : 'bấm để đọc';
      tip.hidden = false; tip.innerHTML = `${esc(plain(s))}<small>${s.lv >= 1 ? esc(sysOf(s).t) : 'lõi'} · ${hint}</small>`; place(ev);
    } else tip.hidden = true;
  });
  cv.addEventListener('pointerleave', () => { hov = null; tip.hidden = true; });
  let downAt = null, pending = null;
  cv.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
  cv.addEventListener('pointerup', (ev) => {
    if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
    const s = pick(ev); if (!s) return;
    clearTimeout(pending); pending = setTimeout(() => choose(s.i), 230); // chờ xem có phải nháy đúp
  });
  cv.addEventListener('dblclick', (ev) => { clearTimeout(pending); const s = pick(ev); if (s) collapse(s.i); });

  // tìm kiếm
  $('q').addEventListener('input', (e) => {
    const q = fold(e.target.value.trim()); const ul = $('res');
    if (q.length < 2) { ul.hidden = true; return; }
    const hits = S.map((s) => [s, (fold(s.t).includes(q) ? 3 : 0) + (fb[s.i].includes(q) ? 1 : 0) + s.imp]).filter((x) => x[1] >= 1).sort((a, b) => b[1] - a[1]).slice(0, 14);
    ul.innerHTML = hits.length ? hits.map(([s]) => `<li><button type="button" data-go="${s.i}"><i style="background:${tint(s)};box-shadow:0 0 6px ${tint(s)}"></i>${esc(plain(s))}<small>${s.lv >= 1 ? esc(sysOf(s).t) : ''}</small></button></li>`).join('') : '<li class="note" style="padding:8px">Không có mục nào khớp.</li>';
    ul.hidden = false;
  });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.target.value = ''; $('res').hidden = true; e.target.blur(); } if (e.key === 'Enter') { const b = $('res').querySelector('button'); if (b) b.click(); } });

  // mở đầu: lõi và 11 hệ thống, màn rộng mở sẵn bảng đọc ở lõi
  sel = 0; if (!mob()) render();
  const st = visibleStars(); const xs = st.map((s) => s.x), ys = st.map((s) => s.y);
  const panelW = mob() ? 0 : Math.min(480, innerWidth * 0.4) + 32;
  const top0 = mob() ? document.querySelector('.dock').getBoundingClientRect().bottom : 0;
  const leftPad = mob() ? 0 : 110;
  // mở đầu đủ gần để đọc tên 11 hệ thống, màn nhỏ thì kéo để xem phần còn lại
  const k0 = Math.max(0.13, Math.min((W - panelW - leftPad) / (Math.max(...xs) - Math.min(...xs) + (mob() ? 1500 : 800)), (H - top0) / (Math.max(...ys) - Math.min(...ys) + 600)));
  sky.call(zoom.transform, d3.zoomIdentity.translate(leftPad + (W - panelW - leftPad) / 2, top0 + (H - top0) / 2 + (mob() ? 0 : 20)).scale(k0));
  requestAnimationFrame(draw);
})();
</script>

</html>
