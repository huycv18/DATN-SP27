ng thức | Biến | Khoảng đầu ra | Ví dụ |\n|---|---|---|---|---|\n| Hệ số tải f | f = tải_hiện_tại / sức_chứa | tải, sức chứa túi | 0 đến 1 | 60 trên 80 thì f = 0,75 |\n| Phạt tải p | p = 0,15 nhân max(0, (f - 0,6) / 0,4) | f | 0 đến 0,15 | f = 0,75 thì p = 0,056 |\n| Tốc độ tối đa thật | vmax_thật = vmax_bậc nhân (1 - p) nhân hệ_số_kéo | p, hệ số kéo lớp vật | 0,43 đến 1,0 nhân vmax | vmax 6,0 với p = 0,056 thì 5,66 u/s |\n| Gia tốc thật | a_thật = a_bậc nhân (1 - p) | p | 0,85 đến 1,0 nhân a | p = 0,056 thì 18 thành 17,0 u/s2 |\n| Hao Oxy nền thật | hao = 1,0 nhân (1 + p) nhân hệ_số_môi_trường nhân hệ_số_hao_kéo | p, hệ số môi trường 1,0 / 2,5 / 4,0, hệ số hao kéo 1,0 / 1,10 / 1,25 | 1,0 đến 5,75 điểm/giây | p = 0,056, thiếu 1 cấp: 2,64 điểm/giây |\n| Vạch \"đủ về\" | Oxy_về = (d_thoát / (0,8 nhân vmax_thật)) nhân hệ_số_môi_trường_dọc_đường + dự phòng | d_thoát là khoảng cách đường thẳng tới đích (u). Dự phòng 8 khi đích là Recall Beacon (5 giây Recall cộng 3 giây đệm), 3 khi đích là cửa khí, giống luật ở mục 2 | từ 3 trở lên | d = 240 u, vmax 6, đích cửa khí: 50 + 3 = 53 Oxy. Sim dùng 8 cho mọi đích (thận trọng hơn) |\n\nNúm gap: ba tham số nối ý đồ với số đo: dung lượng Oxy bậc 0 (độ dài chuyến chương 1), hệ số thiếu cấp (độ mềm của cổng dải, K6), thời gian Ngạt (độ khoan dung, P1 với P3). Chỉnh bằng sim và prototype, không chỉnh cảm tính.\n\nĐộ dài chuyến theo sim GD-030 (`map.md` 3.9): chương 1 dài 4,4 phút với bình 330, chương 5 dài 10,4 phút với bình 1000, khớp khung mục 9 (4 đến 6 và 10 đến 12 phút, log 54).","he-thong/nguoi-choi.md",""],["4. Trường hợp biên",2,84,3,3.81,"| Ca | Xử lý |\n|---|---|\n| Oxy bằng 0 đúng khung Kích Recall hoàn tất | Recall thắng (kiểm trước ngạt, bước 8 trước bước 9), kết thúc chuyến bằng Recall, túi nguyên vẹn |\n| Oxy chạm 0 khi Kích Recall chưa xong | Hủy kênh, vào Ngạt |\n| Dùng CON-101 khi Oxy gần đầy hoặc chạm trần 25% | Hồi phần còn lại tới trần hoặc tới dung lượng, bình tiêu hết, phần dư bỏ |\n| Dùng CON-101 khi Ngạt | Không dùng được, hiện \"Không dùng được khi ngạt\" |\n| Bị đánh giữa kênh CON-101 | Hủy kênh, bình chưa tiêu |\n| Chuyến thứ ba trong ngày hoặc đã mở giờ giao thương | Cửa khí khóa (K22), hiện lý do |\n| Trao đồ hay thả đồ khi đang ngạt | Không cho (K27) |\n| Đòn trúng đúng khung Kích Recall hoàn tất | Đòn thắng (bước 7 trước bước 8), Recall bị hủy |\n| Oxy đúng 0 do hao nền, không phải do đòn | Vào Ngạt như thường, không có nhánh \"chết ngay\" |\n| Túi đầy lúc nhặt | Không nhặt, vật nảy ra, hiện \"Túi đầy\", không mất vật |\n| Ngạt khi đang kéo buồng ngủ đông | Thả buồng, buồng trôi tại chỗ, người nào khác kéo về được. Một mình bị kéo về thì buồng nằm lại ở chỗ thả và kéo lại được ở chuyến sau (buồng thuộc map nhánh không sinh lại, K7) |\n| Nhặt vật manh mối | Ghi vào Sổ tay tức thì, túi đầy cũng nhặt được, ngạt rồi bị kéo về không mất |\n| Bị kéo về khi đang giữ vật nhiệm vụ không ghim | Vật về vị trí gốc, chuyến sau lấy lại |\n| Người đã về trạm muốn ra lại trong cùng chuyến | Không cho (C9), cửa khí báo \"chờ nhóm về\" và mở xưởng, khoang nuôi, xem vị trí đồng đội |\n| Ngạt khi đang kéo lồng mẫu | Thả. Nếu đang ghim lồng đó thì bị kéo về chỉ giữ con có sao cao nhất trong lồng (luật 25 của gd-combat) |\n| Hai người cùng ngạt, cạnh nhau | Không ai chia được (người cho phải từ 20 Oxy), cả hai bị kéo về nếu hết giờ |\n| Người cho tụt xuống 20 Oxy đang chia | Dừng chia, người nhận còn ngạt, đồng hồ tiếp tục |\n| Hai người cùng chia cho một người ngạt | Cộng dồn tốc độ chia (20 điểm/giây), đồng hồ ngạt tạm dừng |\n| Người nhận chia Oxy rồi trúng đòn ngay khi vừa được cứu | I-frame 2 giây che đòn |\n| Spam Lướt | Chặn bởi hồi chiêu, đệm input giữ 0,12 giây |\n| Spam Kích Recall (thả rồi giữ lại) | Cho thử lại không giới hạn (như Dave [D9]), mỗi lần bắt đầu lại 5 giây |\n| Nhặt vật khi đang Trúng đòn | Hút nhặt vẫn chạy, Oxy trừ trước |\n| Lướt vào tường | Triệt vận tốc vuông góc, không trừ thêm, vẫn mất 4 Oxy |\n| Kích Recall khi có vật đang kéo xa hơn 3 u | Vật ở lại, hiện cảnh báo trước khi hoàn tất 1 giây |\n| Về an toàn khi túi rỗng | Cho phép, hiện \"Chuyến trống\" |\n| Thoát phiên đúng khi Ngạt | Mất kết nối: Giữ chỗ (đồng hồ dừng), quá 15 giây thì Bị kéo về giữ 1 món ghim. Thoát chủ động: tính như Bị kéo về, giữ 1 món ghim (C10) |\n| Một mình thoát giữa chuyến | Mất chuyến, vào lại ở điểm lưu gần nhất với cùng bố cục (K23) |\n| Host thoát hoặc mất kết nối giữa chuyến | Thế giới về điểm lưu gần nhất (C10), khách không giữ gì từ chuyến dở |\n| Bộ đẩy mất lực ngoài (vượt 12 u/s) | Chặn ở 12 u/s |\n| Mở túi giữa lúc bị đánh | Không dừng thời gian, túi mở như HUD chồng |\n| Oxy đầy, ở xa cửa khí | Vạch \"đủ về\" hiển thị nhưng thanh không cảnh báo |\n| Một mình, ngạt, cách cửa khí 40 u | Không tự thoát được (12 giây ở 2,4 u/s đi 28,8 u), bị kéo về giữ 1 món |\n| Nhân vật người rời phiên đứng trong khoang đang sự cố | Không nhận trạng thái Chậm hay Giật điện (là NPC trang trí) |\n| Người vào sau khi hết ngày | Vào trạm ở pha cuối ngày, dùng chung kho, chờ chuyến kế |\n| Nâng cấp mua giữa chuyến | Không thể, nâng cấp ở trạm, áp từ chuyến sau |","he-thong/nguoi-choi.md",""],["5. Ràng buộc vật lý của luật",2,84,3,1.04,"- Tốc độ tối đa ở bậc 3 là 7,5 u/s, không vượt 8 u/s vì tốc độ quá lớn làm khe và mảnh dựng tay khó đọc. Tăng mỗi bậc tối đa 8%.\n- Camera thấy khoảng 17,8 u theo chiều ngang và 10 u theo chiều dọc (ước, chốt ở `ux-ui.md`), nên ở 7,5 u/s nhân vật mất 1,2 giây để băng qua nửa màn.\n- Co-op 4 người tách nhau: mỗi người một camera nên cần đồng bộ vị trí 4 nhân vật tại 20 Hz (xem mục 6).\n- Chia Oxy cần từ 2 người trở lên, một mình vẫn thoát được qua Recall, cửa khí, hoặc Ngạt rồi bị kéo về.\n- Ngạt luôn kết thúc, trần thời gian = 12 giây cộng tối đa thời gian đang được chia (người cho đủ 20 Oxy để cho, nên hữu hạn).\n- Túi tối đa 216 Khối (bậc 4) bằng 2,7 lần bậc 0 (80 Khối). Bình Oxy tối đa 1000 bằng 3,0 lần bậc 0, nên từ chương 2 trở đi túi đầy không còn là giới hạn đến trước Oxy. Ở chương 1 (bậc 0) túi đầy vẫn là lý do về phổ biến (sim GD-030: 83% chuyến trung bình một người về vì đầy túi), chấp nhận vì sim đã cho chuyến 4,2 phút.","he-thong/nguoi-choi.md",""],["6. Yêu cầu cho engineer / tool",2,84,3,2.04,"Đầu vào: input (8 hướng, lướt, hãm, ngắm, hành động), cấp bộ đồ của nhóm, danh sách vật phẩm với khối lượng, lớp vật kéo được.\nĐầu ra: vị trí, vận tốc, Oxy, tải, trạng thái, sự kiện.\n\n| Sự kiện (cho Event Tracking) | Tham số |\n|---|---|\n| player_trip_start | player_id, slot, bậc bộ đồ, số người |\n| player_oxy_threshold | player_id, ngưỡng (50, 25, 10, 0), thời điểm trong chuyến |\n| player_dash | player_id, chi phí, vị trí |\n| player_hit | player_id, sát thương gốc, sát thương sau giảm, nguồn |\n| player_choking_start, player_choking_end | player_id, kết thúc (cứu, tự thoát, bị kéo về) |\n| player_oxy_share | từ, tới, tổng điểm |\n| player_consumable_use | player_id, vật tiêu hao, Oxy hồi thật, Oxy hồi lũy kế trong chuyến, hủy hay xong |\n| player_item_trade | từ, tới, vật phẩm |\n| player_recall_start, player_recall_end | player_id, hoàn tất hay hủy, lý do hủy |\n| player_pinned_item | player_id, vật phẩm, thời điểm |\n| player_trip_end | player_id, loại kết thúc (cửa khí, recall, kéo về, rời phiên tính như kéo về, mất chuyến khi chơi một mình), tải cuối, giá trị túi, Oxy còn |\n\n- Dữ liệu lưu: cấp bộ đồ chung của nhóm, danh sách nhân vật (tối đa 4, slot, tên, màu), món ghim đang chọn không lưu qua chuyến.\n- Đồng bộ co-op: vị trí và vận tốc từ client sở hữu nhân vật, Oxy và túi do client sở hữu quyết định nhưng host kiểm hợp lệ (host quyết ngạt, kéo về và chia Oxy), ngưỡng 20 Hz cho vị trí (gd-tech có thể đổi ở `ky-thuat.md`).\n- Tham số trong một ScriptableObject duy nhất `PlayerTuning` để sửa không build lại, kèm công cụ bảng chỉnh trực tiếp trong prototype.\n- Prototype gd-tech cần thử (số thử trong mục 8): vmax, gia tốc, hãm tự nhiên, hãm chủ động, lướt, bán kính hút nhặt, camera nhìn trước.\n- Nơi luật phải cùng đổi khi sửa: `PlayerTuning`, bảng Player trên Sheet, bảng đầu vào của sim chuyến (gd-tech), HUD (gd-ux).","he-thong/nguoi-choi.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,84,3,1.89,"| Sự kiện | Hình | Âm | Text / tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Bay | Bộ đẩy phụt theo hướng ngược, thân nghiêng 10 độ theo hướng đẩy, chân vẩy ngược hướng trôi | Xì nhẹ liên tục theo tốc độ | Bước 1 tutorial: \"Bay\" | Cao |\n| Hãm | Bộ đẩy phụt ngược hướng đang trôi, bụi băng nhỏ | Xì ngắn gắt | Bước 2: \"Hãm để dừng\" | Cao |\n| Lướt | Vệt mờ 3 khung, phụt lớn | Vút ngắn | Bước 3: \"Lướt tốn Oxy\" | Cao |\n| Oxy hao | Thanh Oxy tụt đều, vạch \"đủ về\" | Bíp theo ngưỡng 50, 25, 10 | Gợi ý lần đầu ở 25% | Cao |\n| Trúng đòn | Nháy trắng 0,1 giây, rung màn hình nhẹ, Oxy tụt thấy được | Thịch, thở gấp | Không | Cao |\n| Ngạt | Viền tối, đồng hồ vòng quanh đầu, nhân vật co, túi mở | Thở yếu, tim đập | Hiện \"Chờ cứu hoặc chạm cửa khí\" | Cao |\n| Chia Oxy | Dây sáng nối hai bộ đồ, hạt sáng chạy theo dây | Tiếng nạp ấm | Hiện \"Đang chia Oxy\" | Cao |\n| Được cứu | Quầng sáng 2 giây | Hít sâu | Không | Trung bình |\n| Bị kéo về | Dây kéo về hướng trạm, bình mờ dần | Tiếng thu dây | Màn tóm tắt \"Giữ\" và \"Mất\" | Cao |\n| Kích Recall | Vòng nạp quanh Beacon, nhân vật chùng tay | Bíp tăng dần theo 5 giây | \"Giữ F\" lần đầu | Cao |\n| Nhặt | Vật hút vào theo cong | Tick, cao độ theo độ hiếm | Không | Cao |\n| Túi nặng | Bộ đẩy phụt lớn hơn, nhân vật cúi | Xì nặng hơn | Gợi ý lần đầu ở 60% | Trung bình |\n| Ghim món | Biểu tượng ghim trên túi | Click | \"Món ghim giữ lại khi ngạt\" ở lần ngạt đầu | Cao |\n| Dùng vật tiêu hao | Nhân vật nâng bình lên cổ, thanh Oxy dâng, hiện \"Còn hồi n\" | Xì nạp ấm 1,5 giây | \"Hồi Oxy có trần\" lần đầu Oxy dưới 50% | Cao |\n\nPhản hồi thị giác và âm thanh phải bật tắt được từng lớp khi thử (juice không che thông tin). Chi tiết art nhân vật trong `ho-so-nhan-vat.md`.","he-thong/nguoi-choi.md",""],["7b. Cảm giác (game feel)",2,84,3,2.31,"- Tham chiếu: Dave the Diver (bơi và lặn, điều khiển trực tiếp trong cấu trúc 2D nhìn ngang, oxy hao nhanh khi trúng đòn [D14]), Celeste (tha thứ ngầm: bán kính hút nhặt, corner correction, đệm input), Hardspace: Shipbreaker (phản hồi thị giác thay vật lý nặng: chân vẩy theo vận tốc, camera trễ).\n- Phản tham chiếu: không được giống quán tính nặng kiểu trôi 2 đến 3 giây làm khó dừng chính xác, không được giống nhân vật điều khiển nửa trễ khiến lướt vào đòn.\n- Thời gian phản hồi: đẩy tới gia tốc nhìn thấy trong 1 khung, lướt phản hồi trong 2 khung, hãm trong 1 khung. Camera trễ 0,15 giây, nhìn trước 1,5 u.\n- Rung màn hình: trúng đòn rung biên độ nhỏ 0,1 giây. Chia Oxy không rung. Cảnh báo 10% dùng âm và viền, không rung.","he-thong/nguoi-choi.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,84,3,1.75,"Chỉ số kết quả:\n\n| Chỉ số | Mục tiêu | Ai đo |\n|---|---|---|\n| Tỉ lệ chuyến kết thúc vì Ngạt rồi bị kéo về | Hai mức theo khung mục 9: người cẩn thận dưới 5%, người tham 15 đến 40%. Đo lại bằng playtest | gd-tech, gd-qa |\n| Thời gian chuyến chương 1 | 4 đến 6 phút | gd-tech, gd-world |\n| Tỉ lệ người chơi mới ghim món trước lần ngạt đầu | trên 70% sau tutorial | gd-qa (playtest) |\n| Số lần được cứu trên số lần ngạt khi co-op 2 người | trên 40% | gd-tech, gd-qa |\n\nTiêu chí nghiệm thu (gd-qa pass hoặc fail):\n1. Có prototype di chuyển trong đó người thử dừng cách điểm đích tối đa 0,5 u ở trên 90% lần thử bằng Hãm.\n2. Có hành lang rộng 1,5 u dài 20 u (đi hết khoảng 3,3 giây ở 6 u/s), tối thiểu 5 người thử mới, từ lần thử thứ 3 trở đi ít nhất 90% lượt đi không chạm tường.\n3. Mọi số trong mục 3 nằm trong khoảng an toàn sau prototype, hoặc có ghi lý do lệch và ngày thử.\n4. Bảng trạng thái 2.3: không có đường thoát nào bị thiếu, mô phỏng 1000 chuyến ngẫu nhiên không có người chơi ở trạng thái không thoát được (bot chấm).\n5. Co-op 2 người: cứu bằng chia Oxy hoạt động trong 5 lần thử liền, Oxy hai bên cộng bằng đúng số chuyển (sai số dưới 1 điểm).\n6. Bị kéo về luôn giữ đúng 1 món ghim, 0 Tally bị trừ.\n7. Chuyến bắt đầu với bậc 0 và 1 trên MVP đều có thanh Oxy khớp bảng 2.6.\n8. CON-101: hồi không vượt trần 25% dung lượng bình trong một chuyến, không dùng được khi ngạt, hủy khi trúng đòn, sim 1000 chuyến không có lượt nào hồi vượt trần (bot chấm).\n9. K22 và C10: cửa khí khóa sau chuyến thứ hai, khách thoát giữa chuyến luôn giữ đúng 1 món (bot chấm 1000 lượt).","he-thong/nguoi-choi.md",""],["10. Câu hỏi mở",2,84,3,1.24,"| # | Câu hỏi | Đề xuất | Ai quyết |\n|---|---|---|---|\n| 1 | CON-101 có phá P1 không | Đã chặn bằng K26 (trần 25% dung lượng, tối đa 2 bình, không dùng khi ngạt, hủy khi trúng đòn). Số 40 và chi phí chế chờ gd-tech đưa vào sim chuyến | gd-tech, gd-economy |\n| 2 | Lướt có nên tốn Oxy theo giây giữ phím thay vì một lần không | Giữ một lần 4 Oxy cho đo lường dễ, thử trong prototype | gd-tech |\n| 3 | Người ngạt không bị nhắm tới và không nhận đòn | Đã chốt: `combat-driftlife.md` luật 10 và E9 đã có luật này | Đóng |\n| 4 | Thang tải của vật phẩm và lớp vật kéo | gd-items đặt, giữ trần mẻ lớn nhất không quá 2 lần túi bậc 0 | gd-items |\n| 5 | Camera 17,8 nhân 10 u có hợp bản đồ greybox không | Giữ ước, chốt cùng gd-world và gd-ux | gd-world, gd-ux |\n| 6 | Chuyển host khi host rớt | Không làm: host thoát thì về điểm lưu (C10) | Đóng |\n| 7 | Người rời phiên có nên có mặt trong giờ giao thương như NPC hỗ trợ không | Không, nhân vật chỉ đứng trang trí (Sau MVP bàn lại) | gd-quan, GDM |\n| 8 | Cấp Vỏ có cần giảm đòn không hay chỉ cần là cổng môi trường | Giữ giảm nhẹ 5 phần trăm mỗi cấp để cấp có cảm giác | gd-combat |","he-thong/nguoi-choi.md",""],["Co-op 1 đến 4 người",2,84,3,12.28,"Nguyên tắc: mọi luật ở trên đúng với mọi N từ 1 đến 4. Thêm người là thêm tay, không mở nội dung riêng (P3).\n\n| Mục | 1 người | 2 người (MVP) | 3 người (Sau MVP) | 4 người (Sau MVP) |\n|---|---|---|---|---|\n| Oxy | Riêng, không ai chia được, tự thoát bằng cửa khí hoặc Recall | Riêng, chia Oxy cho nhau | Như 2 người, nhiều bên cho cùng lúc | Như 3 người |\n| Túi đồ | Riêng | Riêng, Trao đồ cho nhau | Như 2 người | Như 2 người |\n| Dụng cụ mang theo | Riêng | Riêng | Riêng | Riêng |\n| Bộ đồ nâng cấp | Chung của nhóm | Chung, mua một lần (C4) | Chung | Chung |\n| Kéo vật nặng | 0,50 | 0,65 nếu cùng kéo | 0,80 | 0,95 |\n| Va chạm giữa người chơi | Không có | Đi xuyên nhau | Đi xuyên | Đi xuyên |\n| Tạm dừng | Có thể (C7) | Không | Không | Không |\n| Ping | Dùng được (ghi chú cho bản thân) | Có | Có, mỗi người 3 ping | Có |\n| Xác nhận chuyến | Một mình xác nhận | Cả hai xác nhận, ai không trả lời trong 30 giây thì tính là ở lại (C5) | Như vậy | Như vậy |\n| Ngạt và kéo về | Mỗi người riêng (C6) | Riêng, người còn lại tiếp tục | Riêng | Riêng |\n| Người về sớm (C9) | Không áp, chuyến kết thúc ngay | Chờ người còn lại, làm việc trạm | Như 2 người | Như 2 người |\n| Khách rời hoặc mất kết nối quá 15 giây | Không áp. Chơi một mình thoát giữa chuyến thì mất chuyến (K23) | Tính như Bị kéo về, giữ 1 món ghim, nhân vật ở lại trạm (C10) | Như 2 người | Như 2 người |\n| Host thoát | Như một mình | Phiên kết thúc, về điểm lưu gần nhất | Như vậy | Như vậy |\n| Người vào sau | Vào làm người thứ 2 | Vào làm người thứ 3 | Vào làm người thứ 4 | Không vào được (hết slot) |\n| Ngạt khi chỉ còn một người ngoài kia | Bị kéo về như thường | Như thường | Như thường | Như thường |\n\nKiểm: không luật nào hỏi \"có đúng N người không\", mọi con số tham số không đổi theo N (C8 chỉ đổi tài nguyên, máu Driftlife, số tàu, ở hệ thống khác).\n\nCa đặc biệt: hai người cùng bị kéo về cạnh nhau, cả hai cùng ở Bị kéo về, hai cảnh kéo hiển thị đồng thời, mỗi người giữ món ghim của mình. Đồng đội cũ vẫn ngoài kia ghi nhận \"người này đã về\" trên HUD và có thể ping lời nhắc.","he-thong/nguoi-choi.md",""],["Combat và Driftlife",1,0,4,35.65,"Ngoài không gian người chơi gặp Driftlife (sinh vật bản địa, sinh lại mỗi chuyến) và ở nửa sau game gặp The Wardens. Combat là cách lấy mẫu và giữ Oxy. Mỗi con Driftlife cho ba lựa chọn: bắt sống, hạ hoặc né. Bắt sống luôn đáng hơn hạ (K9) nhưng tốn công, tốn vật tiêu hao, chiếm chỗ trong Lồng mẫu. Tầng: lõi. Ưu tiên: bản đầu cho MVP (các loài dải Gần và boss chương đầu), đầy đủ cho cả game. Phụ thuộc: `nguoi-choi.md` (Oxy, lướt, túi), `vat-pham.md` (dụng cụ, rơi), `map.md` (điểm sinh, phòng boss), `tram-va-cang.md` (nuôi, sự cố).","he-thong/combat-driftlife.md","GDD hệ thống: Combat, bắt sống, Driftlife, The Wardens, boss"],["Hiện hành",2,106,4,1.03,"- Sát thương lên người chơi trừ thẳng vào Oxy, kèm đẩy lùi và 0,8 giây miễn sát thương. Không có thanh máu riêng.\n- Ngắm tự do bằng chuột hoặc cần phải gamepad, không khóa mục tiêu, gamepad có hỗ trợ ngắm nhẹ.\n- Driftlife có Sinh lực, thanh Choáng và thanh Mê. Choáng nhanh và ngắn (4 giây), ngủ chậm và dài (12 giây). Lặp lại thì yếu dần (DR).\n- Bắt sống theo cỡ: S bằng Súng lưới hoặc tay khi bất lực (từ chương 1, MVP), M bằng Phao kéo khi bất lực, L chỉ lấy mẫu sinh thiết (từ chương 2). Boss Driftlife có hai cách kết: hạ hoặc xua đi.\n- Chất lượng mẫu sống 1 đến 3 sao theo Sinh lực còn lại lúc bắt. Hạ cho nguyên liệu 1 sao, hạ khi đang bất lực cho 2 sao.\n- 15 loài Driftlife (5 mỗi dải), 4 đơn vị The Wardens, 5 boss (1 mỗi chương, chỉ ở map nhánh).\n- Co-op: Sinh lực, ngưỡng choáng và ngưỡng mê tăng theo số người. Sát thương lên người chơi không tăng. Mỗi người chơi có vé tấn công riêng nên áp lực mỗi người giữ nguyên.","he-thong/combat-driftlife.md",""],["1. Mục đích với người chơi",2,106,4,0.94,"- Cảm giác: tôi là người sống sót khéo tay: đọc con vật, chọn đúng dụng cụ, lấy thứ cần với ít Oxy nhất.\n- Quyết định chính mỗi lần gặp Driftlife: bắt sống (giá trị cao, tốn công, phải kéo lồng mẫu về), hạ (nhanh, gọn túi, giá trị thấp hơn), hay né (giữ Oxy cho việc khác).\n- Pillar phục vụ: P1 (mỗi đòn trúng là mất giây thở, nên đánh hay né là quyết định Oxy). P2 (mẫu sống thành con nuôi, nghiên cứu, đơn cảng giá cao, nhìn thấy trên trạm). P3 (mọi luật đúng 1 đến 4 người, có bạn thì chia vai lùa và bắt). P4 (The Wardens và dấu săn bắt trên Driftlife kể chuyện qua thứ người chơi gặp).\n- 30 giây đầu combat (chương 1, chuyến 1): một đám Driftmoth trôi quanh mảnh vỡ, không đánh. Người chơi bắn Lao từ thử, con trúng nổ ra mẫu mô. Vài giây sau một Arc Eel sáng lên báo trước rồi phóng điện, người chơi mất vài điểm Oxy và thấy thanh Oxy tụt.","he-thong/combat-driftlife.md",""],["2. Luật",2,106,4,29.22,"","he-thong/combat-driftlife.md",""],["2.1 Combat chung",3,109,4,11.36,"1. (MVP) Sát thương lên người chơi trừ vào Oxy của người đó (K1). Không có thanh máu riêng.\n2. (MVP) Người chơi trúng đòn thì vào trạng thái Trúng đòn: bị đẩy lùi theo hướng đòn, mất điều khiển 0,25 giây, rồi được miễn sát thương 0,8 giây tính từ lúc trúng. Trong 0,8 giây đó đòn khác trúng vẫn đẩy lùi nhưng không trừ Oxy.\n3. (MVP) Trúng đòn hủy mọi thao tác giữ phím đang làm: Kích Recall (K4), Tương tác bắt, Kim sinh thiết, cạy. Dụng cụ đang nạp không mất đạn.\n4. (MVP) Lướt (thao tác của gd-character) có 0,2 giây đầu miễn sát thương. Đây là cách né chủ động duy nhất.\n5. (MVP) Ngắm tự do: chuột chỉ hướng bắn (bàn phím chuột), cần phải chỉ hướng bắn (gamepad). Không khóa mục tiêu. Gamepad có hỗ trợ ngắm: đạn lệch tối đa 6 độ về mục tiêu gần tâm ngắm nhất trong tầm.\n6. (MVP) Không có sát thương lên đồng đội. Dùi xung, Súng lưới, Súng gây mê không tác dụng lên người chơi. Lao từ trúng đồng đội thì móc dây và kéo đồng đội về phía người bắn, không trừ Oxy.\n7. (MVP) Trong trạm không dùng được dụng cụ combat. Dụng cụ chỉ hoạt động ngoài không gian và trong map nhánh.\n8. (MVP) Mọi đòn của Driftlife và The Wardens có ba pha: Báo trước, Đánh, Hồi. Báo trước có cả hình và tiếng. Báo trước tối thiểu 0,7 giây với đòn hẹp trừ dưới 15 điểm Oxy, 0,8 giây với đòn hẹp từ 15 điểm trở lên, 1,0 giây với đòn vùng bán kính 2 đến 3 u, 1,3 giây với đòn vùng bán kính trên 3 đến 4 u. Vùng lớn hơn 4 u phải có cách chống khác ngoài bay ra (bám mảnh vỡ, chỗ núp). Ý đồ: mọi đòn đều né được bằng bay thường, lướt là cách né dư dả, không bắt buộc (prototype bay của gd-tech: bay ra khỏi đòn hẹp cần khoảng 0,67 giây, khỏi vùng bán kính 2,5 u cần 0,92 giây, lướt ra cần 0,46 giây). Vùng hút của Storm Siphon chống bằng bám mảnh vỡ, không bằng bay ra. Kẻ địch ở ngoài màn hình của người bị nhắm mà ra đòn thì báo trước có thêm chỉ báo ở mép màn (mũi tên chỉ hướng và âm định hướng), hiện ngay từ đầu pha Báo trước, và pha Báo trước không được ngắn hơn mức tối thiểu ở trên tính từ lúc chỉ báo hiện. Hazard từ ngoài màn theo cùng luật này ở `map.md` (gd-world). Ngoại lệ: sát thương tiếp xúc khi người chơi tự lao vào con vật (Lumen Jelly, gai) không cần báo trước nhưng tối đa 5 điểm mỗi lần.\n9. (MVP) Vé tấn công: mỗi người chơi có 2 vé ở dải Gần, 3 vé ở dải Giữa và Xa. Một kẻ địch muốn ra đòn nhắm vào người chơi nào phải giữ một vé của người đó. Hết vé thì kẻ địch vòng quanh ở khoảng cách 4 u chờ. Đòn tiếp xúc và đòn vùng không cần vé.\n10. (MVP) Chọn mục tiêu: kẻ địch nhắm người gây sát thương, choáng hoặc mê cho nó gần nhất trong 3 giây vừa qua. Không có thì nhắm người chơi gần nhất trong vùng phát hiện. Ra khỏi vùng bỏ đuổi thì quay về chỗ cũ. Người chơi đang Ngạt hoặc Được cứu không bị nhắm tới và không nhận sát thương, kể cả đòn vùng (theo `nguoi-choi.md` 2.3). Kẻ địch đang nhắm người đó trả vé và chọn lại mục tiêu theo luật này, không còn ai thì về Trôi.\n11. (Sau MVP) Driftlife và The Wardens thù nhau: Driftlife kiểu Giữ lãnh thổ và Săn mồi tấn công đơn vị The Wardens trong vùng phát hiện, ưu tiên hơn người chơi.","he-thong/combat-driftlife.md",""],["2.2 Choáng và Mê",3,109,4,3.6,"12. (MVP) Mỗi Driftlife có ba chỉ số: Sinh lực, Ngưỡng choáng, Ngưỡng mê. Sinh lực về 0 thì bị hạ.\n13. (MVP) Dùi xung cộng điểm vào thanh Choáng. Thanh đầy thì con vật vào trạng thái Choáng 4 giây. Không bị trúng thêm trong 1 giây thì thanh Choáng tụt 20% ngưỡng mỗi giây. Dùi xung nóng tính riêng cho từng người cầm (bảng 3.3), người này nóng không chặn người khác.\n14. (Sau MVP, mở cùng Súng gây mê ở chương 2) Súng gây mê cộng điểm vào thanh Mê sau 1,5 giây kể từ lúc trúng. Thanh đầy thì con vật vào trạng thái Ngủ 12 giây. Thanh Mê tụt 10% ngưỡng mỗi giây sau 3 giây không trúng thêm.\n15. (MVP) Choáng và Ngủ gọi chung là Bất lực. Con bất lực không di chuyển chủ động, không ra đòn, trôi chậm theo quán tính còn lại.\n16. (Sau MVP) Sát thương lên con đang Ngủ đánh thức nó ngay. Đòn đầu tiên đánh thức gây gấp đôi sát thương. Sát thương lên con đang Choáng không làm nó tỉnh.\n17. (MVP) Giảm dần (DR): mỗi con có hai hệ số riêng, một cho Choáng và một cho Mê, khởi đầu 1. Sau khi tỉnh khỏi Choáng thì hệ số Choáng nhân 1,5, sau khi tỉnh khỏi Ngủ thì hệ số Mê nhân 1,5, trần 3. Ngưỡng hiệu lực bằng ngưỡng gốc nhân hệ số của loại đó. Vừa tỉnh khỏi bất kỳ loại nào thì con vật miễn cả choáng lẫn mê trong 2 giây. Hệ số của một loại về 1 khi đã qua 20 giây kể từ lần tỉnh gần nhất khỏi loại đó.\n18. (MVP) Loài có thuộc tính \"miễn choáng\" thì Dùi xung không cộng thanh Choáng. Loài \"miễn mê\" tương tự với Súng gây mê. Máy The Wardens miễn mê.","he-thong/combat-driftlife.md",""],["2.3 Bắt sống",3,109,4,15.63,"19. Bắt sống theo cỡ. Cỡ S có từ chương 1 (MVP, log GDM dòng 49). Cỡ M, L và Xua đi boss chương 2 trở đi (Sau MVP), trừ Xua đi BS-1 (MVP, không cần dụng cụ):\n\n| Cỡ | Cách bắt | Cần Bất lực trước không | Kết quả |\n|---|---|---|---|\n| S (MVP) | Súng lưới trúng | Không | Mẫu sống vào Lồng mẫu người bắn kéo theo |\n| S (MVP) | Tương tác giữ 1,5 giây | Có | Mẫu sống vào Lồng mẫu người tương tác kéo theo. Chậm hơn Súng lưới nhưng không tốn vật tiêu hao |\n| M | Gắn Phao kéo (Tương tác giữ 1 giây) | Có | 3 giây sau phao đưa con vật về kho trạm, không vào túi |\n| M (DL-G03) | Cạy (Tương tác giữ 1,5 giây) rồi gắn Phao kéo | Có | Như trên |\n| L | Không bắt sống. Kim sinh thiết (Tương tác giữ 2 giây) | Có, trừ loài hiền | Mẫu sinh thiết vào túi (vật nhỏ). Con vật không bị hạ, tỉnh dậy và bỏ đi |\n| Boss Driftlife | Xua đi (mục 2.6) | Theo pha | Mẫu boss vào kho khi về trạm |\n\n20. (MVP) Súng lưới bắt tối đa 3 con cỡ S trong vùng nổ bán kính 1,5 u. Súng lưới trúng con cỡ M trở lên thì quấn nó 2 giây (tốc độ giảm 70%) và không bắt.\n21. (MVP) Mẫu sống không vào túi (theo `vat-pham.md`: mẫu sống là vật kéo). Mẫu sống cỡ S vào Lồng mẫu: lồng mở ra khi bắt con đầu tiên, chứa tối đa 3 con S, người bắt kéo lồng theo trạng thái Kéo vật của gd-character. Mỗi người kéo tối đa 1 lồng. Lồng thuộc lớp vật kéo Nhẹ của `nguoi-choi.md` (không làm chậm, không chiếm túi). Cái giá của bắt sống cỡ S vì vậy chỉ là Lưới cuộn hoặc thời gian bắt tay, và giới hạn 3 con mỗi người mỗi chuyến.\n22. (MVP) Chất lượng mẫu sống theo Sinh lực còn lại lúc bắt: từ 70% trở lên là 3 sao, từ 30% tới dưới 70% là 2 sao, dưới 30% là 1 sao. Mẫu sinh thiết luôn 3 sao.\n23. (MVP) Nguyên liệu khi hạ: 1 sao. Hạ con đang Bất lực bằng Kết nhanh cho 2 sao. Kết nhanh là thao tác riêng, không chung phím với Tương tác (giữ 0,6 giây, không cần dụng cụ, phím do gd-ux đặt ở `ux-ui.md` 2.9), để trên cùng một con bất lực người chơi luôn chọn rõ bắt hay hạ. Kết nhanh có từ MVP vì không cần dụng cụ bắt sống.\n24. (MVP) K9 đo bằng một thước duy nhất: giá trị một mẫu sống, sau khi trừ vật tiêu hao kỳ vọng mỗi lần bắt, chia giá trị một lần hạ cùng loài, mục tiêu 1,5 đến 2 lần (khung mục 9), gd-items kiểm bằng script của họ. Giá trị mẫu sống 1 sao không thấp hơn nguyên liệu 2 sao cùng loài. Theo K9 sửa lần 5 (log GDM dòng 66), K9 chỉ áp cho loài bắt sống được (cỡ S, M). Mẫu sinh thiết cỡ L đứng ngoài K9, dùng cho nghiên cứu (mục 9). Tỉ lệ \"ròng mỗi phút\" ở đề sim S2 là thước đo khác, chỉ để canh chiến lược trội, không phải K9.\n25. (MVP) Mẫu sống trong lồng không chết trong chuyến. Người chơi ngạt và bị kéo về (K2) được ghim Lồng mẫu làm món giữ lại, nhưng chỉ giữ 1 con trong lồng: con có sao cao nhất, bằng sao thì con bắt trước. Các con còn lại mất cùng túi. Lý do: lồng đầy 3 con trị hơn cả túi đầy chương 1, giữ cả lồng thì ngạt gần như không mất gì (`kinh-te-tien-trinh.md` 8.3). Theo K27, người đang Ngạt không trao và không thả được Lồng mẫu: khi vào Ngạt, dây lồng nhả khỏi người nhưng lồng bị khóa tại chỗ, đồng đội không kéo đi được. Người đó được cứu thì Tương tác để nối lại. Bị kéo về thì lồng theo luật ghim ở trên, lồng không ghim thì mất. Rời phiên hoặc mất kết nối quá 15 giây giữa chuyến tính như bị kéo về (C10), lồng xử như trên.\n26. (MVP) Hạ hay bắt đều cho mẫu dùng được ở trạm (P2).","he-thong/combat-driftlife.md",""],["2.4 Driftlife chung",3,109,4,7.96,"27. (MVP) Loài gắn với dải (K5). Một loài chỉ sinh ở dải của nó và ở map nhánh trong dải đó.\n28. (MVP) Driftlife sinh lại mỗi chuyến, không cạn (K8). Không có luật phạt khi hạ nhiều.\n29. (MVP) Mỗi loài có đúng một kiểu hành vi chính trong 6 kiểu: Hiền, Chạy trốn, Giữ lãnh thổ, Săn mồi, Đi bầy, Phục kích. Kiểu quyết định nó làm gì khi thấy người chơi (bảng mục 2.7).\n30. (Sau MVP, chương 3) Một phần cá thể ở dải Giữa và Xa mang Dấu săn bắt (vết lưới năng lượng và vết cắt của quân The Wardens, hình art). Ở dải Xa dấu luôn có: mọi DL-X05 Shardbrood Hatchling mang thẻ đánh dấu của quân The Wardens, mọi DL-X04 Shardbrood Queen có sẹo cắt mô theo quy luật. Dấu này không đổi chỉ số, chỉ là chi tiết truyện cho cú lật Driftlife (B6 sửa lần 6): bằng chứng chế độ của Daskel cướp bóc tràn lan, trái với hình ảnh chúng tự dựng. Manh mối chính vẫn ở map nhánh (K7).","he-thong/combat-driftlife.md",""],["2.5 The Wardens",3,109,4,4.42,"31. (Sau MVP) The Wardens là chế độ và quân đội của Daskel, độc tài của Sennar. Lính là người Sennari mặc giáp chế độ, không phải cả chủng tộc (log GDM dòng 84). Quân The Wardens xuất hiện ở dải Xa từ chương 3, theo sự kiện do gd-world đặt (điểm sinh SP-W). Khác Driftlife ở 5 điểm: dùng vũ khí bắn xa, phối hợp nhóm (một đơn vị gọi thêm drone), có khiên hướng, không bắt sống được, miễn mê.\n32. (Sau MVP) Hạ đơn vị The Wardens cho RES-305 Linh kiện Warden và RES-301 Hợp kim Warden. Đây là nguồn duy nhất của hai vật phẩm này.\n33. (Sau MVP) Warden Harvester đang giữ một Driftlife trong lưới năng lượng. Hạ drone thì con Driftlife được thả, ở trạng thái Choáng 6 giây, bắt sống được ngay.\n34. (Sau MVP) Warden Snarer bắn lưới lên người chơi: người trúng bị trói tối đa 2 giây rồi lưới tự tan, không bay được, mỗi giây trừ 2 điểm Oxy. Thoát sớm bằng Lướt 3 lần liên tiếp, hoặc đồng đội bắn Lao từ vào lưới để cắt. Người đang kéo vật lớp Nặng (không Lướt được theo `nguoi-choi.md`) thì chờ lưới tự tan, hoặc thả vật rồi Lướt. Một mình luôn thoát được (C1).\n\n44. (Sau MVP, chương 3) Kẻ địch có vũ khí của chương 3 lần đầu xuất hiện đủ đội hình là toán bắt cóc Sevra Ilvane do Maro chỉ huy, áp mạn tàu TA04 (Ilsume) trong map nhánh đóng chương 3 (mốc C3.8 của gd-story, nơi do gd-world chốt). Toán chỉ gồm đơn vị sẵn có (bảng dưới), không thêm loại mới. Maro là nhân vật truyện, không chiến đấu, rút lên tàu TA08 khi toán bị hạ. Hạ hết toán thì gỡ được kén thoát hiểm của Sevra để kéo về Ember, qua cửa khí hoặc bằng Recall Beacon (mục 2.8). Toán bắt cóc không sinh lại sau khi đã cứu Sevra.\n\n| Toán bắt cóc Sevra Ilvane | Số lượng |\n|---|---|\n| WD-02 Warden Lancer | 2 |\n| WD-03 Warden Snarer | 1 |\n| WD-01 Warden Harvester | 2 |","he-thong/combat-driftlife.md",""],["2.6 Boss",3,109,4,7.99,"35. (MVP cho BS-1) Mỗi chương có đúng một boss, chỉ ở map nhánh (K7). Boss không sinh lại. Đánh lại boss đã kết không có. Trạng thái boss đã kết (hạ hay xua đi) ghi vào lần tự lưu sau chuyến (K23). Boss chưa kết thì không lưu tiến độ trận, lần sau vào đánh lại từ đầu.\n36. (MVP) Cửa phòng boss không khóa. Boss và mọi Driftlife do boss sinh ra trong trận (ví dụ Sting Krill do Scrapmaw phun) không rời phòng boss, để beacon cố định ngoài phòng luôn kích được. Lối đi tiếp phía sau phòng (BS-1: vách C6 sang C7) đóng tới khi boss kết thúc, theo `map.md`. Người chơi rút ra được bất cứ lúc nào bằng lối vào rồi kích Recall Beacon cố định đặt ngay ngoài phòng, phía lối vào (luật 2.5.7 của `map.md`, BS-1: beacon B3 trong C2, cách cửa D1 vài u). Người ngạt trong phòng theo K2. Khi không còn người chơi nào trong phòng quá 10 giây, hoặc cả nhóm đã về trạm, boss hồi đầy và về pha 1.\n37. (MVP) Boss Driftlife (BS-1, BS-2) có hai cách kết. Hạ: Sinh lực về 0, rơi nhiều nguyên liệu. Xua đi: làm boss Bất lực ở pha cuối rồi Tương tác giữ 3 giây ở điểm yếu (ngắt khỏi tổ hoặc tiêm an thần, theo bảng 3.7) thì boss bỏ đi, rơi một Mẫu boss. Công dụng của Mẫu boss theo `vat-pham.md` (SMP-192, SMP-292: sửa khoang dẫn đường, thay được vật rơi khi hạ). Vật rơi boss chưa có chỗ dùng ở chương đang chơi thì nằm trong kho, trạm báo \"dùng được khi mở khoang dẫn đường\". Cả hai cách đều mở tiếp tiến trình chương. Boss miễn Dùi xung và Súng gây mê, chỉ Bất lực theo cơ chế của từng pha (bảng 3.7).\n38. (Sau MVP) Boss The Wardens (BS-3 đến BS-5) chỉ có một cách kết. Với BS-5 Daskel, Sinh lực về 0 nghĩa là Daskel gục và bị bắt, giao cho The Kindling, không hạ chết (mốc C5.5 của gd-story).\n39. (MVP) Boss có pha. Chuyển pha theo mốc Sinh lực. Lúc chuyển pha boss miễn sát thương 2 giây và có báo trước rõ.","he-thong/combat-driftlife.md",""],["2.7 Hành vi theo kiểu",3,109,4,0.97,"| Kiểu | Khi chưa thấy người | Khi thấy người (vùng phát hiện) | Khi bị tấn công | Bỏ đuổi |\n|---|---|---|---|---|\n| Hiền | Trôi theo đường, ăn | Bỏ qua | Bơi ra xa 6 u rồi trôi tiếp | Không đuổi |\n| Chạy trốn | Trôi, ăn | Lướt ra xa với tốc độ 1,3 lần người chơi bậc 0 trong 3 giây, nghỉ 2 giây | Như thấy người, không bao giờ đánh | Không đuổi |\n| Giữ lãnh thổ | Tuần quanh một điểm neo | Báo trước đe dọa, người còn ở trong vùng 2 giây thì tấn công | Tấn công người gây đòn, kể cả khi người đó ở ngoài vùng phát hiện | Rời vùng lãnh thổ 10 u thì quay về |\n| Săn mồi | Lượn tìm mồi | Đuổi và tấn công | Tấn công | Rời 18 u khỏi chỗ phát hiện |\n| Đi bầy | Trôi cả bầy | Bỏ qua nếu không bị tấn công | Cả bầy trong 8 u chuyển sang tấn công | Rời 12 u |\n| Phục kích | Bám, trông như vật salvage hoặc đá | Người tới gần 2 u thì ra đòn | Tấn công rồi bám lại | Không đuổi |","he-thong/combat-driftlife.md",""],["2.8 Kén của Sevra Ilvane trong combat (Sau MVP, chương 3 và 5)",3,109,4,4.14,"Dùng luật sẵn có, không thêm hệ thống (log GDM về hộ tống). Áp cho hai mốc của gd-story:\n\n| Mốc | Kéo kén từ | Tới |\n|---|---|---|\n| C3.8 (đóng chương 3) | Tàu TA04 ở Waypost Outer Ring | Ember, qua Recall Beacon (kén đi theo người kích, luật 2.5.5 của `map.md`) hoặc cửa khí |\n| C5.1 (hộ tống) | Cửa N4 (Skiff chở kén tới đây từ đầu chương 5) | Cửa The Hearth, qua vòng phong tỏa của The Wardens |\n\n40. (Sau MVP) Sevra nằm trong kén thoát hiểm BNG-102 (`vat-pham.md`). Ở C3.8, hạ hết toán bắt cóc thì Tương tác giữ 2 giây để gỡ kén khỏi mạn tàu TA04, rồi kéo. Kén là vật kéo lớp Nặng, theo luật Kéo vật của `nguoi-choi.md` (cùng luật với buồng ngủ đông). Sevra không ra đòn.\n41. (Sau MVP) Kén không bị kẻ địch nhắm và không nhận sát thương. Kẻ địch nhắm người chơi theo luật 9 và 10. Warden Snarer ưu tiên người đang kéo vật (bảng 3.6), nên người kéo kén là mục tiêu chính, đồng đội che chắn.\n42. (Sau MVP) Người kéo vào Ngạt thì thả kén, kén trôi tại chỗ, đồng đội kéo tiếp được. Cả nhóm bị kéo về hoặc về trạm thì kén nằm lại chỗ thả, chuyến sau kéo tiếp (luật buồng ngủ đông của `nguoi-choi.md`). Trong hộ tống C5.1 kén không đi theo Recall Beacon: người kéo kích beacon thì kén nằm lại tại chỗ, như khi ngạt. Giữa các chuyến, kén được lưu ở beacon cố định gần nhất đã đi qua, chưa qua beacon nào thì ở cửa N4 (luật 2.7.9 của `map.md`). Không có thất bại vĩnh viễn, Sevra không chết.\n43. (Sau MVP) Kén nằm ngoài luật giữ 1 món của K2: không ghim được, không mất theo túi.","he-thong/combat-driftlife.md",""],["Trạng thái và chuyển tiếp của Driftlife",3,109,4,1.35,"| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Trôi | Sinh ra, hoặc hết Bỏ đuổi | Thấy người, bị tấn công | Theo kiểu | Hoạt ảnh nghỉ |\n| Cảnh giác | Thấy người (kiểu Giữ lãnh thổ, Săn mồi) | Hết 2 giây, hoặc người rời vùng | Quay mặt về người, đe dọa | Mắt hoặc thân đổi màu, âm gầm nhỏ |\n| Tấn công | Hết Cảnh giác, bị tấn công, giữ được vé | Ra đòn xong, mất vé | Ba pha Báo trước, Đánh, Hồi | Báo trước hình và tiếng |\n| Chờ vé | Muốn đánh nhưng hết vé | Có vé, mục tiêu đổi | Vòng quanh 4 u | Con vật lượn quanh |\n| Chạy | Kiểu Hiền, Chạy trốn gặp người hoặc bị đánh | Hết thời gian chạy | Lướt ra xa | Vệt chuyển động |\n| Choáng | Thanh Choáng đầy | Hết 4 giây | Bất lực | Sao quay, thân co, vòng xanh |\n| Ngủ | Thanh Mê đầy | Hết 12 giây, bị sát thương | Bất lực | Thân rủ, bong bóng Z, vòng tím |\n| Bỏ đuổi | Mục tiêu ra khỏi khoảng bỏ đuổi | Về tới chỗ cũ | Quay về, không nhận vé | Bơi về |\n| Bị bắt | Bắt thành công | (cuối) | Biến khỏi thế giới, vào lồng hoặc phao | Hiệu ứng lưới, phao bay đi |\n| Bị hạ | Sinh lực về 0 | (cuối) | Rơi nguyên liệu | Vỡ ra, vật rơi trôi |\n\nKhông có trạng thái cụt: mọi trạng thái trừ hai trạng thái cuối đều có lối ra theo thời gian.","he-thong/combat-driftlife.md",""],["Thứ tự xử lý trong một khung hình",3,109,4,1.02,"1. Đòn của người chơi trúng: tính miễn (DR 2 giây, miễn choáng, miễn mê), cộng thanh Choáng hoặc Mê, trừ Sinh lực.\n2. Kiểm Sinh lực về 0: bị hạ. Một con vừa đầy thanh Choáng vừa về 0 Sinh lực trong cùng khung thì bị hạ.\n3. Kiểm thanh đầy: vào Choáng hoặc Ngủ. Hai thanh cùng đầy thì vào Ngủ (dài hơn).\n4. Đòn của kẻ địch trúng người chơi: kiểm miễn sát thương (0,8 giây, 0,2 giây đầu lướt), trừ Oxy, đẩy lùi, hủy thao tác giữ phím.\n5. Kiểm Oxy người chơi về 0: vào Ngạt (K2, gd-character).\n6. Bắt hoàn tất trong khung này mà người bắt vừa trúng đòn ở bước 4: việc bắt bị hủy (bước 4 trước bước 6).\n\nThắng khi: không có thắng thua riêng của combat. Kết quả tốt là mang mẫu về trạm với Oxy còn dư. Thua khi: Oxy về 0 rồi bị kéo về (K2).\nCam kết với người chơi: mọi đòn đều có báo trước, không có đòn nào trúng mà không thấy trước, ngoại trừ chạm vào con vật có gai hoặc bỏng. Luôn có cách tự thoát khi chơi một mình.","he-thong/combat-driftlife.md",""],["3. Tham số",2,106,4,18.77,"","he-thong/combat-driftlife.md",""],["3.1 Combat chung",3,120,4,1.44,"| Tên | Khởi điểm | Khoảng a ễ mê | Mọi Driftlife | ước |\n| Miễn sau khi tỉnh | 2 s | 1 đến 3 s | Khó khóa liên tục | Dễ khóa | Mọi Driftlife | ước, kho tri thức 20-combat (DR) |\n| Hệ số DR mỗi lần | 1,5 | 1,3 đến 2 | Khó khóa | Co-op khóa mãi | Mọi Driftlife | ước |\n| Trần hệ số DR | 3 | 2 đến 4 | | | Mọi Driftlife | ước |\n| Đặt lại DR sau | 20 s | 15 đến 30 s | | | Mọi Driftlife | ước |\n| Bắt S bằng tay | 1,5 s | 1 đến 2 s | Súng lưới đáng mang hơn | Bắt tay trội Súng lưới (sim S2) | Cỡ S | sim S2: 1,5 s làm đường Dùi xung rồi bắt tay chậm hơn Súng lưới |\n| Gắn Phao kéo | 1 s, bay về sau 3 s | 0,5 đến 2 s | | | Cỡ M | ước, theo Dave dùng drone kéo cá về [D8] |\n| Kim sinh thiết | 2 s | 1,5 đến 3 s | | | Cỡ L | ước |\n| Kết nhanh | 0,6 s | 0,4 đến 1 s | | | Mọi Driftlife bất lực | ước |\n| Vùng Súng lưới | bán kính 1,5 u, tối đa 3 con | 1 đến 2 u, 2 đến 5 con | Bắt bầy dễ | Bầy khó bắt | Cỡ S | ước, theo Dave lưới bắt nhiều cá một lần [D11] |\n| Ngưỡng sao mẫu sống | 3 sao từ 70%, 2 sao từ 30% | | | | Mẫu sống | ước |","he-thong/combat-driftlife.md",""],["3.3 Dụng cụ (số khởi điểm để sim, gd-items giữ số chốt và các bậc)",3,120,4,2.01,"Mang vào chuyến theo đai dụng cụ của `nguoi-choi.md` (số ô và bộ khởi điểm do gd-character và gd-items giữ). Ở chương 1 người chơi có thể phải chọn giữa dụng cụ khai thác và dụng cụ combat, đây là lựa chọn trước chuyến có chủ đích. Lồng mẫu không chiếm ô.\n\n| Dụng cụ | Mở | Tác dụng bậc 1 | Nhịp bắn | Tầm | Đạn mỗi chuyến | Nhãn |\n|---|---|---|---|---|---|---|\n| Lao từ (TOL-211) | Chương 1, có từ đầu | 10 sát thương. Trúng S hoặc vật thì móc dây, giữ để kéo về phía mình. Trúng đồng đội thì kéo | 0,8 s | 8 u | Không giới hạn | MVP |\n| Lao từ bậc 2 (UPG-HAR-2) | Chương 1, Kỹ sư | 14 sát thương, móc dây theo luật của bậc 1 | 0,75 s | 9 u | Không giới hạn | MVP |\n| Lao từ bậc 3 (UPG-HAR-3) | Chương 2, Kỹ sư | 20 sát thương, móc dây kéo được cả cỡ M đang Bất lực | 0,7 s | 10 u | Không giới hạn | Sau MVP |\n| Dùi xung (TOL-201) | Chương 1, quest Kỹ sư | 0 sát thương, 20 điểm Choáng, hình nón 60 độ trước mặt | 0,5 s, nóng sau 12 lần liên tiếp thì nghỉ 4 s | 2,5 u (cận) | Không giới hạn, dùng cooldown | MVP |\n| Súng lưới (TOL-202) | Chương 1, quest Kỹ sư (cùng Dùi xung) | Bắt S trong vùng (luật 20) | Nạp lại 3 s | 7 u | 1 Lưới cuộn (CON-102) mỗi phát | MVP |\n| Súng lưới bậc 2 (UPG-NET-2, bản thiết kế BPR-101 từ nghiên cứu DL-G01) | Chương 2, Nhà sinh học | Vùng bán kính 2,2 u, vẫn tối đa 3 con (bằng sức chứa Lồng mẫu) | Nạp lại 2,5 s | 8 u | 1 Lưới cuộn (CON-102) mỗi phát | Sau MVP |\n| Súng gây mê (TOL-203) | Chương 2, Nhà sinh học | 60 điểm Mê, tác dụng sau 1,5 s | 3,0 s | 10 u | 1 Ống gây mê (CON-103) mỗi phát | Sau MVP |\n| Phao kéo (CON-106) | Chương 2, chế ở xưởng | Gửi con M bất lực về kho | Tương tác | Chạm | Vật tiêu hao, theo số mang | Sau MVP |\n| Kim sinh thiết (CON-107) | Chương 2, Nhà sinh học | Lấy mẫu sinh thiết cỡ L | Tương tác | Chạm | Vật tiêu hao, theo số mang | Sau MVP |","he-thong/combat-driftlife.md",""],["3.4 Chỉ số Driftlife (bậc dụng cụ 1, chơi một mình)",3,120,4,1.32,"| ID | Sinh lực | Ngưỡng choáng | Ngưỡng mê | Miễn | Đòn (chi tiết ở 3.4b) | Vùng phát hiện |\n|---|---|---|---|---|---|---|\n| DL-G01 Driftmoth | 10 | 25 | 35 | | Không có | 4 u |\n| DL-G02 Skitter Ray | 20 | 25 | 35 | | Không có | 6 u |\n| DL-G03 Latchjaw | 60 | 90 | 90 | | Đớp | 2 u |\n| DL-G04 Sting Krill (mỗi con, bầy 5 đến 8) | 10 | 25 | 35 | | Lao chích | 5 u |\n| DL-G05 Arc Eel | 80 | Miễn choáng | 90 | Choáng | Lao cắn, Phóng điện vòng | 7 u |\n| DL-M01 Shepherd Whale | Không hạ được | Miễn | Miễn | Sát thương, choáng, mê | Va chạm đẩy lùi | Không |\n| DL-M02 Lumen Jelly | 50 | 100 | 100 | | Tiếp xúc bỏng | Không |\n| DL-M03 Orebiter | 120 | 180 | 180 | | Húc | 6 u |\n| DL-M04 Needlefin (mỗi con, bầy 8 đến 12) | 12 | 25 | 35 | | Lao gai | 8 u |\n| DL-M05 Gulper | 300 | 150 | 140 | | Đớp, Nuốt | 10 u |\n| DL-X01 Prism Wisp | 25 | 25 | 35 | | Không có | 6 u (chỉ khi người đứng yên dưới 1 s mới thấy nó) |\n| DL-X02 Mirror
