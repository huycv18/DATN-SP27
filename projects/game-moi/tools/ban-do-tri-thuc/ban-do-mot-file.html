ến 1, Hạng 4, chương 2 (gd-quan). Luật hiện hành 3 cửa neo đã đạt mục tiêu rảnh ở mọi số người (sim giờ giao thương mục 4), nên cửa thứ 4 chỉ để thuận tiện |\n| T-OXY, T-TUI | Chỉ là số | Chuyến dài hơn, mang về nhiều hơn. Đây là nguồn tăng thu nhập chính |\n| T-DAY bộ đẩy | Chỉ là số | Chuyến gọn hơn, tăng nhỏ để không đổi cảm giác tay (`nguoi-choi.md`) |\n| Dụng cụ khai thác bậc 2, 3 | Chỉ là số, có cổng mềm | Khai thác điểm cứng hơn không bị chậm gấp 4 (`vat-pham.md` luật S3) |","he-thong/kinh-te-tien-trinh.md",""],["3.3 Công thức và núm gap",3,244,8,4.3,"| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nhóm tác động | Nguồn |\n|---|---|---|---|---|---|---|\n| Tally mỗi GTĐ | 10 | cố định | Mọi giá Tally phình theo | | Đơn vị | gd-economy tự quyết |\n| Hệ số ngân sách β | 0,54 | 0,49 đến 0,59 (cả game 12,8 đến 14,8 giờ) | Chương dài hơn | Chương ngắn hơn, Tally dư | Thời lượng mọi chương | Sim, dò bằng `--do` |\n| Giờ dùng tính ngân sách từng chương | 1,25, 2,75, 3,5, 3,0, 1,5 | Tổng 12 đến 15 | | | Ngân sách từng chương | Không phải giờ đo. Giờ đo và lệch ở bảng ngay dưới công thức |\n| Tỉ lệ giá trong ngân sách chương | ENG 1,0, T-VO 0,6, T-OXY 0,5, T-TUI 0,5, T-DUNGCU 0,4, khoang cấp 0,4, T-DAY 0,35, bản thiết kế 0,3, cảng cấp 2 0,2, mỗi nâng cấp dụng cụ 0,15 | | Thứ đó đắt hơn trong chương | | Thứ tự mua | gd-economy tự quyết |\n| Hệ số bậc giá | Chợ 0,75, sinh học 1,0, chế 1,35, sống 1,3, hiếm 1,5 | Sống 1,1 đến 1,4 (giữ K9 trong 1,2 đến 2 lần hạ), chợ 0,7 đến 0,85 | Bậc đó đắt hơn, danh mục nghiêng về nó | Danh mục bỏ bậc đó | Lập danh mục, chỉ số giá | gd-economy, đợt 9 |\n| Độ gọi | Chợ 3, sinh học 2, chế 1,5, sống 1, hiếm 1 | 1 đến 4 | Hàng đó bán trước khi bày thừa | | Thế cân bày thừa | gd-economy, đợt 9. gd-quan giữ độ ưa của loại tàu |\n| Tip tối đa | 25% giá thùng | 20 đến 30% (tip kể cả bơm khí trong 20 đến 30% Tally ca) | Tip lớn hơn phần Tally | | Giờ giao thương | Đề xuất demo 30%, GDM hạ 25% ở đợt 9 vòng 2 |\n| Hệ số co-op k(N), phần thêm mỗi người | 0,30 ở Gần, 0,25 ở Giữa, 0,38 ở Xa | | Co-op nhanh, mỗi người giàu | Co-op chậm | Co-op | gd-world giữ, sim xác nhận |\n\nCông thức:\n- Ngày mục tiêu(c) = Giờ mục tiêu(c) x 60 / Phút một ngày tham chiếu(c). Phút một ngày tham chiếu(c) = 2 x Phút một chuyến đo được của chương (mục 8.5) + phút giờ giao thương + 3 phút chuẩn bị và cuối ngày. Phút giờ giao thương lấy từ sim giờ giao thương gd-tech (một người, trễ 2 giây): 3,83, 3,83, 3,83, 3,83, 3,83 phút. Sim giờ giao thương mới chỉ có chương 1, chương 2 tới 5 dùng cùng số.\n- Thu nhập tham chiếu một ngày(c) = 2 chuyến x (GTĐ một chuyến đo được của chương chia 0,9) x 10 x chỉ số giá kịch bản trung bình x 1 / (1 trừ phần tip). Chia 0,9 vì sim chuyến đo ở mức túi đầy 90% của kịch bản trung bình. Chia (1 trừ phần tip) vì tip là phần của Tally ca, không phải phần cộng thêm trên giá.\n- Tally một ca trong sim = thùng bán x GTĐ một thùng x 10 x chỉ số giá của kịch bản / (1 trừ phần tip của kịch bản và số người). Thùng bán = số nhỏ hơn giữa tàu phục vụ xong (sim giờ giao thương) và thùng còn trong kho sau khi giữ phần để xây.\n- Mật độ GTĐ mỗi Khối lấy trung bình bảng NODE của gd-items: Gần 1,16, Giữa 3,09, Xa 7,78. Chương 4 và 5 dùng mật độ dải Xa, khớp sim chuyến của gd-tech (mục 8.5).\n- Ví dụ chương 1: Phút một ngày = 2 x 4,4 + 3,8 + 3 = 15,6. Ngày mục tiêu = 1,25 x 60 chia Phút một ngày = 4,8. Thu nhập tham chiếu = 2 x (102,1 chia 0,9) x 10 x 0,97 chia (1 trừ 26%) = 3000. Ngân sách = β x Ngày mục tiêu x Thu nhập tham chiếu = 7750 Tally.\n\n\n| Chương | Giờ dùng tính ngân sách | Phút một ngày tham chiếu | Ngày mục tiêu | Thu nhập tham chiếu một ngày (Tally) | Ngân sách Tally của chương |\n|---|---|---|---|---|---|\n| 1 | 1,25 | 15,6 | 4,8 | 3000 | 7750 |\n| 2 | 2,75 | 17,6 | 9,4 | 9350 | 47100 |\n| 3 | 3,50 | 19,8 | 10,6 | 22800 | 130350 |\n| 4 | 3,00 | 23,2 | 7,7 | 32900 | 137600 |\n| 5 | 1,50 | 27,6 | 3,3 | 43700 | không có thứ mua mới |\n\n\nGiờ dùng tính ngân sách so với giờ đo:\n\n\n| Chương | Giờ dùng tính ngân sách | Giờ đo (trung bình, một người) | Lệch |\n|---|---|---|---|\n| 1 | 1,25 | 1,89 | +51% |\n| 2 | 2,75 | 3,55 | +29% |\n| 3 | 3,50 | 3,99 | +14% |\n| 4 | 3,00 | 3,12 | +4% |\n| 5 | 1,50 | 1,37 | -9% |\n\n\nNúm gap: β (một núm cho cả 5 chương). Mọi giá Tally đi theo thu nhập của chương nên khi gd-items hoặc gd-character đổi mật độ, túi, Oxy thì giá tự đổi theo, chạy lại sim là xong. Giá thùng và hệ số bậc không đổi thời lượng nhiều vì ngân sách chương đọc chỉ số giá, chúng đổi cách người chơi lập danh mục.","he-thong/kinh-te-tien-trinh.md",""],["3.4 Thứ tự mua trong sim và kịch bản",3,244,8,3.65,"- Thứ tự mua trong sim: theo chương mở của bảng 3.2, trong mỗi chương mua ENG và T-VO trước, rồi các dòng còn lại theo thứ tự bảng, khi đủ Tally và vật liệu.\n\n| Tham số hành vi | Tệ | Trung bình | Tốt | Nguồn |\n|---|---|---|---|---|\n| Phần túi đầy mỗi chuyến | 75% | 90% | 100% | `[GIẢ ĐỊNH]`, chờ sim chuyến gd-tech |\n| Hệ số mật độ (nhặt đồ hiếm) | 0,9 | 1,0 | 1,15 | `[GIẢ ĐỊNH]` |\n| Tỉ lệ chuyến ngạt, một người | 25% | 15% | 7% | Khung mục 9: người cẩn thận dưới 5%, người tham 15 đến 40%. Ba mức là `[GIẢ ĐỊNH]` nằm giữa hai đầu |\n| Trễ phản xạ ở giờ giao thương | 3 giây | 2 giây | 1 giây | Sim giờ giao thương gd-tech mục 4: tàu xong, giây một ca, tip, điểm mỗi tàu theo N |\n| Chỉ số giá của danh mục | 0,84 | 0,97 | 1,07 | Danh mục đại diện mục 3.1, `[GIẢ ĐỊNH]` |\n| Hệ số phút một ngày | 1,15 | 1,0 | 0,9 | `[GIẢ ĐỊNH]` |\n\n- Giả định chung của sim (ghi đủ ở `tham-so.json`, kèm nguồn ở mục ghi chú nguồn): mỗi chương không xong trước sàn ngày truyện của gd-story (7, 5, 8, 3, 3 ngày, `cot-truyen.md` mục 5). Giờ giao thương chương 1 mở từ ngày 4 (Thông dịch viên tỉnh, mốc C1.8 của `tram-va-cang.md`) và khi đã sửa đủ 98 GTĐ của 5 khoang. Mỗi ngày đúng 2 chuyến, đúng trần của K22, ngày chỉ sang khi ngủ (K23). Lượng nhặt một chuyến là số nhỏ hơn giữa túi đầy và thời gian làm việc nhân tốc độ nhặt thực. Tốc độ nhặt thực đặt để túi bậc 0 đầy ở 65% thời gian làm việc chương 1 (mục tiêu của gd-items). Kết quả nhân hệ số để khớp GTĐ một chuyến của sim chuyến gd-tech (mục 8.5), gồm cả Driftlife bắt và hạ. Chuyến map nhánh cho 50% lượng nhặt. Người vớt tỉnh sau một đêm. Co-op làm mỗi ngày dài thêm 5% mỗi người thêm (chờ người về cuối). Đồng đội cứu nhau làm tỉ lệ ngạt giảm một nửa khi từ 2 người. Ngạt giữ món đắt nhất của dải. Khi còn thứ phải xây, người chơi giữ lại 40% kho cho xây trước khi lập danh mục. Hết hàng thì ca ngắn lại theo phần tàu được phục vụ (D8). Qua chương thì 30% giá trị kho mang sang. 200 lượt chạy mỗi ô, seed 20261120.","he-thong/kinh-te-tien-trinh.md",""],["3.5 Ngưỡng Hạng cảng (gd-quan đã nhận, luật 41)",3,244,8,2.52,"- Cách tính: ngưỡng đặt để ngày đủ điểm trung bình (một người, kịch bản trung bình, chưa tính trần chương) giữ nhịp mở theo chương đã duyệt. Hàm `nguong_theo_ngay_cu()` của sim dò từng ngưỡng theo bước 5 điểm, lặp tới khi đứng yên. Sim in lại đề xuất mỗi lần chạy: 85, 140, 300, 415, 585, 715, 960. Đổi ngưỡng thì gd-quan đổi ở `tram-va-cang.md` rồi gd-economy sửa tham-so.json.\n- Hạng 2 cần 2 lượt giao thương (một ca một người tới 50 điểm). Hạng 6 và 8 lên ở ngày mở chương vì trần chương, như bản cũ.\n\n\n| Hạng | Trần ở chương | Ngưỡng điểm (sim dùng số này) | Ngày đủ điểm, bản trước đợt 9 | Ngày đủ điểm, đo lại | Ngày lên hạng (có trần chương) |\n|---|---|---|---|---|---|\n| 2 | 1 | 70 | 5,0 | 5,0 | 5,0 |\n| 3 | 1 | 135 | 7,0 | 6,0 | 6,0 |\n| 4 | 2 | 285 | 12,5 | 11,9 | 11,9 |\n| 5 | 2 | 400 | 16,1 | 15,8 | 15,8 |\n| 6 | 3 | 560 | 20,1 | 19,6 | 22,0 |\n| 7 | 3 | 680 | 24,3 | 23,2 | 23,2 |\n| 8 | 4 | 910 | 30,5 | 29,6 | 34,5 |","he-thong/kinh-te-tien-trinh.md",""],["4. Trường hợp biên",2,236,8,1.52,"| Ca | Xử lý |\n|---|---|\n| Tally bằng 0 | Không mua được gì, không có phạt. Giờ giao thương hôm sau vẫn có tàu. Không thể kẹt: thùng hàng chợ đóng thẳng từ tài nguyên thô không cần Tally |\n| Bỏ mọi giờ giao thương | Không có Tally, không lên Hạng cảng, kẹt ở ENG-101. Đây là lựa chọn người chơi, game không ép. Bảng tàu nhắc ENG cần Hạng 3 |\n| Đủ Tally, thiếu Hạng cảng cho ENG | Mục ENG hiện điều kiện \"cần Hạng N\". Sim đo: Hạng 3 tới trước khi chương 1 xong (bảng 3.5) |\n| Đủ điểm, chạm trần hạng chương | Điểm cộng dồn, lên hạng khi chương sau mở (gd-quan) |\n| Danh mục ít hơn số tàu | Tàu không tới khi hết hàng, ca kết thúc sớm (D8). Không phạt, không mất điểm đã có |\n| Tàu rời vì hết kiên nhẫn | Không trả giá, không tip, không điểm. Thùng về kho, không mất |\n| Đơn đặt trước trượt (món không có trong danh mục) | Tàu đó gọi món khác trong danh mục với giá thường. Không phạt |\n| Thùng chưa bán cuối ca | Về kho, bán được ca sau với cùng giá |\n| Mua cùng lúc trong co-op | Ví chung, người bấm trước được, người sau thấy giá đỏ nếu thiếu. Máy chủ xử lý theo thứ tự tới |\n| Người vào sau | Không mang Tally riêng, dùng ví chung, bộ đồ cùng bậc với nhóm (C4) |\n| Tally rất lớn ở chương 5 hoặc nhóm 3, 4 người | Chương 5 không có thứ mua mới, Tally dư. Nhóm đông dư nhiều hơn (bảng 8.2). Ghi ở mục 10 |\n| Giao lồng loài A cho tàu gọi loài B | Tàu từ chối (gd-quan). Không có giá |","he-thong/kinh-te-tien-trinh.md",""],["5. Ràng buộc vật lý của luật",2,236,8,1.07,"- Tally tối đa một ca bằng số tàu nhân giá thùng đắt nhất trong danh mục nhân 1,5 (tip tối đa 25%, gấp đôi là 50%), cộng phần 0,5 thêm của đơn đặt trước, cộng 10 Tally mỗi lần bơm khí. K22 cho một ca mỗi ngày nên ngân sách chương luôn đo được bằng số ngày.\n- Không có vòng tiền vô hạn: nuôi có trần ô (4, 6, 9) và lãi ròng 2,2 / 5,0 / 9,5 GTĐ mỗi ô mỗi ngày, khoảng 3 đến 4% thu nhập. Shop không bán tài nguyên, kiện, vật tiêu hao nên không có mua rẻ bán đắt. Chế rồi bán có biên lợi (hàng chế 1,35) nhưng nguyên liệu gốc chỉ đến từ chuyến ngoài, mà chuyến ngoài có Oxy và túi giới hạn, còn số thùng một ca có số tàu giới hạn. Giá không đổi theo số người và thời gian.\n- Thời gian một chương có sàn không phụ thuộc giá: chuyến map nhánh, đêm chờ người vớt, sửa khoang, Hạng cảng. Sim đo sàn chương 1 khi giá Tally gần 0 là 1,6 giờ. Chương 5 gần như chỉ có sàn (bảng 8.1).\n- Co-op không thể nhanh hơn sàn: chương 5 của nhóm 4 dài gần bằng chơi một mình (bảng 8.1).","he-thong/kinh-te-tien-trinh.md",""],["6. Yêu cầu cho engineer và tool",2,236,8,1.15,"- Dữ liệu: bảng giá kiện và thùng (ID kiện, Tally một kiện, Tally một thùng, bậc giá, độ gọi), bảng giá lồng theo loài, bảng thứ mua (ID, chương mở, Hạng cần, Tally, bộ vật liệu), tip tối đa, hệ số Tàu vội, hệ số Tikko, Tally bơm khí, hệ số đơn đặt trước, ngưỡng Hạng. Tất cả lấy từ `ket-qua.json` và `tham-so.json`, gd-tech chuyển sang ScriptableObject. Không gõ giá trong code.\n- Lưu: Tally (số nguyên, chung thế giới), điểm cảng, Hạng cảng, danh sách thứ đã mua, thùng chưa bán trong kho.\n- Sự kiện cho event tracking (gd-tech): `tally_nhan` (nguồn: thùng, tip, bơm khí, đơn đặt trước, kèm loại hàng và bậc giá), `tally_chi` (thứ mua), `hang_cang_len`, `chuong_xong` (ngày, giờ chơi, số người), `danh_muc_lap` (loại hàng, số thùng mỗi loại). Dùng để so với bảng mục 8 và bảng kiểu danh mục mục 3.1 khi playtest.\n- Nơi phải đổi cùng khi đổi số: `tham-so.json`, chạy lại sim với `--ghi`, sửa khối giaThung của `tools/tham-so/ca-cang.json` (selftest bắt lệch), gd-tech xuất lại data. Đổi GTĐ ở `vat-pham.md` thì chạy lại sim, giá tự theo.","he-thong/kinh-te-tien-trinh.md",""],["6b. Co-op 1 đến 4 người",2,236,8,2.49,"| Phần | 1 người | 2 người | 3 người | 4 người |\n|---|---|---|---|---|\n| Ví Tally, giá, Hạng cảng | Chung | Chung | Chung | Chung |\n| Hệ số khe điểm sinh k(N) (gd-world), Gần, Giữa, Xa | 1,00, 1,00, 1,00 | 1,30, 1,25, 1,38 | 1,60, 1,50, 1,76 | 1,90, 1,75, 2,14 |\n| Mỗi người so với chơi một mình, sim chuyến gd-tech, chương 1 tới 5 | 100%, 100%, 100%, 100%, 100% | 85%, 92%, 95%, 92%, 85% | 73%, 85%, 91%, 87%, 75% | 66%, 80%, 89%, 83%, 69% |\n| Số tàu một ca và cửa neo (sim giờ giao thương gd-tech, C8) | 25 tàu, 3 cửa neo | 55 tàu, 3 cửa neo | 55 tàu, 3 cửa neo | 60 tàu, 3 cửa neo |\n| Điểm cảng một ca, kịch bản trung bình, kho đủ | 46 | 102 | 105 | 111 |\n| Giá nâng cấp, sửa khoang | Không đổi | Không đổi | Không đổi | Không đổi |\n\n\nKhông luật nào cần đúng N người. Bảng đo:\n\n\n| Kịch bản | Số người | Mỗi người nhặt so với một mình | Tới hết chương 1 (cộng dồn) | Tới hết chương 2 (cộng dồn) | Tới hết chương 3 (cộng dồn) | Tới hết chương 4 (cộng dồn) | Hết game |\n|---|---|---|---|---|---|---|---|\n| tệ | 2 | 90% | 71% | 55% | 54% | 54% | 57% |\n| tệ | 3 | 82% | 75% | 46% | 47% | 45% | 49% |\n| tệ | 4 | 77% | 78% | 48% | 50% | 47% | 52% |\n| trung bình | 2 | 90% | 92% | 59% | 63% | 60% | 64% |\n| trung bình | 3 | 82% | 96% | 62% | 67% | 64% | 69% |\n| trung bình | 4 | 77% | 101% | 66% | 71% | 68% | 73% |\n| tốt | 2 | 90% | 106% | 74% | 79% | 77% | 81% |\n| tốt | 3 | 82% | 111% | 78% | 84% | 81% | 85% |\n| tốt | 4 | 77% | 116% | 82% | 88% | 85% | 89% |\n\n\n- Số tàu một ca tăng theo số người (C8) nên điểm cảng một ca tăng theo, không cần hệ số riêng. Mỗi người nhóm 4 nhặt 66% đến 89% so với một mình (sim chuyến gd-tech), từ 60% như mục tiêu. Nhóm 4 tới hết game bằng 73% thời gian một mình, hết chương 1 (cộng dồn) bằng 101%, hết chương 2 (cộng dồn) bằng 66%. Nguyên nhân là sàn ngày của chuỗi mốc truyện (`cot-truyen.md` mục 5): tổng 26 ngày, không đổi theo số người. Nhóm đông đi chạm sàn ở mọi chương. Phương án hạ sàn không áp: nếu áp thì sàn còn 22 ngày và nhóm 4 xuống 62%.\n- Ở kịch bản tốt, nhóm đông xong chương 1 chậm hơn chơi một mình (trên 100% ở bảng trên): người chơi tốt một mình cũng chạm sàn ngày truyện, mà một ngày co-op dài hơn 5% mỗi người thêm (chờ người về cuối, `[GIẢ ĐỊNH]`). Cùng số ngày, ngày dài hơn thì giờ nhiều hơn.","he-thong/kinh-te-tien-trinh.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,236,8,1.17,"| Sự kiện | Hình | Âm | Text / tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Nhận Tally từ thùng | Số giá bay lên từ cửa neo về góc ví, số tip bay sau, nhỏ hơn và khác màu | Tiếng xu, tip cao thì tiếng cao hơn | Không | Cao |\n| Màn lập danh mục | Mỗi loại hàng hiện giá thùng và độ gọi bằng biểu tượng (nhiều tàu gọi, ít tàu gọi), số thùng có trong kho | | Lần đầu: một câu của Thông dịch viên: hàng chuẩn bị trước đắt hơn, hàng chợ thì tàu nào cũng gọi (gd-ux) | Cao |\n| Mở Shop lần đầu | Danh mục chia theo Hạng, ô khóa ghi điều kiện | | Một câu của Thông dịch viên: tàu trả Tally, Shop bán thứ trạm không tự làm | Cao |\n| Mua nâng cấp | Bộ đồ đổi hình sáng hôm sau | Tiếng máy Xưởng | Lần đầu: nâng cấp xong qua đêm | Cao |\n| Thiếu Tally hoặc vật liệu | Phần thiếu đỏ, ghi số còn thiếu | | Không | Cao |\n| ENG khóa vì Hạng | Ô ENG ghi \"cần Hạng cảng N\", thanh điểm tới hạng | | FTUE chương 1: lần đầu chạm ô ENG-101 | Cao |\n\ngd-ux: mỗi giá hiện cả hai phần (Tally và vật liệu). Màn Shop, Upgrade, lập danh mục đọc giá từ data, không có số trong strings.","he-thong/kinh-te-tien-trinh.md",""],["7b. Cảm giác (game feel)",2,236,8,0.47,"- Tham chiếu: khoảnh khắc Dave nhận tiền cuối ca sushi, tiền đếm lên từng dòng món [D theo `docs/knowledge/indie/06-dave-the-diver-cau-truc.md`]. Ở đây đếm theo từng tàu trên bảng tổng kết giao thương, tách giá và tip.\n- Phản tham chiếu: không có số Tally nhảy kiểu máy đánh bạc, không có hiệu ứng mua sắm kiểu cửa hàng game di động.\n- Mua nâng cấp: không có hoạt ảnh dài, xác nhận một lần, kết quả thấy ở sáng hôm sau trên hình bộ đồ.","he-thong/kinh-te-tien-trinh.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,236,8,9.05,"","he-thong/kinh-te-tien-trinh.md",""],["8.1 Mốc chương theo kịch bản và số người",3,256,8,3.51,"Mỗi ô là ngày thứ mấy xong chương và số giờ chơi của riêng chương đó (trung bình 200 lượt).\n\n\n| Kịch bản | Số người | Chương 1 | Chương 2 | Chương 3 | Chương 4 | Chương 5 | Cả game (giờ) | Lượt chạy xong game |\n|---|---|---|---|---|---|---|---|---|\n| tệ | 1 | 10 ngày, 2,81 giờ | 29 ngày, 5,77 giờ | 47 ngày, 6,67 giờ | 60 ngày, 5,31 giờ | 63 ngày, 1,52 giờ | 22,1 | 100% |\n| tệ | 2 | 7 ngày, 2,00 giờ | 15 ngày, 2,72 giờ | 25 ngày, 3,54 giờ | 31 ngày, 2,76 giờ | 34 ngày, 1 kiểu danh mục 22% đến 29% | Đạt |\n| Sống so với hạ, cỡ S và M, sau khi trừ vật tiêu hao, tính bằng Tally | 1,2 đến 2 lần (khung mục 9) | 1,44 đến 1,81 qua lưới, 1,50 đến 1,94 bắt tay (mục 8.4) | Đạt |\n| Kiểu danh mục khác nhau rõ (Lead \"cần làm cho nó tốt hơn\") | Không đặt số | Hàng chợ -28%, ít mà đắt -15% so với Chuẩn bị kỹ (mục 3.1) | Để GDM xem |\n\n- Kịch bản tệ một người dài 22,1 giờ, kịch bản tốt 10,1 giờ. Tệ dài vì người không chuẩn bị chỉ bán hàng chợ, chỉ số giá 0,84. Đây là chủ ý của giá theo bậc: chuẩn bị danh mục rút ngắn game. Chương 2 trung bình dài 3,6 giờ so với 2,75 giờ đặt ra (lệch 29%) vì chương 2 có 3 chuyến map nhánh và hai người vớt. Tổng vẫn trong mục tiêu nên không chỉnh thêm, ghi ở mục 10.","he-thong/kinh-te-tien-trinh.md",""],["8.2 Source và sink Tally",3,256,8,1.43,"| Kịch bản | Số người | Tally thu cả game | Phần tip trong thu | Chi cho ENG | Chi cho bộ đồ | Chi cho dụng cụ, khoang, Shop khác | Tally dư cuối game | Dư so với thu |\n|---|---|---|---|---|---|---|---|---|\n| tệ | 1 | 369517 | 21% | 30% | 53% | 17% | 46887 | 13% |\n| tệ | 2 | 404083 | 23% | 30% | 53% | 17% | 81453 | 20% |\n| tệ | 3 | 459510 | 29% | 30% | 53% | 17% | 136880 | 30% |\n| tệ | 4 | 525723 | 29% | 30% | 53% | 17% | 203093 | 39% |\n| trung bình | 1 | 404143 | 26% | 30% | 53% | 17% | 81513 | 20% |\n| trung bình | 2 | 496717 | 26% | 30% | 53% | 17% | 174087 | 35% |\n| trung bình | 3 | 668570 | 29% | 30% | 53% | 17% | 345940 | 52% |\n| trung bình | 4 | 721942 | 29% | 30% | 53% | 17% | 399312 | 55% |\n| tốt | 1 | 426941 | 30% | 30% | 53% | 17% | 104311 | 24% |\n| tốt | 2 | 740140 | 30% | 30% | 53% | 17% | 417510 | 56% |\n| tốt | 3 | 766409 | 30% | 30% | 53% | 17% | 443779 | 58% |\n| tốt | 4 | 844505 | 30% | 30% | 53% | 17% | 521875 | 62% |\n\n\n- Tally không phải cổng ở chương 3 và 4 (cổng là vật liệu, Hạng và chuyến map nhánh), nên Tally trong ví có lúc lên vài ngày lương (Phụ lục). Dư cuối game phần lớn đến từ chương 5 (không có thứ mua mới, GDM chấp nhận). Nhóm 3 và 4 người dư nhiều vì 55 và 60 tàu một ca bán hơn gấp đôi một người, còn giá không đổi theo số người (C8).","he-thong/kinh-te-tien-trinh.md",""],["8.3 Điểm treo log 40: giữ 1 món khi ngạt có quá đau ở chương 1",3,256,8,1.22,"| Kịch bản | Tỉ lệ chuyến ngạt (đầu vào) | Phần nhặt mất vì ngạt, cả game | Giờ chương 1, giữ 1 món | Giờ chương 1, giữ 3 món | Chênh (phút) |\n|---|---|---|---|---|---|\n| tệ | 25% | 22,5% | 2,81 | 2,72 | 5 |\n| trung bình | 15% | 13,8% | 1,89 | 1,89 | 0 |\n| tốt | 7% | 6,3% | 1,47 | 1,47 | 0 |\n\n\n\n| Chương | Dải | Túi đầy (GTĐ, bậc túi theo chương) | Món đắt nhất một đơn vị (GTĐ) | Giữ 1 món còn lại bao nhiêu |\n|---|---|---|---|---|\n| 1 | Gần | 93 | 5,0 | 5% |\n| 2 | Giữa | 309 | 10,0 | 3% |\n| 3 | Xa | 981 | 18,0 | 2% |\n| 4 | Xa | 1308 | 18,0 | 1% |\n| 5 | Xa | 1681 | 18,0 | 1% |\n\n\n- Kết luận: với túi 80 Khối, giữ 1 món là mất thật: món giữ lại chỉ bằng 5% túi đầy ở chương 1 và 1% ở chương 5. Nhưng ngạt hiếm, nên đổi sang giữ 3 món chỉ đổi chương 1 khoảng 0 phút ở kịch bản trung bình và 5 phút ở kịch bản tệ. GDM đã chốt giữ 1 món (log 57).\n- Lồng mẫu: trước khi sửa, lồng 3 con đắt nhất dải Gần trị 92,1 GTĐ, ngang túi đầy chương 1 (92,6 GTĐ), nên ngạt với lồng đầy gần như không mất gì. gd-combat đã sửa luật 25, GDM chốt ở log 57: chọn lồng làm món giữ lại thì chỉ giữ con sao cao nhất.","he-thong/kinh-te-tien-trinh.md",""],["8.4 Bắt sống so với hạ, tính bằng Tally (K9)",3,256,8,2.88,"- Hạ một con: mô sinh học bán theo thùng mô (Hàng sinh học), phần đặc sản đóng kiện đặc sản (Hàng hiếm, hệ số chế 1,1). Bắt sống: giá lồng (Hàng sống). Lưới cuộn trừ 1,10 GTĐ x 10 Tally mỗi phát, chia theo số con một phát trúng.\n\n\n| Loài cỡ S | Dải | Hạ (Tally kỳ vọng, bán mô sinh học và đặc sản) | Lồng sống (Tally) | Sống trên hạ, bắt tay sau choáng | Ròng trên hạ, lưới trúng 1 con | 2 con | 3 con | Nhãn |\n|---|---|---|---|---|---|---|---|---|\n| DL-G01 Driftmoth | Gần | 35,0 | 65 | 1,86 | 1,54 | 1,70 | 1,75 | MVP |\n| DL-G02 Skitter Ray | Gần | 41,7 | 75 | 1,80 | 1,54 | 1,67 | 1,71 | MVP |\n| DL-G04 Sting Krill | Gần | 28,3 | 55 | 1,94 | 1,55 | 1,75 | 1,81 | MVP |\n| DL-M04 Needlefin | Giữa | 81,7 | 135 | 1,65 | 1,52 | 1,59 | 1,61 | Sau MVP |\n| DL-X01 Prism Wisp | Xa | 290,0 | 435 | 1,50 | 1,46 | 1,48 | 1,49 | Sau MVP |\n| DL-X05 Shardbrood Hatchling | Xa | 200,0 | 300 | 1,50 | 1,44 | 1,47 | 1,48 | Sau MVP |\n\n\n- Kết luận: qua lưới, ròng trên hạ từ 1,44 tới 1,81. Bắt tay sau choáng không tốn vật tiêu hao nên được 1,50 đến 1,94 lần, trong trần 2,0 của khung. Bắt sống luôn đáng hơn hạ (K9) mà không vượt trần. Hệ số Hàng sống 1,3 thấp hơn Hàng hiếm 1,5 có chủ ý: đặc sản rơi khi hạ đã đắt, lồng đắt hơn nữa thì Sting Krill vượt trần 2.","he-thong/kinh-te-tien-trinh.md",""],["8.4b Tally một ca theo số người, kho thùng sau hai chuyến",3,256,8,4.67,"Tally một ca chương 1 khi kho đủ (tàu xong theo sim giờ giao thương, giá theo chỉ số giá của kịch bản) so với giá trị hai chuyến đầy túi của cả nhóm. Mốc cũ là 60% cho mọi số người, cột cuối là mốc theo số người:\n\n\n| Kịch bản | Số người | Số tàu | Tàu xong (sim giờ giao thương) | Tally một ca, kho đủ | Hai chuyến đầy túi của nhóm, quy ra Tally | Mốc: phần hai chuyến bán ở một ca | Điểm cảng một ca |\n|---|---|---|---|---|---|---|---|\n| tệ | 1 | 25 | 23,7 | 1345 | 2394 | 56% | 42 |\n| tệ | 2 | 55 | 49,5 | 2882 | 4629 | 62% | 88 |\n| tệ | 3 | 55 | 50,6 | 3195 | 6617 | 48% | 93 |\n| tệ | 4 | 60 | 51,2 | 3233 | 7942 | 41% | 95 |\n| trung bình | 1 | 25 | 24,7 | 1744 | 2989 | 58% | 46 |\n| trung bình | 2 | 55 | 54,5 | 3848 | 5058 | 76% | 102 |\n| trung bình | 3 | 55 | 54,7 | 4025 | 6837 | 59% | 105 |\n| trung bình | 4 | 60 | 57,9 | 4261 | 8225 | 52% | 111 |\n| tốt | 1 | 25 | 24,8 | 2038 | 3195 | 64% | 50 |\n| tốt | 2 | 55 | 54,7 | 4495 | 4864 | 92% | 109 |\n| tốt | 3 | 55 | 54,8 | 4504 | 6357 | 71% | 110 |\n| tốt | 4 | 60 | 59,8 | 4915 | 7764 | 63% | 120 |\n\n\n- Mốc mới, kịch bản trung bình: một người 58%, 2 người 76%, 3 người 59%, 4 người 52% giá trị hai chuyến đầy túi. Tally một ca 1744, 3848, 4025, 4261. Nhóm 2 người bán phần kho lớn hơn một mình vì vật liệu xây không nhân theo số người, nên nhóm có nhiều hàng rảnh để bán. 3 và 4 người có 55 và 60 tàu nên bán phần kho nhỏ dần.\n\nKho thùng sau hai chuyến (kịch bản theo cột, sim chuyến gd-tech) so với số tàu một ca, chưa trừ phần giữ để xây:\n\n\n| Chương | Kịch bản | GTĐ một thùng trung bình | 1 người: thùng sau hai chuyến / số tàu | 2 người: thùng sau hai chuyến / số tàu | 3 người: thùng sau hai chuyến / số tàu | 4 người: thùng sau hai chuyến / số tàu |\n|---|---|---|---|---|---|---|\n| 1 | tệ | 5,4 | 32 / 25 đủ | 60 / 55 đủ | 79 / 55 đủ | 94 / 60 đủ |\n| 1 | trung bình | 5,4 | 38 / 25 đủ | 64 / 55 đủ | 84 / 55 đủ | 101 / 60 đủ |\n| 1 | tốt | 5,4 | 39 / 25 đủ | 59 / 55 đủ | 77 / 55 đủ | 94 / 60 đủ |\n| 2 | trung bình | 16,5 | 39 / 25 đủ | 71 / 55 đủ | 98 / 55 đủ | 123 / 60 đủ |\n| 3 | trung bình | 41,0 | 38 / 25 đủ | 72 / 55 đủ | 104 / 55 đủ | 135 / 60 đủ |\n| 4 | trung bình | 64,4 | 35 / 25 đủ | 64 / 55 đủ | 91 / 55 đủ | 116 / 60 đủ |\n| 5 | trung bình | 77,3 | 39 / 25 đủ | 66 / 55 đủ | 87 / 55 đủ | 107 / 60 đủ |\n\n\n- Mọi ô đủ. Một người chương 1 có 38 thùng sau hai chuyến, còn 23 nếu giữ 40% để xây, dưới 25 tàu. Hàng tồn từ ngày 1 tới 3 (cảng chưa mở) bù phần thiếu: sim đo một người chương 1 bán trung bình 24,6 thùng mỗi ca.\n\nThùng bán thật mỗi ca trong sim (sau khi giữ phần để xây, kho mang sang 30% khi qua chương):\n\n\n| Kịch bản | Số người | Số tàu | Chương 1: thùng bán mỗi ca (phần số tàu) | Chương 2: thùng bán mỗi ca (phần số tàu) | Chương 3: thùng bán mỗi ca (phần số tàu) | Chương 4: thùng bán mỗi ca (phần số tàu) | Chương 5: thùng bán mỗi ca (phần số tàu) |\n|---|---|---|---|---|---|---|---|\n| tệ | 1 | 25 | 19,9 (80%) | 15,3 (61%) | 16,7 (67%) | 16,4 (66%) | 15,9 (64%) |\n| tệ | 2 | 55 | 48,3 (88%) | 28,5 (52%) | 34,4 (63%) | 31,5 (57%) | 28,4 (52%) |\n| tệ | 3 | 55 | 50,6 (92%) | 39,1 (71%) | 43,6 (79%) | 44,9 (82%) | 37,8 (69%) |\n| tệ | 4 | 60 | 51,2 (85%) | uyến không kết thúc sớm vì túi đầy. Cột Phút một chuyến khớp khung mục 9 (4 đến 6 phút ở chương 1, 10 đến 12 ở chương 5).\n\n\n| Điểm | Tên | Dụng cụ | GTĐ mỗi giây tại chỗ | GTĐ mỗi giây gồm 6 giây đi | Giây đầy túi 80 Khối | GTĐ mỗi Khối |\n|---|---|---|---|---|---|---|\n| SLV-101 | Mảnh vỡ trôi | Tay | 0,69 | 0,14 | 608 | 1,10 |\n| SLV-102 | Mạch quặng sắt | TOL-102 | 0,55 | 0,31 | 280 | 1,10 |\n| SLV-103 | Khối băng trôi | TOL-102 | 0,57 | 0,31 | 260 | 1,00 |\n| SLV-104 | Hòm kỹ thuật vỡ | TOL-102 | 0,83 | 0,42 | 310 | 1,61 |\n| SLV-105 | Tấm vỏ lớn | TOL-102 | 0,43 | 0,30 | 267 | 1,00 |\n\n\n- Nhặt tay so với khoan (bảng trên, gồm 6 giây đi giữa hai điểm `[GIẢ ĐỊNH]`): nhặt tay đầy túi chậm nhất trong các cách lấy.","he-thong/kinh-te-tien-trinh.md",""],["8.7 Tiêu chí nghiệm thu (gd-qa kiểm)",3,256,8,2.69,"- Chạy `python projects/game-moi/sim/economy/sim-kinh-te.py --ghi` trên bản sạch: `economy_doc.py kiem` ra 0 lỗi, file này không đổi so với bản đã nộp (cùng seed).\n- `--selftest` in \"selftest xanh\": cùng seed cùng kết quả, kịch bản trung bình một người xong game, tệ chậm hơn trung bình chậm hơn tốt, bậc giá đúng thứ tự, K9 trong 1,2 tới 2 lần, khối giaThung của ca-cang.json khớp bảng giá.\n- Mọi giá Tally trong mọi GDD khác trỏ về mục 3 của file này.\n- Mọi mục 8.1 ghi Đạt, trừ dòng có điều kiện thì điều kiện đã được vai kia nhận.\n\nTiêu chí đo được khi có build:\n\n| Feature | Category | Acceptance Criteria đo được | Nhãn |\n|---|---|---|---|\n| Tally là nguồn duy nhất | Kinh tế | Mọi event `tally_nhan` có nguồn là thùng, tip, bơm khí hoặc đơn đặt trước, không nguồn khác trong 100 phiên thử | MVP |\n| Giá một thùng | Kinh tế | Giá hiển thị bằng cột Giá Tally một thùng ở bảng 3.1, giá kiện bằng thùng nhân 2,5 | MVP |\n| Giá lồng sống | Kinh tế | Giá bằng bảng Lồng theo loài nhân hệ số sao, bảng tàu hiện \"từ\" giá loài rẻ nhất | MVP |\n| Tip | Kinh tế | Tip bằng giá thùng x 25% x phần kiên nhẫn còn lại, Tàu vội và Tikko gọi đồ Trái Đất gấp đôi, bơm khí cộng 10 | MVP |\n| Phần tip trong thu | Kinh tế | 20 đến 30% tổng Tally giờ giao thương trong cả phiên | MVP |\n| Giá nâng cấp và Shop | Kinh tế | Bằng bảng 3.2, không đổi khi số người đổi từ 1 đến 4 kể cả giữa phiên (C8) | MVP |\n| Điểm cảng | Tiến trình | Mỗi tàu xong cộng 1, cộng thêm 1 khi còn trên 2/3 kiên nhẫn, tàu rời không cộng | MVP |\n| Qua chương 1 | Tiến trình | Chương 1 đóng khi mốc đóng chương của truyện xong và ENG-101 đã lắp vào động cơ (K25), không có cổng kinh tế riêng | MVP |\n| ENG-101 | Tiến trình | Chỉ mua được khi Hạng cảng 3, ô ENG hiện \"cần Hạng 3\" khi chưa đủ | MVP |\n| Thời lượng chương 1 | Tiến trình | Event `chuong_xong` chương 1 của 5 người chơi mới, trung bình trong 1,5 đến 2 giờ | MVP |\n| Thời lượng cả game | Tiến trình | 12 đến 15 giờ trung bình, nhóm 4 bằng 60 đến 75% thời gian một mình tới hết game (log 69) | Sau MVP |\n| Lập danh mục có tác động | Kinh tế | Event `danh_muc_lap`: ca có từ 3 thùng hàng chế, sống hoặc hiếm cho Tally mỗi tàu cao hơn ca chỉ hàng chợ từ 20% | MVP |\n| Không mất Tally | Kinh tế | Ngạt, bị kéo về, thoát giữa chuyến không làm Tally giảm (K2) | MVP |\n| Không có vòng tiền | Kinh tế | Tally một ca không vượt số tàu x giá thùng đắt nhất trong danh mục x 1,5 cộng phần đơn đặt trước và bơm khí | MVP |","he-thong/kinh-te-tien-trinh.md",""],["10. Câu hỏi mở",2,236,8,0.71,"| Câu hỏi | Phương án đề xuất | Ai quyết |\n|---|---|---|\n| Chương 2 dài hơn giờ đặt ra 29% | Giữ, tổng game trong mục tiêu. Muốn rút thì bớt 1 chuyến map nhánh chương 2 | GDM, gd-world |\n| Nguồn RES-401 và RES-305 mỗi ngày có đủ cho khoảng 25 thùng CGO-411, CGO-511 một ca không | gd-world và gd-combat đo số RES mỗi chuyến chương 4, 5 | gd-world, gd-combat |\n| Số tàu và phút ca chương 2 tới 5 | Sim dùng số chương 1 (25, 55, 55, 60 tàu). Cần sim giờ giao thương của gd-tech cho tàu chương sau | gd-quan, gd-tech |\n| Tally dư ở nhóm 3, 4 người (bảng 8.2) | Chấp nhận như chương 5, hoặc thêm sink tùy chọn cho nhóm đông khi Lead mở phạm vi | GDM |" ],["PROCESSING (tab Sheet, theo chương)",3,268,8,1.55,"- Số túi và Oxy từng bậc ở bảng Sức mạnh theo chương ngay trên (do sim in), cột Sức mạnh tăng dưới đây chỉ ghi bậc lên theo bảng 3.2.\n\n| Chương | Người chơi học gì | Mở tài nguyên | Mở map | Mở trang bị | Mở Driftlife | Sức mạnh tăng | Ý đồ |\n|---|---|---|---|---|---|---|---|\n| 1 | Bay, Oxy, nhặt, khoan, nạy, hạ, bắt sống loài nhỏ, sửa khoang, lập danh mục, giờ giao thương, mua nâng cấp đầu tiên | Tài nguyên dải Gần | Dải Gần, Station Cinder | Dùi xung, Súng lưới, Bộ kích nguồn, bậc 1 bộ đồ | 4 loài Gần, BS-1 | T-TUI và T-OXY lên bậc 1, T-DAY bậc 1, thêm ô dụng cụ (quest) | Dạy trọn vòng lặp trong 2 giờ |\n| 2 | Nuôi, bắt loài lớn, nghiên cứu, Skiff | Tài nguyên dải Giữa | Dải Giữa, Wick, Lantern | Súng gây mê, Phao kéo, Kim sinh thiết, Lồng mẫu, bậc 2 | Loài Giữa, BS-2 | T-TUI, T-OXY, T-DAY lên bậc 2, T-VO bậc 1, thêm ô dụng cụ | Nhịp chậm lại, trạm lớn lên rõ |\n| 3 | Sự cố trong ca, kẻ địch có vũ khí, nhiều bến | Tài nguyên dải Xa | Dải Xa, Flint, Veyl Waypost | Máy quét xung, bậc 3 | Loài Xa, The Wardens, BS-3 | T-TUI, T-OXY, T-DAY lên bậc 3, T-VO bậc 2 | Chương dài nhất, giữa game |\n| 4 | Map nhánh lớn nhiều chuyến | Linh kiện Cradle | Cradle Interior | Máy cắt thân tàu, bậc 4 | BS-4 | T-TUI, T-OXY lên bậc 4, T-VO bậc 3 | Lộ sự thật, chuẩn bị trận cuối |\n| 5 | Trận cuối nhiều chuyến | Linh kiện Warden | Warden Rig | Không | BS-5 | Không thêm | Kết, Tally không còn vai trò |","he-thong/kinh-te-tien-trinh.md",""],["UX / UI",1,0,9,49.28,"Gồm 35 màn, HUD ngoài không gian và trong giờ giao thương, bảng phím cho bàn phím chuột và gamepad, 37 bước FTUE của chương 1, checklist phản hồi cho các khoảnh khắc chính và bảng strings có giới hạn ký tự. Phục vụ P1 (hệ quả của mỗi hơi thở phải đọc được bằng số), P2 (mang về thì thấy trạm đổi), P3 (cùng một giao diện cho 1 đến 4 người). Tầng: trình bày. Ưu tiên: bản đầu (chương 1). Phụ thuộc chính: `nguoi-choi.md` (Oxy, túi, phím), `tram-va-cang.md` (giờ giao thương, khoang), `map.md` (la bàn, beacon), `combat-driftlife.md` (tín hiệu đòn, choáng), `vat-pham.md` (túi, kiện), gd-economy (giá), gd-story (thoại, tên).","he-thong/ux-ui.md","GDD hệ thống: UX / UI (bản đồ màn, HUD, wireframe, input, FTUE chương 1, strings)"],["Hiện hành",2,272,9,3.9,"| Mục | Giá trị khởi điểm | Nhãn |\n|---|---|---|\n| Khung hình | 16:9, thiết kế ở 1280x720, lề an toàn 5% (64 x 36 px), chiều cao camera ngoài không gian 10 u | MVP |\n| Cỡ chữ | Thân chữ tối thiểu 12 px ở 720p (tương đương 18 px ở 1080p), người chơi chọn 100%, 150%, 200% | MVP |\n| Số màn | 35 màn (bảng 2.2), 33 màn MVP và 2 màn Sau MVP | MVP và Sau MVP |\n| HUD ngoài không gian | 15 phần tử HUD-01 đến HUD-15, chỉ Oxy, túi, dụng cụ luôn hiện | MVP |\n| HUD giờ giao thương | Giờ giao thương, Tally, tip, điểm cảng, số tàu, danh mục còn, thùng đang cầm, bong bóng gọi món và thanh kiên nhẫn trên tàu, gợi ý phím tương tác | MVP |\n| HUD trạm | 4 phần tử HTR-01 đến HTR-04: đồng hồ xác nhận chung, số chuyến hôm nay, điểm lưu, dấu cảnh chờ | MVP |\n| Input | Bàn phím chuột và gamepad (Xbox, PlayStation, Steam Deck), đổi phím, glyph tự đổi theo thiết bị | MVP |\n| FTUE chương 1 | 37 bước T01 đến T37, mỗi bước một ý, tắt sau hành động đầu có ý nghĩa, gợi ý không chặn màn | MVP |\n| Tạm dừng | Một mình có tạm dừng, từ 2 người không tạm dừng toàn cục (C7) | MVP |\n| Strings | 287 key tiếng Việt, mỗi key một giới hạn ký tự, máy kiểm bằng `ux/kiem-ux.mjs` | MVP |\n| Chế độ giảm nhấp nháy và rung, chuyển \"giữ\" thành \"bật\" | Tùy chọn trợ năng | giảm nhấp nháy MVP, \"bật\" Sau MVP |","he-thong/ux-ui.md",""],["1. Mục đích với người chơi",2,272,9,4.01,"- Cảm thấy: nhìn một lần biết mình còn bao lâu và có đủ về không, giao thùng xong thấy Tally và tip bay lên ngay, bước vào trạm thấy mọi việc cần làm đứng yên trên mặt cắt, không phải mở menu mới thấy.\n- Quyết định mà giao diện phải hỗ trợ: đi tiếp hay về (vạch \"đủ về\", thời gian còn), tham hay nhẹ túi (thanh tải và mốc 60%), ghim món nào, chia Oxy cho bạn hay giữ, bán loại hàng nào và bao nhiêu thùng (danh mục bán), tàu nào giao trước (thanh kiên nhẫn).\n- Pillar: P1 (Oxy là số đọc được, không ẩn), P2 (mặt cắt trạm là giao diện chính của nửa ở nhà, mỗi khoang sửa xong đổi hình), P3 (giao diện giống nhau với 1 đến 4 người, thêm người là thêm hàng đồng đội).\n- 30 giây đầu (một mình, thế giới mới): xem cảnh tỉnh dậy (bỏ qua được), đi tới điểm sáng trong trạm tối bằng A D, thấy dòng mục tiêu \"Sửa Khoang neo\" ở góc, ra cửa khí, bay tới vòng sáng đầu tiên, thấy thanh Oxy tụt và vạch \"đủ về\" nhích theo.","he-thong/ux-ui.md",""],["2. Luật",2,272,9,69.11,"","he-thong/ux-ui.md",""],["2.1 Luật chung của giao diện (MVP trừ khi ghi khác)",3,275,9,22.0,"1. Khung hình thiết kế ở 16:9, 1280x720. Vùng nhìn tối thiểu luôn là 17,8 x 10,0 u. Màn rộng hơn 16:9 (tới 21:9) được mở thêm chiều ngang, màn hẹp hơn 16:9 (16:10, 4:3) được mở thêm chiều cao, không có thanh đen trong khoảng 4:3 đến 21:9. HUD neo theo lề an toàn 5%.\n2. Thân chữ tối thiểu 12 px ở 720p, tương đương 18 px ở 1080p theo mức tối thiểu PC của Xbox Accessibility Guideline 101. Người chơi chọn cỡ chữ 100%, 150%, 200% cho toàn bộ chữ và biểu tượng nút, không mất nội dung và không cuộn hai chiều. Mức Steam Deck (ký tự nhỏ nhất không dưới 9 px cao ở 1280x800) thấp hơn mốc này, vì 12 px ở 720p quy ra 13,3 px ở 800p. Nguồn: `45-ux-ui.md` S1, S5.\n3. Font có đủ dấu tiếng Việt và có phương án sans serif không cách điệu. Mọi chữ nằm trên cảnh có viền hoặc nền mờ để đọc được trên mọi nền.\n4. Tương phản chữ cỡ chuẩn tối thiểu 4,5:1, chữ lớn tối thiểu 3:1, phần tử không hoạt động tối thiểu 3:1. Số tỉ lệ ghi trong brief art phải lấy từ script đo, không gõ tay. Nguồn: `45-ux-ui.md` S2, S4.\n5. Không thông tin nào chỉ truyền bằng màu. Mỗi trạng thái cảnh báo có thêm hình, chữ hoặc nhịp. Slot người chơi gồm màu và hình. Bậc hiếm của vật phẩm gồm màu, viền và hình biểu tượng khác nhau (khớp `vat-pham.md` mục 7). Nguồn: `45-ux-ui.md` S3, S8.\n6. Mỗi màn có đúng 3 câu mô tả (ở đâu, làm được gì, quay lại thế nào), một hành động chính và đủ 5 trạng thái: Trống, Đang tải, Bình thường, Lỗi, Đầy hoặc khóa (bảng 2.4 và 2.5).\n7. Quyết định tốn tài nguyên hay Oxy phải hiện hệ quả bằng số trước khi xác nhận: thiếu bao nhiêu, còn bao nhiêu sau khi trừ.\n8. Từ 2 người online không tạm dừng toàn cục (C7). Mọi menu mở ngoài không gian và trong giờ giao thương không dừng thời gian, khung menu có biểu tượng đồng hồ đang chạy. Một người online thì Menu (Esc) dừng thời gian. Trong trạm ngoài giờ giao thương không có đồng hồ nào đang đếm, nên mở menu bao lâu cũng không mất gì (luật 26 nêu cách đổi khi số người đổi).\n9. Gợi ý tutorial là dòng chữ ngắn không chặn thao tác. Cấm hộp thoại chặn màn khi có Driftlife trong 10 u, khi có hazard đang báo trước hoặc khi Oxy dưới 25%. Gợi ý một dòng vẫn được hiện cùng Driftlife (T13, T14, T18) vì đó là lúc cần dạy. Khi Oxy dưới 25% chỉ gợi ý loại thoát hiểm, cứu bạn và cảnh báo (T09, T15, T20, T34, T36) được hiện, gợi ý khác hoãn tới khi Oxy trên 25%. Chỉ cảnh truyện ở trạm được chặn màn (luật 25) và luôn bỏ qua được bằng một lần bấm (khớp `cot-truyen.md` luật 8).\n10. Mọi hành động có ít nhất một phím bàn phím chuột và một nút gamepad. Mọi menu điều khiển được bằng chuột, bàn phím hoặc gamepad. Đổi thiết bị giữa chừng thì glyph đổi ngay trong một khung hình.\n11. Thao tác nhấn phản hồi trong 0,1 giây. Thao tác giữ phải có vòng tiến độ và cách hủy hiện cạnh vòng. Đoạn chờ trên 10 giây phải có quyết định hoặc thông tin mới. Nguồn: `45-ux-ui.md` S6.\n12. Thông báo nhặt gộp theo loại và hiện tối đa 3 dòng, mỗi dòng tối đa 32 ký tự, ở lại 2,5 giây.\n13. Mọi cảnh báo âm có tương đương hình và ngược lại. Mỗi lớp phản hồi (rung, chớp, hạt, âm) bật tắt riêng được trong Cài đặt.\n14. Nhấp nháy tối đa 3 lần mỗi giây. Có tùy chọn giảm nhấp nháy và rung. `[GIẢ ĐỊNH]` ngưỡng 3 lần mỗi giây theo hướng dẫn chống nhấp nháy phổ biến, chưa có nguồn đọc được trong repo.\n15. Oxy hiển thị bằng điểm (1 điểm bằng 1 giây hao nền) kèm thời gian còn ước theo nhịp hao hiện tại. Mọi hệ số làm hao nhanh (tải, thiếu cấp vỏ, kéo vật) hiện thành số \"x1,15\" cạnh thanh Oxy.\n16. HUD đồng đội tối đa 3 hàng nhỏ ở mép trái, không che vùng giữa màn. Ping là tín hiệu có sẵn, không có chat chữ.\n17. UI không viết thoại hay tên truyện. Tên và thoại của gd-story, UI chỉ cấp chỗ đặt và giới hạn ký tự (bảng strings 2.13).\n18. Mã nội bộ (TOL-211, CGO-101) không hiện cho người chơi. Người chơi chỉ thấy tên.\n19. Tiến độ gợi ý tutorial lưu theo người chơi (hồ sơ máy), không theo nhân vật và không theo thế giới. Người chơi xem lại mọi gợi ý đã mở ở Sổ tay mục \"Cách chơi\" và tắt gợi ý trong Cài đặt.\n20. Màn Shop (UI-15) và Nâng cấp (UI-16) hiện mỗi giá thành hai phần, Tally và vật liệu, kèm điều kiện Hạng cảng nếu có. Giá đọc từ dữ liệu của gd-economy, không có số nào nằm trong bảng strings (khớp `kinh-te-tien-trinh.md` dòng 193).\n21. Esc và nút B đóng màn con trước, chỉ khi không còn màn con thì Esc mở UI-50. Start luôn mở UI-50 chồng lên màn hiện tại. UI-34 không có màn con để đóng, Esc không làm gì, Start vẫn mở Menu và không dừng thời gian. UI-35, UI-36, UI-43, UI-45 chỉ có nút Tiếp tục. `MVP`\n22. Âm thanh có bốn thanh âm lượng tách ở UI-51: Tổng, Nhạc, Hiệu ứng, Cảnh báo. MVP không có giọng đọc, mọi thoại là chữ, không cần phụ đề lời nói. Chú thích âm bật tắt được: hiện chữ ngắn cạnh nguồn cho âm có nghĩa (bíp Oxy 25% và 10%, tàu cập bến, báo trước đòn lớn, còi sự cố ở Sau MVP). `MVP`\n23. Thoát giữa chuyến hay giữa giờ giao thương (từ UI-50 hoặc đóng game) hiện hộp xác nhận nêu hệ quả bằng số trước khi thoát. Khách rời phiên tính như bị kéo về, chỉ giữ 1 món (C10). Chơi một mình hoặc chủ phòng thoát thì mất phần đang dở từ điểm lưu gần nhất (K23), chủ phòng thoát còn kết thúc phiên của cả nhóm. Hộp ghi rõ điểm lưu đó (\"Lần lưu: ...\") và có nút Vẫn thoát, Quay lại. `MVP`\n24. Thẻ tên chương: hiện thẻ \"Chương n: tên\" 3 giây, không chặn. Chương 1 hiện sau cảnh tỉnh dậy ở UI-05, các chương sau hiện ở pha Chuẩn bị của ngày đầu chương ở UI-10. Năm tên do gd-story cấp (`cot-truyen.md` mục 13), khóa `hud.chapter`, đều dưới 40 ký tự. `MVP` chương 1\n25. Cảnh truyện chặn màn (UI-53) chỉ xảy ra ở trạm khi giờ giao thương không chạy. Trong giờ giao thương đang chạy, UI-53 chỉ là bong bóng không chặn (`story.bubble`), cảnh của mốc xảy ra giữa ca (C1.8, C2.3, C3.3, C3.4, C3.8) phát ở UI-44 bằng UI-53. Lời theo trạng thái của nhân vật trong trạm và chuyện riêng của thương nhân không phải cảnh: là một dòng khi tới gần hoặc bấm nói chuyện và bong bóng lúc tàu cập bến, không dùng UI-53 và không có dấu cảnh chờ. Khi bất kỳ ai trong nhóm đang chạy giờ giao thương, cảnh của người khác không bao giờ chặn màn. `MVP`\n26. \"Một mình\" nghĩa là một người đang online trong thế giới, không phụ thuộc số nhân vật tỉnh dậy. Người thứ hai vào lúc người kia đang ở Menu tạm dừng thì thời gian chạy tiếp ngay, Menu của người kia đổi tiêu đề thành Menu và hiện thông báo \"{name} đã vào\". Người thứ hai rời thì người còn lại tạm dừng được từ lần mở Menu kế. `MVP`\n27. Xác nhận ra chuyến, ngủ, mở giao thương sớm và nghỉ giao thương có đồng hồ chung hiện cho mọi người ở trạm tại HTR-01. Ra ngoài 30 giây tính từ người đầu tiên xác nhận. Ngủ 30 giây tính từ người đầu tiên vào buồng (khớp K23). Mở giao thương sớm hoặc nghỉ giao thương 30 giây tính từ người đầu tiên xác nhận (`tram-va-cang.md` luật 64 tới 66). Đồng hồ kèm tên người chưa trả lời. Người đã xác nhận hủy bằng cách bấm lại, đồng hồ không dừng và không đặt lại (khớp `tram-va-cang.md` luật 60 và 61). `MVP`\n28. Số chuyến hôm nay hiện ở HTR-02 (\"Chuyến n/2\", K22). Sau chuyến thứ hai hoặc khi giờ giao thương đã mở thì UI-11 khóa kèm lý do. Nút Mở giao thương ở UI-14 hiện cảnh báo \"Mở giao thương là hết ra ngoài hôm nay\" và nút Nghỉ giao thương hiện \"Nghỉ giao thương cũng hết ra ngoài hôm nay\" trước khi xác nhận. `MVP`\n29. Giờ giao thương có hai loại bong bóng. Bong bóng gọi món nằm trên tàu ở cửa neo và không bao giờ bị che. Bong bóng truyện (`story.bubble`) nằm dưới tên tàu, chữ nhỏ hơn, tối đa một cái cùng lúc và không đè bong bóng gọi món. `MVP`\n30. Cửa neo 1, 2, 3 nhận biết bằng số lớn cộng màu. Ô quầy cùng số cùng màu với cửa neo, thùng có viền cùng màu và số cửa neo. Ba màu cửa neo phải khác ba trong bốn màu slot người chơi (cam, lam ngọc, vàng chanh, hồng tím) hoặc khác độ sáng rõ rệt, Artist kiểm. Demo dùng hổ phách, ngọc, tím, gần cam, lam ngọc và hồng tím của slot, nên bản thật không được chỉ dựa vào màu. `MVP`\n31. Màn lập danh mục chỉ nhận số thùng nguyên, không vượt hàng có trong kho. Mỗi lần thêm hay bớt, tổng thùng so với số tàu, số tàu thiếu hàng và giá trị danh mục cập nhật ngay. Mỗi loại hiện giá thùng và độ gọi (biểu tượng 3 vạch kèm số khi chọn, không chỉ màu). Danh mục nháp lưu tới khi Mở giao thương, co-op dùng chung và người Mở giao thương chốt (luật 55). Thiếu nhóm hàng làm một loại tàu không tới thì báo tên nhóm và tên loại tàu (theo luật gd-quan đang viết). Mở giao thương hiện hệ quả bằng số: hết ra ngoài hôm nay, tối đa bao nhiêu tàu không tới (luật 7). `MVP`","he-thong/ux-ui.md",""],["2.2 Bản đồ màn",3,275,9,10.93,"Nhóm: M menu và nhập cuộc, T trạm, O ngoài không gian, C giờ giao thương, S hệ thống. Nhãn trong cột cuối.\n\n| ID | Màn | Nhóm | Vào từ | Ra tới | Nhãn |\n|---|---|---|---|---|---|\n| UI-01 | Menu chính | M | Mở game | UI-02, UI-04, UI-51, thoát | MVP |\n| UI-02 | Tạo thế giới (chọn số người tỉnh dậy 1 đến 4) | M | UI-01 | UI-03 hoặc UI-05 | MVP |\n| UI-03 | Sảnh co-op (chờ bạn vào, sẵn sàng) | M | UI-02 khi từ 2 người, hoặc nút Mời bạn ở UI-50 | UI-05 | MVP (2 người) |\n| UI-04 | Tham gia thế giới (bạn bè, mã, Phòng đầy) | M | UI-01 | UI-05 hoặc UI-20 | MVP |\n| UI-05 | Cảnh tỉnh dậy và cảnh đến | M | UI-02, UI-03, UI-04 | UI-10 | MVP |\n| UI-10 | Trạm mặt cắt (đi bộ, 3 tầng) | T | UI-05, UI-36, UI-35, UI-44 | Mọi màn T, UI-11, UI-40 | MVP |\n| UI-11 | Cửa khí: xác nhận chuyến và chọn dụng cụ | T | UI-10 (E ở cửa khí) | UI-30, UI-10 | MVP |\n| UI-12 | Kho (xem, tìm, lọc) | T | UI-10 | UI-10 | MVP |\n| UI-13 | Xưởng (chế, hàng đợi qua đêm, nâng cấp trang bị) | T | UI-10 | UI-10 | MVP |\n| UI-14 | Bảng tàu và danh mục bán (số tàu, đơn đặt trước, chọn hàng, Mở giao thương) | T | UI-10 (khoang liên lạc) | UI-40 hoặc UI-10 | MVP |\n| UI-15 | Shop (đặt hàng cuối ngày) | T | UI-10 (khoang liên lạc), UI-44 | UI-10 hoặc UI-44 | MVP |\n| UI-16 | Nâng cấp (bộ đồ ở xưởng, khoang ở từng khoang) | T | UI-13, UI-10, UI-44 | UI-10 hoặc UI-44 | MVP |\n| UI-17 | Sửa khoang (danh sách vật liệu, giữ phím sửa) | T | UI-10 (đứng ở khoang hỏng) | UI-10 | MVP |\n| UI-18 | Động cơ chính (5 giai đoạn) | T | UI-10 (khoang động cơ) | UI-10 | MVP giai đoạn 1 |\n| UI-19 | Sổ tay (mục tiêu, mốc truyện, manh mối, cách chơi) | T | UI-10, UI-44, UI-50 | Màn đã mở nó | MVP |\n| UI-20 | Chờ nhóm (người về sớm, người chờ vào) | T | UI-35, UI-36, UI-04 | UI-10 | MVP |\n| UI-21 | Nghiên cứu (mẫu Driftlife sang bản thiết kế) | T | UI-10 (phòng nghiên cứu), UI-44 | UI-10 hoặc UI-44 | Sau MVP |\n| UI-22 | Khoang nuôi (ô, cho ăn, sản phẩm) | T | UI-10 (khoang sinh quyển) | UI-10 | Sau MVP |\n| UI-30 | HUD bay (ngoài không gian) | O | UI-11 | UI-34, UI-36, UI-35 | MVP |\n| UI-31 | Túi đồ (mở, thả, ghim) | O | UI-30 (Tab) | UI-30 | MVP |\n| UI-32 | Bánh ping | O | UI-30 (T) | UI-30 | MVP |\n| UI-33 | Bản đồ chuyến (chỉ phần đã đi qua) | O | UI-30 (M) | UI-30 | MVP |\n| UI-34 | Ngạt và chọn món ghim | O | UI-30 (Oxy chạm 0) | UI-30, UI-35, UI-36 | MVP |\n| UI-35 | Bị kéo về (tóm tắt Giữ và Mất) | O | UI-34 hết giờ | UI-10 hoặc UI-20 | MVP |\n| UI-36 | Kết chuyến (Về an toàn, tóm tắt chuyến) | O | UI-30 (cửa khí hoặc Recall) | UI-10 hoặc UI-20 | MVP |\n| UI-40 | HUD giờ giao thương | C | UI-14 (Mở giao thương) | UI-43 | MVP |\n| UI-41 | Bong bóng gọi món và thanh kiên nhẫn (hiện trên tàu trong cảnh) | C | Tàu vào cửa neo | Tàu rời | MVP |\n| UI-42 | Bơm khí (giữ phím ở cửa neo có yêu cầu) | C | UI-40 (giữ E ở cửa neo) | UI-40 | MVP |\n| UI-43 | Kết thúc giờ giao thương | C | UI-40 (hết giờ, hết danh mục hoặc tàu cuối rời) | UI-44 hoặc UI-10 | MVP |\n| UI-44 | Cuối ngày (việc cuối ngày, vào buồng ngủ) | C | UI-43 | UI-10, UI-15, UI-16, UI-19, UI-21, UI-05 (ngày mới) | MVP |\n| UI-45 | Lên Hạng cảng (danh sách mở) | C | UI-43 | UI-43 | MVP |\n| UI-50 | Menu (một mình là tạm dừng) | S | Esc hoặc Start | Màn trước | MVP |\n| UI-51 | Cài đặt (hình, âm, điều khiển, trợ năng, trò chơi) | S | UI-01, UI-50 | Màn trước | MVP |\n| UI-52 | Đổi phím | S | UI-51 | UI-51 | MVP |\n| UI-53 | Hộp thoại truyện (thoại ngắn, bỏ qua) | S | Mốc truyện, người vớt | Màn trước | MVP |\n\nTổng 35 màn: 33 MVP, 2 Sau MVP (UI-21, UI-22). UI-18 và UI-45 là màn MVP nhưng nội dung giai đoạn 2 đến 5 của động cơ và Hạng cảng 4 đến 8 là Sau MVP.","he-thong/ux-ui.md",""],["2.3 Luồng chính",3,275,9,1.67,"```\nUI-01 Menu --> UI-02 Tạo thế giới --(từ 2 người)--> UI-03 Sảnh --> UI-05 Cảnh tỉnh dậy\n   |                    \\--(1 người)-----------------------------> UI-05\n   \\--> UI-04 Tham gia --> UI-05 Cảnh đến --> UI-20 Chờ nhóm (nếu nhóm đang ngoài) --> UI-10\nUI-10 Trạm --E--> UI-11 Cửa khí --(cả nhóm xác nhận)--> UI-30 HUD bay\nUI-30 --Tab--> UI-31 Túi    --T--> UI-32 Ping    --M--> UI-33 Bản đồ chuyến\nUI-30 --Oxy 0--> UI-34 Ngạt --hết 12 s--> UI-35 Bị kéo về --> UI-10 (hoặc UI-20 nếu nhóm còn ngoài)\nUI-30 --cửa khí / Recall--> UI-36 Kết chuyến --> UI-10 (hoặc UI-20)\nUI-10 --khoang liên lạc--> UI-14 Bảng tàu và danh mục --Mở ca--> UI-40 HUD giờ giao thương --giữ E ở cửa neo--> UI-42 Bơm khí --> UI-40\nUI-40 --hết giờ, hết danh mục hoặc tàu cuối rời--> UI-43 Kết thúc giờ giao thương --> UI-44 Cuối ngày --> UI-05 (ngày mới)\nUI-44 --> UI-15 Shop / UI-16 Nâng cấp / UI-19 Sổ tay / UI-21 Nghiên cứu / vào buồng ngủ\n```\n\nLuật luồng:\n1. Mọi màn có đường quay lại bằng Esc hoặc B về màn đã mở nó (luật 21 mục 2.1), trừ UI-34 (chỉ thoát khi hết giờ, được cứu hoặc chạm cửa khí), UI-05 (bỏ qua bằng một lần bấm) và UI-35, UI-36, UI-43, UI-45 (chỉ có nút Tiếp tục). `MVP`\n2. Không màn nào cụt: mỗi màn có ít nhất một đường ra ghi ở cột \"Ra tới\". `MVP`\n3. Thứ tự một ngày theo khung mục 4 là Chuẩn bị, Chuyến 1, Chuyến 2, Giờ giao thương, Cuối ngày, nhưng giao diện không ép thứ tự: người chơi vào UI-14 hay UI-11 lúc nào cũng được khi điều kiện luật cho phép. Pha giờ giao thương chỉ bắt đầu khi có người chọn Mở giao thương (`tram-va-cang.md` luật 19). `MVP`","he-thong/ux-ui.md",""],["2.4 Từng màn: ba câu và hành động chính",3,275,9,7.5,"Câu thứ nhất nói đang ở đâu, câu thứ hai nói làm được gì, câu thứ ba nói quay lại thế nào. Cột cuối là một hành động chính của màn.\n\n| ID | Ba câu | Hành động chính |\n|---|---|---|\n| UI-01 | Ở: màn mở đầu. Làm: chơi tiếp, tạo thế giới mới, tham gia bạn, cài đặt. Về: thoát game ra desktop. | Chơi tiếp thế giới gần nhất |\n| UI-02 | Ở: tạo thế giới. Làm: đặt tên và chọn 1 hoặc 2 người tỉnh dậy (ô 3 và 4 khóa kèm \"Sắp có\"), bạn vào sau vẫn được. Về: Esc về menu chính, chưa tạo gì. | Bấm Tạo |\n| UI-03 | Ở: sảnh chờ trước khi vào trạm. Làm: xem ai đã vào, ai sẵn sàng, mời thêm. Về: rời sảnh, thế giới vẫn còn. | Bấm Sẵn sàng |\n| UI-04 | Ở: màn tìm thế giới của bạn. Làm: chọn bạn bè hoặc nhập mã để vào. Về: Esc về menu chính. | Bấm Vào |\n| UI-05 | Ở: cảnh mở đầu hay cảnh đến. Làm: xem cảnh ngắn của nhân vật. Về: bấm một lần ở bất kỳ câu nào là bỏ qua. | Bỏ qua hoặc xem tiếp |\n| UI-10 | Ở: mặt cắt Station Ember. Làm: đi tới khoang cần dùng, sửa, chế, lập danh mục bán. Về: không có thoát, thoát game qua Esc. | Đi tới khoang kế tiếp trong mục tiêu |\n| UI-11 | Ở: cửa khí. Làm: chọn dụng cụ trong đai, xác nhận ra ngoài hoặc ở lại trạm, xem số chuyến hôm nay. Về: Esc ở lại trạm. | Xác nhận ra ngoài |\n| UI-12 | Ở: kho dùng chung. Làm: xem số lượng, sao chất lượng và giá của từng loại, lọc theo nhóm, tìm theo tên. Về: Esc về màn đã mở nó. | Tìm một loại vật phẩm |\n| UI-13 | Ở: xưởng. Làm: chọn công thức, đặt vào hàng đợi, nhận đồ chế xong. Về: Esc về trạm. | Bấm Chế |\n| UI-14 | Ở: bảng tàu và danh mục bán ở khoang liên lạc. Làm: xem số tàu và đơn đặt trước, chọn tối đa 4 loại hàng từ kho (chương 1), đặt số thùng, mở giao thương (chỉ khi không còn ai ngoài chuyến, mỗi ngày một ca, hết ra ngoài hôm nay) hoặc nghỉ giao thương không phạt (nghỉ giao thương cũng khóa cửa khí tới ngày mới). Mở giao thương sớm hay nghỉ giao thương cần cả nhóm xác nhận. Về: Esc về trạm, danh mục đã chọn còn nguyên tới lúc Mở giao thương. | Bấm Mở giao thương |\n| UI-15 | Ở: shop ở khoang liên lạc. Làm: đặt hàng bằng Tally, hàng tới sáng hôm sau. Về: Esc về trạm. | Đặt một mục |\n| UI-16 | Ở: màn nâng cấp bộ đồ hay khoang. Làm: chọn trục hay khoang, xem vật liệu và Tally cần, mua một lần cho cả nhóm. Về: Esc quay lại. | Bấm Nâng cấp |\n| UI-17 | Ở: khoang hỏng đang đứng. Làm: xem vật liệu cần, giữ phím sửa. Về: bước ra khỏi khoang là đóng. | Giữ E để sửa |\n| UI-18 | Ở: động cơ chính. Làm: xem giai đoạn đang sửa và vật liệu, giữ phím sửa. Về: bước ra hay Esc. | Giữ E để sửa giai đoạn |\n| UI-19 | Ở: Sổ tay chung của nhóm. Làm: đọc mục tiêu hiện tại, mốc đã xong, manh mối đã nhặt, cách chơi. Về: Esc về trạm. | Đọc mục tiêu hiện tại |\n| UI-20 | Ở: trạm trong lúc nhóm còn ngoài kia. Làm: xem vị trí đồng đội, làm việc trạm, chế trước, ping nhắc. Về: tự đóng khi cả nhóm về. | Làm một việc trạm |\n| UI-21 | Ở: phòng nghiên cứu. Làm: chọn mẫu và đổi sang bản thiết kế. Về: Esc về trạm. | Bấm Nghiên cứu |\n| UI-22 | Ở: khoang sinh quyển. Làm: thả con vào ô, cho ăn, lấy sản phẩm. Về: Esc về trạm. | Cho ăn |\n| UI-30 | Ở: ngoài không gian, thấy Oxy, túi, dụng cụ, la bàn, đồng đội. Làm: bay, nhặt, khai thác, bắn. Về: bay vào cửa khí hoặc giữ F ở Recall Beacon. | Bay |\n| UI-31 | Ở: túi đồ, thời gian vẫn chạy. Làm: xem tải, thả đồ (đang ngạt không thả được), ghim một món. Về: Tab hay Esc đóng. | Ghim một món |\n| UI-32 | Ở: bánh ping quanh nhân vật. Làm: chọn một trong bốn ping rồi thả. Về: thả phím không chọn là hủy. | Chọn một ping |\n| UI-33 | Ở: bản đồ phần đã đi trong chuyến này. Làm: xem Ember, Recall Beacon, lối vào map nhánh đã thấy, đồng đội. Về: M hay Esc đóng. | Nhìn đường về |\n| UI-34 | Ở: bị ngạt, còn 12 giây. Làm: chọn món ghim (đang ngạt không trao và không thả đồ), chờ đồng đội chia Oxy hoặc bay tới cửa khí. Về: không có nút thoát, Esc không làm gì, màn tự kết thúc khi được cứu, chạm cửa khí hay hết giờ. | Chọn món ghim hoặc bay |\n| UI-35 | Ở: cảnh bị kéo về. Làm: xem món giữ, món mất và vật nhiệm vụ về chỗ cũ. Về: bấm Tiếp tục sau 1,5 giây. | Bấm Tiếp tục |\n| UI-36 | Ở: về an toàn. Làm: xem tóm tắt chuyến, túi đã vào kho. Về: bấm tiếp. | Bấm Tiếp tục |\n| UI-40 | Ở: trong giờ giao thương, thấy giờ giao thương, Tally, tàu ở các cửa neo và danh mục còn. Làm: nhặt thùng ở ô quầy, mang tới đúng cửa neo, giao, bơm khí cho tàu đang chờ. Về: không thoát giữa ca, một mình dùng Esc để tạm dừng. | Giao một thùng đúng cửa neo |\n| UI-41 | Ở: trên tàu đang ở cửa neo. Làm: đọc món tàu gọi, xem thanh kiên nhẫn, biết thùng sẽ ra ô quầy sau 3 giây. Về: tàu nhận thùng hoặc hết kiên nhẫn thì rời, bong bóng biến mất. | Đọc món tàu gọi |\n| UI-42 | Ở: cửa neo có tàu đang bật yêu cầu bơm khí. Làm: đứng ở cửa neo khi tay trống, giữ phím 1 giây. Về: thả phím, bước đi hoặc tàu rời là hủy. | Giữ E để bơm khí |\n| UI-43 | Ở: kết thúc giờ giao thương. Làm: xem số tàu phục vụ, Tally, tip, điểm cảng, đơn đặt trước, hàng về kho và lời thương nhân. Về: bấm tiếp, không chặn người khác. | Bấm Tiếp tục |\n| UI-44 | Ở: cuối ngày. Làm: shop, nâng cấp, nghiên cứu, Sổ tay, nói chuyện, rồi vào buồng ngủ (đồng hồ 30 giây từ người đầu tiên). Về: Esc đóng màn con về cuối ngày, ra lại khỏi buồng để hủy xác nhận. | Vào buồng ngủ |\n| UI-45 | Ở: bảng lên Hạng cảng. Làm: xem thứ mới mở. Về: bấm tiếp. | Bấm Tiếp tục |\n| UI-50 | Ở: menu. Làm: tiếp tục, mời bạn, Sổ tay, cài đặt, về menu chính (có xác nhận kèm hệ quả). Về: Esc hay Start đóng. | Tiếp tục |\n| UI-51 | Ở: cài đặt. Làm: chỉnh hình, âm lượng, điều khiển, trợ năng, gợi ý. Về: Esc, thay đổi áp ngay. | Chỉnh một mục |\n| UI-52 | Ở: đổi UD-03 và HUD-04), dụng cụ (HUD-05). Các phần tử còn lại hiện khi có việc. Mọi ngưỡng lấy từ `nguoi-choi.md` mục 2.2 và công thức vạch \"đủ về\" ở mục 3 của file đó.\n\n| ID | Phần tử | Vị trí | Hiện khi | Nội dung và số | Tín hiệu không dựa vào màu |\n|---|---|---|---|---|---|\n| HUD-01 | Thanh Oxy | Trên trái | Luôn | Thanh dài 320 px ở 720p, số điểm Oxy, dưới thanh là thời gian còn ước tính (Oxy chia hao hiện tại) và hệ số \"x1,0\". Hệ số hiện đỏ khi lớn hơn 1 | Ngưỡng 50%: biểu tượng bình và bíp chậm mỗi 3 giây. 25%: chữ THẤP, nhấp nháy tối đa 3 lần mỗi giây, bíp mỗi 1,5 giây, gợi ý \"Về\". 10%: viền màn hình dày lên, thở dốc, bíp mỗi 0,7 giây, camera thu nhẹ |\n| HUD-02 | Vạch \"đủ về\" | Trên HUD-01 | Luôn khi ngoài không gian (cửa khí luôn là đích) | Oxy_về theo công thức mục 3 của `nguoi-choi.md`. Phần thanh dưới vạch tô sọc chéo, trên vạch tô đặc. Nhãn nhỏ \"Về cửa khí\" hoặc \"Về Beacon\" theo đích rẻ nhất. Khi Oxy chạm vạch có một tiếng chuông và chữ ĐỦ VỀ sáng 2 giây | Sọc chéo và đặc, chữ, chuông |\n| HUD-03 | Thanh tải túi | Dưới HUD-01 | Luôn | Thanh tải, số \"x/80\" (bậc 0 là 80 Khối), vạch mốc 60%. Quá 60% hiện chữ \"Nặng\" và \"-p% tốc độ, hao +p%\" cùng một p theo công thức của `nguoi-choi.md` mục 3. Chạm 100% hiện chữ Đầy | Vạch mốc, chữ Nặng, bộ đẩy phụt lớn |\n| HUD-04 | Món ghim | Dưới HUD-03 | Luôn | Biểu tượng ghim và biểu tượng món đang ghim. Chưa ghim hiện \"Chưa ghim\" cùng gợi ý phím. Ghim tự đổi (vật hiếm nhất vừa nhặt) hiện thông báo \"Đã ghim ...\" | Biểu tượng ghim |\n| HUD-05 | Đai dụng cụ | Dưới giữa | Luôn | 2 đến 4 ô (theo bậc đai), ô đang cầm to hơn kèm phím 1 đến 4. Hiện hồi chiêu dạng vòng quay, độ nóng của Dùi xung, số Lưới cuộn còn lại khi cầm Súng lưới | Số phím, vòng hồi chiêu |\n| HUD-06 | La bàn viền | Mép màn hình | Khi mục tiêu nằm ngoài màn | Mũi tên ở mép: Ember (luôn), Recall Beacon đã thấy, đồng đội (hình slot), điểm ping. Mũi tên kèm khoảng cách bằng u. Đòn từ kẻ địch ngoài màn có mũi tên chỉ báo riêng ở mép ngay từ đầu pha báo trước (vàng hay đỏ theo mức đòn, đòn lớn dùng mũi tên đôi, kèm âm định hướng). Hazard của map cũng có chỉ báo mép theo `map.md` mục 3.5: Mảnh trôi (MVP) mũi tên theo hướng tới và tiếng có hướng trái phải, 1 giây trước khi vào màn. Dòng đá vụn (Sau MVP) là vạch đỏ theo làn ở mép, 2 giây trước đợt. Bùng tinh vân (Sau MVP) chỉ báo cùng lúc túi khí sáng dần khi cách mép dưới 5 u. Mũi tên Ember có hình trạm, Beacon có hình tháp | Hình riêng từng loại, không chỉ màu |\n| HUD-07 | Đồng đội | Mép trái, dưới HUD-04 | Từ 2 người | Tối đa 3 hàng: hình slot, tên, thanh Oxy nhỏ, trạng thái (Ngạt có đồng hồ vòng, Được chia Oxy, Đã về), biểu tượng mạng ba mức (ổn, trễ, Giữ chỗ có đồng hồ 15 giây, quá hạn tính như bị kéo về theo C10). Người chia Oxy thấy mốc sàn 20 trên thanh Oxy của mình, chạm sàn thì dừng chia và hiện \"Dừng chia: giữ lại {n} Oxy\" | Hình slot, chữ trạng thái |\n| HUD-08 | Số ping còn lại | Dưới phải | Khi có ping đang hiện | \"Ping 3\" giảm dần, hết thì \"0\", ping hiện 8 giây trong thế giới và ở La bàn nếu ngoài màn | Chữ |\n| HUD-09 | Thông báo nhặt | Phải, dưới HUD-13 | Khi nhặt | Tối đa 3 dòng, 32 ký tự, gộp loại (\"+3 Phế liệu\"). Vật hiếm có viền và hình riêng theo bậc | Viền, hình bậc |\n| HUD-10 | Lời nhắc thao tác | Cạnh nhân vật | Khi có đích tương tác | Phím theo thiết bị và động từ ngắn (\"E Kéo\"). Nhiều đích thì hiện đích ưu tiên theo `nguoi-choi.md` 2.5 và một chấm \"+1\". Lối map nhánh thiếu điều kiện hiện chữ nêu thiếu gì (\"Cần {tool} để mở\"). Vật cản dải chưa mở hiện \"Chưa có đường qua\" | Chữ, glyph |\n| HUD-11 | Tên dải và cảnh báo môi trường | Trên giữa | Qua ranh dải | Tên dải hiện 2 giây. Vào dải thiếu cấp vỏ (Sau MVP): thêm biểu tượng, chữ \"Thiếu cấp vỏ, hao Oxy x2,5\" và hệ số HUD-01 đổi | Biểu tượng, chữ, âm cảnh báo bộ đồ |\n| HUD-12 | Hàng đã ghim | Dưới trái | Khi đã ghim ở bảng tàu (loại hàng còn thiếu cho danh mục) | Một đến hai dòng: \"Cần: Phế liệu x4\" (tên nhóm hàng và số) | Chữ |\n| HUD-13 | Mục tiêu Sổ tay | Trên phải | Luôn trong chương 1 | Một dòng mục tiêu hiện tại của Sổ tay, ví dụ \"Sửa Khoang neo\", kèm tên nơi phải tới | Chữ |\n| HUD-14 | Vòng tiến độ thao tác giữ | Quanh nhân vật | Khi giữ Kích Recall, Kéo, Khai thác, Kết nhanh, Chia Oxy | Vòng đầy dần theo thời gian giữ của thao tác, chữ nhỏ nêu cách hủy (\"Thả phím hủy\") | Vòng, chữ |\n| HUD-15 | Trần hồi Oxy từ vật tiêu hao | Dưới HUD-01 | Khi có vật tiêu hao hồi Oxy trong túi hoặc đã dùng trong chuyến | \"Còn hồi {n} Oxy\" (trần 25% dung lượng bình mỗi chuyến, K26). Vật trong túi hiện số hồi thật nếu vượt trần. Đạt trần hiện \"Đã hồi tối đa chuyến này\". Đang ngạt bấm dùng hiện \"Không dùng được khi ngạt\" | Chữ, số |\n\n```\n1280x720, lề an toàn 64 x 36 px\n+----------------------------------------------------------------------+\n| HUD-01 OXY [/////|####......] 187  ~3:07  x1,0   HUD-11 Dải Gần     HUD-13 Sửa |\n| HUD-02   vạch đủ về --^  Về cửa khí                              Khoang |\n| HUD-03 TÚI [######....|] 56/80 Nặng            HUD-09 +3 Phế liệu        neo |\n| HUD-04 GHIM: (pin) Mảnh lõi                        +1 Băng              |\n| HUD-07 (o) An   [####.] 61                                              |\n|     (^) Bo   NGẠT (vòng 8 s)                                         |\n|  <-- HUD-06 Ember 240 u               (vùng chơi)     Beacon 85 u -->   |\n|                                HUD-10 \"E Kéo\" (vòng HUD-14)               |\n|                                                                      |\n| HUD-12 Cần: Phế liệu x4     HUD-05 [1 Lao từ][2 Dùi xung]  HUD-08 Ping 3 |\n+----------------------------------------------------------------------+\n```\n\nGhi chú: ○ △ □ ◇ trong bản vẽ thay bằng (o) (^) vì khối chữ ASCII. Thanh HUD-01 phần \"////\" là phần dưới vạch \"đủ về\".","he-thong/ux-ui.md",""],["2.7 HUD giờ giao thương và trạm (UI-40, UI-10)",3,275,9,14.0,"| ID | Phần tử | Vị trí | Nội dung và số | Tín hiệu không dựa vào màu |\n|---|---|---|---|---|\n| HCH-01 | Giờ giao thương | Trên trái | Đồng hồ ca còn lại (phút:giây), từ 300 giây (luật 34). Dưới 30 giây: số đậm kèm biểu tượng đồng hồ và tích tắc nhẹ, không nhấp nháy | Chữ, biểu tượng, tích tắc |\n| HCH-02 | Tally và tip trong ca | Trên trái, cạnh HCH-01 | Tally nhận trong ca và Tip nhận trong ca. Mỗi lần giao, \"+giá tip +n\" bay từ cửa neo lên trong 150 ms và hai số cộng. Bơm khí cộng vào Tip | Số bay |\n| HCH-03 | Điểm cảng và số tàu | Trên trái, cạnh HCH-02 | \"Điểm cảng n\" và \"Tàu a/b\" (tàu phục vụ xong trên tổng lịch ca). Điểm cảng cộng 1 mỗi tàu, thêm 1 nếu còn trên 2/3 kiên nhẫn | Chữ, số |\n| HCH-04 | Danh mục còn | Dưới trái | Mỗi loại: hình thùng, tên ngắn, số thùng còn. Hết thì mờ kèm \"Hết\". Loại có đơn đặt trước chưa giao thêm nhãn \"Đặt trước\" | Hình, chữ, số |\n| HCH-05 | Thùng đang cầm | Dưới giữa | Hình thùng, tên ngắn và \"Cửa neo n\" (số cộng màu). Mỗi lần mang 1 thùng. Tay trống thì ẩn | Số cửa neo, hình |\n| HCH-06 | Bong bóng gọi món và thanh kiên nhẫn | Trên tàu (diegetic) | Hình thùng và tên món tàu gọi, vòng đếm 3 giây tới khi thùng ra ô quầy, rồi thanh kiên nhẫn có vạch mốc 2/3 và 1/3. Tàu chờ ngoài chỉ có vòng đồng hồ chờ, không có bong bóng | Hình, vạch mốc, tích tắc dưới 1/3 |\n| HCH-07 | Hàng đợi xưởng | Dưới phải | Số mẻ đang chạy và chờ, chế qua đêm hiện \"xong khi sang ngày\" | Số, chữ |\n| HCH-08 | Sự cố | Giữa trái | Biểu tượng loại sự cố, mũi tên tới khoang, chữ xử lý. Còi báo động ngắn, không lặp liên tục | Biểu tượng riêng từng loại (Sau MVP) |\n| HCH-09 | Tally và Hạng cảng | Trên phải | Tổng Tally của nhóm kèm \"Hạng n (a/b)\" (điểm cảng hiện tại trên ngưỡng kế), mỗi khi thay đổi hiện số cộng hay trừ trong 150 ms. Hiện ngoài giờ giao thương, trong ca nhường chỗ cho HCH-02 | Số |\n| HCH-10 | Sơ đồ trạm thu nhỏ | Dưới HCH-09 | Mặt cắt 3 tầng thu nhỏ: khoang, bến (chấm khi có tàu), vị trí mỗi người (hình slot), sự cố. Hiện ở UI-10 ngoài ca. Trong giờ giao thương ẩn vì quầy và cửa neo nằm trọn trong một màn | Hình khoang, hình slot |\n| HCH-11 | Gợi ý phím tương tác | Cạnh nhân vật | Phím theo thiết bị và động từ ngắn (\"E nhặt thùng\", \"E giao thùng\", \"Giữ E bơm khí\"), chỉ hiện khi làm được. Đứng gần mà chưa làm được thì hiện mờ kèm lý do ngắn (\"Tay đang bận, mỗi lần 1 thùng\") | Glyph, chữ |\n\nHUD trong trạm (UI-10 ngoài giờ giao thương):\n\n| ID | Phần tử | Vị trí | Nội dung và số | Tín hiệu không dựa vào màu |\n|---|---|---|---|---|\n| HTR-01 | Đồng hồ xác nhận chung | Trên giữa | Hiện khi có người xác nhận ra chuyến (30 giây từ người đầu tiên) vào buồng ngủ, mở giao thương sớm hay nghỉ giao thương (30 giây từ người đầu tiên): giây còn lại, tên người chưa trả lời, nút trả lời và nút \"Hủy\". Hiện cho mọi người ở trạm, kể cả đang ở xưởng hay sửa khoang. Hết giờ thì người chưa trả lời tự tính theo luật: ở lại trạm (ra chuyến), sẵn sàng ngủ, đồng ý (mở giao thương sớm hay nghỉ giao thương) | Vòng đồng hồ, chữ tên |\n| HTR-02 | Chuyến hôm nay | Trên phải | \"Chuyến n/2\" (K22). Sau chuyến hai hoặc khi đã mở giao thương thì hiện \"Hôm nay hết chuyến ra ngoài\" | Chữ |\n| HTR-03 | Điểm lưu | Dưới phải | Biểu tượng và chữ \"Đã lưu\" 2 giây tại ba điểm tự lưu của K23: sau mỗi chuyến khi mọi người đã về, sau giờ giao thương, lúc ngủ | Biểu tượng, chữ |\n| HTR-04 | Dấu cảnh chờ | Trên nhân vật hay khoang | Biểu tượng cạnh người vớt hay khoang có cảnh đang chờ phát. Hàng chờ cảnh và dấu là riêng từng người chơi. Cảnh chặn màn chỉ phát ở trạm khi giờ giao thương không chạy. Mốc xảy ra giữa ca chỉ có bong bóng trong ca, cảnh của mốc phát ở UI-44 bằng UI-53 | Biểu tượng, chữ |\n\nQuy tắc giờ giao thương:\n1. Không có chữ \"Thất bại\" hay \"Thua\" ở bất kỳ đâu trong giờ giao thương (K13: tàu rời chỉ mất món đó). Tàu hết kiên nhẫn hiện \"Tàu đã rời\", thương nhân lắc đầu, âm trung tính, thùng về kho. `MVP`\n2. Bong bóng gọi món (HCH-06) là bản nhìn trong cảnh. Danh mục còn (HCH-04) là bản nhìn khi người chơi chạy xa tàu. Hai bản dùng cùng một dữ liệu. `MVP`\n3. Giao sai cửa neo hiện lời từ chối ngắn của thương nhân (gd-story) và lý do ngắn \"Sai cửa neo, tàu gọi thùng khác\", thùng ở lại tay. `MVP`\n4. Trong giờ giao thương không có Oxy. HUD trạm ở UI-10 gồm Tally (HCH-09), mục tiêu Sổ tay (HUD-13), sơ đồ trạm (HCH-10), hàng đợi xưởng (HCH-07), lời nhắc thao tác và ba phần tử HTR-01 đến HTR-04. `MVP`\n5. Giờ giao thương dựng kho, ô quầy và 3 cửa neo trong cùng một màn 1280x720, không cuộn. Tàu chờ ngoài nằm ở dải trên. Số giờ giao thương trong mục này lấy từ `de-xuat-ca-cang-kieu-dave.md` mục 4 (ước, demo bot 2026-11-20), số thật do sim giờ giao thương của gd-tech. `MVP`\n6. Bấm chuột trái vào ô quầy, cửa neo hay điểm trên sàn thì nhân vật tự chạy tới, tới nơi tự làm việc ở đích (nhặt, giao hoặc bắt đầu bơm khí). Điểm đích hiện vòng sáng dưới sàn. Giữ A D giữa đường thì hủy đường tự chạy. `MVP`\n\n```\n1280x720 giờ giao thương (một màn, không cuộn)\n+----------------------------------------------------------------------+\n| HCH-01 Ca còn 2:41  HCH-02 Tally 412  Tip 86  HCH-03 Điểm cảng 12  Tàu 7/25 |\n|   tàu chờ ngoài (vòng chờ 14 s)  (vòng chờ 9 s)                      |\n|                                                                      |\n|  HCH-06 [Phế liệu]      [Đồ Trái Đất - Đặt trước]      [Cáp]  Bơm khí! |\n|         [thanh kiên nhẫn]   [thanh kiên nhẫn]         [thanh kiên nhẫn] |\n|        ==== tàu ====       ==== tàu ====            ==== tàu ====    |\n|                                                                      |\n|  Kho  [1][2][3] quầy cảng     Cửa neo 1     Cửa neo 2     Cửa neo 3  |\n|       HCH-11 E nhặt thùng                                            |\n| HCH-04 Danh mục còn: Phế liệu 6  Cáp 4  Quặng 0 Hết     HCH-05 Cầm: Cáp, cửa neo 3 |\n+----------------------------------------------------------------------+\n```","he-thong/ux-ui.md",""],["2.8 Wireframe các màn chính",3,275,9,4.41,"Wireframe trạm (UI-10) theo sơ đồ mặt cắt của `tram-va-cang.md` mục 2.6b. Khoang hỏng tối với khung đỏ, khoang hoạt động sáng.\n\n```\nTầng trên  | KH08 Dẫn đường | KH06 Liên lạc  | KH10 Nghiên cứu | KH11 Sinh quyển | KH12 Bến 2\nTầng giữa  | KH01 Ngủ đông  | KH05 Xưởng     | KH03 Kho        | KH07 Cảng: quầy cảng | Bến 1 (3 cửa neo)\nTầng dưới  | KH02 Cửa khí   | KH04 Neo       | KH13 Động cơ    | KH09 Bến Skiff  | KH12 Bến 3\nThang dọc: cột trái và cột giữa. Góc trên phải: Tally, HUD-13 mục tiêu. Dưới giữa: lời nhắc.\n```\n\nBảng tàu và danh mục bán (UI-14), bản vẽ mẫu. Số là chỗ đặt, mẫu của một ngày về sau (ca đầu cố định có danh mục trống và chưa có đơn đặt trước, luật FTUE 8):\n\n```\n+---------------------- BẢNG TÀU VÀ DANH MỤC BÁN ---------------------------+\n| Hôm nay: 25 tàu, mỗi tàu gọi 1 thùng. Bến có 3 cửa neo.                    |\n| Số tàu theo số người đang chơi                                             |\n|--------------------------------+------------------------------------------|\n| KHO                            | DANH MỤC BÁN  (4/4 loại)                 |\n| Thùng phế liệu  56 gọi 3  Có 10 [Đã chọn] | Thùng phế liệu     [-] 10 [+] [Bỏ]     |\n| Thùng cáp       52 gọi 2  Có 8  [Đã chọn] | Thùng cáp          [-]  8 [+] [Bỏ]     |\n| Thùng băng      56 gọi 2  Có 5  Danh mục đầy | Thùng đồ Trái Đất  [-]  5 [+] [Bỏ]     |\n| Thùng đồ Trái Đất 48 gọi 1 Có 5 [Đã chọn] | Thùng quặng        [-]  8 [+] [Bỏ]     |\n|--------------------------------+------------------------------------------|\n| ĐƠN ĐẶT TRƯỚC: Tikko đặt 1 Thùng đồ Trái Đất, giá x1,5. Đã có trong danh mục. |\n| Tổng 31 thùng cho 25 tàu. Giá trị danh mục 1632 Tally.                     |\n| Không có hàng sống: tàu Glasswing không tới.                               |\n| Thông dịch viên đóng thùng khi mở giao thương.                                      |\n|          [Ghim hàng]  [Quay lại]  [Nghỉ giao thương]  [Mở giao thương]                         |\n|          Mở giao thương là hết ra ngoài hôm nay                                     |\n+----------------------------------------------------------------------------+\n```\n\nSố thùng đổi bằng nút - và +, mũi tên trái phải hoặc D-pad trái phải. Thêm loại: chuột trái, Enter, Space hoặc A. Bỏ loại khỏi danh mục: R hoặc X (hành động phụ của menu). Thiếu hàng thì dòng tổng đổi thành \"Thiếu hàng: tối đa {n} tàu không tới\".\n\nKết ca (UI-43), bản vẽ mẫu:\n\n```\n+------------------------------ KẾT CA ------------------------------+\n| Hết giờ giao thương.                                                        |\n| Tàu phục vụ xong 24/25        Tàu rời khi chưa giao 1              |\n| Tàu không tới vì hết hàng 0                                        |\n| Tally từ giá hàng 1327   Tip, kể cả bơm khí 442   Tổng Tally 1769  |\n| Điểm cảng 41             Đơn đặt trước: Đã giao                    |\n| Hàng về kho: Quặng 8, Băng 5      Tikko: (lời thương nhân)         |\n|                                              [Tiếp tục]            |\n+--------------------------------------------------------------------+\n```\n\nSố giá trong hai bản vẽ trên là chỗ đặt, giá thật do gd-economy.\n\nNgạt và chọn món ghim (UI-34), mở ở chế độ chồng lên HUD, không dừng thời gian:\n\n```\n+----------------------------------------------------------------------+\n|                         NGẠT   (vòng 12 s, còn 9)                    |\n|        Chờ cứu hoặc bay tới cửa khí. Giữ lại: (pin) Mảnh lõi        |\n|----------------------------------------------------------------------|\n|  [x] Mảnh lõi (hiếm)    1   <- GHIM, giữ khi bị kéo về               |\n|  [ ] Phế liệu           8   mất nếu bị kéo về                        |\n|  [ ] Băng               3   mất nếu bị kéo về                        |\n|  Tổng mất nếu hết giờ: 11 món      Oxy: 0   cần 30 để thoát ngạt    |\n+----------------------------------------------------------------------+\n```\n\nKết chuyến (UI-36) và Bị kéo về (UI-35) cùng khuôn: hai cột Giữ và Mất, danh sách vật, thời gian chuyến, Oxy còn. UI-36 chỉ có cột Giữ (cả túi), có dòng \"Đã vào kho\".","he-thong/ux-ui.md",""],["2.9 Input",3,275,9,6.82,"Bàn phím theo vị trí phím vật lý (AZERTY dùng ZQSD cùng vị trí, không phải chữ). Bảng dưới là nguồn chung với `nguoi-choi.md` 2.7, thêm hành động của trạm, menu và các hành động còn thiếu (đánh dấu \"mới\").\n\nNgoài không gian:\n\n| Hành động | Bàn phím và chuột | Gamepad Xbox | Ghi chú |\n|---|---|---|---|\n| Bay | W A S D | Cần trái | 8 hướng, chéo chuẩn hóa |\n| Ngắm và quay mặt | Chuột | Cần phải | Hỗ trợ ngắm gamepad bật tắt được |\n| Dùng dụng cụ | Chuột trái | RT | Giữ để khai thác |\n| Đổi dụng cụ | 1 đến 4, cuộn chuột | D-pad trái phải | |\n| Lướt | Shift trái | RB | |\n| Hãm | Space | LT | |\n| Tương tác, Kéo, Trao đồ, Mở lối, Bắt tay cỡ S | E | A | Ưu tiên ở 2.5 `nguoi-choi.md` |\n| Kết nhanh | Q giữ 0,6 giây | B giữ 0,6 giây | Dùng được trên mọi cỡ đang Bất lực. E chỉ còn Tương tác (bắt tay cỡ S, gắn Phao kéo, cạy, sinh thiết, Xua đi boss). Giữ cả hai phím thì thao tác bấm trước thắng. Khớp `nguoi-choi.md` 2.7 |\n| Kích Recall | F giữ | Y giữ | |\n| Chia Oxy | V giữ | X giữ | |\n| Dùng vật tiêu hao | G | D-pad xuống | Hồi Oxy có trần 25% mỗi chuyến, không dùng khi ngạt (K26). Khớp `nguoi-choi.md` 2.7 |\n| Mở túi | Tab | Back | Không dừng thời gian |\n| Ghim món (trong túi) | R | Bấm cần phải (R3) | Chỉ khi túi đang mở. R3 không đụng Y (Kích Recall) và X (Chia Oxy), khớp `nguoi-choi.md` 2.7 |\n| Bản đồ chuyến | M | LB | Không dừng thời gian. Khớp `nguoi-choi.md` 2.7 |\n| Ping | T mở bánh | D-pad lên | Chọn bằng chuột hay cần phải |\n| Menu | Esc | Start | Cố định, không gán lại. Esc đóng màn con trước, Start luôn mở menu (luật 21) |\n\nTrong trạm:\n\n| Hành động | Bàn phím | Gamepad Xbox | Ghi chú |\n|---|---|---|---|\n| Đi trái phải | A D | Cần trái | |\n| Leo thang | W S | Cần trái lên xuống | Không nhảy |\n| Tương tác, sửa, nhặt và giao thùng, bơm khí | E hoặc Space (giữ khi sửa và bơm khí, bấm khi nhặt và giao) | A | Space là phím thứ hai, chỉ trong trạm |\n| Xem kho nhanh (mới) | Tab | Back | Chỉ xem |\n| Sổ tay (mới) | J | Y | |\n| Ping | T | D-pad lên | |\n| Menu | Esc | Start | |\n\nTrong giờ giao thương (dùng bảng Trong trạm, thêm các hàng dưới đây, không đổi nghĩa hàng nào):\n\n| Hành động | Bàn phím chuột | Gamepad Xbox | Ghi chú |\n|---|---|---|---|\n| Chạy | A D hoặc mũi tên trái phải | Cần trái | Một trục, không nhảy |\n| Nhặt thùng, giao thùng | E hoặc Space (bấm) | A | Đứng trong tầm ô quầy hay cửa neo. Mỗi lần 1 thùng |\n| Bơm khí | E hoặc Space (giữ 1 giây) | A giữ | Tay trống, có vòng HUD-14, thả phím là hủy |\n| Chạy tới đích | Chuột trái vào ô quầy, cửa neo hay điểm sàn | RB tới cửa neo kế, LB tới ô quầy có thùng | Gamepad là đề xuất. Tới nơi tự làm việc ở đích, giữ A D giữa đường thì hủy |\n| Menu | Esc | Start | Một mình là tạm dừng, từ 2 người không dừng (luật 8 mục 2.1) |\n\nMenu:\n\n| Hành động | Bàn phím chuột | Gamepad |\n|---|---|---|\n| Chọn, di chuyển | Chuột hay mũi tên, W A S D | D-pad, cần trái |\n| Xác nhận | Chuột trái, Enter, Space | A |\n| Quay lại | Esc | B |\n| Đổi thẻ | Q E | LB RB |\n| Hành động phụ (hoán đổi, lọc, bỏ khỏi danh mục) | R | X |\n\nLuật:\n1. Mỗi hành động có tối đa 2 phím bàn phím chuột và 1 nút gamepad. Đổi phím ở UI-52. Phím trùng thì báo và cho Hoán đổi. Esc và Start luôn mở menu, không gán lại để người chơi không tự khóa. Cài đặt lưu theo hồ sơ máy, khôi phục mặc định theo từng hành động hay cả nhóm. `MVP`\n2. Glyph tự đổi theo thiết bị cuối cùng dùng: bàn phím, Xbox, PlayStation. Steam Deck dùng glyph của Steam Input. Con trỏ chuột ẩn khi dùng gamepad. `MVP`\n3. Mọi thao tác giữ hiện vòng HUD-14. Tùy chọn \"chuyển Giữ thành Bật\" cho Kích Recall, Kéo, Chia Oxy, Khai thác: bấm một lần để bắt đầu, bấm lần nữa hay bị đòn thì hủy. `Sau MVP`\n4. Hỗ trợ ngắm gamepad, độ nhạy ngắm, rung tay cầm, rung màn hình đều tắt hay chỉnh được ở UI-51. `MVP`\n5. Phím không đổi nghĩa theo chế độ ngoài hai ngữ cảnh ngoài không gian và trong trạm (khớp `nguoi-choi.md` 2.7). `MVP`\n6. Bảng phím ngoài không gian đã đối chiếu từng hàng với `nguoi-choi.md` 2.7 (Bay, Ngắm, Dụng cụ, Lướt, Hãm, Tương tác, Recall, Chia Oxy, Ghim món R3, Dùng vật tiêu hao G, Kết nhanh Q và B, Bản đồ M và LB, Túi, Ping, Menu): khớp hết. Bản chính của phần ngoài không gian là `nguoi-choi.md`, bản đầy đủ của trạm và menu là mục này (`nguoi-choi.md` đã trỏ sang đây). Còn lệch một câu: `nguoi-choi.md` ghi \"Mọi phím gán lại được\", UX ghi Esc và Start cố định, đề nghị gd-character sửa thành \"trừ Esc và Start\". `MVP`","he-thong/ux-ui.md",""],["2.10 FTUE chương 1",3,275,9,11.5,"Thứ tự theo core loop và theo các mốc chương 1 của `cot-truyen.md` (C1.1 tỉnh dậy, C1.2 neo trạm, C1.3 Station Cinder, C1.4 Ingrid về, C1.5 xưởng, C1.6 Linh về, C1.7 khoang liên lạc và cảng, C1.8 tàu đầu tiên, C1.9 đóng chương). Các bước kích bằng sự kiện, không bằng đồng hồ, nên người chơi đi lệch thứ tự vẫn nhận đúng gợi ý ở đúng lúc.\n\nLuật FTUE:\n1. Gợi ý là một dòng chữ không quá 40 ký tự đặt cạnh thứ cần làm, không chặn thao tác (luật 9 mục 2.1). Mỗi bước dạy đúng một ý. `MVP`\n2. Gợi ý tắt sau hành động đầu có ý nghĩa ở cột Tắt khi. Bước chỉ để thông tin tắt sau 8 giây hay khi người chơi làm việc tiếp. Mỗi bước hiện một lần cho mỗi người chơi, xem lại ở Sổ tay mục Cách chơi. `MVP`\n3. Cảnh báo (nguy hiểm sắp tới) có dáng khác lời giới thiệu: nền cảnh báo, biểu tượng, động từ ngắn, ví dụ \"Sáng đỏ là sắp đánh\". `MVP`\n4. Mọi tình huống dạy đặt ở dải Gần, ô Bến ngoài hoặc mảnh Mở đầu tiên, nơi `map.md` luật 2.3.8 cấm hazard ở Bến ngoài. Bước dạy kỹ năng chiến đấu chỉ đặt khi có đúng một con Driftlife thường trong vùng. `MVP`\n5. Người chơi tắt gợi ý trong Cài đặt thì mọi gợi ý ẩn, Sổ tay mục Cách chơi vẫn đọc được. `MVP`\n6. Không có bước dạy cho thứ ngoài chương 1. Thứ Sau MVP chỉ có danh mục cuối mục này. `MVP`\n7. Cột Setup là cảnh dựng của thế giới, chỉ áp khi thế giới đang ở mốc chương ghi ở cột Trigger. Gợi ý là của từng người chơi. Hai người cùng tỉnh dậy thấy cùng một cảnh dựng (một con Driftlife ở T13), mỗi người nhận gợi ý của mình. Với người vào sau hay thế giới đã qua mốc, Setup bỏ qua, bước vẫn kích theo Trigger khi người đó lần đầu gặp tình huống. `MVP`\n8. Giờ giao thương đầu tiên của thế giới là ca cố định để dạy T21 đến T26 (khớp `tram-va-cang.md` luật 67): danh mục chọn sẵn thùng phế liệu, người chơi chỉ bấm Mở giao thương, lịch 2 tàu kiên nhẫn Dài, không đơn đặt trước. Tàu 1 không bật bơm khí. Tàu 2 cập khi tay trống sau lần giao đầu và bật yêu cầu bơm khí ngay. Kho chỉ đủ 1 thùng thì chỉ có tàu 1, T25 lùi sang ca sau. Lần đầu người chơi tự chọn hàng là ca có đơn đặt trước (T37). UX chỉ đòi mỗi bước có đúng một lần dạy được. `MVP`\n\nMỗi bước có Design Intent (ý đồ), Trigger (kích khi), Setup (cảnh dựng), Interaction (người chơi làm), Tắt khi và Luật nguồn. Chuỗi gợi ý ở bảng strings, khóa `tut.tNN`.\n\n| ID | Design Intent | Trigger | Setup | Interaction | Tắt khi | Luật nguồn |\n|---|---|---|---|---|---|---|\n| T01 | Biết mình điều khiển được và trạm đang hỏng | Sau cảnh tỉnh dậy C1.1, hoặc sau cảnh đến UI-05 với người vào sau | Trạm tối, chỉ KH01, KH02, KH03 dùng được, điểm sáng ở khoang kho | Đi A D, leo thang W S tới điểm sáng | Tới điểm sáng | `nguoi-choi.md` 2.8 |\n| T02 | Luôn biết việc kế tiếp | Đã tới điểm sáng ở T01 | HUD-13 hiện mục tiêu \"Sửa Khoang neo\" | Mở Sổ tay một lần (tùy chọn) | Sau 8 giây | `cot-truyen.md` luật 10 |\n| T03 | Ra ngoài là quyết định có xác nhận | Đứng trong 1,0 u của cửa khí | Hai dụng cụ khởi điểm đã trong đai | E ở cửa khí, chọn dụng cụ, xác nhận | Xác nhận xong | K4, C5 |\n| T04 | Bay trực tiếp, buông thì trượt nửa giây | Ra khỏi cửa khí lần đầu | Ô Bến ngoài, vòng sáng cách 12 u, không hazard | WASD bay tới vòng | Tới vòng | `nguoi-choi.md` 2.1.1 và 2.1.3 |\n| T05 | Hãm là cách dừng chính xác | Tốc độ trên 5 u/s khi cách vòng dưới 2 u, hoặc trôi quá vòng | Vòng thứ hai nhỏ hơn | Giữ Space dừng trong vòng | Dừng trong vòng | `nguoi-choi.md` 2.1.4 |\n| T06 | Oxy là thời gian và là máu | 15 giây sau khi ra ngoài | Thanh HUD-01 và vạch HUD-02 sáng viền | Chỉ nhìn, chưa cần bấm | Sau 8 giây hay khi nhặt vật đầu iftlife.md` 7b) và tắt được trong UI-51.","he-thong/ux-ui.md",""],["2.12 Bảng đối chiếu luật với màn",3,275,9,8.91,"Mỗi luật khung mà người chơi cần thấy phải có tín hiệu. Cột Tín hiệu trỏ tới màn hay phần tử. \"Không cần\" ghi lý do.\n\n| Luật | Điều người chơi cần thấy | Tín hiệu | Nhãn |\n|---|---|---|---|\n| K1 | Oxy là thời gian và máu, hết thì sao | HUD-01, HUD-02, UI-34 | MVP |\n| K2 | Bị kéo về chỉ giữ 1 món, không mất Tally | HUD-04, UI-31 ghim, UI-34, UI-35 hai cột Giữ và Mất | MVP |\n| K3 | Túi giới hạn, đồ chỉ thành của trạm khi về | HUD-03, UI-31, UI-36 dòng \"Đã vào kho\" | MVP |\n| K4 | Có đường về: cửa khí và Beacon | HUD-06, HUD-14, UI-33, T15 | MVP |\n| K5 | Dải Gần, Giữa, Xa | HUD-11 tên dải, UI-33 | MVP (Gần) |\n| K6 | Dải chưa mở bị chặn bằng vật cản (MVP). Thiếu cấp vỏ thì Oxy hao nhanh (Sau MVP) | HUD-10 chữ \"Chưa có đường qua\", HUD-11, HUD-01 hệ số, UI-16 | MVP (vật cản), Sau MVP (thiếu cấp vỏ) |\n| K7 | Map nhánh có lối vào riêng, có thể cần chìa | UI-33 biểu tượng lối vào, HUD-10 chữ \"Cần {tool} để mở\", cảnh chuyển, Sổ tay | MVP |\n| K8 | Sinh lại mỗi chuyến, không cạn | Không cần tín hiệu riêng, điểm khai thác mới hiện ở chuyến sau | MVP |\n| K9 | Sống có giá trị hơn hạ | Sao chất lượng và giá ở UI-12, T19 | MVP |\n| K10 | Động cơ chính là mục tiêu dài | UI-18, HUD-13, Sổ tay | MVP giai đoạn 1 |\n| K11 | Khoang sửa xong đổi hình | UI-10, UI-17 | MVP |\n| K12 | Mỗi người vớt mở một tính năng | UI-10 tên người ở khoang, UI-19 | MVP |\n| K13 | Giờ giao thương: lập danh mục bán, giao thùng đúng cửa neo trước khi tàu hết kiên nhẫn | UI-14, UI-40, UI-41, UI-42, T21 đến T26, T37 | MVP |\n| K14 | Sự cố trạm trong ca | HCH-08 | Sau MVP |\n| K15 | Hạng cảng tăng theo ca | UI-43, UI-45, HCH-09 (Tally và Hạng cảng) | MVP tới hạng 3 |\n| K16 | Nuôi là lựa chọn lợi | UI-22 | Sau MVP |\n| K17 | Không có hệ đói hay phí duy trì | Không cần: không có chỉ số nào để hiện | MVP |\n| K18 | Tally là đồng tiền duy nhất | HCH-09, UI-15, UI-16 | MVP |\n| K19 |
