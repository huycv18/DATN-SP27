mũ, găng dày, bộ đồ cam xám than, đai dụng cụ chéo ngực | MVP |\n| PC-2 | Slot 2 △, lam ngọc `#1FB5D6` | Jonas Weber | Kíp vận hành trạm | 1,1 u | Mũ vuông bo góc, một bình Oxy dài dọc lưng kiểu thùng, dáng cao chữ nhật | Gọng kính trong mũ, bộ đồ lam xám, dây đai vai dày | MVP |\n| PC-3 | Slot 3 □, vàng chanh `#D8E21F` | Mei Tanaka | Kíp vận hành trạm | 0,9 u | Mũ trứng có chóp sáng, balo tròn nhỏ, dáng nhỏ gọn đầu tương đối lớn | Tóc ngắn bồng thấy qua tấm kính mũ, bộ đồ vàng chanh đen, găng ngón mảnh | Sau MVP |\n| PC-4 | Slot 4 ◇, hồng tím `#D6309B` | Tariq Bello | Kíp vận hành trạm | 1,2 u | Vai rất rộng, mũ tròn đáy phẳng, bình Oxy nghiêng trên vai, túi hông to | Râu ngắn trong mũ, bộ đồ hồng tím và xám, hộp y tế đeo hông | Sau MVP |\n\nTrong trạm: nhân vật không mặc bộ đồ ngoài, mặc đồ trạm màu xám than với một mảng màu slot ở vai và ống tay để vẫn nhận ra slot. Mặt thấy rõ nên cần biểu cảm đầy đủ.\n\nBiểu cảm cần có (8, mặt thấy trong trạm và qua tấm kính mũ ngoài không gian): bình thường, vui, lo, đau (trúng đòn), sợ và ngạt, mệt, quyết tâm, ngạc nhiên. Cảm xúc phụ cho emote: vẫy, ngón cái (hai emote MVP).\n\nYêu cầu art: rig chung, 4 skin. Mỗi người có hai bộ màu (bộ đồ ngoài và đồ trạm), mỗi bộ tối đa 6 màu chính cộng 2 nhấn. Biến thể bộ đồ: bình Oxy 5 bậc, vỏ 4 cấp, bộ đẩy 4 bậc, túi 5 bậc, đai dụng cụ 3 bậc, xem bảng 7.","he-thong/ho-so-nhan-vat.md",""],["2b.2 Người vớt (RS-1 đến RS-5), mở tính năng trạm (K12)",3,69,2,5.86,"Người vớt là NPC. Ingrid, Linh, Rafa được kéo từ buồng ngủ đông của xác trạm nên mặc đồ Seed Station (xám nhạt, mòn, mang số hiệu buồng). Amara và Yusuf đang thức ở Lantern và Veyl Waypost, mặc đồ nghề của họ (blouse, áo phản quang). Mỗi người một nhấn trầm. Tính cách, quest: `cot-truyen.md`.\n\n| Mã | Tên | Vai | Chiều cao | Silhouette (khi tô đen) | Ngoại hình | Màu nhận diện | Biểu cảm cần có | Nhãn |\n|---|---|---|---|---|---|---|---|---|\n| RS-1 | Ingrid Halvorsen | Kỹ sư, mở xưởng | 0,95 u | Thấp và rộng vai, tóc búi cao, đai công cụ lớn và kính bảo hộ đẩy lên trán | Tay áo xắn tới khuỷu, găng da, tạp dề thợ, vết dầu | Xanh cobalt trầm `#6A8DB8` | Bình thường, bực, tập trung, vui khi sửa được, mệt | MVP |\n| RS-2 | Linh Tran | Thông dịch viên, mở khoang liên lạc | 1,05 u | Gầy cao, tai nghe vành lớn, áo khoác dài chạm gối, máy bảng cầm tay | Tóc bob, áo khoác dài xám nhạt, dây tai nghe vắt cổ | Tím chàm trầm `#8A7FC9` | Bình thường, lịch sự, bối rối trước thương nhân, lo, cười ngượng | MVP |\n| RS-3 | Rafael Ortega (Rafa) | Hoa tiêu, mở khoang dẫn đường | 1,1 u | Dáng thẳng, mũ lưỡi trai hoa tiêu, khăn quàng dài buông sau lưng | Ria nhẹ, áo hoa tiêu có dây vai, bản đồ cuộn đeo lưng | Đỏ gạch trầm `#B8665C` | Bình thường, mơ màng nhìn bản đồ, tự tin, hoảng, hài hước | Sau MVP |\n| RS-4 | Amara Okafor | Nhà sinh học, mở nghiên cứu và nuôi | 1,0 u | Áo blouse dài, tóc xù lớn có kẹp, hộp mẫu đeo ngực | Blouse ngả vàng, găng cao su, kính lúp gập trên cổ, sổ ghi mẫu kẹp tay | Lục thẫm trầm `#6FA88A` | Bình thường, tò mò sáng mắt, buồn (cú lật Driftlife), giận, dịu dàng khi nuôi | Sau MVP |\n| RS-5 | Yusuf Demir | Trưởng cảng, thêm bến và tiện ích cảng | 1,15 u | Vai to, mũ cứng có đèn, áo phản quang, bộ đàm trước ngực | Râu rậm, cốc trà hay cầm tay, găng, áo phản quang bạc màu | Olive trầm `#9AA06A` | Bình thường, cau có, quát điều phối, hài lòng khi tàu đi đúng giờ, lo | Sau MVP |\n\nTính cách trích từ `cot-truyen.md` để art đặt dáng và biểu cảm:\n\n| Tên | Nghề, quốc gia | Tính cách | Gợi ý cho dáng và mặt |\n|---|---|---|---|\n| Ingrid | Kỹ sư, Na Uy, làm giàn khoan biển | Thẳng, khô, làm trước nói sau, đùa không đổi nét mặt | Mặt ít biểu cảm, vai và tay to, đùa chỉ ở mắt |\n| Linh | Thông dịch viên, Việt Nam | Nhanh miệng, khéo, giữ thể diện cho cả hai bên, dịch quá trung thực | Nghiêng đầu, tay hay chen vào, cười lịch sự |\n| Rafa | Hoa tiêu, Chile | Mơ mộng, mê tín với sao, sợ chịu trách nhiệm cho đường đi | Mắt hay nhìn lên, nói vòng, hay chạm bùa trên cổ |\n| Amara | Nhà sinh học, Nigeria | Tỉ mỉ, ấm, nói chuyện với mẫu vật | Cúi sát mẫu, tay nhẹ, nghiêm hẳn khi nói tuyệt chủng |\n| Yusuf | Trưởng cảng, Thổ Nhĩ Kỳ | Ồn ào, hiếu khách, mặc cả là niềm vui, quát và pha trà | Dáng to, tay vung, hay cầm cốc trà |\n\nYêu cầu art người vớt: dùng cùng rig xương người chơi, hoán đổi bộ phận, bảng 6 màu chính cộng 1 nhấn trầm. Clip riêng: Ingrid (đập búa, đo), Linh (bấm bảng, đứng nghe), Rafa (trải bản đồ), Amara (soi mẫu), Yusuf (vẫy tay điều phối). Clip \"thức dậy từ buồng ngủ đông\" dùng chung cho Ingrid, Linh, Rafa (khác mặt). Amara và Yusuf dùng clip \"bước xuống từ xuồng hoặc Skiff\" (Sau MVP).\n\nChương xuất hiện và chức năng K12 đầy đủ:\n\n| Tên | Chương | Khoang, chức năng K12 |\n|---|---|---|\n| Ingrid | 1 | Xưởng: chế và nâng cấp trang bị |\n| Linh | 1 | Khoang liên lạc: gọi tàu, mở giờ giao thương, shop |\n| Rafa | 2 | Khoang dẫn đường: mở dải, Skiff |\n| Amara | 2 | Nghiên cứu và nuôi Driftlife |\n| Yusuf | 3 | Thêm bến và tiện ích cảng |","he-thong/ho-so-nhan-vat.md",""],["2b.3 Thương nhân The Veyl (TR-1 đến TR-5)",3,69,2,11.06,"Mỗi chủng một rig và hình khối riêng, để người chơi đọc chủng tộc từ xa rồi mới đến tên. Tính cách theo `cot-truyen.md`. Tàu: Tikko TA01, Ilsume TA04, Vaeth TA05, Dromm TA06, Nhem TA10, Maro TA08 (Bram TA03).\n\n| Mã | Tên | Chủng | Chiều cao, tỉ lệ | Silhouette | Ngoại hình | Màu nhận diện | Tính cách (gd-story) | Biểu cảm cần có | Nhãn |\n|---|---|---|---|---|---|---|---|---|---|\n| TR-1 | Tikko | Oru | 0,7 u, tròn | Thân tròn nhỏ, bốn tay mảnh, đội thùng tôn làm mũ | Da nâu tro, bộ đồ vá chằng, túi đựng phế liệu đeo đầy | Hổ phách nhạt `#C2A77E` | Kẻ mê đồ Trái Đất, trả giá cao cho thứ con người coi là rác, hiểu sai công dụng | Tò mò, mê mẩn, bối rối, mặc cả, vui | MVP |\n| TR-2 | Ilsume (tên giả của Sevra Ilvane, trạng thái 1: thương nhân che mạng) | Sennari | 1,6 u, thon | Áo choàng dài nhiều lớp nghi lễ, mũ nhọn cao, mạng che kín mặt | Da trắng ngọc, tay dài, vòng cổ nghi thức, giọng bà lão trang trọng (giả). Dưới áo là dáng người trẻ | Hồng rượu trầm `#A5667A` | Trọng nghi thức, mỗi giao dịch có chuỗi lễ dài (vỏ bọc). Sợ bị nhận ra, đúng mực, lo giấu sau lễ nghi | Trang nghiêm, sốt ruột bị che giấu, hài lòng, bối rối khi lễ bị phá, giật mình khi nghe tên Daskel | Sau MVP |\n| TR-3 | Dromm | Brakk | 1,8 u cao, 1,6 u rộng, thân khối | Khối vuông lớn, giáp đá, đầu nhỏ chìm giữa vai | Một mắt lớn, da xám đá có vân kim loại | Xám đá `#6E6A66` nhấn đồng `#B87333` | Ít lời, không bao giờ nói thẳng giá, mặc cả bằng ánh nhìn | Im lặng, nhìn xuống, nhướng mắt, gật rất nhỏ | Sau MVP |\n| TR-4 | Vaeth | Aelith | 1,3 u, uyển chuyển | Tua mềm như sứa quanh thân, bể thủy tinh nhỏ đeo vai | Da trong mờ, tua phát sáng, bể chứa một sinh vật nhỏ sống | Oải hương `#CBA6E4` | Nhà sưu tầm sinh vật sống, quan tâm Driftlife còn sống hơn Tally | Mê say, thương cảm, giận khi thấy Driftlife bị hạ | Sau MVP |\n| TR-5 | Nhem | Kesh | 1,0 u, lơ lửng | Thân dẹt trôi, nhiều mắt nhỏ, bó dây cáp mạng buông dưới | Da xám đen, mắt trắng nhỏ như điểm sáng, dây cáp có đèn | Xám đen nhấn đỏ tươi nhỏ `#D8382C` | Dân buôn tin, giữ The Lattice, câu ngắn hai vế, áy náy về thông tin giả | Nhìn nghiêng, im lặng, sợ, dè dặt, thú nhận | Sau MVP |\n\nSevra (NP-5, trạng thái 2, xem mục 2b.5) lộ ra ở cuối chương 3 (C3.8). Từ đó Ilsume không còn che mạng trong trạm.\n\nGhé cảng từ: Tikko chương 1 (và TA02 là dân Oru vãng lai không tên, dùng rig Oru, biến thể màu), Ilsume chương 2, Vaeth chương 2, Dromm chương 3, Nhem chương 3, Maro chương 3 (hai lần cập bến khi còn cải trang, lộ mặt khi chỉ huy toán bắt cóc Sevra ở N4, mốc C3.8).\n\nYêu cầu art thương nhân: tàu của mỗi chủng cần màu và hình khối ăn khớp với chủng (yêu cầu tab Assets cho tàu do gd-quan lấy từ hồ sơ này và danh sách tàu). Mỗi chủng cần 6 clip: Idle, Nói, Mặc cả (gật hoặc lắc), Vui, Bối rối, Rời đi.","he-thong/ho-so-nhan-vat.md",""],["2b.4 The Wardens: chế độ của Daskel (WD-P1, WD-P2, lính)",3,69,2,7.0,"Đơn vị chiến đấu (WD-01 đến WD-04) do gd-combat giữ, là lính Sennari mặc giáp của chế độ (không thêm chủng tộc, dùng rig Sennari, mặt che bằng mũ giáp). The Wardens là chế độ và quân của Daskel. File này giữ Daskel và Maro. Ngôn ngữ hình: sạch, nhẵn, đối xứng, kỷ luật, đối lập với thương nhân lấm lem và với mạng lưới cách mạng của Sevra (đồ chắp vá). Màu chung của chế độ: trắng xương `#EDEBE0` và lục acid `#7CFC3A` (đường sáng).\n\n| Mã | Tên | Vai | Chiều cao | Silhouette | Ngoại hình | Màu nhận diện | Biểu cảm cần có | Nhãn |\n|---|---|---|---|---|---|---|---|---|\n| WD-P1 | Daskel, danh xưng tự phong First Warden | Độc tài cầm quyền Sennar, đứng đầu The Wardens, boss BS-5 (chương 3 đến 5, qua lời Maro và tín hiệu, tới Warden Rig ở chương 5). Ghét loài người vì cha là sĩ quan chết trong cuộc chiến vũ trụ đầu tiên giữa các hành tinh (tên cuộc chiến ở `cot-truyen.md` mục Tên mới), cái nhìn phiến diện của hắn | 2,0 u (cao hơn Ilsume nhờ giáp và bục), rất gầy | Cao, tay dài quá gối, vòng sáng tròn sau gáy (halo), mặt nạ nhẵn, vai giáp nhọn đối xứng | Áo giáp choàng trắng xương không một vết bẩn, đường lục acid chạy dọc áo, huy hiệu chế độ trên ngực, không thấy mắt. Sạch vì hắn tin mình đang dọn dẹp | Trắng xương và lục acid | Bình thản, khinh miệt nhẹ, cuồng tín (mặt nạ nứt khi mất bình tĩnh), thương hại giả, giận lạnh khi nhắc tên Sevra hay cha mình | Sau MVP |\n| WD-P2 | Maro | Gián điệp của Daskel săn Sevra, chỉ huy toán bắt cóc. Người Sennari, giả thương nhân của một thương hội Sennari không có thật (tàu TA08), hai lần cập bến khi còn cải trang, lộ mặt ở N4 khi chỉ huy toán bắt cóc (C3.8) | 1,7 u khi cải trang (khom người), 2,0 u sau khi lộ | Cải trang: dáng thương nhân Sennari, áo choàng nghi lễ rút gọn, che đầu bằng khăn, sạch hơn hẳn thương nhân thật. Lộ mặt: dáng cao gầy cùng kiểu Daskel, ít chi tiết hơn, giáp chế độ | Khi cải trang: áo xám không vết, đường lục acid mờ 10 phần trăm ở gáy, chi tiết thưởng cho người tinh ý, không ai cần nó để hiểu truyện (P4). Lộ mặt: đường lục 100 phần trăm, bỏ khăn, huy hiệu The Wardens | Xám nhạt `#A3A8A0`, lục acid mờ khi cải trang, lục acid sáng khi lộ | Vồn vã, hào phóng, hỏi quá nhiều, khi lộ mặt thì phẳng lặng, soi mói | Sau MVP |\n\nLính The Wardens: một bộ giáp trắng xương đường lục acid dùng chung rig Sennari, mũ giáp che mặt, 3 biến thể theo loại đơn vị (gd-combat cấp danh sách). Yêu cầu art: Maro cần hai biến thể (cải trang và lộ mặt) dùng chung rig Sennari, đổi lớp phủ. Tàu của Maro cần sạch bất thường trong cảng (gd-quan lấy làm manh mối). Daskel là boss BS-5 nên ngoài 6 clip hội thoại (Idle, Nói, Chỉ tay, Giận, Rút, Rời) cần danh sách clip chiến đấu và cỡ boss do gd-combat cấp (`combat-driftlife.md`), Sau MVP.","he-thong/ho-so-nhan-vat.md",""],["2b.5 Người phụ (NP-1 đến NP-4) và Sevra (NP-5),",3,69,2,4.2,"| Mã | Tên | Vai | Chiều cao | Silhouette | Màu nhận diện | Biểu cảm tối thiểu | Nhãn |\n|---|---|---|---|---|---|---|---|\n| NP-1 | Odile Laurent | Trưởng trạm Lantern, chương 2 | 1,0 u | Gọn, tóc bạc, áo khoác Lantern dài, gậy đèn | Lục đèn pin trầm `#7FAE7A` | Bình thường, nghiêm, mệt, quát | Sau MVP |\n| NP-2 | Bram Kowalski | Trưởng xuồng tiếp tế Lantern, tàu TA03, chương 1 qua sóng, chương 2 hiện hình | 1,2 u | Vóc to, râu, mũ nồi, thùng hàng sau lưng | Nâu sẫm `#6B5640` | Bình thường, than thở, vui, xin thêm | MVP (chỉ giọng), Sau MVP (hiện hình) |\n| NP-3 | Elias Vance | Thủ lĩnh The Remainers, chương 3 | 1,15 u | Cao gầy, áo bạc màu, băng tay cũ | Xám bạc `#8C95A0` | Bình thường, khắc nghiệt, sợ giấu | Sau MVP |\n| NP-4 | Wren | Đứa trẻ sinh trên The Raft, chương 3 và kết | 0,6 u | Rất nhỏ, đầu tròn, áo thùng thình vá | Xanh lá nhạt `#E4F0D0` | Bình thường, tò mò, ngạc nhiên, vui | Sau MVP |\n| NP-5 | Sevra Ilvane (trạng thái 2 của TR-2 Ilsume) | Người thừa kế hợp pháp của Ilvane (Steward of Sennar, cha của Sevra, bị Daskel lật đổ, chết trong giam cầm). Giả làm Ilsume để trốn Daskel. Người chơi cứu ở cuối chương 3 (C3.8), hộ tống ở chương 5, nhận tọa độ thật | 1,6 u | Bỏ mạng và mũ nhọn, thân thon cùng rig Sennari với Ilsume, khuôn mặt trẻ, tóc buộc gọn, dáng thẳng hơn dáng bà lão giả | Hồng rượu trầm `#A5667A` (cùng Ilsume), thêm nhấn nhỏ là huy hiệu nhà Ilvane ở cổ áo, không dùng trắng xương và lục acid | Bình thường, kiệt sức, sợ, quyết tâm, đau buồn khi nhắc cha, nhẹ nhõm khi được nhận ra | Sau MVP |","he-thong/ho-so-nhan-vat.md",""],["3. Tham số",2,65,2,1.27,"| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nhóm tác động | Nguồn |\n|---|---|---|---|---|---|---|\n| Điểm ảnh mỗi u (1080p) | 108 | 72 (720p) đến 130 | Chi tiết rõ | Silhouette khó đọc | Art | ước (1920 chia 17,8 u, 720p là 72 điểm ảnh một u) |\n| Chiều cao nhân loại | 0,9 đến 1,2 u | 0,8 đến 1,3 | Nhân vật lớn | Nhỏ | Silhouette | ước |\n| Màu chính mỗi nhân vật | 6 | 4 đến 8 | Mịn hơn | Dễ đọc hơn | Art | ước |\n| Màu nhấn nhỏ mỗi nhân vật | 2 | 1 đến 3 | Chi tiết | Gọn | Art | ước |\n| Bão hòa nhấn người chơi (S của HSV) | từ 70% (đo 78 đến 88%) | 65% đến 90% | Nổi bật | Mờ | Nhận diện co-op | ước, đo bằng script |\n| Bão hòa nhấn NPC (S của HSV) | tới 45% (đo 5 đến 42%) | 30% đến 55% | Dễ nhầm với người chơi | Hơi nhạt | Nhận diện | ước |\n| Chênh scale rig giữa preset | tối đa 20% quanh 1,0 u | 10% đến 25% | Khác biệt rõ | Dễ trùng | Rig | ước |\n| Số biểu cảm người chơi | 8 | 6 đến 10 | Tốn art | Thiếu cảm xúc | Art | ước |\n| Số clip ngoài không gian | 17 (MVP) | 14 đến 20 | Tốn art | Thiếu phản hồi | Art | ước (bảng 7), chốt khi artist có bản thử |\n| Số clip trong trạm | 8 | 6 đến 10 | Tốn art | Thiếu | Art | ước |","he-thong/ho-so-nhan-vat.md",""],["4. Trường hợp biên",2,65,2,1.84,"| Ca | Xử lý |\n|---|---|\n| Chơi 1 người, ba buồng tắt | Tên trên buồng lấy từ ba preset chưa dùng, hiện ở cảnh mở |\n| Người vào sau trùng slot với nhân vật đã rời | Nhận lại đúng nhân vật cũ nếu cùng tài khoản, không thì slot trống thấp nhất khác |\n| Hai người chơi cùng chọn một màu | Không cho, màu gắn slot, slot gắn nhân vật |\n| Màu nhận diện trùng giữa NPC và Driftlife | Đề xuất gd-combat dùng gam lục lam phát quang và tím sẫm cho Driftlife, tránh cam, vàng chanh, hồng tím và cặp trắng xương lục acid. gd-combat chưa xác nhận, nếu không đổi thì chấp nhận và kiểm ở review art |\n| Vỏ bộ đồ cấp cao đổi màu bộ đồ | Không đổi màu slot, chỉ thêm tấm giáp xám |\n| Maro lộ mặt ở N4 (C3.8) | Hiện biến thể lộ mặt khi chỉ huy toán bắt cóc. Ở cảng Maro chỉ xuất hiện trong dáng cải trang (gd-quan, TA08 hai lần cập bến) |\n| Người chơi đổi tên | Tên đổi được, hồ sơ không đổi (màu, silhouette, nghề không đổi theo tên) |\n| Hai nhân vật người chơi chồng lên nhau khi cùng ở cảng | Đi xuyên nhau (xem `nguoi-choi.md`), màu slot phân biệt |\n| Bộ đồ nhiều biến thể cùng lúc | 5 trục độc lập, mỗi mảnh vẽ không che mảnh khác (kiểm lắp thử mọi tổ hợp bậc đầu và bậc cuối) |\n| Nền không gian tối trùng màu với áo xám đen | Nhân vật có viền sáng mảnh 2 điểm ảnh khi ngoài không gian |\n| Cảnh trong trạm cỡ khác ngoài không gian | Giữ 108 điểm ảnh một u, nếu camera trạm khác thì silhouette test lại (UI quyết, `ux-ui.md`) |\n| Người vào sau khi đã có đủ 4 nhân vật lưu | Hiện \"Phòng đầy\", host xóa nhân vật người đã rời để nhường slot |\n| Người vào sau mang ngoại hình trùng người đã chết trên buồng tắt | Dùng biến thể B và tên mới bắt buộc, buồng tắt giữ tên mặc định |","he-thong/ho-so-nhan-vat.md",""],["5. Ràng buộc vật lý của luật",2,65,2,0.45,"- Một artist 2D cho cả game (khung). Rig chung, skin ghép mảnh vừa sức một artist cho 4 người chơi cộng 5 người vớt.\n- Silhouette phải đọc ở 108 điểm ảnh cao: chi tiết dưới 4 điểm ảnh không tính là đặc điểm nhận diện.\n- Co-op 4 người cùng màn trong trạm: 4 màu slot, 5 nhấn người vớt, vẫn phải đọc, nên cặp màu bão hòa cao và bão hòa thấp đã chia để không nhầm.\n- Hồ sơ không cần đúng N người chơi (luật 9).","he-thong/ho-so-nhan-vat.md",""],["6. Yêu cầu cho engineer / tool",2,65,2,0.72,"| Mục | Yêu cầu |\n|---|---|\n| Rig | Một prefab xương chung cho nhân loại, skin theo preset, bộ phận hoán đổi theo ID mảnh (ví dụ `part_oxy_0`) |\n| Màu slot | Đọc từ bảng slot (4 mã hex) để dùng cho HUD, ping, viền đồng đội |\n| Biến thể bộ đồ | Gắn mảnh theo cấp nâng cấp chung của nhóm (`nguoi-choi.md` mục 2.6) |\n| Biểu cảm | Hoán đổi bộ phận mặt theo sự kiện (trúng đòn, ngạt, cứu, nhặt vật hiếm) |\n| Dữ liệu | Hồ sơ nhân vật ở dạng ScriptableObject (`CharacterProfile`): ID, tên, màu, preset, chiều cao. Tiền tố PC, RS, TR, WD-P cho MVP và sau, NP chưa đưa vào ScriptableObject (Sau MVP) |\n| Tên | Tên người chơi đổi được, lưu theo nhân vật |","he-thong/ho-so-nhan-vat.md",""],["7. Yêu cầu cho art, UI, tutorial, audio (gửi GDM để vào tab Assets)",2,65,2,3.99,"Yêu cầu chung: 2D vector, rig xương, bóng đổ phẳng 2 mức, viền theo màu tối của vùng, bảng màu theo mục 3. Thời lượng clip theo giây (ước), loop ghi chú.\n\nClip nhân vật người chơi ngoài không gian (mỗi clip dùng cho 4 skin):\n\n| # | Clip | Thời lượng | Loop | Nhãn |\n|---|---|---|---|---|\n| 1 | Idle trôi | 2,0 | Có | MVP |\n| 2 | Bay (4 nghiêng theo hướng, blend) | 0,8 | Có | MVP |\n| 3 | Hãm | 0,3 | Không | MVP |\n| 4 | Lướt | 0,25 | Không | MVP |\n| 5 | Nhặt | 0,2 | Không | MVP |\n| 6 | Khai thác | 0,8 | Có | MVP |\n| 7 | Dùng dụng cụ hạ | 0,4 | Không | MVP |\n| 8 | Kéo vật | 0,8 | Có | MVP |\n| 9 | Kích Recall | 1,0 | Có | MVP |\n| 10 | Chia Oxy | 0,8 | Có | MVP |\n| 11 | Trao đồ | 0,5 | Không | MVP |\n| 12 | Trúng đòn | 0,3 | Không | MVP |\n| 13 | Ngạt | 1,5 | Có | MVP |\n| 14 | Được cứu | 1,0 | Không | MVP |\n| 15 | Bị kéo về | 1,5 | Không | MVP |\n| 16 | Ping chỉ tay | 0,3 | Không | MVP |\n| 17 | Dùng dụng cụ bắt | 0,5 | Không | MVP |\n\nClip trong trạm:\n\n| # | Clip | Thời lượng | Loop | Nhãn |\n|---|---|---|---|---|\n| 1 | Idle | 2,0 | Có | MVP |\n| 2 | Đi | 0,8 | Có | MVP |\n| 3 | Leo thang | 0,8 | Có | MVP |\n| 4 | Mang thùng (đi) | 0,8 | Có | MVP |\n| 5 | Nhặt và giao thùng | 0,4 | Không | MVP |\n| 6 | Tương tác | 0,5 | Không | MVP |\n| 7 | Mặc bộ đồ | 1,0 | Không | MVP |\n| 8 | Thức dậy từ buồng ngủ đông | 3,0 | Không | MVP |\n| 9 | Bước xuống từ xuồng hoặc Skiff (Amara, Yusuf) | 2,0 | Không | Sau MVP |\n\nBiến thể mảnh bộ đồ (xem `nguoi-choi.md` mục 2.6):\n\n| Trục | Số biến thể | Mô tả hình | MVP cần |\n|---|---|---|---|\n| Bình Oxy | 5 | Từ một bình nhỏ tới ba bình ghép | Bậc 0 và 1 |\n| Vỏ bộ đồ | 4 | Từ vải trơn tới giáp dày | Cấp 0 (cấp 1 đến 3 Sau MVP) |\n| Bộ đẩy | 4 | Từ một vòi tới hai vòi lớn, phụt sáng hơn | Bậc 0 và 1 |\n| Túi đồ | 5 | Từ túi nhỏ tới túi lớn buộc ngoài | Bậc 0 và 1 |\n| Đai dụng cụ | 3 | 3, 4, 5 ô thấy được | Bậc 0 và 1 |\n\nClip riêng NPC MVP (rig nhân loại cho Ingrid và Linh, rig Oru cho Tikko):\n\n| Nhân vật | Clip (giây, loop) | Số clip | Biểu cảm | Nhãn |\n|---|---|---|---|---|\n| Ingrid | Idle 2,0 loop, Đập búa 0,8 loop, Đo 0,6, Vui khi sửa được 1,0 | 4 | 5 (bình thường, bực, tập trung, vui, mệt) | MVP |\n| Linh | Idle 2,0 loop, Bấm bảng 0,8 loop, Đứng nghe 1,5 loop, Cười ngượng 0,8 | 4 | 5 (bình thường, lịch sự, bối rối, lo, cười ngượng) | MVP |\n| Tikko | Idle 1,5 loop, Nói 1,0 loop, Mặc cả 0,8, Vui 0,8, Bối rối 0,8, Rời đi 1,2 | 6 | 5 (tò mò, mê mẩn, bối rối, mặc cả, vui) | MVP |\n\nDanh sách yêu cầu để GDM đưa vào tab Assets:\n\n| Mã Assets | Việc | Số lượng | Nhãn |\n|---|---|---|---|\n| CHR-PC | Skin người chơi (rig chung) | 2 MVP, 4 tổng | MVP |\n| CHR-RS | Người vớt (Ingrid, Linh MVP) | 2 MVP, 5 tổng | MVP |\n| CHR-TR | Thương nhân (Tikko MVP) | 1 MVP, 5 tổng | MVP |\n| CHR-WD | Daskel, Maro (hai biến thể), giáp lính The Wardens (3 biến thể) | 6 | Sau MVP |\n| CHR-SEVRA | Sevra và Ilsume: một rig Sennari, hai lớp phủ (che mạng, bỏ mạng), 5 biểu cảm trạng thái 2, clip Idle, Nói, Chạy trốn, Kiệt sức, Bị kéo trong kén | 2 lớp phủ, 4 clip | Sau MVP |\n| CHR-NP | Người phụ | 4 | Sau MVP |\n| CHR-FACE | Biểu cảm người chơi | 8 | MVP |\n| CHR-PART | Mảnh bộ đồ theo 5 trục | 21 biến thể tổng (5, 4, 4, 5, 3), MVP cần 9 (bình 2, vỏ 1, bộ đẩy 2, túi 2, đai 2) | MVP |\n| CHR-ANIM | Clip người chơi ngoài và trong trạm | 17 và 8 (cộng 1 Sau MVP) | MVP |\n| CHR-ANIM-NPC | Clip riêng Ingrid, Linh, Tikko | 14 (bảng dưới) | MVP |\n| CHR-RIG | Rig nhân loại, rig Oru (Tikko, TA02), rig trẻ em (Wren) | 2 MVP, 3 tổng | MVP |\n| CHR-TA02 | Biến thể màu Oru không tên cho TA02 | 1 | MVP |\n| CHR-FACE-B | Biến thể B của 4 preset cho người vào sau | 4 | Sau MVP |","he-thong/ho-so-nhan-vat.md",""],["7b. Cảm giác (game feel)",2,65,2,0.54,"- Tham chiếu: khách và người của Dave the Diver có hồ sơ riêng và hài hước từ tính cách [theo `15-character.md` mục 4, nguồn 16 và 18], Spiritfarer cho cách gắn sở thích vào luật [nguồn 15 của `15-character.md`]. Mượn đúng khoảnh khắc nhận ra nhân vật qua dáng.\n- Phản tham chiếu: không để nhân vật khác nhau chỉ ở màu da hay màu áo (lỗi hai loài khách giống nhau trong playbook).\n- Phản hồi nhân vật: biểu cảm đổi trong 1 khung hình khi có sự kiện (đau, sợ, cứu), không có độ trễ lên mặt.","he-thong/ho-so-nhan-vat.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,65,2,0.99,"Tiêu chí nghiệm thu (gd-qa pass hoặc fail):\n1. Silhouette test: tô đen 4 preset người chơi cạnh nhau ở 108 điểm ảnh một u, 5 người dùng thử phân biệt đúng 4 nhân vật trong 1 giây ở ít nhất 90% lượt. Lặp ở 1280x720 (72 điểm ảnh một u) với cùng ngưỡng 90% `MVP` (preset 1 và 2).\n2. Tô đen người vớt và thương nhân MVP (Ingrid, Linh, Tikko), mỗi nhân vật nhận ra đúng vai ở ít nhất 80% lượt `MVP`. Phần còn lại Sau MVP.\n3. Mỗi nhân vật có từ 1 đến 6 màu chính cộng tối đa 2 nhấn, đo bằng công cụ lấy mẫu màu, và bão hòa (S của HSV) đúng khoảng mục 3 `MVP`.\n4. `MVP` Lắp thử bộ đồ ở bậc 0 và bậc cuối của mọi trục: không mảnh nào che hoặc cắt mảnh khác.\n5. `MVP` Hai nhân vật bất kỳ trong cùng cảnh cách nhau từ 25 độ Hue, hoặc chênh bão hòa từ 25 điểm, hoặc chênh sáng từ 25 điểm (luật 12). Đo lại bằng script khi artist đổi màu.\n6. `MVP` Mọi nhân vật MVP có đủ clip trong bảng mục 7 và biểu cảm 8.","he-thong/ho-so-nhan-vat.md",""],["10. Câu hỏi mở",2,65,2,0.91,"| # | Câu hỏi | Đề xuất | Ai quyết |\n|---|---|---|---|\n| 1 | Người chơi vào sau có dùng cảnh Skiff hoặc xuồng Bram cần art riêng không | Dùng clip Thức dậy từ buồng ngủ đông và nền buồng, không clip riêng (cảnh tối đa 3 câu, bỏ qua được) | gd-story, GDM |\n| 2 | Người vào sau dùng preset có sẵn hay tùy chỉnh ngoại hình | MVP dùng preset, tùy chỉnh Sau MVP | GDM |\n| 3 | Camera trạm có cùng tỉ lệ 108 điểm ảnh một u không | Giữ, chốt cùng gd-ux | gd-ux |\n| 4 | Quốc gia gốc của người vớt và thương nhân ảnh hưởng đến đồ mặc không | Chỉ chi tiết nhỏ (hoa văn), không đổi silhouette | gd-story |\n| 5 | Tàu của từng chủng Veyl cần hồ sơ hình riêng | Có, gd-quan giữ danh sách tàu, gd-character cấp màu và hình khối | gd-quan |\n| 6 | Có thêm phong cách chữ cho tên người chơi trên đầu không | Có, màu slot, cỡ nhỏ | gd-ux |","he-thong/ho-so-nhan-vat.md",""],["Co-op 1 đến 4 người",2,65,2,0.84,"| Mục | 1 người | 2 người | 3 người | 4 người |\n|---|---|---|---|---|\n| Nhân vật hiển thị | 1 preset, 3 buồng tắt có tên preset khác | 2 preset, 2 buồng tắt | 3 preset, 1 buồng tắt | 4 preset, không buồng tắt |\n| Art MVP cần | Preset 1 | Preset 1 và 2 | Thêm preset 3 | Thêm preset 4 |\n| Màu và hình slot | ○ cam | Thêm △ lam ngọc | Thêm □ vàng chanh | Thêm ◇ hồng tím |\n| Người vào sau | Slot trống thấp nhất, biến thể B, đặt tên mới | Như vậy | Như vậy | \"Phòng đầy\", không vào được |\n| Người rời phiên | Không áp | Nhân vật đứng ở khoang buồng ngủ đông, không điều khiển | Như 2 người | Như 2 người |\n| Người vớt, thương nhân | Như nhau | Như nhau | Như nhau | Như nhau |\n\nKiểm: không hồ sơ nào đổi theo số người ngoài số preset hiển thị và số buồng tắt.","he-thong/ho-so-nhan-vat.md",""],["Người chơi",1,0,3,37.86,"Nhân vật người chơi là một người sống sót mặc bộ đồ không gian: bay 8 hướng bằng bộ đẩy với quán tính nhẹ, mang một túi đồ có sức chứa, tiêu một chỉ số duy nhất là Oxy (vừa là thời gian vừa là máu), và đi bộ trong mặt cắt trạm khi ở nhà. Người chơi điều khiển trực tiếp và tiêu Oxy theo từng giây (P1). Tầng: lõi. Ưu tiên: prototype di chuyển và Oxy trước, sau đó bản đầu. Phụ thuộc chính: gd-combat (sát thương, i-frame, bắt sống), gd-items (khối lượng, dụng cụ), gd-world (cấp môi trường theo dải, Recall Beacon), gd-economy (giá nâng cấp), gd-tech (prototype thử số).","he-thong/nguoi-choi.md","GDD hệ thống: Người chơi (nhân vật ngoài không gian và trong trạm)"],["Hiện hành",2,84,3,1.36,"| Mục | Giá trị khởi điểm | Nhãn |\n|---|---|---|\n| Oxy | 1 chỉ số, dung lượng bậc 0 là 330 điểm, hao nền 1 điểm/giây | MVP |\n| Tốc độ bay | bậc 0 là 6,0 u/s, gia tốc 18 u/s2, trôi dừng sau khoảng 0,5 giây | MVP |\n| Lướt | 4 Oxy một lần, hồi 1,2 giây, đi 3,3 u | MVP |\n| Ngạt | 12 giây, tốc độ 40%, được cứu bằng chia Oxy hoặc chạm cửa khí | MVP |\n| Bị kéo về | giữ đúng 1 món ghim, mất phần còn lại của túi, không mất Tally | MVP |\n| Túi đồ | đo bằng Khối, bậc 0 là 80 Khối, đầy thì không nhặt thêm, vật manh mối không chiếm túi | MVP |\n| Bộ đồ | 5 trục nâng cấp, mua một lần cho cả nhóm (C4) | MVP bậc 0 và 1, còn lại Sau MVP |\n| Điều khiển | bàn phím chuột và gamepad, bảng phím ở mục 2.7 | MVP |\n| Thoát giữa chuyến | Khách rời hoặc mất kết nối quá 15 giây tính như bị kéo về (giữ 1 món), chơi một mình thì mất chuyến, host thoát thì về điểm lưu (C10, K23) | MVP |\n| Số chuyến mỗi ngày | Tối đa 2, Skiff cũng tính, cửa khí khóa sau chuyến 2 và sau khi mở giờ giao thương (K22) | MVP |\n| Co-op | Oxy và túi riêng, chia Oxy, trao đồ, ping, không va chạm giữa người chơi | MVP (2 người), 3 và 4 người Sau MVP |\n\nMọi số là khởi điểm \"ước\", chưa qua prototype của gd-tech. Số di chuyển và Oxy phải qua prototype trước khi gd-economy dùng.","he-thong/nguoi-choi.md",""],["1. Mục đích với người chơi",2,84,3,0.82,"- Cảm thấy: người sống sót giỏi nghề, điều khiển chuẩn. Mỗi lượt lướt hay nán lại thêm một mẻ đều tốn Oxy.\n- Quyết định: đi tiếp hay quay về (Oxy, tải túi), lướt hay trôi (tiết kiệm Oxy), ghim món nào phòng khi ngạt, chia Oxy cho bạn hay giữ.\n- Pillar: P1 (Oxy là thời gian và máu, không hồi miễn phí), P3 (mọi luật đúng với 1 đến 4 người, thêm người là thêm tay), P2 (túi đồ là cầu nối ngoài với trạm).\n- 30 giây đầu: ra khỏi cửa khí, bấm bay thấy nhân vật phản hồi ngay, buông phím thấy trượt nửa giây rồi dừng, nhặt một mảnh phế liệu bay vào túi, thấy thanh Oxy tụt đều và vạch \"đủ về\" nhích theo khoảng cách tới cửa khí.\n- Ý đồ cảm giác: trôi nhẹ nhưng dừng đúng chỗ muốn. Đẩy là đi ngay, buông là trượt chừng nửa giây, hãm là dừng gọn.","he-thong/nguoi-choi.md",""],["2. Luật",2,84,3,37.91,"","he-thong/nguoi-choi.md",""],["2.1 Di chuyển ngoài không gian (MVP)",3,87,3,6.45,"1. Bay 8 hướng: bàn phím WASD cho 8 hướng rời rạc (chéo được chuẩn hóa), gamepad cho analog. Tốc độ cuối bằng đúng tốc độ tối đa theo hướng đẩy, không cộng dồn khi đi chéo.\n2. Điều khiển trực tiếp: bấm đẩy thì gia tốc ngay, không độ trễ nạp lực. Đẩy ngược hướng đang trôi nhận gia tốc gấp 1,5 lần (đảo chiều gọn).\n3. Quán tính nhẹ (log dòng 22): buông phím thì tốc độ giảm theo hãm tự nhiên 12 u/s2, từ tốc độ tối đa bậc 0 dừng sau 0,5 giây và đi thêm 1,5 u.\n4. Hãm (giữ Space, LT): hãm 36 u/s2, từ tốc độ tối đa dừng sau 0,17 giây và đi thêm 0,5 u. Hãm không tốn Oxy. Hãm là cách dừng chính xác để nhặt và khai thác.\n5. Lướt (Shift, RB): xung lực 15 u/s trong 0,22 giây (đi 3,3 u) theo hướng đang đẩy, không đẩy thì theo hướng nhân vật quay. Tốn 4 Oxy, hồi chiêu 1,2 giây ở bậc 0. Có miễn sát thương 0,2 giây đầu (khớp gd-combat). Lướt đặt vận tốc cố định 15 u/s trong 0,22 giây, hết thì vận tốc cắt về tối đa vmax_thật theo hướng đó (không trôi tiếp 15 u/s), rồi hãm tự nhiên áp bình thường. Lướt không dùng để di chuyển đường dài vì 3,3 u tốn 4 Oxy trong khi bay thường 6 u chỉ tốn 1 Oxy (đắt hơn 7 lần mỗi u). Lướt dùng để né, vượt khe hẹp, vào đúng điểm.\n6. Hướng nhìn: nhân vật quay trái hoặc phải theo vị trí con trỏ (chuột) hoặc cần ngắm phải (gamepad). Không ngắm thì quay theo hướng bay ngang.\n7. Va chạm: nhân vật là hình tròn bán kính 0,4 u. Chạm tường thì triệt thành phần vận tốc vuông góc, giữ thành phần trượt dọc tường. Va tường không trừ Oxy, không choáng. Có corner correction 0,25 u để không kẹt góc.\n8. Lực ngoài (dòng chảy, hazard của gd-world): cộng vào vận tốc, phần do lực ngoài gây ra chặn ở 12 u/s. Trần này không áp cho Lướt (15 u/s).\n9. Tự gỡ kẹt: nếu hình tròn nhân vật chồng lên địa hình hơn 2 giây thì đẩy ra điểm trống gần nhất.\n10. Kéo vật (E giữ 0,4 giây ở tầm 1,5 u, bấm E lần nữa để thả): nối bằng dây lò xo dài tối đa 3 u. Kéo không chiếm Khối túi. Mỗi người kéo tối đa 1 vật. Tốc độ theo lớp vật:\n\n| Lớp vật | Vật ví dụ | Hệ số tốc độ khi kéo | Lướt | Oxy hao nền |\n|---|---|---|---|---|\n| Nhẹ | Lồng mẫu có LIV cỡ S | 1,00 | Được | 1,00 |\n| Vừa | Chưa gán vật nào (giữ chỗ) | 0,75 | Được, không chặn kéo | 1,10 |\n| Nặng | BNG-101 Buồng ngủ đông | 0,50 | Không | 1,25 |\n\nThêm người cùng kéo một vật nặng hoặc vừa: mỗi người thêm cộng 0,15 vào hệ số, trần 0,95. Một mình vẫn kéo được ở 0,50 (không luật nào cần đúng N người). Lớp vật theo ID của gd-items: lớp Nhẹ là Lồng mẫu (LIV cỡ S, tối đa 3 con, mỗi người 1 lồng), lớp Nặng là BNG-101, lớp Vừa chưa gán vật nào (giữ chỗ cho vật kéo lớn về sau). Driftlife cỡ M không kéo bằng dây mà gửi về kho bằng Phao kéo (gd-items). Hành vi Driftlife trong lồng do gd-combat.","he-thong/nguoi-choi.md",""],["2.2 Oxy (K1, K2) (MVP)",3,87,3,26.01,"1. Oxy là chỉ số duy nhất của người chơi ngoài không gian. Không có thanh máu riêng. Mỗi người một thanh riêng (C3).\n2. Hao nền: 1,0 điểm/giây từ lúc ra khỏi cửa khí tới lúc về. Đứng yên, hãm, khai thác đều hao như nhau, vì Oxy là thời gian.\n3. Hao môi trường (K6): vào vùng môi trường mà Vỏ bộ đồ chưa đủ cấp thì hao nền nhân hệ số. Thiếu 1 cấp nhân 2,5. Thiếu 2 cấp trở lên nhân 4,0. Đủ cấp thì nhân 1,0. Thừa cấp không thêm lợi ích hao nền. Đi được nhưng đắt.\n4. Hao khi lướt: cộng thẳng chi phí lướt (bảng 3).\n5. Hao khi trúng đòn: sát thương của gd-combat trừ thẳng vào Oxy sau khi Vỏ giảm (0, 5, 10, 15 phần trăm theo cấp 0 đến 3). Oxy không âm. Số Oxy trừ mỗi đòn do gd-combat đặt (ví dụ trúng 8 là mất 8 Oxy), ngưỡng 15 Oxy chia đòn nhẹ và đòn nặng.\n6. Hao theo tải: tải túi quá 60% sức chứa thì hao nền tăng tuyến tính tới 1,15 lần khi đầy, đồng thời tốc độ tối đa và gia tốc giảm tới 0,85 lần (công thức ở mục 3). Dưới 60% không ảnh hưởng.\n7. Không hồi Oxy miễn phí giữa chuyến (P1). Oxy nhận lại chỉ có hai đường: chia Oxy từ đồng đội (2.3 điểm 4), và vật tiêu hao CON-101 Bình Oxy nhỏ (K26, thao tác \"Dùng vật tiêu hao\" ở 2.5 và 2.7). Luật CON-101: hồi 40 điểm Oxy theo `vat-pham.md` T8 (khoảng 12% bình bậc 0), chỉ cho chính người dùng, không thả hay trao cho người khác. Kênh 1,5 giây, hủy khi trúng đòn, thả phím, hoặc Lướt (bình chưa tiêu). Không dùng khi Ngạt hoặc khi Oxy đã đầy dung lượng. Tổng Oxy hồi từ vật tiêu hao trong một chuyến không quá 25% dung lượng bình của người đó (K26): ở bậc 0 là 82 điểm, tức tối đa 2 bình. Lần dùng chạm trần thì chỉ hồi phần còn lại và bình vẫn tiêu hết. Không hồi vượt dung lượng, phần dư bỏ. Mỗi người mang tối đa 2 bình trong túi mỗi chuyến (T8). Hồi chiêu giữa hai lần dùng: không. Số 40 chưa qua sim, chờ gd-tech mô hình vào sim chuyến.\n8. Về tới trạm (cửa khí) thì Oxy đầy lại ngay, trạm tái tạo Oxy.\n9. Cảnh báo theo phần trăm dung lượng:\n\n| Ngưỡng | Hiển thị | Âm | Ghi chú |\n|---|---|---|---|\n| 50% | Thanh chuyển vàng | Bíp chậm mỗi 3 giây | Chỉ báo, không khóa gì |\n| 25% | Thanh đỏ nhấp nháy | Bíp mỗi 1,5 giây | Hiện gợi ý \"về\" |\n| 10% | Viền màn hình đỏ, thở dốc | Bíp mỗi 0,7 giây, nhịp thở | Camera thu nhẹ vào nhân vật |\n| Vạch \"đủ về\" | Oxy_về = (d_thoát / (0,8 nhân vmax_thật)) nhân hệ_số_môi_trường_dọc_đường + dự phòng | d_thoát là khoảng cách đường thẳng tới đích (u). Dự phòng là 8 (5 giây Recall cộng 3 giây đệm) khi đích là Recall Beacon, là 3 khi đích là cửa khí | từ 3 trở lên | d = 240 u, vmax 6, đích cửa khí: 50 + 3 = 53 Oxy (không có hao môi trường) |\n\n10. Oxy chạm 0 (do hao hay do đòn) thì vào Ngạt (2.3). Không bao giờ chết ngay. Nếu Oxy chạm 0 khi đang kênh Kích Recall mà kênh chưa hoàn tất thì hủy kênh và vào Ngạt.","he-thong/nguoi-choi.md",""],["2.3 Ngạt, được cứu, bị kéo về (K2, C6) (MVP)",3,87,3,19.5,"1. Ngạt kéo dài 12 giây. Trong Ngạt: tốc độ tối đa nhân 0,4, không Lướt, không dùng dụng cụ, không kích Recall, không dùng vật tiêu hao, không Trao đồ, không thả đồ khỏi túi (K27), thả mọi vật đang kéo. Oxy giữ 0 và không hao thêm.\n2. Người ngạt không bị AI nhắm tới và không nhận sát thương (để Ngạt là khoảnh khắc chọn đồ và chờ cứu, không phải bị đánh chết). Khớp `combat-driftlife.md` luật 10.\n3. Ngay khi vào Ngạt, túi đồ mở ở chế độ chọn món ghim (2.4). Hết giờ chọn vẫn giữ món đã ghim trước đó.\n4. Được cứu: một đồng đội ở trong 1,5 u giữ Chia Oxy (V, X) chuyển Oxy với tốc độ 10 điểm/giây. Khi người ngạt đạt từ 30 Oxy thì sang Được cứu (2 giây i-frame, rồi Bay). Trong lúc đang được chia Oxy thì đồng hồ ngạt tạm dừng.\n5. Tự thoát (không cần đồng đội): nếu người ngạt chạm cửa khí của trạm trong 12 giây (chỉ ở dải Gần mới khả thi: 12 giây ở tốc độ 2,4 u/s đi tối đa 28,8 u) thì tính là kết thúc chuyến bằng cửa khí (K4), giữ nguyên túi. Recall Beacon cần kích 5 giây nên không dùng được khi ngạt.\n6. Hết 12 giây không ai cứu và chưa về: Bị kéo về. Nhân vật về buồng cửa khí của trạm. Túi chỉ giữ đúng 1 món ghim (một đơn vị vật phẩm, một lồng mẫu đang kéo hoặc một vật nhiệm vụ cũng được ghim. Ghim lồng mẫu thì chỉ giữ con có sao cao nhất trong lồng, các con còn lại mất, khớp luật 25 của `combat-driftlife.md`). Phần còn lại của túi biến mất, không rơi ra map. Ngoại lệ: vật nhiệm vụ không ghim thì trở về vị trí gốc (2.4 điểm 10), vật manh mối không nằm trong túi nên không mất. Dụng cụ mang theo trên đai và Tally không mất, không phí, không nợ (K2).\n7. Bị kéo về, cũng như Về an toàn sớm, là kết thúc chuyến của riêng người đó (C6). Người đã về trạm không ra lại trong cùng chuyến (C9, vì về trạm nạp đầy Oxy rồi ra lại sẽ phá giới hạn Oxy K1). Trong lúc chờ người đó làm việc trạm: xưởng (chế trước cho giờ giao thương), khoang nuôi, và xem vị trí đồng đội. Chuyến chung kết thúc khi người cuối cùng đã về hoặc bị kéo về.\n8. K27: người đang ngạt không trao và không thả được đồ. Đồng đội cứu bằng chia Oxy, không vét túi hộ. Muốn giữ đồ cho nhóm, người chơi phải trao trước khi Oxy chạm 0.\n\nBảng trạng thái và chuyển tiếp ngoài không gian:\n\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Ở trạm | Vào game, về an toàn, bị kéo về, người vào sau hoàn tất cảnh đến | Qua cửa khí khi cả nhóm xác nhận (C5), chỉ tối đa 2 chuyến mỗi ngày (K22). Người về giữa chuyến phải chờ chuyến chung kết thúc (C9), trong lúc chờ làm xưởng (chế trước), khoang nuôi, xem vị trí đồng đội | Đi bộ trong trạm (mục 2.8), Oxy đầy, không hao | Cảnh trong trạm |\n| Bay | Qua cửa khí, hết Lướt, hết Trúng đòn, hết Được cứu, thả Kích Recall | Lướt, Kéo vật, Kích Recall, Trúng đòn, Oxy chạm 0, về cửa khí | Bay 8 hướng, nhặt, dùng dụng cụ | Thanh Oxy, bộ đẩy phụt |\n| Lướt | Bấm Lướt, hết hồi chiêu, Oxy đủ chi phí, không Ngạt | Hết 0,22 giây thì về Bay | Xung lực 15 u/s, miễn sát thương 0,2 giây đầu | Vệt lướt, tiếng xì |\n| Kéo vật | Giữ E ở tầm 1,5 u với vật kéo được | Bấm E thả, vào Ngạt (thả), Về an toàn (vật đi theo nếu trong 3 u) | Tốc độ theo lớp vật, Oxy hao theo lớp vật | Dây nối, vật bám theo |\n| Kích Recall | Giữ F trong 1,5 u của Recall Beacon | 5 giây xong thì Về an toàn, hủy khi thả phím, trúng đòn, hoặc rời quá 2,5 u thì về Bay. Oxy chạm 0 giữa kênh thì hủy và vào Ngạt | Tốc độ nhân 0,3, không cho Lướt trong kênh | Vòng tròn nạp quanh Beacon |\n| Trúng đòn | Nhận sát thương | Hết khóa điều khiển 0,25 giây thì về Bay, hoặc vào Ngạt nếu Oxy chạm 0 | Đẩy lùi, miễn sát thương 0,8 giây, hủy Kích Recall và mọi thao tác giữ phím | Nháy trắng, rung nhẹ, Oxy tụt |\n| Ngạt | Oxy chạm 0 | Được chia Oxy đạt 30 thì sang Được cứu, hết 12 giây thì Bị kéo về, chạm cửa khí thì Về an toàn | Mục 2.3 mục 1 đến 3 | Đồng hồ vòng, tiếng thở yếu, túi mở chọn ghim |\n| Được cứu | Đạt 30 Oxy khi đang ngạt | Hết 2 giây thì về Bay | I-frame 2 giây, điều khiển lại | Quầng sáng, đồng đội hiện biểu tượng |\n| Bị kéo về | Hết 12 giây ngạt | Hoàn tất cảnh kéo 1,5 giây thì sang Ở trạm | Mất túi trừ món ghim, Oxy đầy | Dây kéo, hiện tóm tắt \"mất\" và \"giữ\" |\n| Về an toàn | Vào cửa khí hoặc Recall xong | Chuyển cảnh xong thì sang Ở trạm | Túi nguyên vẹn đổ vào kho, Oxy đầy | Màn tóm tắt chuyến |\n| Giữ chỗ | Mất kết nối giữa chuyến (khách) | Tối đa 1 lần mỗi người mỗi chuyến. Kết nối lại trong 15 giây thì về trạng thái cũ, hết 15 giây hoặc mất kết nối lần thứ hai trong chuyến thì Bị kéo về, chỉ giữ 1 món ghim (C10) | Nhân vật đứng yên, bất tử, Oxy đóng băng (mục 2.9 điểm 6) | Đồng đội thấy biểu tượng mạng |\n| Rời phiên | Người chơi thoát chủ động | Vào lại thì nhận lại nhân vật cũ | Khách thoát giữa chuyến thì tính như Bị kéo về (giữ 1 món ghim), nhân vật ở lại trạm. Chơi một mình thoát giữa chuyến thì mất chuyến, vào lại ở điểm lưu gần nhất với bố cục chuyến cũ (K23). Host thoát thì thế giới về điểm lưu gần nhất (C10) | Nhân vật đứng ở trạm, không điều khiển |\n| Chờ vào | Người vào sau khi nhóm đang giữa chuyến | Chuyến kế tiếp được xác nhận ở cửa khí | Ở trong trạm, dùng xưởng, khoang nuôi | Màn \"chờ nhóm về\" có nút ping |\n\nKhông có trạng thái cụt: mọi trạng thái có ít nhất một đường ra, Ngạt luôn kết thúc trong tối đa 12 giây cộng thời gian đồng hồ tạm dừng khi được chia (có trần: chia dứt khi người cho chạm sàn 20 Oxy).\n\nThứ tự xử lý mỗi khung vật lý (60 Hz), cố định để đồng bộ co-op:\n1. Nhận input.\n2. Cập nhật vận tốc (đẩy, hãm, lướt, lực ngoài, kéo vật).\n3. Va chạm địa hình.\n4. Hút nhặt vật trong bán kính hút.\n5. Cập nhật kênh giữ (Kích Recall, Chia Oxy, tương tác giữ).\n6. Hao Oxy (nền, môi trường, tải, chi phí lướt).\n7. Áp sát thương nhận (của gd-combat), hủy các kênh bị đòn ngắt.\n8. Kiểm Kích Recall hoàn tất, nếu xong thì Về an toàn (trước bước 9).\n9. Kiểm Oxy chạm 0 thì vào Ngạt.\n10. Kiểm đồng hồ Ngạt, cứu, kéo về.\n\nCam kết với người chơi: không bao giờ chết ngay vì một đòn, ngạt luôn có 12 giây để làm gì đó, mất mát chỉ nằm trong túi của chuyến đó và luôn nói trước (món ghim hiện thường trực), nhân vật không bao giờ bị kẹt vĩnh viễn.","he-thong/nguoi-choi.md",""],["2.4 Túi đồ và dụng cụ (K3) (MVP)",3,87,3,5.32,"1. Túi đo bằng tải (đơn vị khối lượng). Mỗi vật phẩm có số Khối riêng (gd-items, ví dụ vật nhiệm vụ 1 Khối, mẫu BPS 1 Khối), túi là danh sách xếp chồng theo ID, không có lưới ô.\n2. Đầy thì không nhặt thêm: vật nảy ra khỏi người và hiện \"Túi đầy\". Có thể thả vật khỏi túi trong menu Mở túi, vật thả nằm tại chỗ 30 giây rồi biến mất (khớp `vat-pham.md` V3), riêng vật nhiệm vụ thả thì sau hạn về vị trí gốc theo V4. Không thả được khi Ngạt (K27).\n3. Nhặt là tự động trong bán kính 1,2 u (vật bay vào 0,2 giây) nếu túi còn chỗ. Vật kể chuyện và vật nặng cần Tương tác.\n4. Đồ trong túi chỉ thành của trạm khi về tới trạm (K3), tự đổ vào kho khi Về an toàn.\n5. Ghim món: người chơi ghim 1 vật phẩm hoặc 1 vật đang kéo bất cứ lúc nào (R hoặc bấm cần phải R3 trong menu túi, mặc định ghim vật có độ hiếm cao nhất vừa nhặt). Món ghim là thứ giữ lại khi bị kéo về. Món ghim luôn hiện biểu tượng ghim trên túi.\n6. Mở túi không dừng thời gian (C7).\n7. Dụng cụ mang theo nằm trên đai dụng cụ, riêng từng người (C3). Số ô: bậc 0 là 3, bậc 1 là 4, bậc 2 là 5. Đổi dụng cụ chỉ ở trạm (xưởng hoặc tủ dụng cụ), không đổi ngoài không gian. Ngoài không gian chỉ đổi ô đang cầm (phím 1 đến 4, bánh xe chuột, D-pad). Dụng cụ không bị mất khi bị kéo về.\n8. Bộ khởi điểm bậc 0 (3 ô): ô 1 TOL-102 Dụng cụ khai thác (khoan và nạy), ô 2 TOL-211 Lao từ, ô 3 để trống cho TOL-201 Dùi xung hoặc TOL-202 Súng lưới (mở bằng quest Kỹ sư chương 1). Ô thứ 4 (bậc 1, UPG-RACK-1) và ô thứ 5 (bậc 2, UPG-RACK-2, chương 2) cho dụng cụ thêm như TOL-203 Súng gây mê. Chìa (TOL-401, TOL-402) và Lồng mẫu (TOL-501) không chiếm ô, đúng luật T6 của gd-items.\n9. Dụng cụ không tốn Oxy. Chi phí của dụng cụ là hồi chiêu (gd-combat) và vật tiêu hao (CON-102, CON-103).\n10. Vật manh mối (K2 ngoại lệ, luật V4 của gd-items): tự ghi vào Sổ tay ngay khi nhặt, không chiếm túi, không thể mất. Vật nhiệm vụ (STY-102, 103, 301, 401, 501) chiếm 1 Khối như vật thường. Bị kéo về hoặc thả mà không ghim vật nhiệm vụ thì nó mất cùng túi và trở về vị trí gốc để lấy lại ở chuyến sau, không mất vĩnh viễn. Vật nhiệm vụ ghim được như món giữ lại.","he-thong/nguoi-choi.md",""],["2.5 Tương tác (MVP)",3,87,3,2.17,"| Thao tác | Đầu vào | Giữ | Tầm | Hủy khi | Ghi chú |\n|---|---|---|---|---|---|\n| Nhặt | Tự động | Không | 1,2 u | Túi đầy | Vật nặng, vật kể chuyện cần Tương tác |\n| Khai thác | Giữ Dùng dụng cụ lên điểm khai thác | Theo dụng cụ (gd-items, bậc 1 khoảng 3 đến 7 giây) | Theo dụng cụ, mặc định 2,0 u | Thả phím, rời tầm | Khai thác không chặn Bay |\n| Bắt sống | Dụng cụ bắt (TOL-202, TOL-203, gd-combat quyết chi tiết) | Theo gd-combat | Theo gd-combat | Theo gd-combat | Kết quả là Driftlife sống kéo được |\n| Kéo | E giữ | 0,4 giây | 1,5 u | Bấm E thả, vào Ngạt | Mục 2.1 mục 10 |\n| Kích Recall | F giữ | 5,0 giây | 1,5 u tới Beacon, hủy khi rời 2,5 u | Thả phím, trúng đòn, rời 2,5 u | Thử lại không giới hạn (Lướt không dùng được trong kênh). Vật đang kéo trong 3 u đi theo về |\n| Mở lối map nhánh | E giữ | 1,0 giây | 1,5 u | Thả phím, rời tầm | Lối vào là ô cố định không khóa (gd-world), khóa nằm trong map nhánh. Riêng cửa cập Lantern đóng tới khi hạ BS-2, lúc đó hiện chữ nêu thiếu gì |\n| Chia Oxy | V giữ | Liên tục | 1,5 u tới người nhận | Thả phím, rời tầm, trúng đòn | 10 điểm/giây, người cho không xuống dưới 20 Oxy |\n| Trao đồ | E giữ gần đồng đội, chọn món | 0,5 giây | 1,5 u | Thả phím, một trong hai người vào Ngạt (K27) | Chuyển 1 đơn vị vật phẩm, được nếu người nhận còn chỗ Khối. Không trao được cho người đang ngạt, người ngạt cũng không trao |\n| Dùng vật tiêu hao | G | 1,5 giây (kênh) | Bản thân | Trúng đòn, thả phím, Lướt, Ngạt | CON-101 hồi 40 Oxy, trần 25% dung lượng bình mỗi chuyến (K26), luật ở 2.2 điểm 7 |\n| Vào cửa khí | E (hoặc chạm) | Tức thì | 1,0 u | Không | Từ ngoài vào là Về an toàn |\n| Ping | T (nhấn mở bánh, thả chọn) | Không | Toàn màn | Hết 8 giây | Tối đa 3 ping mỗi người. Bốn loại: Tới đây, Cảnh báo, Cần Oxy, Tìm thấy |\n\nƯu tiên khi nhiều đích cho một phím Tương tác (E): lối map nhánh, rồi vật cần kéo, rồi Trao đồ cho đồng đội, rồi vật khác. Cứu người ngạt dùng phím riêng Chia Oxy (V) nên không tranh E.","he-thong/nguoi-choi.md",""],["2.6 Nâng cấp bộ đồ (MVP và Sau MVP theo nhãn) (K19, C4)",3,87,3,4.15,"Mua một lần cho cả nhóm, mọi bộ đồ lên cấp cùng lúc (C4). Không ghi giá (thuộc gd-economy). Bậc chỉ tăng, không có bậc phá luật. Nguyên tắc: bậc đầu tăng dung lượng và hiệu suất, tốc độ chỉ tăng nhỏ (tối đa 9% mỗi bậc, bậc 1 là 8,3%) để không đổi cảm giác tay.\n\n| Trục | Bậc 0 | Bậc 1 | Bậc 2 | Bậc 3 | Bậc 4 | Mở dự kiến theo chương |\n|---|---|---|---|---|---|---|\n| T-OXY dung lượng Oxy | 330 | 450 | 600 | 780 | 1000 | Chương 1 đến 5 (xấp xỉ một bậc mỗi chương) |\n| T-VO cấp môi trường, giảm đòn | 0, 0% | 1, 5% | 2, 10% | 3, 15% | không có | Cấp bằng cấp dải: Gần 0, Giữa 1, Xa 2, Cradle và Warden Rig 3 (E3 trong `map.md`) |\n| T-DAY vmax, gia tốc, chi phí lướt, hồi chiêu | 6,0 u/s, 18, 4, 1,2 s | 6,5, 20, 4, 1,1 s | 7,0, 22, 3,5, 1,0 s | 7,5, 24, 3, 0,9 s | không có | Bậc 1 chương 1, bậc 2 chương 2, bậc 3 chương 3 (theo `kinh-te-tien-trinh.md` mục 3.2) |\n| T-TUI sức chứa (Khối) | 80 | 100 | 126 | 168 | 216 | Chương 1 đến 5 |\n| T-DUNGCU số ô dụng cụ | 3 | 4 | 5 | không có | không có | Bậc 1 ở chương 1 (Dùi xung), bậc 2 ở chương 2 (bắt sống) |\n\nQuan hệ trục: T-OXY quyết định độ dài chuyến, T-VO quyết định đi được dải nào mà không đắt (K6), T-DAY làm chuyến gọn hơn, T-TUI quyết định lượng mang về, T-DUNGCU quyết định kiểu chơi (khai thác, tấn công, bắt). Bộ đồ nâng cấp ở Xưởng (Kỹ sư, K12) bằng vật liệu (UPG của gd-items) cộng Tally (giá ở bảng của gd-economy, `kinh-te-tien-trinh.md`). MVP chỉ cần bậc 0 và 1 của T-OXY, T-DAY, T-TUI, đủ cho chương 1 và thử hệ nâng cấp.","he-thong/nguoi-choi.md",""],["2.7 Điều khiển (MVP)",3,87,3,2.98,"| Hành động | Bàn phím và chuột | Gamepad (bố cục Xbox) |\n|---|---|---|\n| Bay | W A S D | Cần trái |\n| Ngắm và quay mặt | Con trỏ chuột | Cần phải, hỗ trợ ngắm: kéo nhẹ về mục tiêu trong nón 15 độ |\n| Dùng dụng cụ | Chuột trái | RT |\n| Đổi dụng cụ | 1 đến 4, bánh xe chuột | D-pad trái và phải |\n| Lướt | Shift trái | RB |\n| Hãm | Space | LT |\n| Tương tác, Kéo, Trao đồ, Mở lối | E | A |\n| Kích Recall (giữ) | F | Giữ Y |\n| Chia Oxy (giữ) | V | Giữ X |\n| Ghim món (chỉ khi túi mở) | R | Bấm cần phải (R3) |\n| Dùng vật tiêu hao | G | D-pad xuống |\n| Kết nhanh (giữ 0,6 giây, gd-combat) | Q | B |\n| Bản đồ chuyến | M | LB |\n| Mở túi | Tab | Back |\n| Ping (mở bánh) | T | D-pad lên |\n| Menu | Esc | Start |\n\nQuy tắc: không phím nào đổi nghĩa theo chế độ ngoài hai ngữ cảnh (ngoài không gian, trong trạm). Trong túi mở, Ghim món dùng R3 nên không đụng Y (Kích Recall) và X (Chia Oxy). Trong trạm: Tab là Xem kho nhanh, J (Y) là Sổ tay, E hoặc Space là Tương tác, nhặt và giao thùng (giữ 1 giây để bơm khí), chuột trái vào ô quầy hay cửa neo để tự chạy tới. Bảng đầy đủ của trạm và menu nằm ở `ux-ui.md` mục 2.9, bảng này là phần ngoài không gian và luật. Mọi phím gán lại được. Giữ E cũng dùng để vá điểm rò trong sự cố cảng (gd-quan). Một mình tạm dừng được từ menu, co-op không tạm dừng (C7). Chi tiết HUD, wireframe, FTUE ở `ux-ui.md`.","he-thong/nguoi-choi.md",""],["2.8 Trong trạm (MVP)",3,87,3,4.42,"1. Trạm là mặt cắt ngang, có trọng lực nhân tạo. Nhân vật đi bộ trái phải trên sàn, leo thang giữa các tầng bằng W hoặc S. Không có nhảy.\n2. Tốc độ đi 5,5 u/s, leo thang 3,5 u/s. Không chạy riêng, vì giờ giao thương (K13) có áp lực thời gian nên tốc độ cố định cho dễ đọc.\n3. Trong trạm nhân vật không có Oxy, không Ngạt. Không dùng dụng cụ trong trạm trừ sự cố do gd-quan quy định.\n4. Mang thùng trong giờ giao thương: bấm E hoặc Space để nhặt ở ô quầy và giao ở cửa neo. Mỗi người mang 1 thùng (hoặc 1 lồng) một lần, tốc độ chạy không đổi khi mang, không cùng mang một thùng, không đặt thùng xuống. Giữ E 1 giây ở cửa neo để bơm khí. Bấm chuột trái vào ô quầy hay cửa neo để tự chạy tới, giữ A D giữa đường thì hủy. Luật đầy đủ ở `tram-va-cang.md` luật 26 tới 28.\n5. Sự cố giờ giao thương (K14, gd-quan): không đặt trạng thái lên người chơi. Rò khí đóng cửa một khoang bắt đi vòng, chập điện và Driftlife sổng xử bằng giữ phím. Trong trạm không có Oxy nên không trừ Oxy và không có sát thương (khớp `combat-driftlife.md`).\n6. Qua cửa khí từ trong ra cần cả nhóm đang online xác nhận (C5). 30 giây tính từ lúc người đầu tiên xác nhận (khớp `ux-ui.md`), ai không trả lời trong 30 giây thì tính là ở lại trạm và chuyến vẫn đi. Ở trong ra, bộ đồ tự mặc (cảnh 1,0 giây có thể bỏ qua).\n7. Người chơi không qua cửa khí thì ở lại trạm và dùng xưởng, khoang nuôi (C5).\n8. Người chơi không va chạm nhau, đi xuyên nhau (tránh kẹt hành lang và phá nhau).\n9. K22: một ngày tối đa 2 chuyến (đi Skiff cũng tính một chuyến). Sau chuyến thứ hai cửa khí khóa tới ngày mới. Đã mở giờ giao thương thì không ra ngoài được nữa trong ngày đó. Lý do: về trạm nạp đầy Oxy rồi ra lại không giới hạn sẽ phá K1. Cửa khí khóa hiện chữ nêu lý do (chuyến thứ hai đã xong hoặc giờ giao thương đã mở).","he-thong/nguoi-choi.md",""],["2.9 Vào sau và rời phiên (C2) (MVP luật, cảnh do gd-story)",3,87,3,4.82,"1. Thế giới lưu tối đa 4 nhân vật (4 slot màu). Host chọn 1 đến 4 người tỉnh dậy ban đầu.\n2. Người vào sau lấy slot trống thấp nhất, là một người sống sót vớt về từ một buồng ngủ đông vô danh (gd-story): ở điểm nghỉ kế tiếp Skiff hoặc xuồng của Bram đưa buồng về, trước khi có Skiff thì dòng mảnh vỡ đưa buồng tới sát cửa khí. Không lấp buồng tắt của Ember. Cảnh tối đa 3 câu, phát một lần, bỏ qua được. Người vào sau có tên mới do người đó đặt (bắt buộc, không trùng tên mặc định của buồng tắt, khớp `ho-so-nhan-vat.md` luật 11). Túi rỗng, bộ đồ bằng cấp chung của nhóm (C4), dụng cụ lấy bộ khởi điểm, đổi được ở trạm.\n3. Người vào giữa lúc nhóm đang ở ngoài thì ở Chờ vào tới chuyến kế (C5).\n4. Hết slot thì không vào được, hiện \"Phòng đầy\". Host xóa nhân vật của người đã rời lâu để nhường slot.\n5. Khách chủ động rời giữa chuyến thì tính như Bị kéo về (K2, C10): chỉ giữ 1 món ghim, phần còn lại của túi mất, không phải đường về an toàn. Nhân vật ở lại trạm, đứng ở khoang buồng ngủ đông (khớp gd-story), không điều khiển. Vào lại thì nhận lại đúng nhân vật cũ (cùng slot, cùng màu). Chơi một mình thoát giữa chuyến thì mất chuyến đó, lần sau vào lại ở điểm lưu gần nhất với cùng bố cục chuyến (K23). Host thoát thì phiên kết thúc và thế giới về điểm lưu gần nhất (C10, K23).\n6. Khách mất kết nối giữa chuyến thì Giữ chỗ 15 giây (đứng yên, bất tử, Oxy đóng băng, đồng hồ ngạt dừng). Giữ chỗ tối đa 1 lần mỗi người mỗi chuyến. Quá 15 giây, hoặc mất kết nối lần thứ hai trong cùng chuyến, thì tính như Bị kéo về (C10): chỉ giữ 1 món ghim. Host mất kết nối thì xử như host thoát (về điểm lưu gần nhất). Chuyển host không làm trong MVP.","he-thong/nguoi-choi.md",""],["3. Tham số",2,84,3,8.0,"| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nhóm tác động | Nguồn |\n|---|---|---|---|---|---|---|\n| Oxy dung lượng bậc 0 | 330 điểm | 280 đến 380 | Chuyến dài hơn | Chuyến ngắn, chương 1 khó | Độ dài chuyến | sim GD-030, map.md 3.9 (chuyến chương 1 dài 4,4 phút) |\n| Oxy dung lượng bậc 4 | 1000 điểm | 900 đến 1100 | Chuyến chương 5 dài | Chuyến chương 5 ngắn | Độ dài chuyến | sim GD-030, map.md 3.9 (chuyến chương 5 dài 10,4 phút) |\n| Hao Oxy nền | 1,0 điểm/giây | 1,0 cố định | Đổi mọi số khác | Đổi mọi số khác | Mọi thứ | ước, định nghĩa đơn vị |\n| Hệ số thiếu 1 cấp môi trường | 2,5 | 2,0 đến 3,0 | Phạt đi sớm nặng | Cổng mềm | K6, độ khó dải | ước |\n| Hệ số thiếu 2 cấp trở lên | 4,0 | 3,0 đến 5,0 | Phạt nặng | Dải xa dễ ép | K6 | ước |\n| Chi phí lướt bậc 0 | 4 Oxy | 3 đến 6 | Lướt đắt, ít né | Lướt thành đường đi | Cảm giác, Oxy | ước |\n| Hồi chiêu lướt bậc 0 | 1,2 giây | 0,8 đến 1,6 | Ít lướt | Lướt dày | Cảm giác | ước |\n| Khoảng lư
