<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style>
<title>Bản đồ tri thức The Novent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Bầu trời đêm một giao diện: canvas sao toàn màn, khung tìm kiếm nổi góc trên trái, bảng đọc bên phải (tấm dưới ở màn hẹp). Sao chỉ hiện khi sao cha đã mở */
:root {
  --void: #03050b; --glass: rgba(10, 15, 30, .86); --glass-2: rgba(22, 31, 56, .8);
  --rim: rgba(160, 185, 255, .14); --rim-2: rgba(160, 185, 255, .3);
  --ink: #e9edf7; --ink-2: #aab4cb; --ink-3: #6f7b96; --gold: #ffd48a;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font: 14px/1.6 var(--f-body); overflow: hidden; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#sky.hover { cursor: pointer; }
#sky:active { cursor: grabbing; }

.dock { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: min(370px, calc(100vw - 32px)); display: grid; gap: 8px; z-index: 5; }
.brand { padding: 11px 14px; background: var(--glass); border: 1px solid var(--rim); border-radius: 14px; }
.brand h1 { margin: 0; font: 700 17px/1.2 var(--f-display); letter-spacing: .05em; }
.brand h1 span { color: var(--gold); }
.brand p { margin: 3px 0 0; color: var(--ink-2); font-size: 12.5px; }
.brand kbd { font: 11px var(--f-mono); padding: 0 5px; border: 1px solid var(--rim-2); border-radius: 4px; color: var(--ink); }
.find { position: relative; }
.find input { width: 100%; padding: 9px 14px 9px 34px; background: var(--glass); border: 1px solid var(--rim); border-radius: 12px; color: var(--ink); font: 13.5px var(--f-body); }
.find input::placeholder { color: var(--ink-3); }
.find svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.res { margin: 6px 0 0; padding: 4px; list-style: none; background: var(--glass); border: 1px solid var(--rim); border-radius: 12px; max-height: 46vh; overflow: auto; }
.res button { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 1px 10px; align-items: baseline; padding: 7px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; font: 13px/1.35 var(--f-body); cursor: pointer; }
.res button:hover, .res button:focus-visible { background: var(--glass-2); outline: none; }
.res i { width: 7px; height: 7px; border-radius: 50%; }
.res small { grid-column: 2; color: var(--ink-3); font: 11px var(--f-mono); }

.hud { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 5; }
.hud button { height: 32px; padding: 0 12px; border: 1px solid var(--rim); border-radius: 10px; background: var(--glass); color: var(--ink); font: 500 12.5px var(--f-body); cursor: pointer; }
.hud button:hover { border-color: var(--rim-2); }
.hud span { color: var(--ink-3); font: 11.5px var(--f-mono); }

.tip { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px; background: var(--glass); border: 1px solid var(--rim-2); border-radius: 9px; font-size: 13px; max-width: 320px; }
.tip small { display: block; color: var(--ink-3); font: 11px var(--f-mono); }

.panel { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(480px, 40vw); display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--rim); border-radius: 18px; z-index: 5; overflow: hidden; transition: transform .3s ease, opacity .3s ease; }
.panel.off { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.ph { padding: 16px 48px 12px 18px; border-bottom: 1px solid var(--rim); display: grid; gap: 8px; }
.crumb { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font: 12px var(--f-mono); color: var(--ink-3); }
.crumb button { border: 0; background: none; color: var(--ink-2); font: inherit; padding: 1px 3px; border-radius: 4px; cursor: pointer; }
.crumb button:hover { color: var(--gold); }
.ttl { display: flex; gap: 12px; align-items: flex-start; }
.orb { flex: none; width: 12px; height: 12px; margin-top: 8px; border-radius: 50%; background: #fff; }
.ph h2 { margin: 0; font: 600 21px/1.25 var(--f-display); text-wrap: balance; }
.ph .full { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { padding: 2px 9px; border: 1px solid var(--rim); border-radius: 999px; color: var(--ink-2); font: 11.5px var(--f-mono); }
.pb { overflow: auto; padding: 14px 18px 22px; display: grid; gap: 18px; align-content: start; }
.sec h3 { margin: 0 0 8px; font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.kids { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.kids button { width: 100%; display: flex; gap: 10px; align-items: center; padding: 7px 8px; border: 0; border-radius: 9px; background: none; color: var(--ink); text-align: left; font: 13.5px/1.35 var(--f-body); cursor: pointer; }
.kids button:hover, .kids button:focus-visible { background: var(--glass-2); outline: none; }
.kids .dot { flex: none; display: grid; place-items: center; width: 16px; }
.kids .dot i { border-radius: 50%; background: #fff; }
.kids em { margin-left: auto; font: normal 11px var(--f-mono); color: var(--ink-3); white-space: nowrap; padding-left: 8px; }
.md { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
.md > *:first-child { margin-top: 0; }
.md p, .md ul, .md ol { margin: 0 0 10px; }
.md ul, .md ol { padding-left: 20px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--ink-3); }
.md strong { color: #fff; font-weight: 600; }
.md code { font: 12.5px var(--f-mono); color: var(--gold); background: rgba(255, 212, 138, .07); padding: 1px 4px; border-radius: 4px; }
.md h4 { font: 600 14px var(--f-display); margin: 14px 0 6px; }
.md .tw { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--rim); border-radius: 10px; }
.md table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; width: max-content; }
.md th, .md td { padding: 6px 9px; border-bottom: 1px solid var(--rim); text-align: left; vertical-align: top; min-width: 90px; max-width: 300px; }
.md th { font: 600 11px var(--f-mono); color: var(--ink-2); background: rgba(255, 255, 255, .03); white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.more { border: 1px solid var(--rim); background: none; color: var(--ink-2); font: 12.5px var(--f-body); padding: 6px 12px; border-radius: 9px; cursor: pointer; justify-self: start; }
.note { color: var(--ink-3); font-size: 12.5px; }
.x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font: 18px var(--f-mono); cursor: pointer; }
.x:hover { background: var(--glass-2); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-3); font: 13px var(--f-mono); }

@media (max-width: 820px) {
  .dock { width: calc(100vw - 32px); }
  .brand p { font-size: 12px; }
  .panel { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); top: auto; width: auto; height: 55vh; border-radius: 18px 18px 12px 12px; }
  .panel.off { transform: translateY(calc(100% + 24px)); }
  .hud span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>

<script id="sao-data" type="application/json">{"n":[["The Novent",0,-1,-1,115.0,"Tỉnh dậy trên trạm hỏng giữa bãi vỡ của tàu mẹ, mỗi ngày ra ngoài đổi Oxy lấy tài nguyên và Driftlife, về sửa trạm, bán hàng ở giờ giao thương cho thương nhân ngoài hành tinh lấy Tally, nâng cấp để đi xa hơn, cho tới khi trạm rời neo.\n\nMỗi ngôi sao lớn là một hệ thống trong GDD. Sao càng to, càng nhiều phần khác của thiết kế dẫn tới nó.","",""],["Khung game",1,0,0,30.91,"Define GDD và Game Vision & Concept bản cho người đọc ngoài phòng: tab OVERVIEW của Sheet (nguồn `gdd/sheet/OVERVIEW.tsv`).\nCách đọc: mọi vai đọc file này trước khi viết GDD hệ thống của mình. Luật khung đánh mã K. GDD hệ thống không được trái luật K. Thấy luật K có vấn đề thì phản biện trong báo cáo (luật 12 giao thức chung), không tự đổi.\nNhãn nguồn: (L) Lead chốt bằng lời, (G) GDM tự quyết theo ủy quyền, có dòng trong `log-gdm-tu-quyet.md`.\nMọi tên riêng tiếng Anh là [TẠM]. Số trong file này là mục tiêu ý đồ, chưa đo. Số hiện hành chỉ có sau khi gd-economy và gd-tech chạy sim.","00-khung-game.md","Khung The Novent - nguồn chung cho mọi GDD hệ thống"],["1. Một câu, fantasy, người chơi",2,1,0,1.34,"- Một câu: tỉnh dậy trên một trạm hỏng giữa bãi vỡ của tàu mẹ, mỗi ngày đổi oxy lấy thứ làm trạm sống lại, buôn bán với thương nhân ngoài hành tinh ở cảng, một mình hoặc cùng tối đa ba người bạn, cho tới khi trạm đủ sức rời neo.\n- Mục tiêu người chơi theo chặng (L, G): chương 1 đến 3 là sống sót và tìm đường tới Solace, cuối chương 3 cứu Sevra. Chương 4 lộ ra Solace là mồi do Daskel dựng và giúp mạng lưới của Sevra. Chương 5 hộ tống Sevra, nối tình báo, cách mạng thành công, nhận tọa độ hành tinh có sự sống thật và rời neo. Kết mở: hành trình tới hành tinh thật để cho phần sau.\n- Fantasy (G): tôi là người sống sót giỏi nghề, tự tay kéo một trạm chết sống lại. Mỗi chuyến ra ngoài là một lần liều có tính toán, mỗi lần về là thấy trạm đổi khác.\n- Người chơi mục tiêu (G): người chơi PC thích Dave the Diver, Subnautica, Core Keeper, Stardew Valley co-op. Chơi phiên 30 đến 60 phút. Chơi một mình là chính, rủ bạn vào giữa chừng được.\n- Thể loại (L): hành động nhập vai phiêu lưu kết hợp mô phỏng quản lý. Bán đứt. Unity, PC.\n- Góc nhìn (G): 2D nhìn ngang ở mọi nơi. Ngoài không gian là mặt phẳng bay tự do 8 hướng (cùng cấu trúc với lặn của Dave). Trong trạm là mặt cắt ngang nhìn thấy các khoang.","00-khung-game.md",""],["2. Core Pillars (L)",2,1,0,11.86,"Lead 2026-11-20: \"tôi muốn giữ giống như Dave the Diver đó là điểm mà game sẽ follow.\" Năm pillar theo đúng Five Core Pillars của Dave the Diver (tên, thứ tự, Player Experience), nội dung viết cho game này. Mỗi tính năng phải phục vụ ít nhất một pillar và không phạm cột Cấm. Khi hai pillar xung đột, ưu tiên theo thứ tự CP1 đến CP5.\n\nMã cũ trong các GDD hệ thống đọc theo bảng này:\n\n| Mã cũ trong GDD | Nghĩa nay |\n|---|---|\n| P1 Mỗi hơi thở là một quyết định | CP2 Risk & Reward |\n| P2 Mang về là để trạm sống lại | CP3 Management & Optimization |\n| P3 Một mình vẫn trọn, có bạn thì vui hơn | Nguyên tắc nền Solo or Together |\n| P4 Vũ trụ kể chuyện qua thứ bạn vớt được | CP1 Exploration & Discovery và CP5 Variety & Delight |\n| P5 Progression & Growth | CP4 Progression & Growth |","00-khung-game.md",""],["CP1. Exploration & Discovery - Khám phá",3,3,0,3.28,"| Mục | Nội dung |\n|---|---|\n| Mô tả | Khuyến khích người chơi khám phá bãi vỡ của tàu mẹ Cradle: ba dải Gần, Giữa, Xa, các map nhánh, loài Driftlife mới, tài nguyên hiếm, xác các trạm con, người còn sống để vớt và những điều bất ngờ. Mỗi chuyến bố cục đổi khác, mỗi chương mở vùng mới |\n| Player Experience | Curiosity, Wonder, Discovery |\n| Giữ bằng luật | K5 map sinh lại mỗi chuyến, K6 dải mở theo chương, K7 map nhánh dựng tay giữ người vớt, vật manh mối, boss |\n| Đo bằng | mỗi dải có ít nhất 2 tài nguyên chỉ dải đó có. Mỗi chương mở ít nhất 1 vùng hoặc map nhánh mới |\n| Cấm | Map cố định lặp lại y hệt. Nội dung một lần nằm ở chỗ sinh lại ngẫu nhiên. Vùng mới chỉ khác màu mà không có thứ mới |","00-khung-game.md",""],["CP2. Risk & Reward - Rủi ro và phần thưởng",3,3,0,6.47,"| Mục | Nội dung |\n|---|---|\n| Mô tả | Người chơi phải cân nhắc lượng Oxy, sức chứa túi đồ, Driftlife nguy hiểm và thời điểm quay về. Oxy vừa là thời gian vừa là máu. Đi càng xa càng có phần thưởng giá trị nhưng rủi ro cũng cao hơn. Lựa chọn luôn có thông tin để tính (vạch \"đủ về\", cảnh báo theo phần trăm) |\n| Player Experience | Tension, Challenge, Satisfaction |\n| Giữ bằng luật | K1 Oxy là chỉ số duy nhất, K2 hết Oxy giữ 1 món, K3 túi đồ, K4 Recall Beacon, K9 bắt sống giá trị hơn hạ, K22 tối đa 2 chuyến mỗi ngày, K26 trần Oxy hồi từ vật tiêu hao, K27 đang ngạt không trao đồ |\n| Đo bằng | chuyến chương 1 dài 4 đến 6 phút, chương 5 dài 10 đến 12 phút. Bị kéo về: người cẩn thận dưới 5%, người tham 15 đến 40% |\n| Cấm | Thanh máu riêng. Hồi Oxy miễn phí giữa chuyến. Chuyến đi không có giới hạn. Về trạm nạp Oxy rồi ra lại không giới hạn. Mất trắng khi hết Oxy |","00-khung-game.md",""],["CP3. Management & Optimization - Quản lý và tối ưu",3,3,0,3.38,"| Mục | Nội dung |\n|---|---|\n| Mô tả | Thứ mang về trở thành vật liệu sửa trạm và hàng hóa cho giờ giao thương. Người chơi chọn sửa khoang nào trước, nuôi Driftlife nào, bán gì ở giờ giao thương, mang hàng lên tàu thương nhân kịp giờ, để người vớt về vận hành các khoang, và tối ưu thu nhập Tally |\n| Player Experience | Ownership, Strategy, Efficiency |\n| Giữ bằng luật | K11 khoang sửa xong đổi hình trạm, K12 người vớt vận hành khoang, K13 giờ giao thương, K14 sự cố, K15 Hạng cảng, K16 nuôi Driftlife, K19 nguồn tiêu của tài nguyên |\n| Đo bằng | tàu phục vụ xong ở giờ giao thương 85 đến 100% (chương 1). Tip chiếm 20 đến 30% Tally của giờ giao thương. 100% vật phẩm có ít nhất một nguồn tiêu |\n| Cấm | Tài nguyên chỉ để bán lấy số. Vật phẩm không có nguồn tiêu. Hệ đói, chi phí duy trì làm trạm xấu đi khi người chơi nghỉ |","00-khung-game.md",""],["CP4. Progression & Growth - Phát triển liên tục",3,3,0,3.26,"| Mục | Nội dung |\n|---|---|\n| Mô tả | Tally kiếm được dùng nâng cấp bộ đồ (bình Oxy, vỏ, bộ đẩy, túi, đai dụng cụ), dụng cụ và trạm. Nâng cấp mở ra dải mới, chuyến dài hơn, loài lớn hơn để bắt. Đích của cả hành trình là sửa xong động cơ và rời neo |\n| Player Experience | Achievement, Empowerment, Growth |\n| Giữ bằng luật | K6 cấp bộ đồ theo dải, K18 Tally là đồng tiền duy nhất, K20 Shop, K21 mỗi chương thêm kiểu chơi mới, K25 qua chương |\n| Đo bằng | chương 1 dài 1,5 đến 2 giờ, cả game 12 đến 15 giờ (một người, kịch bản trung bình) |\n| Cấm | Nâng cấp chỉ tăng số mà không mở gì mới. Mất tiến trình (hết Oxy chỉ mất túi, không mất nâng cấp hay Tally). Tiền tệ thứ hai hay XP |","00-khung-game.md",""],["CP5. Variety & Delight - Đa dạng và bất ngờ",3,3,0,2.92,"| Mục | Nội dung |\n|---|---|\n| Mô tả | Cốt truyện (vụ The Scattering, tên độc tài Daskel, người thừa kế Sevra), người vớt về và thương nhân The Veyl mỗi loài một tính cách, hài nhẹ từ tính cách nhân vật. Cơ chế mới xuất hiện theo chương (bắt sống, nuôi Driftlife, sự cố giờ giao thương, hộ tống), nên chương sau không lặp chương trước |\n| Player Experience | Surprise, Humor, Relaxation |\n| Giữ bằng luật | K21 mỗi chương thêm một đến hai kiểu chơi mới, K25 qua chương theo mốc truyện, B8 dấu vết phản diện lộ dần, B9 giọng nền nghiêm hài nhẹ |\n| Đo bằng | mỗi chương có ít nhất 3 mốc truyện và 2 vật manh mối có nơi đặt cố định. Mỗi chương có kiểu chơi mới |\n| Cấm | Cắt cảnh dài chặn vòng chơi. Truyện chỉ kể qua chữ mà không qua thứ người chơi tự tìm thấy. Hài lấn át những mốc mất mát. Chương sau chỉ là chương trước với số lớn hơn |","00-khung-game.md",""],["Nguyên tắc nền. Solo or Together - Một mình vẫn trọn, có bạn thì vui hơn",3,3,0,2.67,"| Mục | Nội dung |\n|---|---|\n| Mô tả | Nguyên tắc nền, mọi pillar phải tuân theo. Mọi luật đúng với 1 đến 4 người. Chơi một mình là cách chơi chính ngang với co-op. Thêm người là thêm tay để chia việc, không mở khóa nội dung |\n| Player Experience | Freedom, Cooperation, Belonging |\n| Giữ bằng luật | C1 đến C10, K23 lưu game |\n| Đo bằng | mỗi người trong nhóm 4 nhặt được từ 60% so với chơi một mình. Nhóm 4 hết game bằng 60 đến 75% thời gian chơi một mình |\n| Cấm | Luật chỉ đúng khi có đúng N người. Nội dung chỉ co-op mới có. Mở thêm bến, vùng hay tính năng theo số người. Tạm dừng toàn cục khi co-op |","00-khung-game.md",""],["3. Bối cảnh đã chốt (tóm tắt, bản đủ ở GDD cốt truyện)",2,1,0,5.45,"| # | Điểm | Nguồn |\n|---|---|---|\n| B1 | Trái Đất cạn kiệt, Hệ Mặt Trời sụp đổ. United Accord đóng tàu mẹ Cradle chở người được chọn lọc đi định cư ở Solace | L |\n| B2 | Loài người đã giao thương với người ngoài hành tinh từ sớm. The Veyl là tên gọi chung, gồm nhiều chủng tộc, phần lớn trung lập và không biết âm mưu | L |\n| B3 | Phản diện chính là Daskel [TẠM], tên độc tài của một chủng tộc trong The Veyl. Hắn đảo chính lật đổ người cai trị cũ (người chủ trương chung sống hòa bình với các chủng tộc sau chiến tranh vũ trụ), rồi hướng sự chú ý sang Trái Đất để giữ quyền và đoàn kết chủng tộc. Hắn phát tín hiệu giả dụ đoàn di cư rồi phục kích. Vụ đó gọi là The Scattering. Chế độ và quân đội của Daskel gọi là The Wardens [TẠM] | L 2026-11-20 sửa phản diện, tên G |\n| B4 | Solace là thông tin mồi. Hồ sơ về một hành tinh sống được tên Solace và đường tới đó do chế độ của Daskel dựng lên, phát qua mạng tin của thương nhân The Veyl trung lập, dẫn Cradle vào điểm phục kích | L, kênh phát G |\n| B5 | Cái nhìn \"loài người tham lam, xấu tính\" là cái nhìn phiến diện của Daskel, sinh từ hận thù vì cha hắn là sĩ quan hy sinh trong chiến tranh vũ trụ. Daskel không tham lam hơn loài người. Dưới Daskel, hành tinh từng hòa bình thành hiếu chiến: ép lính, dung túng cướp bóc và tệ nạn, khơi mào chiến tranh | L |\n| B6 | Driftlife là sinh vật bản địa của vùng chân không nơi bãi vỡ trôi vào. Cú lật giữa game: nhà sinh học tìm thấy dấu săn bắt của quân The Wardens trên Driftlife, bằng chứng chế độ của Daskel cướp bóc tràn lan, trái với hình ảnh chúng tự dựng | G, sửa theo B5 |\n| B7 | Cradle phóng các Seed Station, mỗi trạm 4 buồng ngủ đông. Phần lớn vỡ theo tàu mẹ. Người chơi tỉnh dậy trên Station Ember đang trôi vì hỏng. Chơi N người thì N người tỉnh, buồng còn lại hỏng do không may | L |\n| B8 | Dấu vết phản diện lộ dần theo tiến trình. Sevra Ilvane [TẠM], con gái người cai trị cũ và người thừa kế hợp pháp, giả làm thương nhân. Người chơi cứu Sevra khỏi một cuộc tấn công bắt cóc, Sevra lộ danh tính và xin giúp. Sevra cùng mạng lưới quân cách mạng và người nằm vùng chuẩn bị lật đổ Daskel | L |\n| B9 | Giọng: nền nghiêm, hài nhẹ từ tính cách người vớt về và thương nhân. Kết: cách mạng thành công, Sevra lên nắm quyền, lập lại hòa bình, giúp loài người tìm người sống sót và trao tọa độ một hành tinh có sự sống thật. Ember rời neo lên đường. Hành trình tới hành tinh đó để cho phần sau | L |\n| B10 | Không phạt khai thác. Chủ đề nói qua nhân vật, cú lật Driftlife và lựa chọn nuôi thay vì săn | L |\n| B11 | Móc cho phần sau: tọa độ hành tinh thật Sevra trao. Phần sau là hành trình tới đó và xây dựng lại. Không trả lời trong game này | L, G |","00-khung-game.md",""],["4. Core loop và một ngày",2,1,0,1.34,"Vòng lớn: ra ngoài thu thập -> mang về kho -> sửa trạm, chế đồ, nuôi -> lập danh mục, bán ở giờ giao thương lấy Tally -> nâng cấp bộ đồ và trạm, mua thứ không tự làm được -> đi xa hơn, lâu hơn, gặp thứ mới -> lộ thêm truyện.\n\nMột ngày (từ trong game: \"ngày\", trong truyện là một chu kỳ trạm):\n\n| Pha | Người chơi làm gì | Kết thúc khi | Bỏ qua được |\n|---|---|---|---|\n| 1. Chuẩn bị | Xem bảng tàu hôm nay và đơn đặt trước, chọn dụng cụ mang theo, nhận đồ chế xong, chăm khoang nuôi | Người chơi ra cửa khí | Có |\n| 2. Chuyến 1 | Ra ngoài: nhặt phế liệu, khai khoáng, bắt sống hoặc hạ Driftlife, vào map nhánh, vớt người, tìm manh mối | Mọi người đã về trạm (cửa khí, Recall Beacon) hoặc bị kéo về | Có |\n| 3. Chuyến 2 | Như chuyến 1. Giữa hai chuyến được vào kho, xưởng | Như trên | Có |\n| 4. Giờ giao thương | Lập danh mục bán, mở giao thương. Tàu cập vào cửa neo, mỗi tàu gọi 1 thùng, người chơi mang thùng từ quầy tới đúng tàu, bơm khí cho tàu đang chờ, nhận Tally và tip | Hết giờ giao thương, tàu cuối rời, hoặc hết hàng trong danh mục | Có, không bị phạt |\n| 5. Cuối ngày | Nâng cấp, nghiên cứu, đặt hàng ở shop, nói chuyện với người trong trạm, nhận quest, xem truyện. Ngủ thì lưu và sang ngày mới | Người chơi vào buồng ngủ | Không |","00-khung-game.md",""],["5. Luật khung",2,1,0,16.38,"","00-khung-game.md",""],["Chuyến ra ngoài",3,12,0,4.29,"- K1 (L, G): Oxy là một chỉ số duy nhất, vừa là thời gian chuyến đi vừa là máu. Oxy giảm đều theo thời gian và giảm thêm khi trúng đòn hay vào vùng môi trường xấu. Không có thanh máu riêng.\n- K2 (G): Oxy về 0 thì người đó vào trạng thái ngạt trong một khoảng ngắn. Hết khoảng đó mà không ai cứu thì bị kéo về trạm, chỉ giữ đúng 1 món tự chọn trong túi đồ, mất phần còn lại của túi. Không mất Tally, không có phí cứu hộ, không có nợ. Ngoại lệ: vật manh mối tự ghi lại ngay khi nhặt và không chiếm túi, vật nhiệm vụ mất cùng túi thì trở về vị trí gốc để lấy lại.\n- K3 (G): túi đồ có giới hạn sức chứa. Đây là giới hạn thứ hai sau Oxy. Đồ trong túi chỉ thành của trạm khi người chơi về tới trạm.\n- K4 (L): kết thúc chuyến bằng cửa khí của trạm hoặc Recall Beacon. Recall Beacon: giữ phím vài giây, bị đánh thì hủy, về trạm giữ nguyên túi đồ. Trong map tổng vị trí Recall Beacon đổi mỗi chuyến. Trong map nhánh Recall Beacon nằm cố định.\n- K5 (L, G): map tổng có 3 dải theo khoảng cách tới trạm: Gần, Giữa, Xa. Bố cục sinh lại mỗi chuyến bằng cách ghép các mảnh dựng tay từ một kho mảnh. Loài Driftlife và loại tài nguyên gắn với dải, không ngẫu nhiên giữa các dải.\n- K6 (G): dải mở theo chương truyện. Mỗi dải có một điều kiện môi trường cần cấp bộ đồ tương ứng. Thiếu cấp vẫn vào được nhưng Oxy hao nhanh hơn nhiều (đi được nhưng đắt). Dải chưa mở theo chương thì bị chặn cứng bằng vật cản do gd-world định.\n- K7 (L, G): map nhánh là khu dựng tay, không sinh lại, vào qua một lối trong map tổng. Người để vớt, vật manh mối, boss chỉ nằm ở map nhánh. Mốc truyện thì được diễn ra cả ở trạm và cảng. Skiff đưa người chơi từ trạm thẳng tới map nhánh đã tìm ra, tính là một chuyến.\n- K8 (L): Driftlife và tài nguyên sinh lại mỗi chuyến. Không có luật cạn kiệt, không phạt khai thác.\n- K9 (G): với loài bắt sống được (cỡ S và M), bắt sống luôn có giá trị hơn hạ. Driftlife sống dùng để nuôi, nghiên cứu và bán ở giờ giao thương giá cao. Driftlife đã hạ chỉ cho nguyên liệu. Loài cỡ L không bắt sống được: mẫu sinh thiết là cách lấy mẫu nghiên cứu mà không hạ, đứng ngoài luật này.","00-khung-game.md",""],["Trạm và cảng",3,12,0,23.66,"- K10 (L, G): Ember neo cố định suốt game. Việc sửa đầu tiên là hãm trôi và neo. Sửa động cơ chính là mục tiêu dài nhất, xong thì Ember rời neo, lên đường tới hành tinh thật Sevra trao tọa độ, và game kết (kết mở, chưa tới hành tinh đó trong game này).\n- K11 (G): trạm gồm các khoang. Khoang hỏng phải sửa bằng vật liệu mới dùng được. Mỗi khoang sửa xong đổi hình trạm và trả lại một chức năng.\n- K12 (L, G): mỗi người vớt về mở một tính năng của trạm qua một quest nhỏ hoặc mốc chương. Năm người: Kỹ sư (xưởng: chế và nâng cấp trang bị), Thông dịch viên (khoang liên lạc: gọi tàu, mở giờ giao thương, shop), Hoa tiêu (khoang dẫn đường: mở dải Xa, Skiff. Dải Giữa mở khi xong chương 1), Nhà sinh học (nghiên cứu và nuôi Driftlife), Trưởng cảng (thêm bến, tiện ích cảng). Không có bếp trưởng.\n- K13 (L, 2026-11-20 đổi theo khung bán sushi của Dave the Diver): giờ giao thương là nửa chơi tay thứ hai. Trước ca người chơi lập danh mục bán từ hàng trong kho, Thông dịch viên tự đóng thùng. Trong ca tàu cập vào các cửa neo, mỗi tàu gọi 1 thùng trong danh mục. Người chơi nhặt thùng ở quầy cảng, mang tới đúng cửa neo trước khi tàu hết kiên nhẫn, và bơm khí cho tàu đang chờ. Giao xong nhận giá thùng cộng tip theo kiên nhẫn còn lại. Không chế, không đóng kiện trong ca. Tàu chỉ mua, không bán trong ca. Bản luật đủ: `gdd/he-thong/tram-va-cang.md`, nguồn đề xuất: `de-xuat-ca-cang-kieu-dave.md`.\n- K14 (G): từ chương 3, giờ giao thương có sự cố trạm chen ngang (rò khí, chập điện, Driftlife sổng khoang nuôi). Trước chương 3 không có sự cố.\n- K15 (G): có một thang Hạng cảng duy nhất, tăng theo kết quả các ca. Hạng cảng mở thêm loại tàu, loại hàng giá cao, trần danh mục bán và danh mục shop. Không có danh tiếng riêng từng phe.\n- K16 (L, G): nuôi Driftlife trong khoang sinh quyển là nguồn hàng đều, mở ở chương 2. Nuôi là lựa chọn có lợi, không phải nghĩa vụ.\n- K17 (G): không có hệ đói, không có chi phí duy trì cư dân, không nấu ăn. Trạm không xấu đi khi người chơi nghỉ.","00-khung-game.md",""],["Kinh tế và tiến trình",3,12,0,4.81,"- K18 (L, G): Tally là đồng tiền duy nhất. Nguồn chính là giờ giao thương. Không có tiền thứ hai, không có XP. Nghiên cứu tiêu mẫu vật và vật liệu.\n- K19 (G): sink của tài nguyên: sửa khoang, chế trang bị, nghiên cứu, nuôi, bán ở giờ giao thương. Sink của Tally: nâng cấp bộ đồ và trạm, mua ở shop thứ Ember không tự làm được (linh kiện động cơ, bản thiết kế).\n- K20 (G): Shop là bảng giá duy nhất, nằm ở khoang liên lạc, đặt hàng cuối ngày. Danh mục mở theo Hạng cảng và chương.\n- K21 (G): tiến trình đi theo 5 chương. Mỗi chương mở một dải hoặc map nhánh lớn và thêm một hoặc hai kiểu chơi mới.\n- K22 (G): một ngày có tối đa 2 chuyến. Đi bằng Skiff cũng tính là một chuyến. Sau chuyến thứ hai cửa khí khóa tới ngày mới. Giờ giao thương luôn sau các chuyến: đã mở giờ giao thương thì không ra ngoài được nữa trong ngày đó. Lý do: về trạm nạp đầy Oxy rồi ra lại không giới hạn sẽ phá K1.\n- K23 (G): ngày không có đồng hồ. Ngày chỉ sang khi người chơi vào buồng ngủ đông (co-op: vào buồng là xác nhận, đếm 30 giây từ người đầu tiên, người chưa vào tự tính là đồng ý). Game tự lưu ở ba điểm: sau mỗi chuyến khi mọi người đã về trạm, sau giờ giao thương, và lúc ngủ. Thoát giữa một chuyến hoặc giữa giờ giao thương thì lần sau vào lại ở điểm lưu gần nhất, mất phần đang dở. Bố cục map của từng chuyến được lưu theo ngày và số thứ tự chuyến, nạp lại không đổi bố cục.\n- K24 (G): sau cảnh kết game về menu chính. Bản lưu nằm ở ngày cuối với mọi mốc truyện đã xong, Ember còn ở neo để chơi tự do, không có nội dung mới. Cảnh kết không phát lại khi vào bản lưu, xem lại được từ Sổ tay.\n- K25 (G): \"qua chương\" chỉ có một nghĩa. Chương đóng và vùng mới mở khi mốc đóng chương của truyện xong. Mốc đóng chương chỉ kích hoạt khi giai đoạn động cơ của chương đó đã lắp. Kinh tế và trạm không có cổng chương riêng, các mốc kinh tế khác chỉ là gợi ý tiến độ.\n- K26 (G): Oxy hồi từ vật tiêu hao trong một chuyến không quá 25% dung lượng bình của người đó. Vật tiêu hao hồi Oxy không dùng được khi đang ngạt và không hồi vượt dung lượng.\n- K27 (G): người đang ngạt không trao và không thả được đồ. Đồng đội cứu bằng chia Oxy, không vét túi hộ.","00-khung-game.md",""],["6. Co-op (khung)",2,1,0,7.0,"- C1 (L): 1 đến 4 người, co-op online, không PvP. Chơi một mình là cách chơi chính ngang với co-op.\n- C2 (G): thế giới thuộc về người tạo (host). Lúc tạo, host chọn số người tỉnh dậy ban đầu từ 1 đến 4. Người vào sau là người sống sót vớt về, tối đa 4 người chơi cùng lúc. Người rời phiên thì nhân vật ở lại trạm.\n- C3 (G): dùng chung cả nhóm: trạm, kho, Tally, nâng cấp trạm, cấp trang bị, bản thiết kế, bản đồ, tiến trình truyện, Hạng cảng. Riêng từng người: Oxy, túi đồ trong chuyến, dụng cụ đang mang.\n- C4 (G): nâng cấp trang bị mua một lần cho cả nhóm, mọi bộ đồ cùng lên cấp. Lý do: bạn vào giữa chừng không bị yếu, một ví chung, ít màn hình.\n- C5 (G): chuyến bắt đầu khi mọi người đang online đã xác nhận ở cửa khí. Ai không đi thì chọn ở lại trạm và vẫn dùng được xưởng, khoang nuôi. Ai không trả lời trong 30 giây thì tính là ở lại. Ngoài không gian mỗi người tự do tách nhau, mỗi người một màn hình.\n- C6 (G): mỗi người kết thúc chuyến riêng. Người ngạt được đồng đội chia Oxy để cứu. Chuyến kết thúc khi người cuối cùng đã về hoặc bị kéo về.\n- C9 (G): người đã về trạm (về sớm hoặc bị kéo về) không ra lại trong cùng chuyến. Trong lúc chờ, người đó làm việc trạm: xưởng (chế trước hàng cần chế cho danh mục), khoang nuôi, sửa khoang, và xem được vị trí đồng đội. Lý do không cho ra lại: về trạm nạp đầy Oxy rồi ra lại sẽ phá giới hạn Oxy (K1).\n- C10 (G): rời phiên hoặc mất kết nối giữa chuyến không phải là đường về an toàn. Khách mất kết nối được giữ chỗ 15 giây, quá hạn thì tính như bị kéo về (K2, chỉ giữ 1 món). Khách chủ động rời giữa chuyến cũng tính như bị kéo về. Host thoát thì phiên kết thúc và thế giới trở về điểm lưu gần nhất (K23). Chơi một mình thoát giữa chuyến thì mất chuyến đó theo K23.\n- C7 (G): không tạm dừng toàn cục khi có từ 2 người. Mở menu không dừng thời gian. Chơi một mình được tạm dừng.\n- C8 (G): cân bằng theo số người: không gian chơi giữ nguyên, lượng tài nguyên một chuyến và sức chịu của Driftlife, boss (máu, ngưỡng choáng) tăng theo số người, số tàu trong giờ giao thương tăng theo số người đang chơi lúc mở giao thương, bảng tàu ghi rõ điều này. Giá sửa khoang và nâng cấp không đổi theo số người, vì số người đổi được giữa các phiên. Không nội dung nào mở khóa theo số người. Hệ số do sim đặt. Mục tiêu ý đồ ở mục 9.","00-khung-game.md",""],["7. Tiến trình 5 chương (G)",2,1,0,3.44,"| Chương | Tên tạm | Vùng mới | Người vớt | Kiểu chơi mới | Mốc truyện |\n|---|---|---|---|---|---|\n| 1 | Tỉnh dậy | Dải Gần, xác Seed Station đầu tiên | Kỹ sư, Thông dịch viên | Khai thác, bắt sống loài nhỏ bằng lưới, giờ giao thương | Neo trạm, sửa cảng, tàu buôn đầu tiên ghé, bắt được sóng của Lantern |\n| 2 | Không cô độc | Dải Giữa, Station Lantern | Hoa tiêu, Nhà sinh học | Nuôi Driftlife, bắt sống cỡ M (gây mê, Phao kéo), lấy mẫu sinh thiết cỡ L | Gặp người sống ở Lantern, dấu vết phá từ ngoài vào trên các xác trạm |\n| 3 | Kẻ canh giữ | Dải Xa, Veyl Waypost, The Remainers | Trưởng cảng | Sự cố trong giờ giao thương, kẻ địch có vũ khí | Tàu lạ ghé cảng, cú lật Driftlife, quân The Wardens lộ mặt. Cuối chương: cứu Sevra khỏi cuộc tấn công bắt cóc, Sevra lộ danh tính |\n| 4 | Tâm vụ nổ | Cradle Interior | Không | Map nhánh lớn trong nội thất tàu | Hộp ghi hành trình: Solace là thông tin mồi do chế độ Daskel dựng. Sevra kể chuyện đảo chính. Mục tiêu đổi từ \"tới Solace\" sang \"giúp Sevra lật đổ Daskel\". Chuyển tin cho mạng lưới qua giờ giao thương |\n| 5 | Rời neo | Warden Rig | Không | Hộ tống Sevra, trận đối đầu cuối | Hộ tống Sevra về căn cứ, nối tình báo, đánh Warden Rig (đầu não của Daskel ở bãi vỡ) khi cách mạng nổ ra. Sevra lên nắm quyền, trao tọa độ hành tinh thật. Sửa xong động cơ chính, rời neo |","00-khung-game.md",""],["8. Hệ thống và chủ sở hữu",2,1,0,1.7,"| Hệ thống | Vai | File GDD (`projects/game-moi/gdd/he-thong/`) | Tab Sheet |\n|---|---|---|---|\n| Khung, core loop, một ngày | GDM | `../00-khung-game.md` | OVERVIEW, CORE LOOP, Day |\n| Cốt truyện, chương, nhân vật truyện, tên gọi | gd-story | `cot-truyen.md` | GAME STORY |\n| Nhân vật người chơi: di chuyển, Oxy, bộ đồ, túi đồ, ngạt và cứu, điều khiển. Hồ sơ người vớt và thương nhân | gd-character | `nguoi-choi.md`, `ho-so-nhan-vat.md` | Player |\n| Combat, bắt sống, Driftlife, The Wardens, boss | gd-combat | `combat-driftlife.md` | Enemy |\n| Tài nguyên, vật phẩm, dụng cụ, công thức, hàng hóa | gd-items | `vat-pham.md` | Salvage, ITEM LIST, Recipe |\n| Map tổng, map nhánh, hazard, Recall Beacon, Skiff, nhịp chuyến | gd-world | `map.md` | Zone |\n| Trạm và cảng: khoang, người vớt mở tính năng, giờ giao thương, Hạng cảng, nuôi Driftlife, sự cố | gd-quan | `tram-va-cang.md` | Customer (thương nhân và tàu) |\n| Tally, giá, nâng cấp, nhịp mở khóa, cân bằng 1 đến 4 người | gd-economy | `kinh-te-tien-trinh.md` | ECONOMIC, Shop, Upgrade, PROCESSING, Balance Sheet |\n| HUD, màn hình, input, FTUE | gd-ux | `ux-ui.md` | WIREFRAME, Tutorials |\n| Sim, schema dữ liệu, yêu cầu đồng bộ co-op, event | gd-tech | `ky-thuat.md` | Event Tracking |\n| Nghiệm thu | gd-qa | `../qa/` | MVP Criteria Checklist |\n\nChủ tên gọi: gd-items giữ tên và ID vật phẩm, gd-combat giữ tên Driftlife và kẻ địch, gd-world giữ tên vùng và hazard, gd-story giữ tên riêng trong truyện. Vai khác cần tên chưa có thì đặt tạm, đánh dấu `[CHỜ <vai>]` và nhắn thẳng vai chủ.","00-khung-game.md",""],["9. Mục tiêu ý đồ (G, chưa đo)",2,1,0,1.57,"| Mục | Mục tiêu | Ai đo |\n|---|---|---|\n| Thời lượng một chuyến, chương 1 | 4 đến 6 phút | gd-world, gd-tech |\n| Thời lượng một chuyến, chương 5 | 10 đến 12 phút | gd-world, gd-tech |\n| Thời lượng giờ giao thương | 3 đến 5 phút | gd-quan, gd-tech |\n| Một ngày đủ 2 chuyến và giờ giao thương | Chương 1: 15 đến 20 phút. Chương 5: 25 đến 30 phút | GDM |\n| Chương 1 | 1,5 đến 2 giờ | gd-economy |\n| Cả game | 12 đến 15 giờ | gd-economy |\n| Tỉ lệ chuyến bị kéo về vì hết Oxy | Người chơi cẩn thận dưới 5%, người chơi tham 15 đến 40%. Đo lại bằng playtest khi có build | gd-tech |\n| Thứ kết thúc chuyến | Chương 1 túi đầy trước ở khoảng 60% chuyến, từ chương 2 Oxy là giới hạn chính | gd-world, gd-tech |\n| Thời gian tới hết game của nhóm 4 người so với chơi một mình | 60 đến 75% (bị chặn dưới bởi số ngày tối thiểu của chuỗi mốc truyện) | gd-economy, gd-tech |\n| Lượng nhặt được của mỗi người trong nhóm 4 so với khi chơi một mình | từ 60% trở lên | gd-world, gd-tech |\n| Phần Tally của giờ giao thương đến từ tip (kể cả bơm khí) | 20 đến 30% (demo bot 2026-11-20: 23 đến 26%) | gd-economy |\n| Giá trị Driftlife sống so với đã hạ (cỡ S và M, sau khi trừ vật tiêu hao) | 1,2 đến 2 lần | gd-items, gd-economy |\n| Tỉ lệ tàu phục vụ xong trong giờ giao thương | Chương 1: 85 đến 100%. Từ chương 2: 75 đến 95% | gd-quan, gd-tech |\n| Thời gian rảnh mỗi người trong giờ giao thương | Không quá 30% ở người chơi trễ phản xạ 2 giây, mọi số người | gd-quan, gd-tech |","00-khung-game.md",""],["10. Từ điển (dùng đúng từ này trong mọi GDD)",2,1,0,3.63,"| Từ | Nghĩa |\n|---|---|\n| Trạm, Ember | Station Ember, nhà của người chơi |\n| Khoang | Một phòng chức năng của trạm |\n| Buồng ngủ đông | Nơi người ngủ. Ember có 4 buồng |\n| Chuyến | Một lần ra ngoài không gian rồi về |\n| Dải Gần, Giữa, Xa | Ba dải của map tổng The Wake. Tên riêng: Ember Anchorage, Shepherd Belt, Glass Nebula |\n| Map nhánh | Khu dựng tay vào qua một lối trong map tổng |\n| Oxy | Chỉ số duy nhất của người chơi ngoài không gian |\n| Bộ đồ, bộ đẩy, túi đồ | Trang bị mặc, thiết bị di chuyển, chỗ chứa đồ trong chuyến |\n| Kho | Chỗ chứa đồ chung của trạm |\n| Driftlife | Sinh vật trôi trong chân không. Bắt sống hoặc hạ |\n| Phế liệu, khoáng, băng, linh kiện, mẫu | Các nhóm tài nguyên. Chi tiết do gd-items giữ |\n| Kiện | Đơn vị hàng hóa trong kho và trong kinh tế (giá kiện) |\n| Thùng | Đơn vị bán trong giờ giao thương, bằng 0,4 kiện. Lồng sinh vật sống là một đơn vị riêng, không chia |\n| Danh mục bán | Các loại hàng và số thùng người chơi đưa ra bán trước ca |\n| Bến, cửa neo, tàu | Khu cảng, chỗ một tàu cập (bến có nhiều cửa neo), tàu thương nhân |\n| Kiên nhẫn, tip, bơm khí | Thanh thời gian của tàu ở cửa neo, tiền thêm theo kiên nhẫn còn lại, việc phụ hồi kiên nhẫn |\n| Đơn đặt trước | Thùng một tàu cụ thể đặt từ đầu ngày, giá cao, hiện ở bảng tàu |\n| Giờ giao thương | Pha bán hàng cho tàu để lấy Tally |\n| Tally | Đồng tiền duy nhất |\n| Hạng cảng | Thang tiến trình của cảng |\n| Người vớt | Người sống sót đưa về trạm, mở tính năng |\n| Recall Beacon | Điểm thoát kéo về trạm |\n| Skiff | Xuồng đi thẳng tới map nhánh đã tìm ra |\n| The Veyl, The Wardens, Daskel, Sevra, Sennari | Tên chung người ngoài hành tinh, chế độ và quân của tên độc tài, tên độc tài (First Warden), người thừa kế hợp pháp (giả làm thương nhân Ilsume), chủng tộc của hai người |\n| Cradle, Seed Station, Solace, The Scattering, United Accord, Lantern, The Remainers, Veyl Waypost, Warden Rig | Tên riêng trong truyện, xem GDD cốt truyện |","00-khung-game.md",""],["11. Không làm (G)",2,1,0,0.25,"PvP. Chơi chung một máy. Tiền thứ hai. XP và cấp nhân vật. Hệ đói, nấu ăn, phục vụ ăn uống. Sinh map thủ tục hoàn toàn. Danh tiếng từng phe. Xây trạm tự do theo ô. Phí cứu hộ và nợ. Chọn chặng trên bản đồ. Solace là vùng chơi.","00-khung-game.md",""],["12. Phạm vi MVP đề xuất (G, Lead nên xem lại vì chạm thời hạn)",2,1,0,2.31,"Chương 1 trọn vẹn: dải Gần, 1 xác Seed Station, Kỹ sư và Thông dịch viên, xưởng, giờ giao thương 1 bến, 3 đến 4 loài Driftlife, bắt sống loài nhỏ bằng lưới và 1 loại hàng Driftlife sống ở cảng, 1 boss nhỏ, co-op 2 người chạy được. GDD viết cho cả game, mỗi mục ghi nhãn MVP hoặc Sau MVP.","00-khung-game.md",""],["13. Art Direction (L phong cách, G phần còn lại)",2,1,0,1.32,"- Phong cách: 2D vector, nhìn ngang ở mọi nơi (Lead chốt). Thêm 3D thành 2.5D: chưa chốt, chờ Lead\n- Không khí: khoa học viễn tưởng sinh tồn, nền nghiêm, hài nhẹ từ tính cách nhân vật. Bãi vỡ tối và lạnh, trạm Ember ấm dần lên theo từng khoang sửa xong (thấy được tiến trình bằng mắt)\n- Màu: không gian xanh than, tím đậm. Ánh sáng trạm cam ấm. Driftlife phát quang để đọc được trên nền tối. Giáp chế độ The Wardens trắng xương EDEBE0 và lục acid 7CFC3A, không ai khác dùng. 4 slot người chơi mỗi slot một màu kèm một hình: cam ○, lam ngọc △, vàng chanh □, hồng tím ◇\n- Nhân vật: silhouette đọc được ở 72 điểm ảnh mỗi u (720p). Mỗi nhân vật tối đa 6 màu chính cộng 2 nhấn. Người chơi bão hòa từ 70%, NPC tới 45%. Rig xương chung cho nhân loại, mảnh bộ đồ hoán đổi theo 5 trục nâng cấp\n- Môi trường: map tổng ghép từ kho mảnh dựng tay (tái dùng tối đa), trạm là mặt cắt ngang nhìn thấy các khoang, mỗi dải một bảng màu và loại mảnh vỡ riêng\n- UI: 16:9, chữ đọc được ở 1280x720, mỗi trạng thái quan trọng có tín hiệu hình kèm màu\n- Tham chiếu cảm giác: Dave the Diver (đọc rõ, vui mắt, nhân vật nhiều biểu cảm). Chỉ lấy cảm giác, không lấy asset\n- Chi tiết: tab Assets, ho-so-nhan-vat.md mục 7","00-khung-game.md",""],["14. Project Scope (G, mốc thời gian chờ Lead)",2,1,0,0.9,"- Nhóm: 1 Game Designer, 4 Game Developer, 1 Artist 2D. Unity, PC, co-op online 2 đến 4 người\n- Cả game: 5 chương, 3 dải map tổng, 8 map nhánh, 15 loài Driftlife, 4 đơn vị The Wardens, 5 boss, khoảng 150 vật phẩm, 5 người vớt, 5 thương nhân, 12 đến 15 giờ chơi một mình\n- MVP: trọn chương 1. Dải Gần, 1 xác Seed Station, Kỹ sư và Thông dịch viên, xưởng, giờ giao thương 1 bến có 1 loại kiện phải chế và 1 loại hàng Driftlife sống, bắt sống loài nhỏ bằng lưới, 3 đến 4 loài Driftlife, 1 boss nhỏ, co-op 2 người. Khoảng 1,5 đến 2 giờ chơi\n- Ngoài phạm vi: PvP, chơi chung một máy, tiền thứ hai, XP, sinh map thủ tục hoàn toàn, chọn chặng trên bản đồ, vùng chơi trên hành tinh Sennar hay hành tinh đích\n- Mốc thời gian: chưa có, chờ Lead. Phạm vi art tính lại khi có mốc\n- Chi tiết: tab TRACKING, MVP Criteria Checklist","00-khung-game.md",""],["15. USP (L)",2,1,0,1.56,"Lead chốt cách viết 2026-11-23: theo khung USP của Dave the Diver, giọng giới thiệu sản phẩm, mỗi ý một tên và một đoạn ngắn. Ý 1 và 3 là lời Lead, ý 2 và 4 do GDM viết (DECISIONS 2026-11-23, log dòng 100). Bản này thay bản 2 có cột so với Dave.\nNgày và đêm: nhịp sinh hoạt của trạm, không có đồng hồ thật (K23). Ngày là pha Chuyến 1 và Chuyến 2, đêm là pha Giờ giao thương.\n\n1. Kết hợp thể loại game độc đáo: Kết hợp hành động, phiêu lưu ngoài không gian với mô phỏng quản lý trạm thương cảng trong một vòng lặp ngày đêm rõ rệt. Ban ngày bay ra bãi vỡ của tàu mẹ để thu thập tài nguyên và Driftlife, ban đêm mở giờ giao thương với thương nhân ngoài hành tinh.\n2. Nội dung đa dạng, nhịp độ thư giãn: Xen giữa các chuyến bay căng thẳng là nhịp chậm trên trạm: sửa khoang, nuôi Driftlife, trò chuyện với người sống sót, giao thương với thương nhân mỗi loài một tính cách. Hoạt động mới mở dần theo chương, thất bại không bị phạt nặng, không gò bó như làm việc.\n3. Thế giới và cốt truyện cuốn hút: Khám phá thế giới giả tưởng có chiều sâu và những khu vực ngoài không gian để tìm lời giải cho những bí ẩn bị che giấu.\n4. Trải nghiệm trọn vẹn dù chơi một mình hay co-op: Chơi một mình vẫn đủ toàn bộ nội dung và cốt truyện. Co-op online 2 đến 4 người không làm giảm trải nghiệm hay bắt cốt truyện phải đánh đổi: mỗi người chơi đều có chỗ trong câu chuyện, thêm người là thêm tay chia việc, không khóa nội dung.","00-khung-game.md",""],["16. Target Audience (G)",2,1,0,0.46,"- Người chơi PC thích Dave the Diver, Subnautica, Core Keeper, Stardew Valley chơi chung\n- Thích khám phá, tối ưu và tự tay dựng lại một thứ. Thích truyện dày nhưng không muốn xem cắt cảnh dài\n- Chơi phiên 30 đến 60 phút (2 đến 3 ngày trong game). Chơi một mình là chính, rủ 1 đến 3 bạn vào giữa chừng\n- Kỹ năng hành động vừa phải: thử thách đến từ quyết định quản lý Oxy, không đòi phản xạ cao\n- Độ tuổi: chưa chốt","00-khung-game.md",""],["Cốt truyện",1,0,1,49.62,"Hệ thống cốt truyện giữ bối cảnh, năm chương, nhân vật truyện, tên riêng và luật về cách truyện chen vào vòng ngày. Hệ thống cho người chơi lý do để đi xa hơn (ai đã đánh Cradle, đường nào tới Solace, rồi ai dựng lời nói dối đó và làm sao rời được bãi vỡ) và cho các hệ thống khác một trật tự mở nội dung. Tầng: tính năng và trình bày. Ưu tiên: chương đầu cho MVP, các chương sau cho bản đầy đủ. Phụ thuộc chính: map (nơi đặt manh mối và người vớt), trạm và cảng (quest mở tính năng, thương nhân), combat (The Wardens, boss), UX (hộp thoại, Sổ tay).","he-thong/cot-truyen.md","GDD hệ thống: Cốt truyện"],["Tên mới (đợt 6, phản diện Lead sửa 2026-11-20)",2,27,1,4.16,"Nguồn: lời Lead ở cuối `story/lead-y-tuong-2026-11-20.md`, khung B3 đến B11 và K10, log GDM dòng 84 đến 92. Mọi tên là [TẠM], các vai khác dùng đúng các tên này.\n\n| Là gì | Tên [TẠM] | Mã, ghi chú |\n|---|---|---|\n| Chủng tộc của X và Y | Sennari | Đã có trong danh mục, dùng lại. Không thêm chủng tộc mới, không thêm art chủng tộc |\n| Hành tinh quê của Sennari | Sennar | Người chơi không tới (log 88) |\n| The Wardens | The Wardens | Tên chế độ và quân đội của X (log 84), không phải một chủng tộc. Lính The Wardens là người Sennari mặc giáp của chế độ |\n| X, tên độc tài | Daskel | WD-P1, boss BS-5. Kẻ cầm quyền Sennar, đứng đầu The Wardens. Danh xưng tự phong: First Warden |\n| Người cai trị cũ | Ilvane | Danh xưng Steward of Sennar. Cha của Y. Bị lật đổ, chết trong giam cầm trước khi game bắt đầu. Không xuất hiện, không cần art |\n| Y, người thừa kế hợp pháp | Sevra Ilvane | Gọi là Sevra. Mã NP-5 (đề xuất, gd-character chốt) |\n| Y giả làm thương nhân nào | Ilsume | Thương nhân Sennari đã có hồ sơ (TR-2, tàu TA04, ghé cảng từ chương 2). Ilsume là tên giả của Sevra. Một nhân vật, hai trạng thái: thương nhân che mạng và người thừa kế bỏ mạng |\n| Chiến tranh vũ trụ | The Meeting War | Cuộc chiến nổ ra khi các hành tinh phát hiện ra nhau. Cha của Daskel là sĩ quan Sennari chết trong cuộc chiến này |\n| Mạng lưới cách mạng | The Kindling | Quân cách mạng và người nằm vùng của Sevra. Tàu của mạng lưới ghé cảng Ember là TA11 (mã của gd-quan) |\n| Căn cứ của Y ở bãi vỡ | The Hearth | Khoang ẩn có khí của The Kindling, khu thứ ba của Veyl Waypost (N4). gd-world đã chốt |\n| Gián điệp của X săn Y | Maro | Giữ tên, mã WD-P2, tàu TA08 (log 90). Là người Sennari, chỉ huy toán bắt cóc |\n\nViệc truyện cần ở vai khác, đã chốt với từng vai:\n\n| Việc | Bản đã chốt | Vai đã chốt |\n|---|---|---|\n| Nơi cứu Y (mốc đóng chương 3, C3.8) | N4, Waypost Outer Ring: tàu TA04 bị toán của Maro áp mạn. Sevra nằm trong kén thoát hiểm BNG-102, người chơi kéo kén như kéo buồng ngủ đông. Mốc xong khi kén về tới Ember, qua cửa khí hoặc bằng Recall Beacon | gd-world (nơi, đường về), gd-combat (toán bắt cóc), gd-items (BNG-102) |\n| Hộ tống Y về căn cứ (C5.1) | Skiff chở nhóm và kén từ Ember tới cửa N4. Kéo kén qua vòng phong tỏa của The Wardens tới cửa The Hearth, cửa mở khi kén chạm tới. Kén không bị nhắm, không nhận sát thương. Không thêm hệ thống (log 87) | gd-world, gd-combat |\n| Nối tình báo (C4.7, C5.2) | Đơn đặt trước tự sinh của tàu TA11 (Pilot Light) mỗi ngày: Thông dịch viên đóng thùng tin mật CGO-421 từ gói tin mật STY-701 lúc Mở giao thương, tàu đến thì giao thùng, giao xong là tin tới nơi. Tàu vào lịch từ ngày kế tiếp sau C3.8 | gd-quan (TA11, nhóm hàng HC15), gd-items (CGO-421, STY-701, RCP-422) |\n| Maro | Hai lần cập bến (C3.3 và sau C3.4), rồi chỉ huy cuộc bắt cóc ở C3.8. Maro không đánh, rút lên tàu TA08 khi toán bị hạ. Tàu TA06 không là điều kiện của mốc nào ở chương 5 | gd-quan, gd-combat |\n| Trận cuối | Daskel tự tới Warden Rig để bắt Sevra. The Kindling nổi dậy ở Sennar đúng lúc hắn vắng mặt, tổ Ember giữ chân hắn ở Rig. BS-5 là Daskel, trận kết bằng khuất phục và bắt giữ, giao cho The Kindling | gd-combat |\n\nMốc gắn với Sevra và đơn tin mật (bản đủ ở mục 2.5):\n\n| Mốc | Nội dung |\n|---|---|\n| C3.7 | Dấu săn trộm: dấu săn bắt của quân The Wardens trên Driftlife (B6) |\n| C3.8 | Cứu Sevra: kén thoát hiểm của Ilsume về tới Ember, và giai đoạn 3 đã lắp |\n| C4.6 | Mở hộp ghi hành trình: Solace là mồi, Sevra kể chuyện đảo chính |\n| C4.7 | Giao xong đơn đặt trước tin mật đầu tiên cho tàu TA11, và giai đoạn 4 đã lắp |\n| C5.1 | Hộ tống: kén của Sevra chạm cửa The Hearth |\n| C5.2 | Số đơn đặt trước tin mật của TA11 đã giao xong đạt ngưỡng ở mục 3 |\n| C5.6 | Nộp bản đồ sao thật, Sevra trao tọa độ hành tinh có sự sống thật |","he-thong/cot-truyen.md",""],["Hiện hành",2,27,1,2.45,"- Phản diện là Daskel, tên độc tài của hành tinh Sennar. Hắn đảo chính lật đổ Steward Ilvane, người chủ trương chung sống hòa bình sau The Meeting War. Chế độ và quân đội của hắn là The Wardens. Cái nhìn loài người tham lam, xấu tính là cái nhìn phiến diện của riêng hắn, sinh từ hận thù vì cha hắn chết trong cuộc chiến đó (Lead sửa 2026-11-20).\n- Solace là thông tin mồi (Lead chốt). Lodestar Survey, hồ sơ tả một hành tinh sống được tên Solace và đường tới đó, do chế độ của Daskel dựng và phát qua The Lattice. Thương nhân trung lập chuyển nó đi mà không biết. Hồ sơ dẫn Cradle vào điểm phục kích: The Scattering.\n- Sevra Ilvane, con gái Ilvane và người thừa kế hợp pháp, giả làm thương nhân Ilsume. Tổ Ember cứu cô ở mốc đóng chương 3. Cô cùng mạng lưới The Kindling chuẩn bị lật đổ Daskel.\n- Chương 1 tới 3 người chơi sống sót và tìm đường tới Solace. Chương 4 lộ ra Solace là mồi và Sevra kể chuyện đảo chính. Chương 5 là hộ tống Sevra, nối tình báo qua giờ giao thương, đánh Warden Rig khi cách mạng nổ ra, rồi rời neo.\n- Kết: cách mạng thành công, Sevra lên nắm quyền và trao tọa độ một hành tinh có sự sống thật. Ember rời neo lên đường. Móc cho phần sau là hành trình tới đó, game này không kể (B9, B11).\n- Truyện có 5 chương, 40 mốc, đi một đường, không rẽ nhánh, một kết.\n- Vật manh mối chỉ đặt ở khe M của map nhánh, vật nhiệm vụ ở khe V. Vật nhiệm vụ không bao giờ mất vĩnh viễn, nộp không tiêu vật. Mọi cảnh bỏ qua được. Không có trạng thái thua của truyện.\n- Mốc xong ngay khi điều kiện đúng, không chờ cảnh. Chương đóng và dải mở theo mốc đóng chương. Chuỗi mốc cần ít nhất 26 ngày trong game, riêng chương 1 là 7 ngày (mục 5).\n- Cảnh truyện chỉ diễn ra ở điểm nghỉ của vòng ngày. Ngoài không gian chỉ có lời radio một dòng, không chặn điều khiển.\n- Năm người vớt: Ingrid Halvorsen (Kỹ sư), Linh Tran (Thông dịch viên), Rafael Ortega (Hoa tiêu), Amara Okafor (Nhà sinh học), Yusuf Demir (Trưởng cảng). Quest mở tính năng của họ theo luật ở `tram-va-cang.md`: sửa khoang của người đó.\n- Mọi luật đúng với 1 đến 4 người. Tiến trình truyện là của chung thế giới.\n- Vụ phục kích tên The Scattering (log GDM dòng 75). Tên Solace giữ nguyên. Mốc đóng chương cần giai đoạn động cơ của chương đã lắp (K25).","he-thong/cot-truyen.md",""],["1. Mục đích với người chơi",2,27,1,0.77,"- Người chơi cảm thấy: mình đang lần ra vì sao mình ở đây. Mỗi map nhánh mới trả lời một câu và mở một câu.\n- Người chơi quyết định: đi tìm manh mối kế tiếp ngay, hay làm thêm vài ngày cho trạm khỏe rồi mới đi. Truyện không ép nhịp.\n- Phục vụ pillar P4 (vũ trụ kể chuyện qua thứ bạn vớt được) và P3 (một mình vẫn trọn, có bạn thì vui hơn). Truyện cho P2 có mặt người: mỗi khoang sửa xong có một người đứng trong đó.\n- 30 giây đầu: màn hình tối, tiếng báo động yếu, một buồng ngủ đông mở. Người chơi bước ra, thấy những buồng bên cạnh (đã tắt, hoặc đang mở nếu chơi nhiều người), thấy qua cửa sổ bãi vỡ đang xoay chậm vì trạm trôi. Một dòng radio tự động của trạm báo việc đầu tiên: ra cửa khí.","he-thong/cot-truyen.md",""],["2. Luật kể chuyện",2,27,1,44.83,"","he-thong/cot-truyen.md",""],["2.1 Luật",3,31,1,13.5,"Số luật là khóa tham chiếu của các file khác, nên luật thêm sau nằm ở cuối, từ luật 19.\n\n1. `MVP` Truyện chia 5 chương. Mỗi chương là một chuỗi mốc có thứ tự. Mốc sau chỉ mở khi mốc trước đã xong. Chương đóng khi mốc đóng chương đã xong, và chỉ mốc đóng chương mới mở dải và map nhánh của chương sau. Theo K25, mỗi mốc đóng chương chỉ xong khi giai đoạn động cơ của chương đó đã lắp. Kinh tế và trạm không có cổng chương riêng.\n2. `MVP` Mỗi mốc có một danh sách điều kiện và đúng một nơi diễn ra. Mọi điều kiện trong danh sách phải cùng đúng thì mốc xong, không có điều kiện dạng \"hoặc\". Mỗi mốc xong đúng một lần trong một thế giới.\n3. `MVP` Vật manh mối chỉ đặt ở map nhánh, tại khe M cố định theo bảng khe ở mục 2.5 (K7). Không vật manh mối nào đặt ở map tổng. Vật manh mối hiện ra từ lúc mốc ghi ở cột \"Hiện từ mốc\" mở, và nằm yên tại chỗ cho tới khi có người nhặt.\n4. `MVP` Nhặt vật manh mối là ghi ngay vào Sổ tay của cả nhóm. Vật manh mối không chiếm sức chứa túi đồ và không mất khi người nhặt bị kéo về.\n5. `MVP` Vật nhiệm vụ là thứ phải đưa về trạm, đặt ở khe V của map nhánh. Vật nhiệm vụ nhỏ (mảnh lõi dẫn đường của Cinder và Wick, mẫu Driftlife mang thẻ, hộp ghi hành trình, bản đồ sao thật) chiếm túi theo luật V4 của `vat-pham.md`. Người mang bị kéo về thì chọn nó làm món giữ lại theo K2 được. Không chọn thì nó mất cùng túi và ở chuyến sau nằm lại đúng khe V của nó. Buồng ngủ đông có người là vật kéo: rơi dọc đường, hoặc người kéo bị kéo về, thì ở chuyến sau buồng nằm lại vị trí gốc. Không vật nhiệm vụ nào mất vĩnh viễn. Người trong buồng ngủ đông không chết vì người chơi thất bại.\n6. `MVP` Cảnh truyện chỉ diễn ra ở điểm nghỉ: pha Chuẩn bị, lúc vừa về tới trạm, pha Cuối ngày, và trong khu có khí của map nhánh. Không cảnh nào diễn ra trong map tổng. Không cảnh nào dừng đồng hồ giờ giao thương.\n7. `MVP` Hộp thoại chỉ có trong trạm và trong khu có khí của map nhánh (Lantern, Veyl Waypost, The Raft), ngoài giờ giao thương. Trong giờ giao thương và trong khu chân không của map nhánh, truyện chỉ nói bằng lời bong bóng trên đầu nhân vật hoặc radio, không chặn điều khiển.\n8. `MVP` Cảnh ngắn dài tối đa 3 câu. Cảnh dài (cảnh của mốc dài và cảnh mở chương 4, 5) dài tối đa 8 câu. Mọi cảnh bỏ qua được bằng một lần bấm ở bất kỳ câu nào. Bỏ qua thì Sổ tay vẫn ghi tóm tắt một câu.\n9. `MVP` Ngoài không gian không có hộp thoại. Lời nói ngoài không gian đi qua radio: một dòng chữ ở mép màn hình, tự tắt, không dừng điều khiển.\n10. `MVP` Sổ tay ở trong trạm ghi mọi mốc đã xong, mọi vật manh mối đã nhặt, và đúng một dòng mục tiêu hiện tại kèm tên nơi phải tới. Khi mốc đang mở cần một thứ chưa có (dụng cụ, khoang, tàu), dòng mục tiêu ghi thứ đó.\n11. `MVP` Quest mở tính năng của người vớt theo luật 15 ở `tram-va-cang.md`: sửa khoang của người đó. Cốt truyện chỉ thêm cảnh và lời cho quest, không thêm điều kiện. Quest không có giới hạn thời gian và không thất bại. Riêng Linh Tran có hai khoang: khoang liên lạc KH06 và cảng KH07.\n12. `MVP` Truyện không khóa vòng ngày. Khi một mốc chưa xong, người chơi vẫn ra ngoài, làm giờ giao thương, nâng cấp như mọi ngày. Mốc chỉ khóa nội dung mới: dải, lối vào map nhánh, tính năng, loại tàu.\n13. `MVP` Lối vào mỗi map nhánh mở theo một mốc ghi ở bảng \"Lối vào map nhánh\" (mục 2.5). Dải chưa mở bị chặn cứng theo `map.md`, không vào sớm được.\n14. `MVP` Lời theo trạng thái không phải cảnh và không vào hàng chờ cảnh. Nhân vật trong trạm nói một dòng khi người chơi tới gần hoặc bấm nói chuyện: chào đầu ngày, sau chuyến có hàng, sau khi người chơi bị kéo về, sau giờ giao thương, gợi ý mục tiêu. Mỗi trạng thái có 4 biến thể, không nói lại biến thể vừa nói.\n15. `MVP` Tikko có lời theo trạng thái ở cảng (cập bến, chờ, nhận đủ hàng, rời bến thiếu hàng), nói bằng bong bóng.\n16. `MVP` Truyện đi một đường. Không có lựa chọn hội thoại, không có nhánh, không có nhiều kết.\n17. `MVP` Lời truyện không chứa số và không dạy thao tác. Hướng dẫn thao tác do gd-ux viết.\n18. `MVP` Mỗi câu thoại là một chuỗi có mã riêng. Mã không hiện ra cho người chơi.\n19. `MVP` Mốc xong ngay khi điều kiện đúng, không phụ thuộc cảnh. Cảnh chỉ là phần trình bày của mốc. Mỗi người chơi có hàng chờ cảnh riêng và xem mỗi cảnh nhiều nhất một lần.\n20. `MVP` Nộp nghĩa là mang vật nhiệm vụ về tới trạm và đặt vào khoang nhận. Nộp không tiêu vật: vật vào kho của trạm và ở lại đó. Vật chỉ bị tiêu khi một danh sách sửa khoang hoặc một công thức của `vat-pham.md` dùng nó làm nguyên liệu, và các chỗ dùng đó được xếp sau mốc cần vật (bảng \"Vật nhiệm vụ và chỗ tiêu\" ở mục 6).\n21. `MVP` Mốc có điều kiện đúng ở giữa giờ giao thương (C1.8, C2.3, C3.3, C3.4, C4.7, C5.2): trong ca chỉ phát lời bong bóng. Cảnh mốc đó phát sau ca, ở màn Kết thúc giờ giao thương hoặc ở pha Cuối ngày của cùng ngày (UI-43, UI-44 của `ux-ui.md`). Khi giờ giao thương đang chạy, không cảnh nào chặn màn của bất kỳ ai trong nhóm, kể cả người không làm ca: cảnh của họ chờ tới khi ca xong.\n22. `MVP` Người vớt nằm trong buồng tỉnh vào đầu ngày kế tiếp sau khi buồng về tới trạm (luật 14 của `tram-va-cang.md`), rồi mới giao quest. Người vớt đang thức (Amara, Yusuf) giao quest ngay khi tới trạm.\n23. `MVP` \"Ngày kế tiếp sau mốc X\" nghĩa là sau ít nhất một lần ngủ kể từ lúc X xong (K23).\n24. `Sau MVP` Bốn thương nhân có tên còn lại cũng có lời theo trạng thái ở cảng như luật 15.\n25. `Sau MVP` Mỗi thương nhân có tên có một chuỗi chuyện riêng 3 đoạn. Đoạn thứ k mở khi đủ cả hai điều kiện: số lần phục vụ xong tàu của thương nhân đó đạt ngưỡng ở mục 3, và mốc ghi ở cột \"Mở sau mốc\" của bảng đề cương (mục 2.6) đã xong. Chưa đủ thì thương nhân chỉ nói lời theo trạng thái. Mỗi đoạn là tối đa 3 lời bong bóng lúc tàu cập bến, không phải cảnh, không vào hàng chờ cảnh.\n26. `Sau MVP` Sau cảnh kết game về menu chính (K24). Bản lưu nằm ở ngày cuối: động cơ chính giữ trạng thái đã xong giai đoạn 5, C5.7 và C5.8 đã xong và không phát lại, Ember không rời neo lần nữa. Người chơi vào chơi tiếp được, không có nội dung mới. Hai cảnh cuối xem lại được từ Sổ tay.\n\nXong truyện khi: mốc C5.8 xong. Truyện không có trạng thái thua.\nCam kết với người chơi: không bỏ lỡ mốc, không mất vật truyện, luôn bỏ qua được cảnh, luôn biết việc kế tiếp.","he-thong/cot-truyen.md",""],["2.2 Trạng thái và chuyển tiếp",3,31,1,4.91,"Mốc truyện (trạng thái của thế giới, host giữ):\n\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Khóa | Tạo thế giới | Mốc trước xong | Không kiểm điều kiện | Không thấy gì |\n| Mở | Mốc trước xong | Mọi điều kiện của mốc cùng đúng | Kiểm điều kiện mỗi khi một điều kiện đổi | Một dòng mục tiêu trong Sổ tay |\n| Xong | Mọi điều kiện cùng đúng | Không ra | Mở mốc sau và nội dung gắn với mốc. Thêm cảnh của mốc vào hàng chờ của từng người đang có mặt trong thế giới | Sổ tay thêm một dòng tóm tắt |\n\nCảnh của mốc (trạng thái riêng của từng người chơi):\n\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Chưa có | Tạo nhân vật | Mốc xong khi người đó đang có mặt trong thế giới | Không có gì | Không thấy gì |\n| Chờ phát | Mốc xong | Người đó tới điểm nghỉ và cảnh đứng đầu hàng chờ của họ | Nằm trong hàng chờ của riêng người đó | Dấu báo ở nhân vật hoặc khoang có cảnh |\n| Đã xem | Cảnh phát hết hoặc người đó bỏ qua | Không ra | Không phát lại, xem lại từ Sổ tay | Không còn dấu báo |\n\nNgười vào sau khi mốc đã xong không nhận cảnh của mốc đó vào hàng chờ, chỉ đọc được tóm tắt trong Sổ tay.\n\nVật manh mối:\n\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Ẩn | Tạo thế giới | Mốc ở cột \"Hiện từ mốc\" mở | Không hiện trong map nhánh | Không thấy gì |\n| Tại chỗ | Mốc đó mở | Có người nhặt | Nằm cố định ở khe M, có dấu nhận diện | Vật phát sáng nhẹ kèm dấu manh mối |\n| Đã nhặt | Có người nhặt | Không ra | Ghi Sổ tay cho cả nhóm | Thông báo một dòng và mục mới trong Sổ tay |\n\nNgười vớt nằm trong buồng (Ingrid, Linh, Rafa):\n\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Chưa tìm | Tạo thế giới | Người chơi bắt đầu kéo buồng | Buồng còn chạy trong map nhánh | Đèn buồng còn sáng |\n| Đang đưa về | Người chơi bắt đầu kéo buồng | Buồng qua cửa khí của Ember, hoặc rơi | Buồng là vật kéo theo luật 5. Rơi thì quay lại Chưa tìm | Buồng được kéo theo người chơi |\n| Hồi sức | Buồng qua cửa khí | Đầu ngày kế tiếp | Buồng nằm ở khu hồi sức, chưa giao quest | Buồng trong trạm, đèn đổi màu |\n| Đã thức | Đầu ngày kế tiếp | Quest sửa khoang của người đó xong | Người đứng trong trạm, giao quest | Cảnh đánh thức ở pha Chuẩn bị, nhân vật mới trong trạm |\n| Đã mở tính năng | Quest xong | Không ra | Đứng ở khoang của mình, có lời theo trạng thái | Khoang sáng đèn, tính năng dùng được |\n\nAmara Okafor và Yusuf Demir đang thức, không nằm trong buồng. Hai người này đi thẳng từ một mốc truyện vào trạng thái Đã thức, xem bảng người vớt của hai chương đó ở mục 2.5.","he-thong/cot-truyen.md",""],["2.3 Thứ tự xử lý",3,31,1,0.78,"Khi một điều kiện đổi (về tới trạm, nhặt vật, sửa xong khoang, tàu cập bến, ngủ dậy):\n1. Ghi đồ trong túi vào kho nếu vừa về tới trạm (luật của gd-character và gd-quan).\n2. Kiểm vật nhiệm vụ vừa về tới trạm và ghi nộp.\n3. Kiểm điều kiện của mốc đang Mở. Đủ thì mốc Xong, mở mốc sau, kiểm tiếp mốc sau cho tới khi gặp mốc chưa đủ.\n4. Với mỗi mốc vừa Xong: thêm cảnh của mốc vào cuối hàng chờ của từng người đang có mặt, theo thứ tự mốc.\n5. Cập nhật dòng mục tiêu trong Sổ tay.\n\nKhi một người chơi tới một điểm nghỉ:\n1. Hàng chờ của người đó xếp theo thứ tự: cảnh mốc (mốc xong trước phát trước), rồi cảnh đánh thức người vớt.\n2. Phát đúng một cảnh đứng đầu hàng. Cảnh còn lại chờ điểm nghỉ sau của người đó.","he-thong/cot-truyen.md",""],["2.4 Bối cảnh (bản đủ của khung B1 tới B11)",3,31,1,18.68,"| Thời điểm | Việc xảy ra | Nguồn |\n|---|---|---|\n| The Meeting War | Các hành tinh phát hiện ra nhau và đánh nhau. Loài người là một bên. Cha của Daskel, một sĩ quan Sennari, chết trong một trận với hạm đội loài người | B3, B5, Tự quyết 34 |\n| Sau chiến tranh | Steward Ilvane cầm quyền ở Sennar, chủ trương chung sống hòa bình với mọi chủng tộc. Các chủng tộc, loài người gọi chung là The Veyl, giao thương với nhau và với loài người, dùng chung Tally | B2, B3 |\n| Trái Đất cạn kiệt | Loài người vắt kiệt Trái Đất, Hệ Mặt Trời sụp đổ. Họ tìm một hành tinh để di cư, và mọi thương nhân The Veyl đều biết điều đó | B1 |\n| Đảo chính ở Sennar | Daskel lật đổ Ilvane. Để giữ ghế và gom dân Sennar về một mối sau đảo chính, hắn hướng mọi bất ổn sang một kẻ thù bên ngoài: loài người. Ilvane chết trong giam cầm. Con gái ông là Sevra, khi đó còn nhỏ, được người của cha giấu vào một thương hội | B3, B8, Tự quyết 35 |\n| Một hồ sơ xuất hiện | Chế độ của Daskel dựng Lodestar Survey: hồ sơ khảo sát một hành tinh sống được tên Solace, kèm đường tới đó. Chúng đưa nó lên The Lattice qua một nguồn ẩn danh. Thương nhân Kesh chuyển tiếp như mọi bản tin khác. Phái bộ của loài người nhận về và dịch | B4 |\n| Lập đoàn di cư | Các quốc gia lập United Accord, đóng tàu mẹ Cradle. Người lên tàu được chọn lọc, ngủ đông. Đích là Solace. Hồ sơ không kiểm chứng được từ Trái Đất, và loài người không còn lựa chọn nào khác | B1 |\n| The Scattering | Đường trong hồ sơ dẫn Cradle vào điểm phục kích trong Glass Nebula. Quân The Wardens đánh từ ngoài vào. Cradle nổ, phi hành đoàn đang thức chết. Cradle kịp phóng các Seed Station, phần lớn vỡ theo tàu mẹ | B3, B7 |\n| Sau đó | Daskel tuyên bố bãi vỡ là khu bảo hộ và đặt quân đồn trú ở Warden Rig. Quân lên Cradle, cài lại hệ an ninh, xóa dữ liệu dẫn đường. Chế độ dung túng cướp bóc: lính tháo xác tàu, bắt người, săn Driftlife đem bán. Thương nhân The Veyl trung lập vẫn lui tới rìa bãi vỡ gom hàng, không ai dám cãi lời tuyên bố | B5, B6 |\n| Sennar dưới Daskel | Hành tinh từng to đẹp và hòa bình thành hiếu chiến: ép lính, dung túng cướp bóc và tệ nạn, khơi mào chiến tranh với láng giềng. Người của Ilvane lui vào bóng tối, lập mạng lưới The Kindling: quân cách mạng và người nằm vùng | B5, B8 |\n| Sevra | Lớn lên trong thương hội dưới tên Ilsume. Cô đi các tuyến buôn The Veyl để nối người của The Kindling, và tới bãi vỡ vì đây là nơi lời nói dối lớn nhất của Daskel còn để lại bằng chứng | B8 |\n| Các trạm con | Trạm nào còn chạy thì tự đánh thức người theo chu kỳ. Lantern thức sớm và để đèn sáng. Một số trạm ghép lại thành The Raft và bỏ nhiệm vụ. Ember hỏng nặng nên chu kỳ đánh thức chạy muộn hơn nhiều năm | B7 |\n| Lúc game bắt đầu | Ember đang trôi, người chơi tỉnh dậy. Chơi N người thì N người tỉnh, buồng còn lại hỏng do hậu vụ nổ, là không may | B7 |\n| Điều game này không trả lời | Hành tinh có sự sống thật mà Sevra trao tọa độ ra sao, đường tới đó thế nào: để cho phần sau | B11 |\n\n- Cái nhìn của Daskel (B5): hắn nói loài người là loài ăn hết thế giới của mình rồi đi tìm thế giới khác. Một nửa câu đó đúng: Trái Đất cạn kiệt là thật (B1). Nửa còn lại là hận thù của một người mất cha, được đem làm chính sách. Trong game không người Sennari nào ngoài chế độ nói câu đó. Hắn dùng hận thù đó để giữ quyền.\n- Trái với hình ảnh tự dựng (B6): chế độ gọi bãi vỡ là khu bảo hộ và gọi mình là kẻ giữ nó, trong khi lính của nó gắn thẻ, cắt mô, lùa đàn đem bán. Chế độ dung túng cướp bóc và gọi đó là canh giữ.\n- Driftlife (B6): sinh vật bản địa của vùng chân không mà bãi vỡ trôi vào. Chúng kéo tới bãi vỡ vì mảnh vỡ là chỗ bám và chỗ kiếm ăn mới. Người chơi săn và bắt chúng từ chương 1 mà không biết gì về The Wardens. Cú lật nằm ở chương 3.\n- Vì sao thương nhân The Veyl không chở giúp và không báo tin hộ: lời tuyên bố khu bảo hộ cấm chở tàn dư của loài người ra khỏi bãi vỡ, và ai cũng sợ quân The Wardens. Thương nhân bán hàng được vì buôn bán ở rìa không bị cấm.\n- Vì sao Daskel chưa giết hết người sống sót: hắn cần kẻ thù còn đó. Tàn dư loài người trong khu bảo hộ là cớ để giữ quân, giữ luật thời chiến và giữ ghế. Maro đếm người để báo cáo đó luôn có số.\n- Vì sao không ai chỉ được đường tới Solace: mọi thứ thương nhân biết về Solace đều đến từ cùng một hồ sơ trên The Lattice. Người chơi tin phải vào Cradle mới có đường đi thật, và đó là lý do của chương 4.\n- Vì sao Sevra kịp lớn: người Sennari sống dài hơn người. Truyện không nêu con số.\n- Chủ đề (B10): không luật nào phạt khai thác. Chủ đề nói qua ba chỗ: lời Amara Okafor, cú lật Driftlife, và việc nuôi thay vì săn. Gốc tai nạn là hận thù và định kiến của Daskel (log GDM dòng 91). Lời hứa \"dựng khác đi\" vẫn đứng được vì Trái Đất cạn kiệt là thật.","he-thong/cot-truyen.md",""],["2.5 Năm chương",3,31,1,28.5,"- Mã mốc: `C<chương>.<thứ tự>`. Mã vật truyện: `MM<chương>.<thứ tự>`.\n- Cột \"Điều kiện\" là danh sách, các điều kiện nối bằng chữ \"và\" phải cùng đúng (luật 2).\n- Khe M là khe manh mối, khe V là khe vật nhiệm vụ, theo quy ước của `map.md` mục 2.10.\n- Boss, loài, khu trong map nhánh, khoang, loại tàu, vật phẩm là của vai khác. Ở đây chỉ ghi vai truyện và dùng đúng mã của họ.\n\nLối vào map nhánh (luật 13):\n\n| Map nhánh | Lối vào mở khi | Nhãn |\n|---|---|---|\n| N1 Station Cinder | C1.2 xong | `MVP` |\n| N3 Station Lantern | C1.9 xong | `Sau MVP` |\n| N2 Station Wick | C2.5 xong | `Sau MVP` |\n| N4 Veyl Waypost | C2.8 xong | `Sau MVP` |\n| N5 The Raft | C3.4 xong | `Sau MVP` |\n| N6 Station Flint | C3.5 xong | `Sau MVP` |\n| N7 Cradle Interior | C3.8 xong | `Sau MVP` |\n| N8 Warden Rig | C4.7 xong, chỉ vào bằng Skiff | `Sau MVP` |\n\n#### Chương 1 - Tỉnh dậy `MVP`\n\nMục tiêu người chơi: hãm trôi và neo Ember, vớt hai người đầu tiên, sửa cảng, bán chuyến hàng đầu tiên, nghe được tiếng người khác.\n\n- Cảnh mở: cảnh của C1.1, theo số người (mục 2.7). Trạm tối, xoay chậm, một dòng radio tự động của trạm.\n\n| Mốc | Tên | Điều kiện | Nơi | Mở gì |\n|---|---|---|---|---|\n| C1.1 | Tỉnh dậy | Bắt đầu thế giới | Ember, buồng ngủ đông KH01 | Cửa khí, dải Gần |\n| C1.2 | Hãm trôi và neo | Khoang neo KH04 Hoạt động | Ember | Trạm ngừng xoay. Lối vào N1 |\n| C1.3 | Một trạm khác | Tới lối vào N1 | N1, khu C1 | Vật truyện của N1 hiện ra |\n| C1.4 | Người đầu tiên | Buồng của Ingrid qua cửa khí của Ember | Ember | Ingrid vào Hồi sức, tỉnh đầu ngày kế tiếp và giao quest sửa xưởng KH05 |\n| C1.5 | Xưởng sáng đèn | Xưởng KH05 Hoạt động | Ember, xưởng | Xưởng (K12), chế được Bộ kích nguồn TOL-401 và Súng lưới cho loài nhỏ TOL-202 (log GDM dòng 49) |\n| C1.6 | Người thứ hai | Buồng của Linh qua cửa khí của Ember | Ember | Linh vào Hồi sức, tỉnh đầu ngày kế tiếp và giao quest sửa KH06 và KH07 |\n| C1.7 | Lời gọi đầu tiên | Khoang liên lạc KH06 Hoạt động và cảng KH07 Hoạt động | Ember, khoang liên lạc | Khoang liên lạc, cảng, shop (K12, K20). Tàu TA01 vào lịch từ ngày kế tiếp |\n| C1.8 | Tàu đầu tiên | Ngày kế tiếp sau C1.7 và tàu TA01 của Tikko cập bến | Ember, bến 1 | Giờ giao thương (kiểu chơi mới) |\n| C1.9 | Sóng của Lantern (đóng chương) | Số giờ giao thương đã xong đạt ngưỡng ở mục 3 và giai đoạn 1 của động cơ chính đã lắp (K25) | Ember, khoang liên lạc | Dải Giữa, lối vào N3, chương 2 |\n\n| Mã | Là gì | ID vật | Nơi | Hiện từ mốc | Nói điều gì |\n|---|---|---|---|---|---|\n| MM1.1 | Nhật ký trạm của Cinder | STY-101 | N1, khe M4 ở khoang ngủ đông trái C3 | C1.3 | Người trực của Cinder ghi một ánh chớp ở phía ngoài mạn tàu ngay trước tiếng nổ. Nghi vấn đầu tiên: thứ đó đến từ bên ngoài |\n| MM1.2 | Bản tin lưu trong máy liên lạc của Cinder | STY-111 | N1, khe M3 ở khoang lái C7 | C1.3 | Tên hồ sơ Lodestar Survey xuất hiện lần đầu, kèm dấu của The Lattice. Linh nhận ra tên này và im lặng |\n| MM1.3 | Thẻ tên hai buồng đã tắt (không bắt buộc) | STY-601 | N1, khe M1 ở C3 và khe M2 ở C5 | C1.3 | Tên hai người không qua khỏi. Mang về thì thẻ treo ở khoang buồng ngủ đông của Ember. Ingrid và Linh mỗi người có một lời riêng |\n| V1.1 | Mảnh lõi dẫn đường của Cinder (vật nhiệm vụ) | STY-102 | N1, khe V1 ở khoang lái C7 | C1.3 | Chưa có chỗ dùng ở chương 1. Sang chương 2 nó là một vật liệu sửa khoang dẫn đường KH08 |\n\n- Nhật ký trạm nằm ở khe M4 trong C3 để nhặt được ngay ở lần vào đầu tiên. Đây là vật manh mối đầu tiên của game, bước hướng dẫn T29 của gd-ux dựa vào nó. `map.md` đã có khe này.\n\nNhân vật xuất hiện: tổ Ember, Ingrid Halvorsen, Linh Tran, Tikko, Bram Kowalski (chỉ giọng qua sóng).\n\nKiểu chơi mới và cách truyện đưa vào:\n- Khai thác: khoang neo cần vật liệu, đó là lý do của chuyến ra ngoài đầu tiên (C1.2).\n- Bắt sống loài nhỏ bằng lưới: Ingrid không chịu được việc phá hỏng thứ còn nguyên. Thứ đầu tiên cô chế sau Bộ kích nguồn là Súng lưới, để mang sinh vật về mà không làm nát chúng (C1.5).\n- Giờ giao thương: lời gọi của Linh được một dân gom phế liệu Oru nghe thấy. Tikko ghé vì tò mò và trở thành khách đầu tiên (C1.8). Thùng Tikko gọi là một loại hàng Driftlife sống: Tikko gom hộ một nhà sưu tầm chưa lộ mặt. Người đó là Vaeth, tới chương 2 mới tự đến.\n\nNgười vớt của chương:\n\n| Người | Đưa về thế nào | Quest mở (luật của gd-quan) | Cảnh truyện kèm quest | Mở (K12) |\n|---|---|---|---|---|\n| Ingrid Halvorsen | Lần 1 vào Cinder: kéo buồng từ C3 về beacon B1 | Sửa xưởng KH05 | Cô tự tay kiểm từng món vật liệu người chơi giao, chê một món, nhận hết | Xưởng: chế và nâng cấp trang bị. Kèm Súng lưới cho loài nhỏ |\n| Linh Tran | Lần 2 vào Cinder: mở cửa D1 bằng Bộ kích nguồn, qua khoang máy C6, kéo buồng từ C5 về beacon B2 | Sửa khoang liên lạc KH06 và cảng KH07 | Cô phát lời gọi đầu tiên bằng ba thứ tiếng của The Veyl | Khoang liên lạc và cảng: gọi tàu, giờ giao thương, shop |\n\n- Vai truyện của boss BS-1 Scrapmaw: nó làm tổ quanh lõi năng lượng ở khoang máy C6, chắn đường duy nhất tới buồng của Linh. Hạ hay xua nó đi đều được (hai cách kết của gd-combat). Xua đi là lần đầu game cho thấy không cần giết.\n\nCảnh đóng (cảnh của C1.9, pha Cuối ngày): khoang liên lạc bắt được một giọng người lặp đi lặp lại một lời gọi cũ. Cả trạm đứng nghe. Linh trả lời. Bram Kowalski đọc vị trí của Station Lantern, và Linh giải từ sóng đó ra một khe đi qua Rạn vụn đang chặn dải Giữa (hazard của gd-world).\n\n#### Chương 2 - Không cô độc `Sau MVP`\n\nMục tiêu người chơi: phá vây cho Lantern, đưa về Nhà sinh học và Hoa tiêu, học nuôi và bắt sống Driftlife cỡ M, tìm hiểu vì sao các trạm con vỡ.\n\nMở chương: không có cảnh. Lần đầu vào dải Giữa có một dòng radio: Bram nhận ra đèn của Ember.\n\n| Mốc | Tên | Điều kiện | Nơi | Mở gì |\n|---|---|---|---|---|\n| C2.1 | Đèn của Lantern | Tới lối vào N3 | N3, Lantern Outer Ring | Trận BS-2 Tempest Gulper đang vây bến cập. Vật truyện của N3 hiện ra |\n| C2.2 | Phá vây | BS-2 xong (hạ hoặc xua) | N3, Lantern Core | Cửa cập mở. Gặp Odile Laurent, Bram, Amara. Odile ra điều kiện cho Amara đi. Tàu TA03 của Bram vào lịch từ ngày kế tiếp |\n| C2.3 | Chuyến xuồng đặc biệt | Phục vụ xong tàu Lamplighter (TA03) | Ember, bến | Bram chở Amara sang Ember. Quest sửa phòng nghiên cứu KH10 và khoang sinh quyển KH11 |\n| C2.4 | Mẫu sống cho Amara | KH10 và KH11 Hoạt động và một con Driftlife cỡ M còn sống về tới kho của trạm | Ember, phòng nghiên cứu | Nuôi Driftlife (K16). Tàu TA05 của Vaeth |\n| C2.5 | Nhịp buồng trong vành đai | Ngày kế tiếp sau C2.4 | Ember, khoang liên lạc | Lối vào N2 |\n| C2.6 | Người chỉ đường | Buồng của Rafa qua cửa khí của Ember | Ember | Rafa vào Hồi sức, tỉnh đầu ngày kế tiếp và giao quest sửa khoang dẫn đường KH08 |\n| C2.7 | Không nổ từ trong ra | Đã nhặt MM2.1 và đã nhặt MM2.2 | Ember, xưởng | Cảnh Ingrid xem mảng vỏ. Tàu TA04 của Ilsume |\n| C2.8 | Bản đồ có một lỗ đen (đóng chương) | Khoang dẫn đường KH08 Hoạt động, đã nộp mảnh lõi dẫn đường của Wick STY-103 và giai đoạn 2 của động cơ chính đã lắp (K25) | Ember, khoang dẫn đường | Bến Skiff KH09, dải Xa, lối vào N4, chương 3 |\n\n| Mã | Là gì | ID vật | Nơi | Hiện từ mốc | Nói điều gì |\n|---|---|---|---|---|---|\n| MM2.1 | Mảng vỏ thân của Station Wick | STY-211 | N2, khe M1 ở khoang ngủ đông | C2.5 | Vỏ lõm vào trong. Vết phá đi từ ngoài vào |\n| MM2.2 | Nhật ký trạm của Wick | STY-101 | N2, khe M2 ở khoang ngủ đông | C2.5 | Sau vụ nổ có kẻ cắt rời khoang hàng của Wick. Đường cắt sạch, không phải dụng cụ của loài người |\n| MM2.3 | Sổ trực của Lantern | STY-212 | N3, khe M1 ở Lantern Core | C2.1 | Danh sách xuồng Lantern cử vào dải Xa không về, kèm ghi chú về những con tàu lạ không trả lời |\n| MM2.4 | Bản Lodestar Survey Odile treo trên tường | STY-213 | N3, khe M2 ở Lantern Core | C2.1 | Lantern vẫn tin hồ sơ này và định đi tiếp tới Solace khi sửa xong động cơ |\n| MM2.5 | Thẻ tên các buồng đã tắt của Wick (không bắt buộc) | STY-601 | N2, khe M3 | C2.5 | Tên những người không qua khỏi ở Wick |\n| V2.1 | Mảnh lõi dẫn đường của Wick (vật nhiệm vụ) | STY-103 | N2, khe V1 ở khoang lái | C2.5 | Nộp ở khoang dẫn đường, là điều kiện của C2.8 |\n\n- Mảnh lõi dẫn đường của Cinder STY-102 bị tiêu khi sửa KH08 (danh sách sửa của `vat-pham.md`). Vì vậy C2.8 không đòi nộp nó lần nữa: sửa xong KH08 nghĩa là mảnh của Cinder đã được ghép.\n\nNhân vật xuất hiện: Odile Laurent, Bram Kowalski, Amara Okafor, Rafael Ortega, Vaeth, Ilsume.\n\nKiểu chơi mới và cách truyện đưa vào:\n- Bắt sống Driftlife cỡ M (gây mê, gắn Phao kéo): lưới của Ingrid chỉ bắt được cỡ S. Việc đầu tiên Amara nhờ là một con cỡ M còn sống. Cỡ L không bắt sống được, chỉ lấy mẫu sinh thiết (luật của gd-combat).\n- Dụng cụ cho C2.4, dòng mục tiêu Sổ tay ghi từng bước. Đường nhanh nhất theo `vat-pham.md` và `combat-driftlife.md`: chế Phao kéo CON-106 ở xưởng (chế nhanh), làm một con cỡ M bất lực bằng dụng cụ đã có rồi gắn phao, ví dụ Latchjaw DL-G03 ở dải Gần. Súng gây mê TOL-203 cần hai lần chế qua đêm (bản thiết kế BPR-102 rồi mới tới súng), dành cho loài phải gây mê mới bắt được.\n- Nuôi: khoang sinh quyển sửa xong thì nhận những con cỡ S đã bắt bằng lưới từ chương 1. Mốc C2.4 không đòi con cỡ M đó phải là loài nuôi được. Vaeth, nhà sưu tầm Aelith từng nhờ Tikko gom hộ ở chương 1, tự tìm tới và trả giá cao cho Driftlife sống, cho việc nuôi một lý do kinh tế đúng K9.\n- Gieo trước cho cú lật Driftlife: ở dải Giữa một phần cá thể đã mang dấu lạ (luật 30 của `combat-driftlife.md`). Amara để ý và ghi lại, chưa ai hiểu nó là gì.\n\nNgười vớt của chương:\n\n| Người | Đưa về thế nào | Quest mở (luật của gd-quan) | Cảnh truyện kèm quest | Mở (K12) |\n|---|---|---|---|---|\n| Amara Okafor | Cô đang thức ở Lantern, làm thầy thuốc bất đắc dĩ. Odile chỉ cho đi khi Lantern nhận được hàng tiếp tế. Bram chở cô sang ở mốc C2.3 | Sửa phòng nghiên cứu KH10 và khoang sinh quyển KH11 | Cô mang theo đúng một cuốn sổ, thứ duy nhất còn lại của kho giống Trái Đất | Nghiên cứu và nuôi Driftlife |\n| Rafael Ortega | Vào Wick: bật điện khoang ngủ đông bằng Bộ kích nguồn, kéo buồng về | Sửa khoang dẫn đường KH08 | Anh không chịu chạm vào bản đồ cho tới khi sửa xong khoang | Khoang dẫn đường: đọc lõi dẫn đường, mở dải Xa, Skiff |\n\nVai truyện của boss BS-2 Tempest Gulper: con đầu đàn vây Lantern, cắt đường tiếp tế. Đây là lý do nhiều năm Lantern không ra khỏi trạm được và xuồng của Bram không tới được Ember sớm hơn. Lần đầu tới Lantern là một trận cứu trạm.\n\nCảnh đóng (cảnh của C2.8): Rafa ghép lõi của Ember, Cinder và Wick. Mọi vệt mảnh vỡ chỉ về một điểm nằm trong Glass Nebula, và phần đường tới Solace trong cả ba lõi đều bị cháy đúng một chỗ. Rafa nói anh không tin vào trùng hợp, rồi tự gạt đi. Chỉ Cradle còn giữ bản đủ. Qua sóng, Odile nói người của bà vào đó chưa ai về, và nhắc tới những người đã bỏ đi: The Remainers.\n\n#### Chương 3 - Kẻ canh giữ `Sau MVP`\n\nMục tiêu người chơi: vào dải Xa, tới Veyl Waypost và The Raft, đón Trưởng cảng, biết ai đã đánh Cradle, cứu một thương nhân khỏi tay The Wardens.\n\nMở chương: không có cảnh. Lần đầu vào dải Xa có một sự kiện hình không lời: liên lạc nhiễu, trong mây khí bóng một cỗ máy rất lớn đi ngang rồi mất.\n\n| Mốc | Tên | Điều kiện | Nơi | Mở gì |\n|---|---|---|---|---|\n| C3.1 | Bến của The không ai được chở tàn dư của loài người ra khỏi đó. Lý do thương nhân chỉ dám buôn bán |\n| MM3.3 | Xác một máy thu hoạch | STY-313 | N5, khe M1 ở kho của Elias | C3.5 | Ký hiệu trên máy trùng với ký hiệu trên lời tuyên bố ở Veyl Waypost |\n| MM3.4 | Nhật ký trạm của Flint | STY-101 | N6, khe M1 | C3.5 | Flint sống sót sau vụ nổ, bốn người đã thức. Rồi lính mang giáp tới, lấy hết kho và bắt người đi. Dòng cuối: họ nói đây là khu bảo hộ, rồi họ tháo cả cửa khí |\n| MM3.5 | Manh mối lõi dẫn đường của Flint (không bắt buộc) | STY-104 | N6, khe M2 | C3.5 | Lõi của Flint cũng cháy đúng chỗ ghi đường tới Solace. Nhặt rồi thì Rafa có thêm một lời |\n| V3.1 | Mẫu Driftlife mang thẻ (vật nhiệm vụ). Loài: Shardbrood Hatchling DL-X05 theo gd-combat | STY-301 | N6, khe V1 ở khoang nghiên cứu, mở sau khi hạ BS-3 | C3.5 | Con vật mang thẻ kiểm hàng của lính The Wardens. Con mẹ của nó có sẹo cắt mô đều nhau: bị lấy mô đem bán nhiều lần. Nộp ở phòng nghiên cứu, là điều kiện của C3.6 |\n\n- Khe của N4 (M1, M2), N5 (M1), N6 (M1, M2, V1) khớp `map.md`.\n\n- Thiết bị lạ dưới bến Ember (C3.4) và lời Elias kể ở C3.5 là mốc truyện, không phải vật manh mối để nhặt.\n\nNhân vật xuất hiện: Yusuf Demir, Nhem, Dromm, Maro, Elias Vance, Wren, Ilsume (lộ là Sevra Ilvane ở mốc đóng chương), Daskel (chỉ qua lời Maro và lời phát).\n\nKiểu chơi mới và cách truyện đưa vào:\n- Sự cố trong giờ giao thương: thiết bị Maro để lại làm trạm trục trặc. Thiết bị đó cũng nghe lén lịch tàu ở cảng, nhờ vậy The Wardens biết đường đi của Ilsume. Sau khi Ingrid gỡ nó, trạm vẫn mang di chứng, nên sự cố còn lại tới hết game.\n- Kẻ địch có vũ khí: đơn vị The Wardens có ở dải Xa từ đầu chương (theo gd-combat). Người chơi đọc được tên The Wardens ngay ở Veyl Waypost (MM3.2), nhưng tới C3.8 mới biết chính chúng đã đánh Cradle, khi toán bắt cóc của Maro lộ mặt.\n- Kéo kén thoát hiểm ở mốc đóng chương: dùng lại cách kéo buồng ngủ đông của chương 1. Không thêm luật (log GDM dòng 87).\n\nNgười vớt của chương:\n\n| Người | Đưa về thế nào | Quest mở (luật của gd-quan) | Cảnh truyện kèm quest | Mở (K12) |\n|---|---|---|---|---|\n| Yusuf Demir | Ông đang thức, điều bến thuê ở Veyl Waypost từ khi trạm của ông vỡ. Ông nhờ Dromm ghé xem cảng Ember có đáng về không. Sau một ca có Dromm cập bến, người chơi dùng Skiff đón ông ở mốc C3.2. Theo K22 chuyến Skiff đó là của ngày sau ca | Sửa bến thuộc KH12 | Ông đi một vòng cảng, chê hết, rồi pha trà | Thêm bến, tiện ích cảng |\n\nHai lần cập bến của Maro (tàu TA08) và cuộc bắt cóc:\n\n| Lần | Vào lịch khi | Maro làm gì | Người trong trạm phản ứng |\n|---|---|---|---|\n| Thứ nhất (C3.3) | Bến thuộc KH12 Hoạt động | Gọi 1 thùng như mọi tàu, trả giá hời. Hỏi thăm trạm có bao nhiêu người thức | Yusuf vui vì có khách sộp. Linh thấy cách chào hơi lệch nghi thức Sennari. Ca sau có sự cố đầu tiên (C3.4) |\n| Thứ hai | Từ ngày kế tiếp sau C3.4 | Hỏi những thương hội Sennari nào hay ghé Ember. Hỏi mua bản sao dữ liệu của nhật ký trạm. Rời bến sớm | Ingrid đã gỡ thiết bị lạ, chưa biết của ai. Linh trả lời qua loa về Ilsume |\n| Cuộc bắt cóc (C3.8) | Từ ngày kế tiếp sau C3.7, khi giai đoạn 3 đã lắp | Không cập bến Ember nữa. Toán của Maro áp mạn tàu TA04 ở Waypost Outer Ring của N4 | Mốc đóng chương |\n\n- Thùng Maro gọi hay đơn đặt trước của Maro, giao hay không giao đều không đổi truyện (luật 16). Truyện đếm lần cập bến.\n- Bản sao dữ liệu chỉ sao được từ vật loại dữ liệu (nhật ký trạm, hộp ghi hành trình) theo `vat-pham.md`. Ở chương 3 chỉ có nhật ký trạm.\n- Nơi bắt cóc là đề xuất của gd-story, gd-world chốt. Toán bắt cóc là đơn vị của gd-combat.\n\n- Vai truyện của boss BS-3 Warden Reaper: máy thu hoạch của lính The Wardens đang chạy trong khoang hàng của Flint, giữa những lồng nhốt Driftlife chờ đem bán. Phá lồng thì Driftlife quay sang đánh máy (cơ chế của gd-combat). Trận này và mẫu ở khe V1 nói cùng một điều.\n\nCuộc bắt cóc và cảnh đóng của chương:\n- Ngoài không gian, chỉ lời radio (luật 8): tới Waypost Outer Ring, người chơi thấy tàu TA04 bị áp mạn,
