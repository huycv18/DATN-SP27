| Húc | Lao thẳng 5 u với 9 u/s | 16 | 0,8 | 0,5 | 1,2 | 5 | Có |\n| DL-X05 | Cắn | Nón 60 độ, tầm 1,5 | 5 | 0,7 | 0,2 | 0,5 | 3 | Có |\n\n| Loài | Tốc độ thường | Tốc độ khi đuổi hoặc chạy | Khoảng bỏ đuổi |\n|---|---|---|---|\n| DL-G01, DL-M01, DL-M02 (Hiền) | 1,5 | Bơi ra xa 3,0 khi bị tấn công | Không đuổi |\n| DL-G02, DL-X01 (Chạy trốn) | 2,0 | 7,8 (1,3 lần người chơi bậc 0) trong 3 s, nghỉ 2 s | Không đuổi |\n| DL-G03, DL-X02 (Phục kích) | Đứng yên khi bám | Không đuổi | Không đuổi |\n| DL-G04, DL-M04, DL-X05 (Đi bầy) | 2,5 | 4,5 | 12 u |\n| DL-G05, DL-M03, DL-X03 (Giữ lãnh thổ) | 2,0 | 4,5 | 10 u tính từ điểm neo |\n| DL-M05 (Săn mồi) | 2,5 | 5,0 (chậm hơn người chơi bậc 0, chạy được) | 18 u |\n| DL-X04 (Đẻ bầy, giữ tổ) | 1,0 | 3,0 | 10 u tính từ tổ |\n\nGiữ lãnh thổ bị bắn từ ngoài vùng phát hiện (ví dụ Lao từ bắn Arc Eel từ xa hơn vùng phát hiện của nó) vẫn chuyển Tấn công và đuổi người gây đòn cho tới khi người đó ra ngoài khoảng bỏ đuổi tính từ điểm neo.","he-thong/combat-driftlife.md",""],["3.5 Hồ sơ từng loài: vì sao bắt, vì sao hạ, khắc chế",3,120,4,8.08,"| ID | Hành vi riêng (không chỉ khác số) | Lý do bắt sống | Lý do hạ | Khắc chế bằng | Người chơi học gì |\n|---|---|---|---|---|---|\n| DL-G01 | Trôi thành đám quanh mảnh vỡ, ăn bụi kim loại, không phản ứng | Con nuôi đầu tiên, sinh phấn sinh học đều | Một phát lao là xong, gọn túi | Bất kỳ | Bắn, nhặt, thấy mẫu rơi |\n| DL-G02 | Thấy người thì lướt đi nhanh hơn người chơi bậc 0, không bao giờ đánh | Đơn cảng Driftlife sống giá cao, nuôi ra màng | Mẫu màng, nhưng khó đuổi kịp | Súng gây mê từ xa, Súng lưới, dồn vào góc mảnh vỡ, co-op người lùa người chặn | Tiếp cận chậm, dùng địa hình |\n| DL-G03 | Giả làm vật salvage, người lại gần 2 u thì đớp, rồi bám lại | Tuyến keo sống cho nghiên cứu | Vỏ khoáng sinh học dùng sửa khoang | Bắn từ xa trước khi lại gần, choáng rồi cạy | Không vơ mọi thứ trông như đồ nhặt |\n| DL-G04 | Bầy bỏ qua người cho tới khi một con bị đánh, rồi cả bầy lao vào từng con một theo vé | Nuôi cần từ 2 con, cho vỏ giáp đều | Từng con yếu | Súng lưới một phát 3 con, Dùi xung hình nón, rút lui khỏi 12 u | Đánh một con là đánh cả bầy |\n| DL-G05 | Tuần quanh xác có điện, miễn choáng (Dùi xung làm nó sáng thêm). Ở MVP chỉ hạ được, bắt sống từ chương 2 khi có Súng gây mê và Phao kéo | Nuôi cho tế bào điện | Tuyến điện cho linh kiện | Súng gây mê, đánh trong lúc hồi sau phóng điện, né vòng điện bằng lướt | Dụng cụ sai thì vô dụng, đọc báo trước |\n| DL-M01 | Trôi chậm khổng lồ, các loài nhỏ bám theo nó, không hạ được | Sinh thiết mẫu quý không cần làm bất lực | Không hạ được | Tiếp cận, đừng lướt va vào | Không phải con nào cũng để đánh |\n| DL-M02 | Trôi theo đàn, phát sáng soi vùng tối, chạm vào thì bỏng | Gel phát quang nuôi được, đơn cảng | Gel ít hơn | Bắn từ xa, Phao kéo khi ngủ | Giữ khoảng cách |\n| DL-M03 | Giữ thiên thạch khoáng, gặm khoáng: để yên 60 s thì một khối khoáng biến mất | Nuôi ra khoáng tinh, lý do lớn nhất để có khoang sinh quyển | Khoáng tinh ngay trong túi | Mê rồi Phao kéo, hoặc hạ nhanh để cứu khối khoáng | Combat tranh tài nguyên với thời gian |\n| DL-M04 | Bầy săn mồi bao vây, đổi màu đỏ trước khi lao | Nuôi ra gai | Gai, vỏ giáp | Súng lưới, đứng sát mảnh vỡ để giảm hướng bị lao | Vé tấn công, bao vây |\n| DL-M05 | Đuổi người, há miệng hút rồi nuốt, giữ người 2 s | Sinh thiết khi choáng | Túi tiêu hóa chứa phế liệu và linh kiện nó đã nuốt, đáng giá | Né lúc há miệng (báo trước 1 s), choáng giữa pha hút | Kẻ săn mồi lớn, đáng hạ để lấy đồ trong bụng |\n| DL-X01 | Ẩn trong mây khí, chỉ thấy khi người chơi đứng yên | Hiếm, đơn cảng giá cao nhất dải | Tinh thể lăng kính | Đứng yên quan sát, Súng lưới | Kiên nhẫn đổi lấy hàng hiếm |\n| DL-X02 | Phục kích, mặt trước dội ngược đạn và tia về người bắn | Không nuôi, chỉ hạ hoặc bắt ngủ cho nghiên cứu | Vỏ gương | Vòng ra sau, Súng gây mê từ sau | Vị trí quan trọng hơn bắn nhiều |\n| DL-X03 | Giữ vùng, chu kỳ hút kéo người vào và hút Oxy | Sinh thiết lõi khí sống | Lõi khí | Bám vào mảnh vỡ chống hút, đánh khi nó nghỉ | Hazard sống, quản lý Oxy |\n| DL-X04 | Đẻ bầy liên tục, hạ mẹ thì bầy tan | Sinh thiết túi trứng | Túi trứng | Bỏ qua bầy, đánh mẹ, co-op chia vai | Ưu tiên mục tiêu |\n| DL-X05 | Bầy con, tan khi mẹ bị hạ (bơi đi) | Nuôi, dễ bắt nhất dải Xa | Vỏ giáp nhỏ | Súng lưới | Bắt hàng loạt |","he-thong/combat-driftlife.md",""],["3.6 Đơn vị The Wardens (Sau MVP)",3,120,4,3.69,"| ID | Sinh lực | Ngưỡng choáng | Khiên | Đòn (DMG, báo trước, hồi chiêu) | Hành vi | Khác Driftlife |\n|---|---|---|---|---|---|---|\n| WD-01 Warden Harvester | 80 | 60 | Không | Không đánh người, trừ khi bị chắn đường: đẩy 0 Oxy | Bắn lưới năng lượng giữ một Driftlife, kéo về Warden Collector | Hạ thì thả Driftlife đang bị giữ (luật 33) |\n| WD-02 Warden Lancer | 120 | 100 | Khiên trước chặn 100% sát thương và choáng từ phía trước | Tia: 12, 0,7, 2,5 | Giữ khoảng cách 6 u, quay khiên về người gần nhất | Phải vòng ra sau hoặc có đồng đội đánh lạc hướng. Một mình: dùng Lao từ kéo vật nổ hoặc dụ Driftlife lãnh thổ vào |\n| WD-03 Warden Snarer | 90 | 75 | Không | Lưới trói (luật 34). Gọi 1 WD-01 mỗi 15 s | Giữ 8 u, bắn lưới vào người đang kéo vật hoặc đang bắt | Săn người đang bắt sống |\n| WD-04 Warden Collector | 600 | Miễn | Giáp toàn thân, 2 động cơ là điểm yếu (mỗi cái 150) | Thả 2 WD-01 mỗi 20 s. Tháp tia: 15, 1,0, 6 | Trôi qua dải Xa theo đường, có khoang chứa Driftlife | Phá cả 2 động cơ thì tàu rút, khoang chứa vỡ, thả 3 đến 5 Driftlife đang choáng |","he-thong/combat-driftlife.md",""],["3.7 Boss",3,120,4,7.5,"| ID | Nơi | Sinh lực (một mình) | Pha | Cơ chế chính | Cách kết | Thời lượng mục tiêu một mình | Nhãn |\n|---|---|---|---|---|---|---|---|\n| BS-1 Scrapmaw | Station Cinder, khoang máy C6 (phòng lõi năng lượng) sau cửa D1 | 600 | 2 | Pha 1 (từ đầy tới khi đứt hết 3 Neo hoặc Sinh lực dưới 50%): quấn quanh lõi, thân giữ bằng 3 Neo xúc tu trên tường. Bắn Lao từ vào một Neo rồi giữ 2 s để giật đứt (bị đánh thì hủy). Mỗi Neo đứt thì Scrapmaw Choáng 4 s, thân đánh được. Ở pha 1 thân chỉ nhận sát thương khi đang Choáng (xúc tu quấn che thân). Đòn: quét xúc tu nón 120 độ tầm 4 (8 Oxy, báo trước 0,8, hồi chiêu 4), phun 2 DL-G04 (hồi chiêu 20, tối đa 3 con sống). Pha 2: rời lõi, thân nhận sát thương mọi lúc, vẫn nối với lõi bằng một Dây nối (xúc tu dài, gốc cố định sát lõi giữa phòng). Đuổi người chơi, lao húc thẳng 5 u với 10 u/s (10 Oxy, báo trước 1,0, hồi chiêu 5). Không phun bầy. Lõi phóng điện vòng bán kính 4 u quanh lõi mỗi 10 s (8 Oxy, báo trước 1,3 bằng lõi sáng dần, vòng đỏ trên sàn hiện bán kính). Scrapmaw dính phóng điện thì Choáng 6 s: đây là cách duy nhất làm nó Bất lực ở pha 2, người chơi dụ nó vào vùng lõi lúc lõi sáng | Hạ: Sinh lực về 0 bằng Lao từ. Xua đi: Dây nối có 2 đoạn. Mỗi lần Scrapmaw Choáng 6 s ở pha 2 do phóng điện, Tương tác giữ 3 s ở gốc Dây nối (sát lõi, tầm 1,5 u) cắt được 1 đoạn. Cắt đoạn thứ hai khi Sinh lực boss dưới 50% thì boss bỏ đi. Như vậy Xua đi cần cùng lượng giao chiến như hạ, không phải đường tắt. Phóng điện đã tắt và boss đang choáng nên không có đòn nào hủy thao tác, trừ DL-G04 còn sót từ pha 1. Không cần dụng cụ chương 2 | 1 đến 2 phút | MVP |\n| BS-2 Tempest Gulper | Station Lantern, bến cập hàng ở vành ngoài | 900 | 2 | Pha 1: nuốt kiện hàng tiếp tế trôi quanh vành ngoài Lantern. Khi nó há miệng hút (báo trước 1,2 s), người chơi phóng Lao từ kéo kiện nổ vào miệng thì nó choáng 5 s. Pha 2: hút liên tục, người chơi bám mảnh vỡ hoặc dây neo, đánh 2 túi khí bên sườn | Hạ, hoặc Xua đi: choáng ở pha 2 rồi tiêm an thần vào túi khí | 3 đến 5 phút | Sau MVP |\n| BS-3 Warden Reaper | Station Flint, khoang hàng bị biến thành trạm thu | 1200 | 2 | Pha 1: máy hút Driftlife vào 3 khoang chứa. Phá mỗi khoang (200) thì thả Driftlife, chúng quay sang đánh máy. Đòn: lưỡi gặt quét (18, 1,0, 5), drone WD-01. Pha 2: khiên năng lượng, chỉ hạ khiên bằng cách kéo lõi nổ (vật trong phòng) vào máy bằng Lao từ | Hạ | 4 đến 6 phút | Sau MVP |\n| BS-4 Cradle Custodian | Cradle Interior, Lõi máy | 1000 | 3 | Hệ an ninh chặn đường tới hộp ghi hành trình, điều khiển cửa khoang và tia quét. Báo trước bằng đường quét đỏ 1,0 s. Người chơi phá 4 rơ le theo thứ tự hiện trên bảng điều khiển trong phòng. Mỗi rơ le phá xong mở một đoạn hành lang. Pha 3: lõi Custodian lộ ra | Hạ | 4 đến 6 phút | Sau MVP |\n| BS-5 Daskel | Warden Rig, Command Deck | 1500 | 3 | Pha 1: khiên được nuôi bằng Driftlife bị nhốt trong ống chứa. Giải thoát hết ống (4 ống) thì khiên tắt. Pha 2: Daskel dùng lưới The Wardens bắt người chơi như bắt Driftlife (bị trói như luật 34, tối đa 5 s). Pha 3 (Sinh lực Daskel dưới 30%): Rig quá tải, sàn vỡ dần theo đoạn trong 90 s nên chỗ đứng thu hẹp, Daskel vẫn nhận sát thương bình thường. Hết 90 s mà chưa xong thì sàn dừng vỡ ở vùng nhỏ nhất, trận tiếp tục, không có thua do hết giờ. Daskel có mặt vì tự tới bãi vỡ bắt Sevra, tổ Ember giữ chân hắn trong lúc The Kindling nổi dậy ở Sennar | Khuất phục: Sinh lực về 0 thì Daskel gục và bị bắt, giao cho The Kindling | 6 đến 9 phút | Sau MVP |\n\nSố BS-1 trước sim S5 và lý do đổi: cuối file, mục Lịch sử thay đổi.\n\nKết quả S5 hiện hành (`tools/ket-qua/sim-combat.md` mục 5):\n\n| Cách kết | Kịch bản | Số người | Phút P50 / P90 | Oxy mất do đòn mỗi người | Oxy mỗi người P50 / P90 | P90 so với bình chương 1 | Xong trong 10 phút |\n|---|---|---|---|---|---|---|---|\n| Hạ | tệ | 1 | 1,8 / 2,0 | 225 | 329 / 387 | 117% | 100% |\n| Hạ | tệ | 2 | 1,3 / 1,5 | 112 | 193 / 216 | 65% | 100% |\n| Hạ | trung bình | 1 | 1,2 / 1,3 | 99 | 172 / 200 | 61% | 100% |\n| Hạ | trung bình | 2 | 1,0 / 1,0 | 49 | 106 / 124 | 37% | 100% |\n| Hạ | trung bình | 3 | 0,9 / 0,9 | 35 | 87 / 98 | 30% | 100% |\n| Hạ | trung bình | 4 | 0,8 / 0,9 | 29 | 78 / 86 | 26% | 100% |\n| Hạ | tốt | 1 | 1,0 / 1,0 | 41 | 99 / 121 | 37% | 100% |\n| Hạ | tốt | 2 | 0,8 / 0,8 | 20 | 67 / 80 | 24% | 100% |\n| Xua đi | tệ | 1 | 1,3 / 1,8 | 176 | 253 / 356 | 108% | 80% |\n| Xua đi | tệ | 2 | 1,1 / 1,4 | 88 | 150 / 204 | 62% | 74% |\n| Xua đi | trung bình | 1 | 0,8 / 1,2 | 71 | 117 / 174 | 53% | 90% |\n| Xua đi | trung bình | 2 | 0,7 / 0,9 | 35 | 74 / 109 | 33% | 87% |\n| Xua đi | trung bình | 3 | 0,6 / 0,9 | 26 | 63 / 90 | 27% | 85% |\n| Xua đi | trung bình | 4 | 0,6 / 0,8 | 21 | 55 / 81 | 24% | 82% |\n| Xua đi | tốt | 1 | 0,7 / 0,9 | 31 | 72 / 99 | 30% | 97% |\n| Xua đi | tốt | 2 | 0,5 / 0,7 | 15 | 48 / 67 | 20% | 91% |\n\nNgưỡng choáng và mê của boss: mọi boss miễn Dùi xung và Súng gây mê, chỉ Bất lực theo cơ chế của pha (Neo đứt, phóng điện, kiện nổ). Không có thanh choáng nên không có ngưỡng để nhân theo số người. Thời gian choáng theo cơ chế không đổi theo số người. BS-1 và BS-2 là boss Driftlife nhưng dùng dòng hệ số boss ở 6b, không dùng dòng Driftlife.\n\nPhòng boss (gd-world giữ, `map.md` 2.10). Vật dựng phòng BS-2 đến BS-5 dưới đây là nhu cầu của cơ chế, đồng bộ với bảng phòng của `map.md` khi mở các boss đó (Sau MVP):\n\n| Boss | Phòng | Kích thước | Thứ trong phòng gd-combat cần |\n|---|---|---|---|\n| BS-1 | Station Cinder, khoang máy C6 | 16 x 12 u | 3 điểm neo xúc tu trên tường, lõi năng lượng giữa phòng |\n| BS-2 | Station Lantern, bến cập hàng vành ngoài | 32 x 20 u | Kiện hàng trôi đẩy được, mảnh vỡ và dây neo để bám khi bị hút |\n| BS-3 | Station Flint, khoang hàng thành trạm thu | 28 x 16 u | 3 lồng giữ Driftlife, lõi nổ kéo được |\n| BS-4 | Cradle Interior, Lõi máy | 32 x 24 u | 4 rơ le, bảng điều khiển hiện thứ tự |\n| BS-5 | Warden Rig, Command Deck | 36 x 24 u | 4 ống chứa Driftlife, sàn vỡ theo đoạn ở pha 3 |\n\nNúm gap: Sinh lực Driftlife và Sinh lực boss nối sát thương dụng cụ (gd-items) với thời gian hạ mục tiêu ở mục 5.\n\n| Công thức | Biến | Ví dụ |\n|---|---|---|\n| Số phát trúng để hạ = trần(Sinh lực x hệ số người chơi / sát thương mỗi phát) | Hệ số người chơi ở mục 6b | Chỉ là thời gian bắn thuần, chưa tính trượt và bay tới (sim ra 11,2 s cho Arc Eel). Arc Eel một mình, Lao từ bậc 1: trần(80 x 1 / 10) = 8 phát, bắn liên tục 6,4 giây |","he-thong/combat-driftlife.md",""],["3.8 Bắt sống so với hạ (sim của gd-tech)",3,120,4,5.28,"Nguồn: `tools/sim-combat.mjs` của gd-tech (có thời gian bay tới, cạy Latchjaw, cột ròng trừ vật tiêu hao theo ITEM LIST). Số bảng dưới lấy từ `tools/ket-qua/sim-combat.md` của gd-tech, gồm luật Chạy trốn và giá trị mẫu của gd-items.\n\n| Thông số lần chạy | Giá trị |\n|---|---|\n| Kịch bản | Một người trung bình (trúng 0,7, né 0,6, giả định của gd-tech) |\n| Số trận mỗi ô | 2000, seed 1 |\n| Giờ chạy | 21:50 UTC ngày 19/11, tức 04:50 giờ máy ngày 20/11 (chép bằng script, không chép tay) |\n\nĐiều chỉnh để bắt không áp đảo hạ:\n\n| Số | Bản đầu | Hiện hành | Lý do |\n|---|---|---|---|\n| Ngưỡng choáng, ngưỡng mê cỡ M | Thấp hơn Sinh lực | Khoảng 1,5 lần Sinh lực (Lumen Jelly 2 lần). Riêng ngưỡng mê Arc Eel 90, Mirror Mantis 280 (2 lần Sinh lực, vì mặt gương làm hạ chậm nên bắt dễ trội) | Làm bất lực không được nhanh hơn hạ |\n| Dùi xung | 25 điểm Choáng mỗi 0,5 s | 20 điểm | Dùi xung từng nhanh gấp 4 lần Lao từ |\n| Súng gây mê | 35 điểm Mê mỗi 1,2 s | 60 điểm mỗi 3 s | Bớt số Ống gây mê mỗi lần bắt mà giữ nhịp mê chậm |\n| Mẫu sinh thiết cỡ L | Bằng k nhân giá trị khi hạ | Thấp hơn giá trị khi hạ (gd-items) | Sinh thiết nhanh hơn hạ nhiều |\n\n| Loài | Đường bắt | Giây hạ | Giây bắt | GTĐ vật tiêu hao mỗi lần bắt | Bắt chia hạ, gộp | Bắt chia hạ, ròng |\n|---|---|---|---|---|---|---|\n| DL-G01 Driftmoth | Súng lưới (MVP) | 3,3 | 3,3 | 1,6 | 1,90 | 1,33 |\n| DL-G01 Driftmoth | Dùi xung rồi bắt tay (MVP) | 3,3 | 5,6 | 0,0 | 1,10 | 1,10 |\n| DL-G02 Skitter Ray | Súng lưới (MVP) | 8,2 | 3,3 | 1,6 | 4,67 | 3,41 |\n| DL-G02 Skitter Ray | Dùi xung rồi bắt tay (MVP) | 8,2 | 5,6 | 0,0 | 2,71 | 2,71 |\n| DL-G04 Sting Krill | Súng lưới (MVP) | 3,3 | 3,3 | 1,5 | 1,76 | 1,08 |\n| DL-G04 Sting Krill | Dùi xung rồi bắt tay (MVP) | 3,3 | 5,6 | 0,0 | 1,02 | 1,02 |\n| DL-G05 Arc Eel | Súng gây mê rồi Phao kéo (Sau MVP, đường mê) | 11,2 | 11,6 | 21,0 | 4,96 | 1,57 |\n| DL-G03 Latchjaw | Dùi xung rồi Phao kéo (Sau MVP) | 8,9 | 8,7 | 7,9 | 2,87 | 1,53 |\n| DL-M02 Lumen Jelly | Dùi xung rồi Phao kéo (Sau MVP) | 7,9 | 7,4 | 7,9 | 2,32 | 1,61 |\n| DL-M03 Orebiter | Dùi xung rồi Phao kéo (Sau MVP) | 15,9 | 17,6 | 7,9 | 1,86 | 1,35 |\n| DL-M04 Needlefin | Súng lưới (MVP) | 4,7 | 3,3 | 1,5 | 2,67 | 2,27 |\n| DL-M04 Needlefin | Dùi xung rồi bắt tay (MVP) | 4,7 | 5,6 | 0,0 | 1,55 | 1,55 |\n| DL-M05 Gulper | Dùi xung rồi Phao kéo (Sau MVP) | 36,6 | 10,7 | 7,8 | 2,57 | 1,54 |\n| DL-X01 Prism Wisp | Súng lưới (MVP) | 9,2 | 3,3 | 1,6 | 5,24 | 5,00 |\n| DL-X01 Prism Wisp | Dùi xung rồi bắt tay (MVP) | 9,2 | 5,6 | 0,0 | 3,04 | 3,04 |\n| DL-X02 Mirror Mantis | Súng gây mê rồi Phao kéo (Sau MVP, đường mê) | 33,9 | 25,9 | 40,7 | 3,16 | 1,31 |\n| DL-X03 Storm Siphon | Dùi xung rồi Phao kéo (Sau MVP) | 47,9 | 19,9 | 7,8 | 1,43 | 1,09 |\n| DL-X04 Shardbrood Queen | Dùi xung rồi Phao kéo (Sau MVP) | 42,3 | 18,1 | 7,8 | 1,39 | 1,05 |\n| DL-X05 Shardbrood Hatchling | Súng lưới (MVP) | 4,7 | 3,3 | 1,6 | 2,62 | 2,44 |\n| DL-X05 Shardbrood Hatchling | Dùi xung rồi bắt tay (MVP) | 4,7 | 5,6 | 0,0 | 1,52 | 1,52 |\n\nHai thước đo khác nhau, không lẫn:\n\n| Thước đo | Định nghĩa | Mục tiêu | Ai kiểm |\n|---|---|---|---|\n| K9 (luật 24) | Giá trị một mẫu sống chia giá trị một lần hạ cùng loài | 1,5 đến 2 lần (khung mục 9) | gd-items, script của `vat-pham.md` |\n| Ròng mỗi phút (đề sim S2) | Giá trị mỗi phút của bắt trừ vật tiêu hao, chia giá trị mỗi phút của hạ | Từ 1,0 cho mọi loài (bắt không thiệt). Cỡ M bắt bằng choáng hoặc mê không quá 1,6. Cỡ S được vượt vì bị chặn bởi Lồng mẫu 3 con mỗi người mỗi chuyến | gd-tech, sim combat |\n\nCột ròng theo thước đo thứ hai:\n\n| Nhóm | Loài và ròng | Kết luận |\n|---|---|---|\n| Trong 1,2 đến 1,6 | DL-G01 (Súng lưới), DL-G03, DL-G05 (đường mê, Sau MVP), DL-M03, DL-M05 (sinh thiết) | Đạt |\n| Sát trên 1,6 | DL-M02 | Đạt, lệch dưới 0,05 |\n| Dưới 1,2 nhưng từ 1,0 | DL-G04 (bầy, hạ một phát là xong, sim tính bắt từng con dù một phát lưới được nhiều con), DL-X03, DL-X04 (sinh thiết, ngoài K9) | Đạt mức sàn 1,0, bắt không thiệt |\n| Trên 1,6, cỡ S | DL-G02, DL-X01 (Chạy trốn), DL-M04, DL-X05 (bầy) | Chấp nhận: chặn bằng Lồng mẫu 3 con. Loài Chạy trốn cố ý khó hạ để dạy dùng Súng lưới |\n| Cỡ M bắt bằng mê | DL-X02: mặt gương bắt người chơi vòng ra sau cho mọi phát, nên hạ nhiều phát chậm hơn bắt ít phát mê. Ngưỡng mê 280 (2 lần Sinh lực) | Trong 1,2 đến 1,6, đạt |\n| Đường Dùi xung rồi bắt tay (cỡ S) | Mọi loài cỡ S: ròng thấp hơn đường Súng lưới cùng loài ở bảng trên, bắt mất lâu hơn | Không trội: không tốn vật tiêu hao nhưng chậm. Là đường cho người hết Lưới cuộn |\n\nỞ MVP, Arc Eel chỉ hạ được (bắt cần Súng gây mê và Phao kéo của chương sau). Dòng Arc Eel ở bảng trên là đường bắt của chương sau.\n\n| S3 sau khi sửa | Giá trị |\n|---|---|\n| Bất lực trong 60 giây, 4 người dùng Dùi xung liên tục | 18 đến 32% |\n| Mục tiêu | Dưới 70% |","he-thong/combat-driftlife.md",""],["4. Trường hợp biên",2,106,4,3.3,"| # | Ca | Phán quyết |\n|---|---|---|\n| E1 | Oxy còn 3, trúng đòn 8 | Oxy về 0, vào Ngạt. Không có Oxy âm |\n| E2 | Hai đòn trúng cùng khung | Đòn đầu trừ Oxy và kích miễn sát thương. Đòn sau chỉ đẩy lùi |\n| E3 | Bắn Dùi xung liên tục một con với 4 người | DR: sau mỗi lần tỉnh miễn 2 s, ngưỡng tăng 1,5 lần tới trần 3. Không khóa được mãi (sim kiểm ở mục 8) |\n| E4 | Súng lưới trúng 5 con S cùng vùng | Bắt 3 con gần tâm nhất. 2 con còn lại chạy theo kiểu |\n| E5 | Lồng đã đủ 3 con khi bắt S | Không bắt được, con vật vẫn bất lực, thông báo lồng đầy. Súng lưới không tiêu Lưới cuộn khi mọi con trong vùng không vào được lồng |\n| E6 | Đang gắn Phao kéo thì bị đánh | Hủy gắn, phao không mất |\n| E7 | Con đang Ngủ bị đồng đội bắn | Tỉnh ngay, đòn đầu x2 sát thương (luật 16). Co-op cần ping trước khi bắt |\n| E8 | Đang Kích Recall thì bầy lao tới | Bị đánh là hủy Kích Recall (K4). Phải dọn hoặc né rồi kích lại |\n| E9 | Người chơi ngạt trong phòng boss, đồng đội còn đánh | Người ngạt không bị boss nhắm tới, không nhận sát thương (luật 10), chờ cứu hoặc bị kéo về theo K2. Boss không hồi. Boss chỉ hồi theo luật 36: không còn người chơi nào trong phòng quá 10 giây, hoặc cả nhóm đã về trạm |\n| E10 | Boss vừa về 0 Sinh lực đúng lúc đủ điều kiện Xua đi | Hạ thắng vì bước 2 xử lý trước. Xua đi chỉ hoàn tất bằng Tương tác 3 giây |\n| E11 | Người bắt rớt mạng giữa lúc giữ Tương tác | Việc bắt hủy. Con vật vẫn bất lực tới hết thời gian. Mất kết nối quá 15 giây thì người đó tính như bị kéo về (C10), Lồng mẫu theo luật 25 |\n| E12 | Lao từ trúng đồng đội đang Ngạt | Kéo người ngạt về phía người bắn để chia Oxy nhanh hơn (luật chia Oxy của gd-character). Không kéo theo Lồng mẫu của người ngạt (K27) |\n| E13 | Warden Harvester bị hạ khi đang kéo Driftlife cỡ L | Con L được thả, choáng 6 s, chỉ sinh thiết được (L không bắt sống) |\n| E14 | Mirror Mantis dội Lao từ về người bắn | Đòn dội gây 50% sát thương của đòn gốc vào Oxy người bắn, có miễn sát thương như đòn thường |\n| E15 | Hai người cùng Tương tác bắt một con | Người bắt đầu trước được. Người sau nhận thông báo \"đang có người bắt\" |\n| E16 | Spam Kết nhanh lên con vừa tỉnh | Không làm được, Kết nhanh chỉ áp con đang Bất lực |\n| E17 | Con cỡ S bất lực, người chơi giữ cả phím Tương tác và phím Kết nhanh | Thao tác bấm trước được thực hiện, thao tác sau bị bỏ qua tới khi thả phím |\n| E18 | Lồng còn 1 chỗ, Súng lưới trúng 3 con | Bắt 1 con gần tâm nổ nhất, tiêu 1 Lưới cuộn. Hai con còn lại chạy theo kiểu |\n| E19 | Ba người đã về trạm hoặc bị kéo về, người cuối còn ngoài không gian | Driftlife chưa giao chiến tính lại hệ số Sinh lực và ngưỡng theo số người còn ngoài không gian. Con đang giao chiến giữ hệ số tới hết trận. Mật độ (k(N) của gd-world) giữ như lúc sinh |\n| E20 | Người một mình đang kéo kén của Sevra bị Warden Snarer trói | Không Lướt được khi kéo vật lớp Nặng, nên lưới tự tan sau tối đa 2 giây (luật 34). Muốn thoát sớm thì thả kén rồi Lướt, sau đó kéo lại. Một mình luôn thoát được (C1) |","he-thong/combat-driftlife.md",""],["5. Ràng buộc vật lý của luật",2,106,4,1.05,"- Trần khóa liên tục: với hệ số DR 1,5 và trần 3, thời gian Choáng một con trên một phút giảm dần. Ước một người với Dùi xung bậc 1 giữ con DL-G05 không thể vì miễn choáng, giữ DL-M03 bất lực tối đa khoảng 40% thời gian. Đã đo bằng sim S3 (kết quả ở cuối mục 3.8): 4 người dùng Dùi xung liên tục giữ một con Bất lực 18 đến 32% thời gian trong 60 giây, dưới mục tiêu 70%.\n- Vé tấn công giới hạn số đòn cùng lúc: một người ở dải Gần chịu tối đa 2 đòn có vé trong một chu kỳ, cộng đòn vùng. Trần Oxy mất do combat mỗi giây vì vậy có giới hạn, sim S1 đo.\n- Súng lưới bắt tối đa 3 con một phát, nên bầy 8 con cần 3 phát. Số con bắt được một chuyến bị chặn bởi số Lưới cuộn mang theo và 1 lồng 3 con mỗi người.\n- Cỡ L không bắt sống được bằng luật, nên khoang sinh quyển chỉ chứa S và M.\n- Một mình phải thắng được mọi boss: không cơ chế boss nào cần hai người đứng hai chỗ cùng lúc. BS-1 Neo xúc tu giật lần lượt được, BS-5 ống chứa phá lần lượt được.","he-thong/combat-driftlife.md",""],["6. Yêu cầu cho engineer và tool",2,106,4,1.6,"Dữ liệu (gd-tech dựng ScriptableObject):\n\n| Bảng | Trường |\n|---|---|\n| Loài | ID, tên, dải, cỡ (S, M, L, Boss), kiểu hành vi, sinh lực, ngưỡng choáng, ngưỡng mê, danh sách miễn, vùng phát hiện, khoảng bỏ đuổi, bắt sống được không, cách bắt, nuôi được không, bảng rơi khi hạ, bảng rơi khi bắt, nhãn MVP |\n| Đòn | ID, loài, kiểu (cận, xa, vùng, tiếp xúc, nuốt), DMG Oxy, báo trước, thời gian đánh, hồi, hồi chiêu, cần vé không, hình dạng vùng trúng, lực đẩy |\n| Dụng cụ (luật) | ID theo `vat-pham.md` (TOL, CON), sát thương, điểm choáng, điểm mê, trễ tác dụng, vùng, nhịp, tầm, đạn |\n| Boss | ID, pha, mốc chuyển pha, cơ chế mỗi pha, cách kết, phần rơi mỗi cách kết |\n| Hệ số co-op | Tham số mục 6b |\n\nSự kiện cần phát (để UI, audio, event tracking dùng): `trung_don_nguoi_choi`, `driftlife_choang`, `driftlife_ngu`, `driftlife_tinh`, `bat_song_xong`, `ha_driftlife`, `bat_that_bai`, `boss_chuyen_pha`, `boss_ket` (kèm cách kết), `ve_tan_cong_cap`, `ve_tan_cong_tra`.\n\nĐồng bộ co-op: host giữ Sinh lực, thanh Choáng, thanh Mê, trạng thái của mọi kẻ địch. Máy người chơi hiện hiệu ứng trúng ngay khi bắn, host xác nhận. Oxy của mỗi người do máy người đó tính, host kiểm. Hitstop chỉ là hiệu ứng hình trên máy người bắn và người trúng, không dừng mô phỏng chung (C7).\n\nNơi phải cùng đổi khi đổi luật này: bảng Loài và Đòn, sim combat (mục 8), tab Enemy, `vat-pham.md` (dụng cụ), `nguoi-choi.md` (trạng thái Trúng đòn, lướt), tutorial của gd-ux.","he-thong/combat-driftlife.md",""],["6b. Co-op 1 đến 4 người",2,106,4,4.12,"| Chỉ số | Công thức theo số người N | N=1 | N=2 | N=3 | N=4 |\n|---|---|---|---|---|---|\n| Sinh lực, ngưỡng choáng, ngưỡng mê Driftlife, dải Gần | N chia k(N) của dải | 1 | 1,54 | 1,88 | 2,11 |\n| Sinh lực, ngưỡng choáng, ngưỡng mê Driftlife, dải Giữa | N chia k(N) của dải | 1 | 1,6 | 2 | 2,29 |\n| Sinh lực, ngưỡng choáng, ngưỡng mê Driftlife, dải Xa | N chia k(N) của dải | 1 | 1,45 | 1,7 | 1,87 |\n| Số Driftlife một chuyến, dải Gần | k(N) = 1 + 0,3 x (N - 1), `map.md` 3.8 | 1 | 1,3 | 1,6 | 1,9 |\n| Số Driftlife một chuyến, dải Giữa | k(N) = 1 + 0,25 x (N - 1), `map.md` 3.8 | 1 | 1,25 | 1,5 | 1,75 |\n| Số Driftlife một chuyến, dải Xa | k(N) = 1 + 0,38 x (N - 1), `map.md` 3.8 | 1 | 1,38 | 1,76 | 2,14 |\n| Gánh mỗi người so với một mình = k(N) x hệ số Sinh lực / N | Kiểm, mục tiêu 0,9 đến 1,1 | 1 | 1 | 1 | 1 |\n| Sinh lực boss (kể cả BS-1, BS-2) và đơn vị The Wardens | Gốc x (1 + 0,6 x (N - 1)) | 1 | 1,6 | 2,2 | 2,8 |\n| Ngưỡng choáng đơn vị The Wardens | Gốc x (1 + 0,6 x (N - 1)) | 1 | 1,6 | 2,2 | 2,8 |\n| Ngưỡng choáng, mê boss | Không có, boss chỉ Bất lực theo cơ chế (3.7) | | | | |\n| Sát thương lên người chơi | Không đổi | 1 | 1 | 1 | 1 |\n| Vé tấn công | Mỗi người giữ vé riêng (luật 9) | 2 | 4 | 6 | 8 |\n\nKết quả S4 (sim của gd-tech, `tools/ket-qua/sim-combat.md` bảng 4, sim tự tính hệ số từ `map.md`). \"Dồn\" là cả nhóm cùng xử một con, so với mỗi người xử riêng phần mình, loài cỡ M và L:\n\n| Cách chơi | Cỡ | N = 2 | N = 3 | N = 4 |\n|---|---|---|---|---|\n| Mỗi người xử riêng | Mọi cỡ | 1,00 | 1,00 | 1,00 |\n| Cả nhóm cùng hạ một con | M, L | 1,01 đến 1,18 | 1,04 đến 1,29 | 1,07 đến 1,38 |\n| Cả nhóm cùng bắt một con | M, L | 0,65 đến 1,16 | 0,69 đến 1,40 | 0,76 đến 1,57 |\n| Cả nhóm cùng hạ một con | S | 0,85 đến 1,32 | 0,80 đến 1,60 | 0,95 đến 1,93 |\n| Cả nhóm cùng bắt một con | S | 1,21 đến 1,34 | 1,43 đến 1,68 | 1,67 đến 2,04 |\n\nMục tiêu của S4 (mục 8) áp cho kiểu chia (mỗi người xử riêng). Kiểu dồn chỉ để đọc kết quả. Nhận kết quả, không đổi số. Đi theo cặp gần như không tốn thêm, và với Orebiter, Storm Siphon, Shardbrood Queen còn lợi hơn (một người choáng, một người bắt). Cả nhóm bốn người dồn vào một con thì tốn hơn, nên nhóm tự tách thành hai cặp, đúng kiểu chia vai mong muốn (P3). Loài cỡ S dồn tốn rõ hơn vì máu mỗi con nhân theo N mà con S chết hoặc dính lưới sau một hai phát, nên cả nhóm vây một con nhỏ là phí. Chấp nhận, kể cả 2 người ở MVP: loài cỡ S trôi rải rác hoặc theo bầy, nên mỗi người một hướng là cách chơi chung tự nhiên, và Súng lưới bắt nhiều con một phát.\n\nLuật co-op:\n- N là số người đang ở ngoài không gian trong cùng map lúc kẻ địch sinh ra hoặc lúc vào phòng boss. Số người ngoài không gian giảm giữa chuyến thì áp E19. Người rời phiên giữa trận thì hệ số giữ nguyên tới hết trận đó.\n- Bắt sống: người hoàn tất thao tác bắt nhận mẫu vào lồng mình kéo. Đồng đội nhận lồng bằng thao tác Trao đồ của gd-character. Phao kéo gửi về kho chung (C3), không cần ai mang.\n- Hạ: nguyên liệu rơi thành vật trôi, ai vào bán kính hút nhặt trước thì nhặt được (luật nhặt của `nguoi-choi.md`). Vật rơi trôi 60 giây rồi biến mất, cùng luật vật thả của `nguoi-choi.md` 2.4.\n- Ngắm và vé riêng từng người nên mỗi người chịu áp lực như chơi một mình. Thêm người là thêm tay chia vai: một người choáng, một người bắt, một người lùa.\n- Không luật nào cần đúng N người. Mọi cơ chế co-op (lùa Skitter Ray, đánh lạc hướng Lancer, cắt lưới cho đồng đội) đều có cách làm một mình.\n- Hệ số Sinh lực và số Driftlife nhân chồng lên nhau, nên hai vai chốt chung (gd-world, `map.md` 3.8): tích chia N gần 1, mỗi người gánh khoảng bằng lúc chơi một mình. Ngưỡng choáng và ngưỡng mê dùng cùng hệ số với Sinh lực để bắt sống trong co-op không khó hơn hạ. DR chặn khóa vĩnh viễn (sim S3).","he-thong/combat-driftlife.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,106,4,2.63,"| Sự kiện | Hình (VFX, trạng thái) | Âm (SFX) | Text, tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Báo trước đòn | Thân con vật sáng màu đòn (vàng thường, đỏ đòn lớn), viền vùng trúng hiện mờ với đòn vùng | Âm tích ngắn, cao dần | Tutorial chương 1: \"Sáng đỏ là sắp đánh, lướt để né\" | MVP |\n| Đòn từ ngoài màn | Mũi tên ở mép màn chỉ hướng kẻ địch, màu theo mức đòn (vàng, đỏ), hiện suốt pha Báo trước | Âm báo trước phát theo hướng (stereo) | Không | MVP |\n| Người chơi trúng đòn | Nhân vật nháy trắng 2 khung, thanh Oxy tụt có vệt đỏ phần mất, rung màn nhẹ | Âm va đập mũ, tiếng thở gấp | Lần đầu: \"Bị đánh mất Oxy\" | MVP |\n| Miễn sát thương | Nhân vật nhấp nháy 0,8 s | Không | Không | MVP |\n| Lao từ trúng | Hitstop 3 khung, tia lửa, dây căng | Âm xuyên, dây rít | Không | MVP |\n| Choáng | Vòng xanh dương quanh con vật, sao quay, đồng hồ vòng đếm ngược | Âm điện xẹt rồi ù | Tutorial: \"Con vật choáng, lại gần để bắt hoặc Kết nhanh\" | MVP |\n| Ngủ | Vòng tím, bong bóng Z, đồng hồ vòng | Âm ngáy nhẹ | Tutorial chương 2 | Sau MVP |\n| Bắt được | Súng lưới co lại, mẫu bay vào lồng, hiện số sao | Âm \"pốp\" vui, hợp âm ngắn theo số sao | Lần đầu: \"Mẫu sống giá trị hơn\" | MVP |\n| Phao kéo bay về | Phao bật đèn, kéo con vật bay về hướng trạm, có vệt | Âm động cơ nhỏ xa dần | Không | Sau MVP |\n| Hạ | Con vật vỡ, nguyên liệu trôi ra có viền sáng | Âm vỡ trầm | Không | MVP |\n| Miễn choáng (Arc Eel) | Dùi xung làm nó sáng thêm, biểu tượng \"miễn\" | Âm dội | Lần đầu ở chương 1: \"Con này không choáng được, chưa có cách bắt\" | MVP |\n| Chuyển pha boss | Boss gầm, màn tối viền, khung chậm 0,3 s | Nhạc boss đổi đoạn | Tên boss hiện ở lần gặp đầu | MVP |\n| Bị lưới The Wardens trói | Súng lưới năng lượng đỏ quấn nhân vật, nút \"Lướt x3\" | Âm điện rè | Lần đầu hiện cách thoát | Sau MVP |\n| Dấu săn bắt | Vết lưới năng lượng và vết cắt của quân The Wardens trên thân một số cá thể | Không | Nhà sinh học bình luận khi mang mẫu về | Sau MVP |\n\nArt: mỗi loài cần hoạt ảnh Trôi, Cảnh giác, Báo trước (mỗi đòn), Đánh, Hồi, Choáng, Ngủ, Bị hạ. Silhouette mỗi loài khác nhau rõ ở cỡ nhỏ. Màu nhận diện theo kiểu: hiền màu lạnh, săn mồi và lãnh thổ có điểm đỏ hoặc vàng. Gửi GDM cho tab Assets, AUDIO ASSETS LIST.\nTutorial (gd-ux):\n\n| Chương | Dạy |\n|---|---|\n| 1 | Bắn, Né bằng lướt, Choáng, Kết nhanh, Súng lưới, Lồng mẫu, sao chất lượng |\n| 2 | Mê, Phao kéo, Sinh thiết |","he-thong/combat-driftlife.md",""],["7b. Cảm giác (game feel)",2,106,4,0.87,"- Tham chiếu: lao móc trúng thì dây căng và con vật giật về phía người chơi (khoảnh khắc lao trúng cá to rồi giữ dây trong Dave the Diver). Choáng là ngắt rõ ràng, con vật đơ hẳn, không lờ mờ.\n- Hitstop: đòn nhẹ 2 đến 3 khung (30 đến 50 ms), đòn nặng và đứt Neo boss 4 đến 6 khung (60 đến 100 ms). Nguồn: `docs/knowledge/indie/20-combat.md` mục 3.\n- Rung màn: chỉ khi người chơi trúng đòn từ 15 Oxy và khi boss chuyển pha. Biên độ thấp vì người chơi cần định hướng khi bay 8 hướng. Có tùy chọn tắt rung trong cài đặt.\n- Phản tham chiếu: tránh cảm giác bắn súng không gian (không đạn tràn màn hình, không nổ lớn liên tục). Người chơi là người sống sót, không phải phi công chiến đấu.\n- Mỗi lớp phản hồi (hitstop, rung, chớp, hạt, âm) là một tham số bật tắt được để thử trên prototype.","he-thong/combat-driftlife.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,106,4,2.59,"","he-thong/combat-driftlife.md",""],["Đề sim combat cho gd-tech",3,136,4,3.84,"| Mã | Câu hỏi | Đầu vào | Đầu ra | Mục tiêu ý đồ |\n|---|---|---|---|---|\n| S1 | Combat ăn bao nhiêu Oxy một chuyến | Mục 3.4, mật độ của gd-world, bình Oxy bậc 0 đến 4 của gd-character, 3 kiểu người chơi (né giỏi, trung bình, kém) | Oxy mất do combat mỗi chuyến, tỉ lệ chuyến hết Oxy | Combat chiếm 10 đến 25% Oxy một chuyến người chơi trung bình. Hết Oxy 10 đến 20% (khung mục 9) |\n| S2 | Bắt sống có áp đảo hạ không | Mục 3.3, 3.4, bảng 3.8, giá vật tiêu hao của gd-economy | Giá trị ròng mỗi phút của bắt và hạ mỗi loài (giá trị mẫu trừ vật tiêu hao), theo từng đường bắt | Như bảng \"Hai thước đo\" ở 3.8: từ 1,0 cho mọi loài, cỡ M bắt bằng choáng hoặc mê không quá 1,6, cỡ S được vượt vì chặn bằng Lồng mẫu. Không phải K9 |\n| S3 | Co-op có khóa vĩnh viễn được không | Luật 13, 17, mục 6b, N = 1 đến 4 | Tỉ lệ thời gian một con bị Bất lực trong 60 s | Dưới 70% với N = 4 |\n| S4 | Gánh combat mỗi người theo số người | Mục 6b, k(N) của gd-world | Thời gian combat mỗi người mỗi chuyến với N = 1 đến 4, thời gian hạ mỗi boss | Gánh mỗi người 0,9 đến 1,1 lần chơi một mình. Boss nhóm 4 mất 60 đến 75% thời gian một mình |\n| S5 | Boss dài bao lâu, tốn bao nhiêu Oxy | Mục 3.7 | Thời lượng mỗi boss và Oxy mỗi người (P90), một mình và 4 người | Thời lượng theo cột mục tiêu ở 3.7. Người trung bình đánh một mình: Oxy P90 không quá 75% bình Oxy của chương. Người tệ đánh một mình: Oxy P50 không quá 100% bình (có thể thua lần đầu, nhưng không phải chắc thua) |\n| S6 | Báo trước đủ để né không | Báo trước, tốc độ, gia tốc, hãm của prototype bộ đẩy | Thời gian từ thấy báo trước tới ra khỏi vùng trúng | Ra khỏi vùng trúng trước khi đòn đánh, với phản xạ 0,27 s |","he-thong/combat-driftlife.md",""],["Tiêu chí nghiệm thu (gd-qa kiểm)",3,136,4,1.34,"1. Mỗi loài có ít nhất một lý do bắt sống và một lý do hạ (hoặc ghi rõ vì sao không hạ được) ở bảng 3.5.\n2. Không hai loài cùng kiểu hành vi và cùng cách khắc chế. Kiểm bằng bảng 3.5 cột Hành vi riêng và Khắc chế.\n3. Mọi đòn ở bảng 3.4 có báo trước đúng luật 8.\n4. Bảng trạng thái không có trạng thái cụt.\n5. Mọi luật có nhãn MVP hoặc Sau MVP.\n6. Chơi một mình thắng được mọi boss theo mô tả cơ chế (không cơ chế cần hai người cùng lúc).\n7. MVP có đúng 4 loài dải Gần và 1 boss.\n8. Trên prototype bay (`tools/prototype/bay.html`, chế độ thử né phím T): người chơi mới né được đòn hẹp báo trước 0,7 s bằng bay thường, không lướt, ít nhất 70% lần sau 3 lần thử.\n9. Trên prototype bay: người chơi mới thoát khỏi đòn vùng bán kính 2,5 u báo trước 1,0 s bằng bay thường ít nhất 70% lần sau 3 lần thử. Biên thiết kế hiện tại: đòn hẹp 0,7 s so với 0,67 s cần để bay ra, đòn vùng 1,0 s so với 0,92 s, nên hai tiêu chí này là kiểm thật, có thể trượt.\n10. Trên prototype bay: người chơi mới thoát khỏi vùng phóng điện bán kính 4 u của lõi BS-1 (báo trước 1,3 s) từ sát lõi bằng bay thường ít nhất 70% lần sau 3 lần thử. Phép tính ước: phản xạ 0,27 s cộng khoảng 0,9 s bay 4,4 u từ đứng yên là khoảng 1,2 s, biên 0,1 s.","he-thong/combat-driftlife.md",""],["10. Câu hỏi mở",2,106,4,0.95,"| # | Câu | Đề xuất | Ai quyết |\n|---|---|---|---|\n| Q1 | Súng lưới mở chương 1 hay chương 2 | GDM đã xử, log dòng 49: chương 1, MVP | Xong |\n| Q2 | Có nên cho Lồng mẫu làm chậm người kéo để thêm cái giá cho bắt sống cỡ S | Không, giữ lớp Nhẹ của `nguoi-choi.md`. Xem lại khi có playtest | gd-combat, gd-character |\n| Q3 | Xua đi boss có cho thưởng truyện khác không | Có một dòng thoại khác của Nhà sinh học, không đổi nhánh truyện | gd-story |\n| Q4 | Driftlife bị Warden Harvester kéo về Barge có mất hẳn không | Đã chốt với gd-world: mất khỏi chuyến đó, không ảnh hưởng gì khác | Xong |\n| Q5 | Sim cho BS-5 Daskel, toán bắt cóc C3.8 và hộ tống kén C5.1 khi nào chạy | Chưa đo, ghi backlog vì cả ba là Sau MVP (nguyên tắc 12). Khi GDM mở phạm vi thì gd-tech chạy theo thứ tự BS-5, toán bắt cóc, hộ tống. Hộ tống cần thêm mô hình kéo vật vào sim | GDM |","he-thong/combat-driftlife.md",""],["Driftlife trong trạm (sự cố sổng khoang nuôi, K14)",2,106,4,3.03,"Luật sự cố, thời gian, hậu quả là của gd-quan. gd-combat chỉ cấp hành vi. Sau MVP (sự cố và nuôi chưa có ở MVP, xem K14, K16).\n\n| Kiểu loài sổng | Hành vi trong mặt cắt trạm | Cách người chơi xử |\n|---|---|---|\n| Hiền (DL-G01, DL-M02) | Đi lang thang qua các khoang, dừng nuốt hàng trong khoang đang đứng | Đi tới tóm (Tương tác giữ 0,8 s) |\n| Chạy trốn (DL-G02, DL-X01) | Chạy khỏi người chơi trong bán kính 3 u, trốn vào góc khoang | Dồn vào góc hoặc hai người chặn hai cửa |\n| Đi bầy (DL-G04, DL-M04, DL-X05) | Sổng là 3 con tách ra 3 khoang | Tóm từng con |\n| Giữ lãnh thổ (DL-G05, DL-M03) | Đứng chặn cửa một khoang, đẩy người chơi ra (0 Oxy, trong trạm không có Oxy) | Đưa mồi (vật phẩm nuôi của gd-items) để dụ ra, rồi tóm |\n\n- Trong trạm không có Oxy giảm, không có sát thương. Driftlife sổng không chết và không mất. Không có dụng cụ combat trong trạm (luật 7).\n- Con sổng nuốt và giữ hàng trong khoang nó đứng (hàng thô trong kho, hàng đã chế trong xưởng, hoặc kiện trên kệ). Hàng không mất: tóm được thì hàng nó giữ về chỗ cũ và con tự về ô nuôi. Bỏ mặc thì nó nuốt tiếp tới hết giờ giao thương, hết giờ giao thương con tự về và hàng về kho, kệ. Cái giá là hàng bị giữ không giao được trong ca (luật 46 của `tram-va-cang.md`). Số theo `tram-va-cang.md` bảng 2.8:\n\n| Tham số | Giá trị | Khoảng an toàn | Chủ |\n|---|---|---|---|\n| Nhịp nuốt và giữ hàng | 1 đơn vị mỗi 20 s | 10 đến 40 s | gd-quan |","he-thong/combat-driftlife.md",""],["Map",1,0,5,26.17,"Hệ thống này dựng toàn bộ không gian ngoài trạm: map tổng The Wake gồm ba dải ghép mới mỗi chuyến từ mảnh dựng tay, tám map nhánh dựng tay cố định giữ truyện, người vớt và boss, cùng hai cách rút ngắn đường (Recall Beacon và Skiff). Hệ thống biến Oxy thành quyết định đi tiếp hay quay về (P1) và đặt nội dung một lần ở chỗ chắc chắn gặp (P4). Tầng: lõi. Ưu tiên: bản đầu cho MVP (dải Gần, Station Cinder), đầy đủ cho cả game. Phụ thuộc: tốc độ bay và bình Oxy của gd-character, loài và boss của gd-combat, nhóm tài nguyên của gd-items, mốc chương của gd-story.","he-thong/map.md","GDD hệ thống: Map tổng, map nhánh, hazard, Recall Beacon, Skiff, nhịp chuyến"],["Hiện hành",2,141,5,1.07,"- Map tổng là một dải ngang: Ember ở mép trái, đi sang phải là đi xa trạm và về phía tâm vụ nổ. Ba dải Gần, Giữa, Xa nối tiếp nhau theo trục ngang.\n- Mỗi dải là lưới mảnh 40 x 24 u, cao 3 hàng. Gần 4 cột, Giữa 6 cột, Xa 8 cột. Mảnh dựng tay, ghép lại mỗi chuyến, một số ô cố định.\n- Dải chưa mở bị chặn bằng Rạn vụn. Dải đã mở mà vỏ bộ đồ thiếu cấp môi trường thì hao nền nhân hệ số thiếu cấp của gd-character (2,5 hoặc 4).\n- Recall Beacon: Gần 1, Giữa 2, Xa 3 mỗi chuyến, giữ phím 5 giây, dùng nhiều lần, ai cũng dùng được.\n- Skiff mở ở chương 2, đưa cả nhóm tới lối vào một map nhánh đã từng vào, tính là một chuyến, chỉ đi vào map nhánh đó.\n- Map nhánh giữ trạng thái giữa các chuyến (cửa đã mở, boss đã hạ, đường tắt).\n- Thang đã chốt (GDM, log 54): túi bậc 0 đến 4 là 80, 100, 126, 168, 216 Khối, bình là 330, 450, 600, 780, 1000. Giây khai thác mỗi node đã nhân 2 (gd-items). Thời lượng chuyến và tỉ lệ bị kéo về hiện hành ở mục 3.9, chép từ sim bằng script.","he-thong/map.md",""],["1. Mục đích với người chơi",2,141,5,1.17,"Người chơi cảm thấy: mỗi lần rời cửa khí là một khoản Oxy đem đi đầu tư. Đi xa thì đổi được thứ hiếm hơn, nhưng đường về dài hơn và chỗ thoát ít hơn. Mỗi chuyến lạ đi một chút nhưng không bao giờ lạc: trạm, xác trạm lớn và lối vào map nhánh luôn ở chỗ cũ.\n\nQuyết định người chơi đưa ra trong hệ thống này:\n1. Đi dải nào hôm nay (gần, an toàn, hàng thường hay xa, đắt Oxy, hàng hiếm).\n2. Đi theo đường chính hay rẽ vào nhánh phụ có mảnh Thưởng.\n3. Lúc nào quay về: bay ngược về cửa khí, tìm Recall Beacon đã thấy, hay liều tìm beacon mới.\n4. Dùng chuyến cho map tổng (tài nguyên sinh lại) hay cho map nhánh (truyện, người vớt, boss, một lần).\n\n- Pillar phục vụ: P1 (Oxy là đồng hồ của không gian), P3 (mọi luật đúng với 1 đến 4 người), P4 (truyện chỉ ở chỗ dựng tay).\n\n30 giây đầu của chuyến đầu tiên: ra cửa khí vào mảnh Ember Mooring (ô cố định, không hazard, không Driftlife săn mồi). Thấy phế liệu trôi trong tầm tay, nhặt món đầu. Thấy xác Station Cinder lớn ở phía phải trên làm mốc. Thấy Mảnh trôi đầu tiên đi chậm qua đường bay, có vệt bụi báo trước.","he-thong/map.md",""],["2. Luật",2,141,5,21.97,"","he-thong/map.md",""],["2.1 Map tổng và mảnh",3,144,5,8.6,"1. Map tổng The Wake là mặt phẳng 2D nhìn ngang. Trục ngang là khoảng cách tới Ember. Ember nằm ngoài lưới, ở mép trái, cửa khí mở vào giữa chiều cao map. (MVP)\n2. Map tổng gồm ba dải nối tiếp theo trục ngang: Gần, Giữa, Xa. Mỗi dải là một lưới mảnh, số cột theo bảng tham số, cao 3 hàng. (MVP cho Gần)\n3. Mảnh là khối dựng tay cùng kích thước. Mỗi cạnh của mảnh khai báo một cổng: mở (lỗ rộng bằng tham số cổng mảnh, ở giữa cạnh) hoặc đóng. Hai mảnh cạnh nhau chỉ thông nhau khi cả hai cạnh chạm nhau đều mở. (MVP)\n4. Mỗi mảnh thuộc đúng một dải và một loại: Mở, Hành lang, Ổ, Xác lớn, Thưởng, Cố định. Định nghĩa loại ở bảng 3.3. (MVP)\n5. Ô cố định giữ nguyên mảnh qua mọi chuyến: ô Ember Mooring (cột 1 hàng giữa của Gần, cổng Trái, Phải, Trên, Dưới đều mở) và ô lối vào của mỗi map nhánh (cổng ghi ở mục 6.4). Rạn vụn không phải ô (luật 2.2.2). (MVP)\n6. Bố cục mới được sinh khi chuyến bắt đầu, theo thứ tự xử lý ở 2.9. Seed của chuyến sinh từ thế giới, số ngày và số thứ tự chuyến trong ngày (1 hoặc 2), nên nạp lại cùng ngày cùng chuyến ra đúng bố cục cũ (K23). Trong một chuyến, bố cục không đổi. (MVP)\n7. Trong một chuyến, một mảnh xuất hiện tối đa một lần. Trùng mảnh là cùng một mảnh ở cùng một ô với chuyến liền trước, chỉ tính ô ghép. Số ô trùng không vượt tham số trùng tối đa. (MVP)\n8. Cờ nửa ngoài của mảnh: \"Có\" là mảnh chỉ đặt ở nửa ngoài của dải (cột lớn hơn nửa số cột, dải Gần là cột 3 và 4), \"Không\" là mảnh đặt ở mọi cột. Mảnh Thưởng luôn có cờ \"Có\". (MVP)\n9. Mỗi dải có đường chính đi được từ ranh trong tới ranh ngoài mà không cần dụng cụ phá vật cản. Mỗi dải có ít nhất một vòng: hai đường khác nhau nối cùng hai cột. (MVP)\n10. Mọi ô lối vào map nhánh, mọi Recall Beacon của chuyến và ô Ember Mooring đều nối được với đường chính. (MVP)\n11. Biên trên và biên dưới của map là ranh vô hình có hình mảnh vỡ dày. Người chơi chạm ranh thì dừng lại, không mất Oxy. (MVP)","he-thong/map.md",""],["2.2 Dải, mở dải và môi trường",3,144,5,3.88,"1. Dải Gần mở từ đầu game. Dải Giữa mở ở mốc đóng chương 1 (bắt được sóng của Lantern, Thông dịch viên giải ra khe đi qua Rạn vụn). Dải Xa mở ở mốc đóng chương 2 (Hoa tiêu đọc lõi dẫn đường). Mốc do gd-story giữ. (MVP cho Gần, Sau MVP cho Giữa, Xa)\n2. Dải chưa mở có Rạn vụn chiếm 8 u đầu cột 1 của dải đó, suốt chiều cao map. Rạn vụn là va chạm cứng, không phá được bằng mọi dụng cụ. Khi dải mở, Rạn vụn mở một khe cao bằng cổng mảnh ở đúng hàng đường chính đi từ dải trước sang (mục 2.9 bước 4), phần còn lại giữ làm cảnh. (MVP)\n3. Mỗi dải có một môi trường: Gần E0, Giữa E1, Xa E2. Môi trường E0 không đòi gì. Môi trường E1, E2, E3 đòi cấp vỏ bộ đồ (trục T-VO của gd-character) bằng số trong mã. (MVP cho E0)\n4. Người chơi ở trong dải có môi trường cao hơn cấp vỏ bộ đồ thì hao nền Oxy nhân hệ số thiếu cấp. Hệ số do gd-character giữ (thiếu 1 cấp và thiếu từ 2 cấp). Hệ số tính theo khu người đó đang ở, đổi ngay khi qua ranh dải. (Sau MVP)\n5. Map nhánh dùng môi trường của dải chứa lối vào, trừ khu có khí (luật 2.7.4). Cradle Interior và Warden Rig dùng E3. (Sau MVP)\n6. Tài nguyên và loài Driftlife gắn với dải, không trộn giữa các dải (K5). Mỗi dải có loài và nhóm tài nguyên chỉ dải đó có, danh sách do gd-items và gd-combat giữ. (MVP)","he-thong/map.md",""],["2.3 Hazard",3,144,5,1.71,"1. Hazard chỉ xuất hiện ở điểm sinh SP-H của mảnh hoặc ở vị trí dựng tay trong map nhánh. Mỗi SP-H khai báo danh sách hazard được phép, máy chọn một hazard trong danh sách theo dải và chương. (MVP)\n2. Mọi hazard gây hại đều có tín hiệu báo trước bằng hình và tiếng, dài ít nhất bằng tham số báo trước tối thiểu. Không hazard nào gây hại khi chưa báo. Báo trước tính từ lúc người chơi thấy được tín hiệu, không phải từ lúc hazard vào màn. Hazard có thể chạm người chơi từ ngoài vùng nhìn (H01, H04, H07) có chỉ báo ở mép màn hình (mũi tên theo hướng tới và tiếng) bắt đầu ít nhất bằng báo trước tối thiểu trước khi vào màn. (MVP cho H01)\n3. Sát thương của hazard trừ thẳng vào Oxy (K1). Đẩy lùi của hazard cộng vào vận tốc người chơi. Hazard không giết thẳng: Oxy về 0 thì theo luật ngạt của gd-character. (MVP)\n4. Hazard không phân biệt người chơi: trúng ai thì trừ người đó. Driftlife cũng chịu Mảnh trôi, Dòng đá vụn, Bùng tinh vân, Hàng rào cắt. (MVP)\n5. Hazard đẩy (Ống xì, Dòng trôi) không trừ Oxy. Bay xuôi chiều được cộng tốc độ, bay ngược bị trừ tốc độ. (MVP cho Ống xì)\n6. Vùng nhiễu tắt la bàn, ping co-op và tín hiệu Recall Beacon cho người đứng trong vùng. Beacon nằm trong Vùng nhiễu vẫn kích được bằng tay. (Sau MVP)\n7. Hàng rào cắt có một máy phát. Phá máy phát thì hàng rào tắt tới hết chuyến. Máy phát có máu theo bảng hazard, tăng theo số người theo C8. (Sau MVP)\n8. Hazard trong map tổng không xuất hiện ở ô Ember Mooring và ở mảnh chứa Recall Beacon trong bán kính an toàn của beacon. (MVP)\nChi tiết từng hazard ở bảng 3.5.","he-thong/map.md",""],["2.4 Điểm sinh và mật độ",3,144,5,1.81,"1. Mỗi mảnh khai báo sẵn các điểm sinh: SP-R, SP-D, SP-W, SP-H, SP-B, SP-L. Số khe mỗi loại theo loại mảnh ở bảng 3.3. (MVP)\n2. Khi sinh chuyến, máy kích hoạt một phần khe SP-R và SP-D theo tỉ lệ kích hoạt của dải nhân hệ số số người k(N). Khe không kích hoạt để trống. (MVP)\n3. Khe SP-R chọn một điểm khai thác (mã SLV của gd-items) trong danh sách của dải theo trọng số do gd-items cấp. Khe SP-D chọn một loài trong danh sách của dải và một kiểu sinh (đơn, đàn, tổ) do gd-combat cấp. (MVP)\n4. Tài nguyên và Driftlife không sinh lại trong cùng chuyến. Đã nhặt, đã bắt, đã hạ thì trống tới chuyến sau (K8 áp ở mức chuyến). (MVP)\n5. Khe SP-R hạng hiếm là khe chỉ cho phép điểm khai thác loại hòm của dải: SLV-104 (Gần), SLV-203 (Giữa), SLV-303 (Xa). Mảnh Thưởng luôn có ít nhất một khe hạng hiếm được kích hoạt, và luôn có ít nhất một SP-H hoặc một SP-D loài săn mồi được kích hoạt. (MVP)\n6. Từ chương 3, dải Xa kích hoạt khe SP-W theo tỉ lệ ở bảng 3.6. Trước chương 3 khe SP-W để trống. (Sau MVP)\n7. Khe SP-D khai báo điểm neo (không neo, mảnh vỡ nhỏ, xác có điện hoặc cạnh Cáp chập, thiên thạch khoáng, mây khí, xác lớn). Loài có điểm neo trong bảng điểm sinh của gd-combat chỉ sinh ở khe có điểm neo đó. Loài đòi vùng trống hazard (Storm Siphon) chỉ sinh ở khe không có SP-H kích hoạt trong bán kính loài đó đòi. (MVP)\n8. Khe SLV-101 Mảnh vỡ trôi (nhặt tay) chiếm tối đa 25% khe SP-R của một mảnh, hai khe SLV-101 cách nhau ít nhất 2 u. Node khoan và nạy đặt thành cụm 2 đến 3 node trong bán kính 4 u. Với lượng của gd-items (1 lần quay), tính cả thời gian bay thì nhặt tay và khoan gần ngang nhau (bảng cuối mục 3.8). (MVP)","he-thong/map.md",""],["2.5 Recall Beacon",3,144,5,4.42,"1. Mỗi chuyến có số Recall Beacon trong mỗi dải theo bảng tham số. Beacon chỉ đặt ở khe SP-B của mảnh. Beacon của chuyến không nằm ở ô nào đã có beacon trong chuyến liền trước (K4). (MVP)\n2. Luật đặt: không đặt ở ô Ember Mooring, hai beacon cách nhau ít nhất số cột theo tham số, mỗi dải có ít nhất một beacon ở nửa ngoài của dải, mọi beacon nằm trên đường chính hoặc ở ô kề đường chính. (MVP)\n3. Beacon phát tín hiệu trong bán kính phát hiện. Người chơi bay vào bán kính thì beacon hiện trên la bàn của cả nhóm tới hết chuyến. (MVP)\n4. Kích beacon: đứng trong bán kính kích, giữ phím Kích Recall đủ thời gian giữ. Trong lúc giữ, Oxy vẫn hao. Trúng đòn hoặc thả phím thì hủy, phải giữ lại từ đầu. Thử lại không giới hạn. (MVP)\n5. Kích xong: người đó về trạm, giữ nguyên túi đồ. Vật đang kéo (buồng ngủ đông, Driftlife sống, kiện) trong bán kính kéo theo đi cùng. (MVP)\n6. Beacon dùng được nhiều lần trong chuyến, nhiều người cùng kích một beacon được, mỗi người kích riêng. (MVP)\n7. Map nhánh có beacon dựng tay ở vị trí cố định, theo sơ đồ từng nhánh. Mỗi phòng boss có một beacon cố định ở phía lối vào, ngoài phòng, để rút giữa trận. Beacon trong map nhánh theo luật 2.5.4 tới 2.5.6. (MVP)\n8. Cửa khí của Ember là lối về luôn có, không cần giữ phím: bay vào cửa khí là về. (MVP)","he-thong/map.md",""],["2.6 Skiff",3,144,5,2.88,"1. Skiff mở khi Hoa tiêu đã về trạm và bến Skiff đã sửa (khoang của gd-quan). (Sau MVP)\n2. Skiff chỉ đi tới lối vào của map nhánh mà nhóm đã vào ít nhất một lần bằng đường bay (K7). (Sau MVP)\n3. Chọn Skiff ở cửa khí thay cho ra cửa khí. Mọi người xác nhận như chuyến thường (C5). Chuyến Skiff tính là một chuyến trong ngày. (Sau MVP)\n4. Skiff chạy cảnh đi trong thời gian cố định, Oxy không hao trong cảnh đi. Skiff thả cả nhóm ở cửa map nhánh. (Sau MVP)\n5. Chuyến Skiff chỉ gồm map nhánh đó. Ra khỏi cửa map nhánh là về Skiff và Skiff đưa về trạm, không bay ra map tổng. Recall Beacon trong map nhánh cũng đưa về trạm. (Sau MVP)\n6. Map nhánh N8 Warden Rig là ngoại lệ của luật 2.6.2: N8 không có ô lối vào trong map tổng, Skiff đi thẳng tới N8 ngay sau mốc C4.7 mà không cần từng vào. (Sau MVP)","he-thong/map.md",""],["2.7 Map nhánh",3,144,5,7.59,"1. Map nhánh là khu dựng tay, không sinh lại (K7). Vào bằng cửa ở ô lối vào trong map tổng, hoặc bằng Skiff. Vào và ra qua màn chuyển cảnh ngắn. (MVP)\n2. Map nhánh giữ trạng thái giữa các chuyến: cửa đã mở, vách đã cắt, boss đã hạ, đường tắt đã mở, vật kể chuyện đã lấy, vị trí kén hộ tống (luật 2.7.9). Tài nguyên và Driftlife thường trong map nhánh sinh lại mỗi chuyến như map tổng. (MVP)\n3. Mỗi map nhánh có ít nhất một lối vào và một lối ra rõ: cửa vào chính luôn là lối ra, cộng các beacon cố định. (MVP)\n4. Khu có khí (trạm còn người: Lantern, Waypost, The Raft) không hao nền Oxy và không nạp Oxy. Trúng đòn trong khu có khí vẫn trừ Oxy. (Sau MVP)\n5. Người vớt nằm trong buồng ngủ đông (vật kéo BNG của gd-items). Muốn vớt thì kéo buồng tới beacon hoặc tới cửa ra. Buồng không vào túi đồ. Người vớt còn thức (Amara ở Lantern, Yusuf ở Veyl Waypost) về trạm bằng mốc truyện (C2.3, C3.2 của gd-story), không kéo buồng. Sevra Ilvane nằm trong kén thoát hiểm, kéo theo đúng luật kéo buồng ngủ đông. Lúc cứu (C3.8), kén về tới Ember bằng Recall Beacon (kén trong bán kính kéo theo đi cùng, luật 2.5.5) hoặc qua cửa khí, hai cách đều tính là xong C3.8. (MVP cho luật kéo buồng, Sau MVP cho Sevra)\n6. Manh mối truyện, người vớt và boss chỉ nằm trong map nhánh (K7). Nội dung manh mối do gd-story đặt vào khe manh mối của sơ đồ. (MVP)\n7. Khóa trong map nhánh mở bằng một trong ba loại chìa: dụng cụ (do gd-items định nghĩa), mốc truyện (do gd-story), hạ boss. Một người mở được mọi khóa. (MVP)\n8. Vật nhiệm vụ ở khe V bị mất khi người mang bị kéo về thì trở lại đúng khe V của nó ở chuyến sau. Vật manh mối ở khe M tự ghi khi chạm, không chiếm túi (log GDM dòng 46). (MVP)\n9. Hộ tống (C5.1) không có hệ thống riêng: kéo kén của Sevra qua một đoạn map nhánh có kẻ địch, dùng luật bay, kéo và combat sẵn có. Từ đầu chương 5 (sau C4.7), Skiff chở nhóm và kén từ Ember tới cửa N4, kén chỉ rời Ember bằng Skiff. Từ cửa N4, kéo kén qua vòng phong tỏa tới cửa The Hearth. Cửa The Hearth mở khi kén chạm cửa, đó là mốc C5.1. Trong hộ tống, kén không đi theo Recall Beacon: người kéo kích beacon thì kén nằm lại tại chỗ. Kén rơi khi người kéo ngạt, bị kéo về hoặc kích beacon. Giữa các chuyến, kén được lưu ở beacon cố định gần nhất đã đi qua trên đường hộ tống, chưa qua beacon nào thì ở cửa N4. (Sau MVP)\nSơ đồ từng map nhánh ở mục 2.10.","he-thong/map.md",""],["2.8 Nhịp chuyến",3,144,5,0.93,"1. Thời lượng chuyến khi Oxy là giới hạn bằng dung lượng bình trừ phần dự trù quay về. Bình quyết chuyến dài bao lâu, dải quyết phần nào của chuyến là bay và phần nào là làm việc. (MVP)\n2. Đường áp lực của một chuyến: nhẹ ở Ember Mooring, tăng dần theo cột, có mảnh Mở hoặc Xác lớn sau mỗi mảnh Ổ hoặc Thưởng trên đường chính để người chơi thở. Máy sinh không đặt hai mảnh Ổ hoặc Thưởng liền nhau trên đường chính. (MVP)\n3. Phần thưởng tăng theo rủi ro: tỉ lệ khe SP-R hạng hiếm tăng theo cột, mảnh Thưởng chỉ ở nửa ngoài của dải. (MVP)\n4. Chuyến kết thúc với từng người khi người đó về cửa khí, kích beacon xong hoặc bị kéo về. Chuyến của nhóm kết thúc khi người cuối cùng xong (C6). (MVP)\n5. Một ngày có tối đa hai chuyến, chuyến Skiff cũng tính (K22). Ngân sách một ngày ở khung mục 9 do GDM giữ, thời lượng mỗi chuyến đo ở mục 3.9. (MVP)","he-thong/map.md",""],["2.9 Thứ tự xử lý khi sinh một chuyến",3,144,5,4.62,"1. Đọc chương, dải đã mở, map nhánh đã mở, số người N, seed của chuyến (từ thế giới, số ngày, số thứ tự chuyến, K23).\n2. Đặt ô cố định (Ember Mooring, ô lối vào map nhánh đã biết) và Rạn vụn ở dải chưa mở.\n3. Mỗi dải: chọn đường chính đi qua mọi cột từ trái sang phải. Trong một cột đường chính đổi tối đa một hàng, và chỉ sang hàng kề (hàng 1 sang 2, hàng 2 sang 1 hoặc 3, hàng 3 sang 2), rồi sang cột kế ở hàng đó. Dải Gần bắt đầu ở ô Ember Mooring.\n4. Hàng đường chính đi vào cột 1 của dải sau bằng hàng đường chính ra khỏi cột cuối của dải trước. Khe Rạn vụn (khi dải sau đã mở) đặt ở hàng đó.\n5. Đặt mảnh cho các ô trên đường chính: cổng phải khớp hướng đường. Áp luật nhịp 2.8.2.\n6. Chọn một cặp cột cho vòng, đặt mảnh ô phụ tạo đường thứ hai.\n7. Điền ô còn lại bằng mảnh có ít nhất một cổng mở về phía ô đã nối.\n8. Kích hoạt khe SP-R, SP-D, SP-W, SP-H theo 2.4.\n9. Đặt Recall Beacon theo 2.5.2.\n10. Kiểm hợp lệ: đường chính đi được và nối liền giữa các dải, mỗi dải có vòng, mọi beacon và lối vào nối được, không mảnh lặp, cờ nửa ngoài đúng, không hai mảnh Ổ hoặc Thưởng liền nhau trên đường chính, số ô trùng mảnh với chuyến trước không vượt tham số, không beacon nào cùng ô với beacon chuyến trước. Bản tham chiếu: `projects/game-moi/sim/bo_cuc.py` (hàm kiểm).\n11. Không hợp lệ thì sinh lại với seed kế tiếp. Quá số lần thử theo tham số thì dùng bố cục dự phòng dựng tay của dải (bảng ở mục 6.4), beacon đặt ở ô dự phòng không trùng chuyến trước.","he-thong/map.md",""],["2.10 Map nhánh từng nơi",3,144,5,7.5,"Ký hiệu khu: C là khu, D là cửa khóa, B là beacon cố định, M là khe manh mối (nội dung do gd-story), V là khe vật nhiệm vụ (vật kể chuyện của gd-items dùng để mở tính năng). Thời lượng là thời gian ở trong nhánh, ước.\n\nLối vào mỗi map nhánh mở theo mốc truyện (bảng mốc ở `cot-truyen.md` mục 2.5). Trước mốc, ô lối vào vẫn có trên map tổng nhưng cửa đóng:\n\n| Nhánh | Mở sau mốc |\n|---|---|\n| N1 Station Cinder | C1.2 |\n| N3 Station Lantern | C1.9 |\n| N2 Station Wick | C2.5 |\n| N4 Veyl Waypost | C2.8 (cửa The Hearth mở khi kén của Sevra chạm tới, mốc C5.1) |\n| N5 The Raft | C3.4 |\n| N6 Station Flint | C3.5 |\n| N7 Cradle Interior | C3.8 (cứu Sevra ở N4) |\n| N8 Warden Rig | C4.7 |\n\n**N1 Station Cinder (MVP).**\n- Xác Seed Station đầu tiên, dải Gần, chương 1.\n- Ô lối vào cố định ở Gần cột 3 hàng trên, vỏ xác nhìn thấy từ Ember Mooring làm mốc.\n\n| Khu | Vị trí | Có gì |\n|---|---|---|\n| C1 Cửa khí hỏng | Tầng dưới, đầu trái | Lối vào và lối ra chính. Beacon B1 |\n| C2 Hành lang trục | Tầng dưới | Mảnh trôi trong hành lang, đàn Driftmoth, phế liệu, linh kiện. Beacon B3 ngay trước D1 để rút khỏi phòng boss |\n| C3 Khoang ngủ đông trái | Tầng trên, lên bằng giếng ở đầu trái C2 | Buồng của Ingrid (sống), một buồng tắt (M1), khe M4 nhật ký trạm STY-101 (vật manh mối đầu tiên, lấy được ở lần 1) |\n| C4 Vách sập | Giữa tầng trên | Chặn đường sang C5 từ C3, không phá được |\n| C5 Khoang ngủ đông phải | Tầng trên | Buồng của Linh (sống), một buồng tắt (M2). Chỉ vào được từ C8, tức phải qua phòng boss |\n| D1 Cửa khóa nguồn | Cuối C2 | Mở bằng TOL-401 Bộ kích nguồn: công thức đầu tiên Ingrid chế ở xưởng sau lần 1 (RCP-205, chỉ dùng tài nguyên thô dải Gần). Nhóm đã có thì ai chạm cửa cũng mở |\n| C6 Khoang máy | Tầng dưới, sau D1 | Lõi năng lượng, tổ của boss BS-1 Scrapmaw (3 điểm neo xúc tu trên tường), hai Cáp chập |\n| C7 Khoang lái | Đầu phải, hai tầng | khe M3 (manh mối MM1.2 của gd-story), khe vật nhiệm vụ V1 (STY-102 mảnh lõi dẫn đường), beacon B2 mở sau khi xong boss |\n| C8 Hành lang trên | Tầng trên, từ C7 sang C5 | Đường duy nhất tới buồng của Linh |\n\n- Lần 1 (chưa có chìa): C1, C2, giếng, C3, vớt Ingrid, kéo buồng về B1. Lần 2 (có Bộ kích nguồn): C1, C2, D1, C6 boss, C7, C8, C5, vớt Linh, kéo buồng về B2.\n- Cửa giữa C6 và C7 là vách kín, chỉ mở khi BS-1 kết thúc (hạ hoặc xua đi). Không chạy ngang boss được: đường duy nhất tới C7, C8, C5 và Linh đi qua trận boss. Driftlife do boss sinh ra trong trận không rời phòng C6 (gd-combat xác nhận), nên beacon B3 ngoài phòng luôn kích được.\n\n| Lần | Thời lượng trong nhánh (giây) | Ghi chú |\n|---|---|---|\n| Lần 1 | 90 | Dạy kéo buồng và beacon cố định |\n| Lần 2 | 150 | Gồm boss, ước 60 giây (gd-combat đo trong đề sim combat) |\n\nCác map nhánh sau MVP (sơ đồ chi tiết làm ở đợt dựng chương tương ứng):\n\n| Nhánh | Dải, chương | Khu | Khóa và chìa | Người vớt | Boss | Khe manh mối | Thời lượng mỗi chuyến (giây) |\n|---|---|---|---|---|---|---|---|\n| N2 Station Wick | Giữa, 2 | Cửa khí, hành lang băng phủ (Băng nứt), khoang ngủ đông, khoang lái. Chung bộ nội thất với Cinder, đổi bố trí và hư hại | Khoang ngủ đông mất điện, mở bằng Bộ kích nguồn (dụng cụ cũ dùng lại) | Rafa (Hoa tiêu) | Không | M1, M2, M3 ở khoang ngủ đông (M3 là thẻ tên STY-601), V1 ở khoang lái (STY-103) | 150 |\n| N3 Station Lantern | Giữa, 2 | Lantern Outer Ring gồm Lantern Berth (chân không, đấu boss giữa các kiện hàng trôi), Lantern Core (khu có khí: Odile, Bram, Amara, chợ đổi tin) | Cửa cập chỉ mở sau khi đuổi BS-2 lần đầu (chìa là hạ boss). Sau đó là điểm ghé | Amara (Nhà sinh học) | BS-2 Tempest Gulper | M1, M2 ở Lantern Core | 180 lần đầu, 60 các lần ghé sau |\n| N4 Veyl Waypost | Xa, 3 đến 5 (ô lối vào cố định ở Xa cột 1) | Waypost Outer Ring (chân không, nơi tàu TA04 của Ilsume bị toán của Maro áp mạn ở C3.8), Waypost Concourse có khí (thương nhân, Yusuf đang làm ở bến), The Hearth (khoang ẩn có khí của The Kindling, sâu trong Waypost, cửa mở khi kén của Sevra chạm tới). Đường hộ tống từ cửa N4 tới cửa The Hearth dài khoảng 120 u, qua hai đoạn phong tỏa, beacon cố định ở khoảng 40 u và 90 u (ước, chốt khi dựng greybox) | Cứu Sevra (C3.8): sự kiện áp mạn tàu TA04 ở Waypost Outer Ring chỉ sinh khi mốc C3.7 đã xong và giai đoạn 3 của động cơ đã lắp (K25). Hạ toán của Maro, kéo kén về Ember bằng beacon hoặc cửa khí. Hộ tống (C5.1, luật 2.7.9): Skiff chở kén tới cửa N4, kéo kén qua vòng phong tỏa của The Wardens (Hàng rào cắt và đơn vị The Wardens) tới cửa The Hearth. Yusuf về Ember bằng mốc C3.2 | Yusuf (Trưởng cảng), còn thức. Sevra Ilvane trong kén thoát hiểm (không phải người vớt mở tính năng) | Không boss. Toán của Maro (gd-combat) | M1, M2 | 150 lần thường, 180 lúc cứu Sevra, 210 lúc hộ tống |\n| N5 The Raft | Xa, 3 | Cụm trạm con ghép của The Remainers, phần lớn có khí. Một khu ngoài có Hàng rào cắt cũ để dạy phá máy phát | Mốc truyện gặp Elias | Không | Không | M1 (Elias, Wren) | 120 |\n| N6 Station Flint | Xa, 3 | Xác Seed Station chung bộ nội thất, khoang nghiên cứu, khoang hàng bị The Wardens biến thành trạm thu (Driftlife bị giữ, đấu trường boss) | Khoang nghiên cứu mở sau khi hạ BS-3 | Không | BS-3 Warden Reaper | M1 nhật ký Flint, M2 manh mối lõi dẫn đường STY-104, V1 mẫu STY-301 ở khoang nghiên cứu (mở sau BS-3) | 210 |\n| N7 Cradle Interior | Xa, 4 | Bốn khu nối tiếp: Broken Hold, Cryo Deck, Engine Core, Bridge Archive (hộp ghi hành trình lộ ra Solace là thông tin mồi). Mỗi khu xong mở đường tắt về cửa vào và một beacon cố định | Vách thân tàu mở bằng TOL-402 Máy cắt thân tàu (bản thiết kế BPR-105 ở hòm cố định của Station Flint hoặc Shop) | Không | BS-4 Cradle Custodian ở Engine Core | M1 ở Broken Hold (STY-411), M2 ở Cryo Deck (STY-412), M3 ở Engine Core (STY-105). Khu cuối có M4 bản gốc Lodestar Survey và V1 hộp ghi hành trình STY-401. Mang hộp về trạm là mốc C4.5 của gd-story | 240, đi trọn trong 3 đến 4 chuyến |\n| N8 Warden Rig | Xa, 5 (chỉ vào bằng Skiff) | Rig Landing (Hàng rào cắt, đơn vị The Wardens), Holding Pens (thả để chúng đánh lại The Wardens), Command Deck (đấu boss), Data Core sau Command Deck (bản đồ sao thật và lệnh phục kích Cradle mang dấu Daskel). Nơi Daskel chỉ huy ở bãi vỡ, đánh khi cách mạng nổ ra | Vào Warden Rig: mốc đóng chương 4. Data Core: mở sau khi hạ BS-5 | Không | BS-5 (gd-combat đặt tên Daskel) | V1 bản đồ sao thật STY-501, M1 lệnh phục kích Cradle mang dấu Daskel STY-502, cả hai ở Data Core | 300, hai beacon cố định giữa các khu để chia trận cuối nhiều chuyến |\n\n\nPhòng boss (kích thước theo thời lượng trận ước, cơ chế do gd-combat giữ):\n\n| Boss | Nơi | Kích thước (u) | Điểm dựng cho cơ chế | Lối ra sau trận |\n|---|---|---|---|---|\n| BS-1 Scrapmaw | Cinder, C6 Khoang máy | 16 x 12 | 3 điểm neo xúc tu trên tường, lõi năng lượng ở giữa, 2 Cáp chập | Cửa không khóa. Rút giữa trận: qua D1 về C2, beacon B3 cách D1 6 u. Sau trận: beacon B2 ở C7 |\n| BS-2 Tempest Gulper | Lantern, Lantern Berth, Lantern Outer Ring | 32 x 20 | Kiện hàng trôi (Vụn, đẩy được), 2 cửa cập làm chỗ nấp | Cửa cập Lantern mở, beacon cố định ở bến. Beacon phía lối vào, ngoài phòng, để rút giữa trận (luật 2.5.7) |\n| BS-3 Warden Reaper | Flint, khoang hàng thành trạm thu | 28 x 16 | Lồng giữ Driftlife phá được, băng chuyền thu hoạch | Khoang nghiên cứu mở, beacon cố định. Beacon phía lối vào, ngoài phòng, để rút giữa trận (luật 2.5.7) |\n| BS-4 Cradle Custodian | Cradle, Engine Core | 32 x 24 | Hai tầng sàn kỹ thuật, Engine Core làm tâm | Đường tắt về cửa vào, beacon cố định. Beacon phía lối vào, ngoài phòng, để rút giữa trận (luật 2.5.7) |\n| BS-5 (Daskel) | Warden Rig, Command Deck | 36 x 24 | Hàng rào cắt bật theo pha, Holding Pens kề bên | Data Core mở, beacon cố định. Beacon phía lối vào, ngoài phòng, để rút giữa trận (luật 2.5.7) |\n\nHòm và vật kể chuyện trong map nhánh (hòm là điểm khai thác SLV của gd-items, độ cứng theo bảng của gd-items):\n\n| Nhánh | Hòm | Vật kể chuyện (ID gd-items) | Vị trí |\n|---|---|---|---|\n| Station Cinder | 3 SLV-111 Hòm kỹ thuật Seed, 1 SLV-112 Kho hàng Seed | STY-601 thẻ tên ở hai buồng tắt (M1, M2), STY-101 ở khoang ngủ đông trái (M4), STY-102 ở khoang lái (V1) | SLV-111 ở C2, C3, C7. SLV-112 ở C6 sau boss |\n| Station Wick | 3 SLV-111, 1 SLV-112 | STY-211 mảng vỏ thân (M1), STY-101 nhật ký trạm (M2), STY-601 thẻ tên (M3), STY-103 (V1) | M1 đến M3 ở khoang ngủ đông, V1 ở khoang lái |\n| Station Lantern | Không | STY-212 sổ trực (M1), STY-213 bản Lodestar Survey (M2) | Lantern Core |\n| Veyl Waypost | Không | STY-311 (M1), STY-312 (M2) | Waypost Concourse |\n| The Raft | Không | STY-313 (M1) | Khu có khí |\n| Station Flint | 3 SLV-111, 1 hòm cố định chứa BPR-105 | STY-301 ở khoang nghiên cứu (V1), STY-104 (M2), nhật ký Flint (M1) | Hòm BPR-105 trong khoang nghiên cứu, mở sau BS-3 |\n| Cradle Interior | 2 SLV-112 mỗi khu | STY-411 (M1, Broken Hold), STY-412 (M2, Cryo Deck), STY-105 (M3, Engine Core), bản gốc Lodestar Survey (M4) và STY-401 hộp ghi hành trình (V1) ở Bridge Archive | Mỗi khu 2 hòm |\n| Warden Rig | Không | STY-501 bản đồ sao thật (V1), STY-502 lệnh phục kích Cradle mang dấu Daskel (M1) | Data Core, mở sau BS-5 |","he-thong/map.md",""],["3. Tham số",2,141,5,12.3,"","he-thong/map.md",""],["3.1 Không gian và di chuyển",3,155,5,1.22,"| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nhóm tác động | Nguồn |\n|---|---|---|---|---|---|---|\n| Tốc độ bay đều | 6,0 u/s ở bộ đẩy bậc 0, 6,5 đến 7,5 ở bậc 1 đến 3 | theo gd-character | Dải ngắn lại theo giây | Bay chiếm nhiều Oxy hơn | Mọi dải | gd-character |\n| Hệ số đường vòng | 1,3 | 1,2 đến 1,5 | Bay ra tốn Oxy hơn | Map thẳng, ít vòng | Ngân sách Oxy | ước |\n| Kích thước mảnh | 40 x 24 u | rộng 32 đến 48 | Ít mảnh hơn mỗi dải, ít đa dạng | Nhiều mối nối, dễ vụn | Kho mảnh, greybox | ước |\n| Số hàng mỗi dải | 3 | 2 đến 4 | Dải rộng, khó lạc đường chính | Dải thành hành lang | Mọi dải | ước |\n| Số cột Gần, Giữa, Xa | 4, 6, 8 | ±1 mỗi dải | Dải dài, bay ra tốn Oxy | Thời lượng làm việc tăng | Ngân sách Oxy | ước |\n| Ranh dải (u) | 160, 400, 720 | theo số cột | | | Ngân sách Oxy | sinh từ số cột |\n| Cổng mảnh | 8 u | 6 đến 10 | Đi qua dễ, mảnh ít kín | Va chạm nhiều ở mối nối | Greybox | ước |\n| Khe hở tối thiểu | 3 u | 3 đến 4 | Dễ bay | Chật, hay va | Greybox | ước, nhân vật cao 1 u |\n| Đường chính rộng tối thiểu | 6 u | 5 đến 8 | Dễ đi | Chật | Greybox | ước |","he-thong/map.md",""],["3.2 Oxy và nhịp chuyến",3,155,5,6.44,"| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nhóm tác động | Nguồn |\n|---|---|---|---|---|---|---|\n| Hao nền | 1 điểm/giây | cố định | | | Mọi chuyến | gd-character (1 điểm bằng 1 giây hao nền). Bảng trần dưới đây không tính hao thêm khi túi gần đầy (tới 1,15 lần) và khi kéo buồng (1,25 lần). Sim chuyến có tính |\n| Bình Oxy bậc 0 đến 4 | 330, 450, 600, 780, 1000 | GDM chốt (log 54) | Chuyến dài hơn | Chuyến ngắn hơn | Thời lượng chuyến cuối game | gd-character giữ trục, GDM chốt |\n| Túi bậc 0 đến 4 (Khối) | 80, 100, 126, 168, 216 | GDM chốt (log 54) | Oxy thành giới hạn sớm hơn | Túi đầy sớm, chuyến ngắn | Thời lượng chuyến đầu game | gd-character giữ trục, GDM chốt |\n| Hệ số thiếu cấp môi trường | 2,5 khi thiếu 1 cấp, 4,0 khi thiếu từ 2 cấp | theo gd-character | Cổng mềm thành tường | Người chơi bỏ qua nâng vỏ bộ đồ | Giữa, Xa, Cradle, Warden Rig | gd-character |\n| Dự trù quay về trong phép tính | 15% bình | 10 đến 20% | Phép tính cho chuyến ngắn hơn | Phép tính cho nhiều chuyến ngạt hơn | Chỉ phép tính ngân sách và sim | ước. Giả định hành vi người chơi trong phép tính, HUD dùng vạch đủ về của gd-character |\n| Dự trù trúng đòn trong phép tính | 10% bình | 5 đến 15% | | | Phép tính ngân sách | ước |\n| Mục tiêu chuyến chương 1, chương 5 | 4 đến 6 phút, 10 đến 12 phút | | | | Khung mục 9 | khung |\n\nTrần Oxy của một chuyến theo chương (sinh bởi script, đủ cấp môi trường, người chơi chơi tới ngưỡng dự trù). Đây là trần: thời lượng thật đo bằng sim ở mục 3.9 ngắn hơn vì túi đầy ở đầu game, combat và hazard ăn Oxy ở cuối game.\n\n| Chương | Bậc bình | Bậc bộ đẩy | Oxy | Túi | Dải | Bay ra | Về | Làm việc | Dự trù đòn | Tổng chuyến (giây) | Tổng (phút) |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | 0 | 0 | 330 | 80 | Gần | 17 | 17 | 213 | 33 | 280 | 4,7 |\n| 2 | 1 | 1 | 450 | 100 | Giữa | 56 | 24 | 257 | 45 | 382 | 6,4 |\n| 3 | 2 | 2 | 600 | 126 | Xa | 89 | 24 | 336 | 60 | 510 | 8,5 |\n| 4 | 3 | 3 | 780 | 168 | Xa | 97 | 24 | 463 | 78 | 663 | 11,1 |\n| 5 | 4 | 3 | 1000 | 216 | Xa | 111 | 24 | 615 | 100 | 850 | 14,2 |\n\nVề bằng beacon tính bằng thời gian bay tới beacon gần nhất đã thấy cộng thời gian giữ phím. Chương 1 về bằng cửa khí vì Gần gần trạm.\n\nThiếu cấp môi trường (vào dải mới khi vỏ bộ đồ chưa nâng):\n\n| Chương | Dải | Làm việc đủ cấp | Làm việc thiếu 1 cấp | Còn lại |\n|---|---|---|---|---|\n| 2 | Giữa | 257 | 74 | 29% |\n| 3 | Xa | 336 | 111 | 33% |\n\nRanh dải theo giây bay:\n\n| Dải | Từ (u) | Tới (u) | Giây bay thẳng tới ranh ngoài | Giây bay có đường vòng |\n|---|---|---|---|---|\n| Gần | 0 | 160 | 27 | 35 |\n| Giữa | 160 | 400 | 67 | 87 |\n| Xa | 400 | 720 | 120 | 156 |\n\n- Công thức: Oxy làm việc = Bình x (1 trừ Dự trù quay về) trừ Oxy bay ra trừ Oxy về trừ Bình x Dự trù trúng đòn. Oxy bay ra = (khoảng cách tới điểm làm việc chia Tốc độ bay đều) x Hệ số đường vòng x Hao nền, phần nằm trong dải thiếu cấp nhân thêm Hệ số thiếu cấp. Ví dụ chương 1: 330 x 0,85 trừ 17 trừ 17 trừ 33 = 213 giây làm việc.\n\nNúm gap: Hệ số đường vòng và Dự trù quay về là hai núm nối số gốc với mục tiêu thời lượng. Chưa đo, gd-tech đo bằng sim đợt 2.","he-thong/map.md",""],["3.3 Loại mảnh và khe điểm sinh",3,155,5,2.11,"| Loại | Vai | Cổng mở tối thiểu | SP-R | SP-D | SP-H | SP-B | Tỉ lệ trong kho |\n|---|---|---|---|---|---|---|---|\n| Mở | Khai thác, thở | 3 | 8 | 2 | 0 đến 1 | 1 | 30% |\n| Hành lang | Nối, hẹp, có hazard | 2 (đối diện) | 3 | 1 | 1 đến 2 | 0 | 20% |\n| Ổ | Driftlife tập trung | 2 | 4 | 4 | 0 đến 1 | 0 | 20% |\n| Xác lớn | Vật cản lớn có túi khai thác bên trong, che tầm nhìn | 2 | 10 | 1 | 1 | 1 | 20% |\n| Thưởng | Hàng hiếm, rủi ro cao, chỉ nửa ngoài dải | 1 | 6 (có hạng hiếm) | 2 | 2 | 0 | 10% |\n| Cố định | Ember Mooring, lối vào map nhánh, Rạn vụn | theo thiết kế | theo thiết kế | theo thiết kế | 0 | 0 | ngoài kho |\n\n\nĐiểm khai thác (mã SLV của gd-items) theo loại mảnh, dải Gần (MVP):\n\n| Loại mảnh | SLV cho phép | Ghi chú |\n|---|---|---|\n| Mở | SLV-101 Mảnh vỡ trôi, SLV-102 Mạch quặng, SLV-103 Khối băng | Nhiều node nhỏ, ít hazard |\n| Hành lang | SLV-101, SLV-104 Hòm kỹ thuật vỡ | Hòm ở chỗ có Cáp chập để lấy hòm phải canh nhịp |\n| Ổ | SLV-101, SLV-102 | Node nằm giữa đàn Driftlife |\n| Xác lớn | SLV-104, SLV-105 Tấm vỏ lớn | SLV-105 chỉ có ở Xác lớn. Cạnh H02 là điểm neo của Arc Eel |\n| Thưởng | Mọi SLV của dải, có hạng hiếm | |\n\nĐiểm khai thác dải Giữa và Xa (Sau MVP):\n\n| Loại mảnh | Giữa | Xa |\n|---|---|---|\n| Mở | SLV-201 Mạch quặng cobalt, SLV-202 Khối băng tinh | SLV-301 Mạch kính nebula, SLV-302 Túi khí plasma đông |\n| Hành lang | SLV-204 Tấm hợp kim trôi | SLV-301 |\n| Ổ | SLV-201 | SLV-302 trong mây khí |\n| Xác lớn | SLV-203 Hòm Cradle, SLV-204 | SLV-303 Hòm Warden (cạnh trạm thu, có WD-02 canh) |\n| Thưởng | Mọi SLV của dải, có hạng hiếm | Mọi SLV của dải, có hạng hiếm |\n\nHazard làm node khó lấy:\n- Gần: Cáp chập cạnh SLV-104 Hòm kỹ thuật vỡ.\n- Giữa: Băng nứt là phản ứng của SLV-202 Khối băng tinh khi khoan mạnh. Dòng đá vụn chạy ngang qua SLV-201 Mạch quặng cobalt.\n- Xa: Bùng tinh vân đặt cạnh SLV-302 Túi khí plasma đông. Hàng rào cắt chắn trước SLV-303 Hòm Warden.","he-thong/map.md",""],["3.4 Kho mảnh và ô cố định",3,155,5,1.02,"| Dải | Số ô | Ô cố định | Ô ghép | Kho mảnh MVP | Kho mảnh đủ | Tỉ lệ kho trên ô ghép (đủ) |\n|---|---|---|---|---|---|---|\n| Gần | 12 | 2 (Ember Mooring, lối vào Cinder) | 10 | 16 | 22 | 2,2 |\n| Giữa | 18 | 2 (lối vào Wick, Lantern) | 16 | không có | 32 | 2,0 |\n| Xa | 24 | 4 (lối vào Waypost, Raft, Flint, Cradle) | 20 | không có | 40 | 2,0 |\n\n| Tên | Khởi điểm | Khoảng an toàn | Tăng thì | Giảm thì | Nguồn |\n|---|---|---|---|---|---|\n| Trùng mảnh tối đa giữa hai chuyến liền nhau | 5 trên 10 ô ghép (50%), tính cùng mảnh cùng ô | 30 đến 6
