độ khai thác bị hủy nếu bỏ đi |\n| Kho đạt 999 một loại | Phần thừa của loại đó khi về trạm bị bỏ tự động (không còn chiếm Khối trong túi), hiện thông báo. gd-tech kiểm bằng sim rằng 999 hiếm khi chạm tới |\n| Hai người cùng khai thác một điểm | Người đến trước giữ. Người sau thấy điểm xám |\n| Người chơi thả vật nhiệm vụ | Thả được, vật nằm 30 giây rồi về vị trí gốc nếu không ai nhặt (V4) |\n| Spam nhặt và thả | Thả mất tối đa 1 lần mỗi giây, vật thả tồn tại 30 giây. Không có lỗi nhân đôi vì vật được trừ khỏi túi ngay |\n| Rời phiên hoặc mất kết nối giữa chuyến | Theo C10: khách mất kết nối được giữ chỗ 15 giây, quá hạn hoặc chủ động rời thì tính như bị kéo về (K2), chỉ giữ 1 món, không phải đường về an toàn giữ nguyên túi. Host thoát thì thế giới về điểm lưu gần nhất (K23). Chơi một mình thoát giữa chuyến thì mất chuyến |\n| Hai mẫu cùng loài, một sống một hạ | Hai vật phẩm khác ID, không gộp |\n| Công thức đòi \"một trong n loài\" và kho có nhiều loài | Người chơi chọn loài dùng. Nhóm loài cùng dải, giá trị đầu vào tính theo loài rẻ nhất trong nhóm |\n| Hết nguyên liệu lúc Mở giao thương khi đóng thùng | Loại hàng đó đóng được bao nhiêu thùng thì bày bấy nhiêu, không trừ nguyên liệu của thùng không đóng |\n| Ngủ khi hàng đợi chưa xong | Hàng đợi hoàn thành khi ngủ. Không có hàng đợi chạy khi người chơi offline |\n| Nâng cấp bậc cao hơn dải đã mở | Không cho. Công thức bậc đó mở khi dải mở (luật T5) |\n| Người vào sau co-op | Nhận trang bị theo cấp nhóm (C4), túi rỗng |","he-thong/vat-pham.md",""],["5. Ràng buộc vật lý của luật",2,178,6,1.07,"| Ràng buộc | Số hoặc lý do |\n|---|---|\n| Giá trị tối đa túi mang ra một chuyến | Sức chứa T0 nhân mật độ cao nhất. Với 80 Khối toàn Hiếm (7 đến 10 GTĐ mỗi Khối) thì 560 đến 800 GTĐ. Thực tế không đạt vì Hiếm chỉ có ở dải sâu và số lượng ít |\n| Chuỗi COM không tăng giá trị vô hạn | COM chỉ nhân 1,25 đến 1,5 một lần, kiện tinh nhân thêm tối đa 1,25. Tổng chuỗi thô, COM, kiện tinh tối đa 1,5 nhân 1,25 bằng 1,88 lần GTĐ thô |\n| Mẫu sống tối đa gấp đôi mẫu hạ | k tối đa 2,0, nên ép người chơi cân nhắc rủi ro bắt (lâu hơn) với thưởng |\n| Không có vòng lặp tạo giá trị | Không công thức nào cho ra nguyên liệu thô. Mọi vòng đều tiêu GTĐ |\n| Nâng cấp phải đi cùng dải | Vật liệu bậc 3 cần COM Giữa (chỉ làm được sau khi đi tới Giữa) |\n| Số loại vật phẩm | Khoảng 143 vật phẩm có ID duy nhất và 83 công thức (script đếm, xem dòng sinh ở mục 3). Dev vẫn nhập được bằng một bảng dữ liệu |\n| Hạn chế thùng | 1 người mang 1 thùng mỗi lần trong ca, tốc độ không đổi |","he-thong/vat-pham.md",""],["Co-op 1 đến 4 người",2,178,6,1.19,"| Số người | Luật vật phẩm |\n|---|---|\n| 1 | Một túi, một bộ dụng cụ chọn. Xưởng và cảng một người làm hết: mọi công thức chế được ngoài ca, mọi thùng mang được một mình. Số điểm khai thác bản 1 người (R=1,0) |\n| 2 | Hai túi riêng, hai bộ dụng cụ riêng chọn từ cùng danh sách mở khóa chung. Số điểm khai thác theo k(2) của `map.md`. Có thể chia việc: một người khai thác, một người ở xưởng chế. Kho chung |\n| 3 | Như 2, số điểm khai thác theo k(3) |\n| 4 | Như 2, số điểm khai thác theo k(4) |\n\n- Dùng chung (C3): kho, bản thiết kế, cấp dụng cụ, cấp nâng cấp bộ đồ, hàng đợi chế. Riêng: túi, dụng cụ đang mang, vật tiêu hao đang mang. Không có luật cần đúng N người: tất cả công thức, kiện và điểm khai thác chạy đúng với 1 người. Người vào sau nhận mọi nâng cấp đã mua (C4), không bị yếu. Người rời phiên giữa chuyến áp luật C10 (mục 4): không giữ túi, chỉ giữ 1 món.\nChia Oxy cứu đồng đội (C6): do gd-character định, hệ thống này không thêm vật phẩm. Bình Oxy nhỏ (CON-101) là vật tiêu hao dùng cho chính người mang, không thể thả cho người khác (đề xuất, chờ gd-character).","he-thong/vat-pham.md",""],["6. Yêu cầu cho engineer và tool",2,178,6,1.78,"- Dữ liệu: mỗi vật phẩm một bản ghi tĩnh `ItemData` (id, tên, nhóm, độ hiếm, khối, GTĐ tham chiếu, dải, cờ nhãn MVP). Bản ghi động `ItemInstance` chỉ có id, số lượng, phẩm cấp (1 đến 3 sao cho mẫu và kiện sinh học), loài (cho kiện sống). Xuất từ script này qua JSON cho Unity (gd-tech làm).\n- Công thức: `RecipeData` (id, nơi chế, đầu vào [id hoặc nhóm id, số lượng], đầu ra, thời gian hoặc \"qua đêm\", cờ mở bằng vai, chương hoặc BPR). Nhóm id cho phép chọn một trong n loài.\n- Điểm khai thác: `SalvageNodeData` (id, độ cứng hoặc cấp khóa, dụng cụ, thời gian bậc 1, số lần quay, bảng rơi [id, trọng số, số lượng]).\n- Sự kiện cần: `item_pickup` (id, số lượng, nguồn), `item_craft` (recipe id, nơi chế), `cargo_pack` (kiện id, phẩm cấp), `item_lost_on_recall` (danh sách mất). gd-tech ghi vào Event Tracking.\n- Đồng bộ co-op: kho, hàng đợi chế, bản thiết kế, nâng cấp là trạng thái dùng chung, đồng bộ qua host. Túi, khai thác điểm (khóa điểm cho một người) là trạng thái riêng người chơi có xác nhận host (chống nhân đôi). Điểm khai thác mới sinh theo hạt giống chuyến cho mọi người.\n- Nơi phải cùng đổi khi đổi luật: script `vat-pham.mjs`, bảng Sheet Salvage, ITEM LIST, Recipe, tab Shop (gd-economy), tab Upgrade, `nguoi-choi.md`, `combat-driftlife.md`, `map.md`, `tram-va-cang.md`.\n- Kiểm tự động: `node projects/game-moi/sim/vat-pham.mjs` kiểm ID duy nhất, đầu vào công thức có trong ITEM LIST, mọi vật phẩm có nguồn nhận và nguồn tiêu, tối thiểu 2 tài nguyên riêng mỗi dải, biên lợi từng loại công thức, chi phí nâng cấp theo công thức, tỉ lệ mẫu sống trên hạ từ 1,5 đến 2,0. Thoát mã 1 khi có lỗi.","he-thong/vat-pham.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,178,6,1.78,"| Sự kiện | Hình | Âm | Text và tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Nhặt vật phẩm | Vật bay vào người, số đếm cộng lên HUD | Tiếng nhặt cao độ theo độ hiếm | Tutorial 1: nhặt Mảnh vỡ trôi | MVP |\n| Khai thác điểm | Thanh tiến độ trên điểm, tia khoan, mảnh vụn bay | Tiếng khoan, tiếng vỡ | Tutorial 2: khoan quặng và băng, tutorial 3: nạy hòm | MVP |\n| Cổng mềm (dụng cụ yếu) | Thanh tiến độ chậm, biểu tượng khóa nửa mở | Tiếng khoan ì ạch | Gợi ý \"cần bậc cao hơn để nhanh\" | MVP |\n| Túi đầy | Thanh Khối đổi màu đỏ, vật phẩm thừa bật ra | Tiếng cảnh báo ngắn | Tutorial 4: thả đồ | MVP |\n| Bị kéo về | Màn chọn 1 món, các món còn lại mờ đi | Tiếng ngắt nhẹ | Giải thích luật 1 món ở lần đầu | MVP |\n| Chế tại xưởng | Máy ép, lò, hàng đợi | Tiếng máy theo loại công thức | Tutorial 5: chế COM đầu tiên | MVP |\n| Đóng thùng lúc Mở giao thương | Hộp gấp lại hàng loạt, nhãn loại và phẩm cấp | Tiếng dán, thả hộp | Tutorial 6 (cảng, gd-ux và gd-quan) | MVP |\n| Bậc hiếm | Màu viền và hình dạng biểu tượng khác nhau, không chỉ dựa vào màu (cho người mù màu) | Nhạc nhặt tăng cao độ theo bậc | Chú giải trong kho | MVP |\n| Nâng cấp bộ đồ hoàn thành | Bộ đồ đổi hình theo trục, trạm đổi hình khi sửa xong khoang | Tiếng khởi động | Màn nhận đồ chế xong | MVP |\n| Học bản thiết kế | Bản vẽ mở ra, dụng cụ mới hiện | Tiếng mở khóa | Tutorial dụng cụ mới | Sau MVP |\n\nArt cần ID danh sách icon: mọi ID trong ITEM LIST (khoảng 130) cần icon vector, nhóm theo hình khối: phế liệu (mảnh góc cạnh), khoáng (tinh thể), băng (khối trong), linh kiện (bo mạch), mẫu (thể sinh học), kiện (hộp). GDM đưa vào tab Assets.","he-thong/vat-pham.md",""],["7b. Cảm giác (game feel)",2,178,6,0.66,"- Tham chiếu: khoảnh khắc \"khoan và thấy tiến độ\" của Dave the Diver khi mở nhánh khai thác, tiếng nhặt tăng cao độ theo độ hiếm. Không lấy asset, chỉ lấy nhịp phản hồi: nhặt trả lời trong dưới 0,1 giây, khoan có tiến độ nhìn thấy, hoàn thành có phản hồi rõ.\n- Phản tham chiếu: không làm thanh tiến độ khoan nhàm chán như chờ. Điểm khoan mất 6 đến 14 giây ở bậc 1 nên cần có rung nhẹ và mảnh vụn để không thành thời gian chết. Không để nhặt bị kéo dài quá 1 giây.\n- Thời gian phản hồi: nhặt 0,1 giây, hoàn thành khai thác hiện hiệu ứng trong 0,2 giây, đóng thùng lúc Mở giao thương, hộp gấp trong 0,5 giây.","he-thong/vat-pham.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,178,6,1.8,"- Chỉ số kết quả: số GTĐ trung bình mang về mỗi chuyến (do gd-tech đo ở sim). Thời gian làm đầy túi (mục tiêu 60 đến 70% chuyến, chương 1). Tỉ lệ chuyến dùng cả khoan, nạy hòm và hạ trong cùng chuyến ở chương 1 (mục tiêu trên 90%). Tỉ lệ kiện tinh trên kiện thô khi có đủ nguyên liệu (mục tiêu trên 50% sau chương 1).\n- Chỉ số trải nghiệm: playtest ghi người chơi hiểu vì sao đồ này đáng nhặt, bỏ gì khi túi đầy.\n\nTiêu chí nghiệm thu (gd-qa kiểm pass hoặc fail):\n1. `node projects/game-moi/sim/vat-pham.mjs` thoát mã 0, 0 lỗi.\n2. Mọi vật phẩm trong ITEM LIST có nguồn nhận và nguồn tiêu (script).\n3. Mọi công thức chỉ dùng vật phẩm có trong ITEM LIST (script).\n4. Mỗi dải có ít nhất 2 tài nguyên riêng (script).\n5. Biên lợi mọi công thức nằm trong khoảng ở luật C5 (script).\n6. Tỉ lệ ròng mẫu sống trên hạ từ 1,5 đến 2,0 cho mọi loài cỡ S và M có mẫu sống (script kiểm). Mẫu sinh thiết loài cỡ L đứng ngoài K9 (log 66), script chỉ kiểm khoảng 0,4 đến 0,5 theo thiết kế.\n7. Không ghi giá Tally ở file này. Tìm \"Tally\" chỉ thấy trong ngữ cảnh giá do gd-economy giữ.\n8. Mỗi nhãn MVP có số lượng đủ cho chương 1: 6 tài nguyên, 5 COM, 9 kiện, 6 nâng cấp, 2 vật tiêu hao, 5 dụng cụ cộng chìa Bộ kích nguồn, 4 loài Driftlife trong đó 3 loài cỡ S bắt sống được. Mỗi luật có nhãn MVP hoặc Sau MVP.\n9. Không còn dấu chờ của gd-story, gd-character, gd-combat, gd-world, gd-quan. Chỉ còn chờ gd-economy (giá, quy đổi GTĐ), gd-ux, gd-tech (script kiểm đã có sẵn, sim đợt 2).\n10. Kiểm sim đợt 2 (gd-tech): thời gian làm đầy túi, thu nhập chuỗi thô và chuỗi tinh trong một ngày, mức độ trội của một chiến lược nhặt (script nên in).","he-thong/vat-pham.md",""],["10. Câu hỏi mở",2,178,6,2.71,"| # | Câu hỏi | Đề xuất | Ai quyết |\n|---|---|---|---|\n| 1 | Túi đo bằng Khối hay ô, sức chứa khởi điểm | Khối, 80 Khối khởi điểm (GDM chốt log 54). Nếu gd-character chọn ô thì 1 Khối bằng 1 ô, vật nặng chiếm nhiều ô | gd-character |\n| 2 | Tên và thứ tự loài Driftlife | Đã khớp với `combat-driftlife.md`: Gần 111 đến 115, Giữa 211 đến 215, Xa 311 đến 315. Mẫu sinh thiết BPS cho 4 loài L. Mẫu boss SMP-192 và SMP-292. Phao kéo CON-106, Kim sinh thiết CON-107, Lồng mẫu TOL-501 | gd-combat xác nhận |\n| 3 | Bình Oxy nhỏ có phá P1 (\"không hồi Oxy miễn phí giữa chuyến\") không | Giữ, vì tốn Khối và vật liệu chế, chỉ hồi 40 điểm (khoảng 12% bình bậc 0), tối đa 2 bình mỗi chuyến (luật T8), hủy nếu bị đánh | gd-character, GDM |\n| 4 | Số ô dụng cụ | Đã chốt theo `nguoi-choi.md`: 3, 4, 5 ô theo Đai dụng cụ (UPG-RACK). Vật tiêu hao nằm trong túi | gd-character (đã trả lời) |\n| 5 | Chỉ số combat của dụng cụ theo bậc, cooldown, tầm | gd-combat giữ. Đề xuất dụng cụ không độ bền, chi phí là vật tiêu hao hoặc cooldown | gd-combat |\n| 6 | Tốc độ mang kiện nhiều người | Bỏ từ đợt 9: không có cỡ kiện, không khiêng chung, thùng mang một lần một thùng, tốc độ không đổi | gd-quan (Lead chốt 2026-11-20) |\n| 7 | Nhu cầu vật liệu sửa khoang, số bước lắp động cơ chính | Bảng ở mục 2.7 | gd-quan |\n| 8 | Quy đổi GTĐ ra Tally, mức giá kiện, giá linh kiện ENG, giá nâng cấp | Hệ số GTĐ sang Tally là một số duy nhất theo chương hoặc Hạng cảng, gd-economy đặt | gd-economy |\n| 9 | Số điểm khai thác theo số người k(N), mật độ, vị trí | Do gd-world giữ ở `map.md`, vật phẩm không có núm riêng | gd-world, GDM (mục tiêu 70 đến 85%) |\n| 10 | Vật kể chuyện: tên riêng và nơi đặt | ID đã gán theo danh mục gd-story: STY-101 Nhật ký trạm, STY-102..104 Mảnh lõi dẫn đường (Cinder, Wick, Flint), STY-105 Lõi dẫn đường Cradle, STY-301 Mẫu mang dấu săn bắt, STY-401 Hộp ghi hành trình, STY-501 Bản đồ sao thật, STY-601 Thẻ tên buồng ngủ đông | gd-story |\n| 11 | Bộ kích nguồn (TOL-401) từ đâu | Đã chốt với gd-world: công thức đầu của Xưởng sau khi vớt Kỹ sư (RCP-205). Nhịp khóa và chìa đầu game được giữ | gd-world (đã trả lời) |\n| 12 | Giai đoạn 5 động cơ dùng ENG-105 chế từ STY, không mua ở Shop | Giữ (lý do R2 của truyện). Nếu gd-quan cần 5 linh kiện mua được thì đổi RCP-207 thành mua | gd-quan |\n| 13 | Kiện đồ Trái Đất (CGO-109) cho thương nhân mê đồ Trái Đất (gd-story) | Đã thêm RES-106 Đồ Trái Đất vụn trong hòm kỹ thuật, kiện thô CGO-109 | gd-quan |","he-thong/vat-pham.md",""],["Trạm và cảng",1,0,7,43.19,"Trạm và cảng là nửa ở nhà của The Novent. Người chơi sửa từng khoang của Station Ember, đánh thức người vớt để mở tính năng, nuôi Driftlife, và chơi giờ giao thương, nửa chơi tay thứ hai. Trước ca người chơi lập danh mục bán từ hàng trong kho. Trong ca tàu thương nhân cập vào 3 cửa neo, mỗi tàu gọi 1 thùng, người chơi mang thùng từ quầy cảng tới đúng cửa neo trước khi tàu hết kiên nhẫn và bơm khí cho tàu đang chờ để lấy Tally và tip. Tầng: lõi. Ưu tiên: bản đầu (MVP chương 1). Phụ thuộc chính: vật phẩm (gd-items), Driftlife (gd-combat), kinh tế (gd-economy), cốt truyện (gd-story).","he-thong/tram-va-cang.md","GDD hệ thống: Trạm và cảng"],["Hiện hành",2,201,7,1.41,"| Mục | Giá trị hiện hành | Nhãn |\n|---|---|---|\n| Số khoang | 13 khoang, 7 khoang có ở chương 1 | MVP một phần |\n| Sửa khoang | Mang đủ vật liệu tới khoang, giữ phím sửa | MVP |\n| Trước ca | Lập danh mục bán tối đa 4 loại hàng (chương 1), Thông dịch viên tự đóng thùng lúc Mở giao thương. Hàng cần chế phải chế xong ở xưởng trước ca | MVP |\n| Giờ giao thương | Bến 1 có 3 cửa neo. Tàu cập theo nhịp, mỗi tàu gọi 1 thùng. Mang thùng từ quầy cảng tới đúng cửa neo, bơm khí cho tàu đang chờ. Trả giá thùng cộng tip theo kiên nhẫn còn lại | MVP |\n| Thất bại trong ca | Tàu hết kiên nhẫn thì rời, chỉ mất món đó. Thùng về kho, không trừ Tally, không giảm Hạng cảng | MVP |\n| Đơn đặt trước | 1 đơn mỗi ngày ở chương 1, hiện ở bảng tàu, giá thùng nhân 1,5 | MVP |\n| Hạng cảng | 8 hạng, điểm cảng theo tàu phục vụ xong, có trần theo chương, không bao giờ giảm. Ngưỡng 70, 135, 285, 400, 560, 680, 910 (GD-055) | MVP tới hạng 3 |\n| Nuôi Driftlife | 4 ô lên 9 ô, cặp cùng loài sinh con non, cho ăn thì ra sản phẩm, không cho ăn không chết | Sau MVP |\n| Sự cố | Từ chương 3: rò khí ở cửa neo, chập điện ở quầy, Driftlife sổng ôm thùng | Sau MVP |\n| Co-op | Mọi luật đúng với 1 đến 4 người. Bến 1 luôn 3 cửa neo. Số tàu một ca 25, 55, 55, 60 cho 1 tới 4 người (sim GD-054 vòng 2 mục 4) | MVP 2 người |","he-thong/tram-va-cang.md",""],["1. Mục đích với người chơi",2,201,7,2.81,"- Pillar P2 (mang về là để trạm sống lại): mỗi chuyến về là có thứ để sửa, mỗi khoang sửa xong đổi hình mặt cắt trạm và trả một chức năng.\n- Pillar P1 kéo dài sang nhà: bảng tàu cho biết hôm nay loại tàu nào ghé, tàu đó hay gọi gì và đơn đặt trước nào đang chờ, nên quyết định đi dải nào và mang gì về bắt đầu từ cảng.\n- Pillar P3: giờ giao thương có đủ việc cho 4 người nhưng một người vẫn chơi trọn, vì số tàu co giãn theo số người và mỗi tàu chỉ cần 1 thùng.\n- Pillar P4: thương nhân ghé cảng là nơi kể truyện giữa hai nửa ngày, kể cả tàu lạ của gián điệp Maro và Ilsume, người thừa kế Sevra giả danh.\n- Cảm giác giờ giao thương: tay bận, đầu nhẹ. Quyết định nặng nằm trước ca (bán gì, bao nhiêu). Trong ca người chơi đọc bong bóng, chọn tàu sắp hết kiên nhẫn để phục vụ trước, chen bơm khí khi rảnh tay. Chậm thì mất tip trước, chậm nữa mới mất món.\n- 30 giây đầu của giờ giao thương đầu tiên (luật 67): màn lập danh mục mở với thùng phế liệu chọn sẵn, người chơi bấm Mở giao thương. TA01 cập cửa neo 1, bong bóng hiện thùng phế liệu, 3 giây sau thùng viền màu cửa neo 1 hiện ở quầy. Người chơi nhặt thùng, chạy tới cửa neo 1, giao, thấy giá và tip bay lên. Tàu thứ hai cập khi tay trống và bật bơm khí ngay.","he-thong/tram-va-cang.md",""],["2. Luật",2,201,7,50.39,"","he-thong/tram-va-cang.md",""],["Luật trạm và khoang (K10, K11)",3,204,7,7.09,"1. Ember có 13 khoang ở bảng Danh mục. Mỗi khoang ở một trong bốn trạng thái: Hỏng, Hoạt động, Đang sự cố, Đang nâng cấp. `MVP` (trừ Đang sự cố)\n2. Khoang Hỏng không dùng được chức năng, vẫn đi qua được. `MVP`\n3. Sửa khoang: mọi vật liệu trong danh sách sửa phải nằm trong kho, người chơi đứng ở khoang và giữ phím sửa trong thời gian sửa. Bắt đầu giữ phím thì vật liệu bị trừ khỏi kho. Thả phím giữa chừng thì tiến độ giữ nguyên, vật liệu không hoàn lại, giữ phím lại thì làm tiếp. `MVP`\n4. Sửa xong thì khoang sang Hoạt động cấp 1, mặt cắt trạm đổi hình khoang đó và hiện người vớt phụ trách (nếu có). `MVP`\n5. Nâng cấp khoang lên cấp 2 và cấp 3 theo cùng cách sửa, cần vật liệu và Tally theo bảng của gd-economy. Trong lúc nâng cấp khoang vẫn dùng được. ID nâng cấp là ID khoang cộng cấp: KH05-C2 là xưởng cấp 2, KH07-C2 là Cảng cấp 2: cửa neo thứ 4 của bến 1 (mua ở shop, Hạng 4), là nâng cấp, không theo số người, KH12-KP là quầy phụ cạnh bến 2 và bến 3, KHxx-C3 là cấp 3 của khoang xx. Xưởng cấp 2 mở ở chương 2. Mọi nâng cấp khoang `Sau MVP`\n6. Khoang neo là khoang đầu tiên sửa được. Trước khi khoang neo Hoạt động, chỉ cửa khí, kho, buồng ngủ đông dùng được, và Ember trôi chậm (hình nền trôi, không ảnh hưởng luật). Sửa xong khoang neo thì Ember đứng yên tới hết game. `MVP`\n7. Một khoang chỉ sửa được khi chương của khoang đã mở (bảng 2.6). Khoang có người vớt phụ trách (xưởng, khoang liên lạc, cảng, khoang dẫn đường, bến Skiff, phòng nghiên cứu, khoang sinh quyển, bến 2, bến 3) chỉ sửa được sau khi người vớt đó tỉnh và giao quest (luật 15). Khoang chưa sửa được hiện khung tối và một dòng gợi ý truyện. `MVP`\n8. Kho không giới hạn số lượng. Đồ trong túi đồ tự vào kho khi người chơi qua cửa khí về trạm. `MVP`\n9. Trạm không xấu đi theo thời gian: khoang Hoạt động không tự hỏng lại. Chỉ sự cố (từ chương 3) làm một phần của cảng tạm Đang sự cố trong giờ giao thương. `MVP`","he-thong/tram-va-cang.md",""],["Luật động cơ chính (K10)",3,204,7,3.1,"10. Động cơ chính có 5 giai đoạn. Mỗi chương mở đúng một giai đoạn. Mỗi giai đoạn cần một bộ vật liệu gồm tài nguyên của dải mới và một linh kiện động cơ. Giai đoạn 1 tới 4 dùng ENG-101 tới ENG-104 mua ở shop. Giai đoạn 5 dùng ENG-105 chế ở xưởng (RCP-207) từ bản đồ sao thật lấy ở Warden Rig và hộp ghi hành trình Cradle, không mua được. `MVP` giai đoạn 1\n11. Sửa một giai đoạn theo luật 3. Xong giai đoạn thì động cơ hiện thêm một phần sáng đèn. Mốc đóng chương của truyện chỉ kích hoạt khi giai đoạn động cơ của chương đã lắp, chương đóng khi mốc đó xong (K25). Trạm không có cổng chương riêng. `MVP` giai đoạn 1\n12. Giai đoạn 5 chỉ sửa được sau mốc C5.6 (lấy bản đồ sao thật ở Warden Rig). Xong giai đoạn 5 thì Ember rời neo, rời bãi vỡ, game sang cảnh kết mở C5.7, không tới Solace (K10). Sau cảnh kết game về menu chính. Bản lưu ở ngày cuối với mọi mốc truyện đã xong, Ember còn ở neo để chơi tự do, không có nội dung mới. Cảnh kết không phát lại, xem lại từ Sổ tay (K24). `Sau MVP`","he-thong/tram-va-cang.md",""],["Luật người vớt mở tính năng (K12)",3,204,7,10.26,"13. Mỗi người vớt nằm trong một buồng ngủ đông còn chạy (BNG-101) ở một map nhánh. Người chơi tìm buồng, kéo buồng về cửa khí của Ember (luật kéo vật của gd-character). Người vớt nào gd-story đặt ngoài buồng ngủ đông (ví dụ người đang sống ở Station Lantern) thì tới Ember theo mốc truyện, bỏ qua luật 13 và 14, vẫn áp luật 15. `MVP` cho Kỹ sư, Thông dịch viên\n14. Buồng kéo về qua cửa khí thì đặt vào khu hồi sức cạnh buồng ngủ đông, người vớt ở trạng thái Hồi sức. Mốc truyện của việc vớt xong lúc buồng qua cửa khí. Người vớt tỉnh vào đầu ngày kế tiếp và giao quest lúc tỉnh. `MVP`\n15. Người vớt tỉnh thì giao quest mở: sửa khoang của người đó (luật 3). Thông dịch viên có hai khoang, quest là sửa cả khoang liên lạc KH06 và cảng KH07 (khớp luật 18 và mốc C1.7). Sửa xong thì tính năng mở và người vớt đứng làm việc ở khoang đó. `MVP`\n16. Mỗi người vớt có tính năng lớn dần theo cấp khoang và theo chương (bảng 2.7). Người vớt không chết, không rời trạm, không cần ăn (K17). `MVP`\n17. Người vớt không phải nhân vật người chơi. Người chơi vào phiên sau là người sống sót vớt về theo luật C2, không chiếm chỗ của 5 người vớt. `MVP`","he-thong/tram-va-cang.md",""],["Luật giờ giao thương (K13)",3,204,7,16.5,"18. Giờ giao thương chỉ có khi khoang liên lạc và cảng (bến 1) đều Hoạt động. Trước đó pha giờ giao thương tự bỏ qua. `MVP`\n19. Ca bắt đầu khi một người chơi tương tác với bảng tàu ở khoang liên lạc và chọn Mở giao thương, theo điều kiện ở luật 64 tới 66. Chọn Nghỉ giao thương thì ca bỏ qua, không phạt, tàu hôm đó không tới, kho giữ nguyên. `MVP`\n20. Danh mục bán: trước khi Mở giao thương, người chơi lập danh mục ở bảng tàu. Danh mục gồm tối đa M loại hàng, mỗi loại hàng là một ID kiện đã mở (bảng Nhóm hàng cảng). Mỗi loại đặt số thùng từ 1 tới số thùng kho làm được. M theo Hạng cảng (mục 3). Danh mục rỗng thì không Mở giao thương được. Danh mục chốt lúc Mở giao thương, không sửa trong ca. `MVP`\n21. Thùng là đơn vị bán trong ca, bằng 0,4 kiện. Số thùng kho làm được của một ID kiện bằng số kiện làm được theo công thức của gd-items nhân 2,5, làm tròn xuống. Lồng sinh vật sống, bản sao dữ liệu và kiện tin mật không chia: một đơn vị là một thùng. `MVP` (bản sao, tin mật `Sau MVP`)\n22. Lúc Mở giao thương, Thông dịch viên đóng thùng tự động cho cả danh mục và trừ hàng khỏi kho ngay, không tốn thời gian ca. Hàng cần chế phải chế xong ở xưởng trước khi Mở giao thương (luật 53). Trong ca không chế, không đóng gì. `MVP`\n23. Bến 1 có 3 cửa neo, mỗi cửa neo chứa một tàu. Số cửa neo không đổi theo số người (GDM chốt đợt 9, sim GD-054 vòng 2 đạt mục tiêu ở 1 tới 4 người). Cửa neo thứ 4 chỉ có qua nâng cấp KH07-C2. Tàu tới mà có cửa neo trống thì cập cửa neo trống có số nhỏ nhất. Mọi cửa neo bận thì tàu chờ ngoài, xếp hàng ở mép màn hình kèm đồng hồ chờ ngoài. Có cửa neo trống thì tàu chờ lâu nhất cập trước. Hết đồng hồ chờ ngoài thì tàu bỏ đi. `MVP`\n24. Lúc tới, mỗi tàu chọn đúng 1 thùng trong các loại hàng còn thùng của danh mục. Trọng số chọn bằng độ gọi của bậc giá (gd-economy, `kinh-te-tien-trinh.md` mục 3.1: Hàng chợ 3, Hàng sinh học 2, Hàng chế 1,5, Hàng sống 1, Hàng hiếm 1) nhân hệ số hàng hay gọi của loại tàu (bảng 2.4, loại hàng không ghi có hệ số 1). Tàu có cột \"chỉ gọi\" ở bảng 2.4 chỉ chọn trong các nhóm đó. Thùng đó giữ riêng cho tàu từ lúc chọn. Tàu có đơn đặt trước chọn đúng thùng đã đặt (luật 72). Danh mục không còn thùng nào tàu đó gọi được thì tàu không tới. Từ chương 1, TA02 chỉ gọi băng hoặc khoáng, nên danh mục không có hai nhóm đó thì Tàu vội không tới và mất tip gấp đôi của nó. Người chơi phải chọn giữa bán hàng đắt và giữ chỗ cho hàng tàu tip cao gọi. Tàu cập cửa neo thì hiện món gọi bằng bong bóng trên tàu. `MVP`\n25. Quầy cảng có 3 ô, mỗi ô cùng màu một cửa neo. 3 giây sau khi tàu cập, thùng tàu gọi hiện ở ô quầy cùng màu cửa neo đó. `MVP`\n26. Mang thùng: người chơi tay trống nhặt thùng ở ô quầy bằng tương tác. Mỗi lần mang 1 thùng, tốc độ chạy không đổi khi mang. Tới cửa neo nhấn tương tác để giao. Thùng giao vào cửa neo khác thì tàu từ chối, thùng ở lại tay. Thùng đã nhặt không đặt xuống được, chỉ giao (GDM chốt cho MVP). Thứ tự xử lý ở mục \"Thứ tự xử lý khi giao thùng\". `MVP`\n27. Kiên nhẫn: mỗi tàu có thanh kiên nhẫn đầy lúc cập cửa neo và giảm 1 mỗi giây. Kiên nhẫn tối đa theo loại tàu (bảng 2.4). Lúc chờ ngoài chỉ chạy đồng hồ chờ ngoài, không trừ kiên nhẫn. Hết kiên nhẫn thì tàu rời chưa giao (luật 32). `MVP`\n28. Bơm khí: lúc cập, mỗi tàu có 50% bật yêu cầu bơm khí ngay. Tàu chưa giao thì bật yêu cầu nữa sau 10 tới 18 giây kể từ lúc cập hoặc lần bơm trước. Người chơi tay trống đứng ở cửa neo đó giữ tương tác 1 giây. Xong thì kiên nhẫn hồi 25% kiên nhẫn tối đa, không vượt tối đa, và cộng 10 Tally tính vào tip. Rời cửa neo trước 1 giây thì không tính, làm lại từ đầu. Bỏ qua yêu cầu không bị trừ gì. Lý do bật lúc cập: sim GD-054 cho thấy tàu thường được giao trong 10 giây, bơm khí bật sau 10 giây thì người chơi một mình không bao giờ gặp. Bật lúc cập thì bơm khí tranh 3 giây chờ thùng ra quầy với việc chạy về quầy. Số 50% là ước, gd-tech đo lại. `MVP`\n29. Giao đúng thì tàu nhận thùng, trả Tally ngay bằng giá thùng cộng tip (luật 30, 31), cộng điểm cảng (luật 40), rồi rời cửa neo. Cửa neo trống khi tàu khuất. `MVP`\n30. Giá thùng bằng giá ID kiện chia 2,5, gd-economy đặt (`kinh-te-tien-trinh.md` mục 3.1). Hàng không chia (luật 21) giữ giá một đơn vị. Lồng tính giá theo loài bên trong. Thùng của đơn đặt trước nhân 1,5 (luật 71). Giá không nhân theo Hạng cảng, không nhân theo số người. `MVP`\n31. Tip bằng giá thùng nhân 25%, nhân phần kiên nhẫn còn lại lúc giao (0 tới 1), nhân hệ số tip của loại tàu, nhân 2 nếu là món mê của tàu đó (bảng 2.4), làm tròn. Bơm khí cộng thêm 10 Tally mỗi lần (luật 28). Tip là chỗ duy nhất tốc độ đổi ra Tally. `MVP`\n32. Tàu rời chưa giao khi hết kiên nhẫn hoặc hết giờ giao thương. Tàu bỏ đi khi hết đồng hồ chờ ngoài. Cả hai chỉ mất món của tàu đó: không có giá, tip, điểm cảng cho tàu đó, không trừ gì. Thùng của tàu (ở quầy hay trên tay) về lại danh mục, tàu sau gọi được. `MVP`\n33. Tàu không bán gì trong ca. Mua hàng chỉ ở shop của khoang liên lạc vào cuối ngày (K20). `MVP`\n34. Ca kết thúc ở điều tới trước trong ba điều: hết giờ giao thương (300 giây), tàu cuối của lịch đã rời, hoặc danh mục hết thùng (kể cả thùng giữ cho đơn đặt trước) và không còn tàu ở cửa neo hay chờ ngoài. Hết danh mục thì tàu còn lại trong lịch không tới. Hết giờ giao thương thì mọi tàu ở cửa neo rời ngay và tàu chờ ngoài bỏ đi, áp luật 32. `MVP`\n35. Cuối ca hiện bảng tổng kết giao thương: số tàu phục vụ xong trên số tàu trong lịch, số tàu rời chưa giao, số tàu không tới vì hết hàng, Tally từ giá thùng, tip (kể cả bơm khí), tổng Tally, điểm cảng, kết quả đơn đặt trước, số thùng về kho theo loại, lời một thương nhân. Thùng còn lại về kho ngay, giữ qua ngày, không hỏng. Bảng tổng kết giao thương không chặn người chơi khác trong co-op. Mốc truyện xảy ra trong ca (C1.8, C2.3, C3.3, C3.4, C4.7, C5.2) chỉ hiện lời bong bóng trong ca, cảnh phát ở pha Cuối ngày, đồng hồ ca không dừng. `MVP`\n36. Thời gian trong ca không dừng khi mở menu nếu có từ 2 người (C7). Chơi một mình thì tạm dừng được. `MVP`\n\nThắng khi (ca): phục vụ xong mọi tàu khi kiên nhẫn còn cao. Không có trạng thái thua ca. Ca tệ nhất là mọi tàu rời chưa giao, khi đó ca không có Tally, mọi thùng về kho, Hạng cảng không đổi.\nCam kết với người chơi: không mất hàng vì tàu rời, không trừ Tally, không giảm Hạng cảng, thùng không hỏng, bảng tàu không nói dối (TA06 gọi bằng gợi ý, bảng tàu ghi rõ).","he-thong/tram-va-cang.md",""],["Luật loại tàu (K13, chi tiết từng loại ở bảng 2.4)",3,204,7,0.82,"37. Mỗi loại tàu khác nhau ở tối đa ba trục: kiên nhẫn, hàng hay gọi (trọng số sở thích hoặc chỉ gọi một số nhóm), một luật riêng. Không loại nào chỉ khác nhau ở số. `MVP`\n38. TA08 tàu lạ không thuộc túi trộn. TA08 cập bến đúng 2 lần, mỗi ngày tối đa 1 lần. Lần 1 vào lịch từ ngày kế tiếp sau khi bến 2 (KH12) Hoạt động, lần cập bến này hoàn thành mốc C3.3, tàu gọi 1 thùng như tàu thường. Lần 2 vào lịch từ ngày kế tiếp sau mốc C3.4, đặt trước 1 bản sao dữ liệu (HC09) của nhật ký trạm (hiện ở bảng tàu như đơn đặt trước) kèm lời thoại dò hỏi về các thương hội Sennari ghé Ember. Sau mốc C3.8 TA08 không ghé nữa. Truyện đếm lần cập bến, giao hay không giao đều không đổi truyện. Bán bản sao không mất vật gốc và không mất manh mối. `Sau MVP`","he-thong/tram-va-cang.md",""],["Luật Hạng cảng (K15)",3,204,7,4.82,"39. Hạng cảng là một thang duy nhất từ hạng 1 tới hạng 8, chung cả nhóm. `MVP` tới hạng 3\n40. Điểm cảng: mỗi tàu phục vụ xong cho 1 điểm, thêm 1 điểm khi lúc giao còn từ 2/3 kiên nhẫn trở lên. Tàu rời chưa giao, bỏ đi, không tới cho 0 điểm. Điểm không nhân theo số người vì số tàu đã tăng theo số người (luật 68). Điểm cảng không bao giờ giảm. `MVP`\n41. Đủ điểm ngưỡng thì lên hạng ngay sau bảng tổng kết giao thương. Mỗi chương có trần hạng: đủ điểm nhưng chạm trần thì điểm vẫn cộng dồn, lên hạng khi chương sau mở. Ngưỡng điểm Hạng cảng 2 tới 8: 70, 135, 285, 400, 560, 680, 910 (gd-economy GD-055, `kinh-te-tien-trinh.md` mục 3.5). `MVP`\n42. Mỗi hạng mở đúng các thứ ở bảng 2.5: loại tàu, trần danh mục M, loại hàng bán được, mục shop. `MVP` tới hạng 3","he-thong/tram-va-cang.md",""],["Luật sự cố (K14)",3,204,7,2.91,"43. Trước chương 3 không có sự cố. Sự cố bắt đầu từ giờ giao thương kế tiếp sau lần đầu TA08 cập bến (lý do truyện: thiết bị Maro để lại làm trạm trục trặc, theo gd-story). Từ đó mỗi ca có số sự cố theo bảng tham số, giờ xảy ra ngẫu nhiên trong ca nhưng không trong 30 giây đầu ca. `Sau MVP`\n44. Sự cố làm một cửa neo, một ô quầy cảng hoặc khoang sinh quyển sang Đang sự cố. Xử lý bằng thao tác ở bảng 2.8. Xử lý xong thì chỗ đó về trạng thái trước. `Sau MVP`\n45. Sự cố bỏ mặc chỉ gây hậu quả trong ca đó. Hết giờ giao thương thì mọi sự cố tự hết, không có hư hại lâu dài, không mất hàng. `Sau MVP`\n46. Driftlife sổng chỉ xảy ra khi khoang sinh quyển có Driftlife nuôi. Loài sổng là một loài đang nuôi. Thùng con sổng ôm không mất: tóm được thì thùng về ô quầy cũ, hết giờ giao thương thì thùng về kho. Tàu đang chờ thùng đó vẫn giảm kiên nhẫn. `Sau MVP`","he-thong/tram-va-cang.md",""],["Luật nuôi Driftlife (K16)",3,204,7,3.67,"47. Khoang sinh quyển mở ở chương 2 khi Nhà sinh học tỉnh và khoang được sửa. Khoang có số ô nuôi theo cấp khoang, mỗi ô chứa một con. `Sau MVP`\n48. Thả Driftlife sống vào ô trống bằng cách mang lồng tới khoang. Chỉ loài gd-combat ghi \"nuôi được\" mới thả được. `Sau MVP`\n49. Cho ăn là bỏ 1 thức ăn đúng dải (FED-101, FED-201, FED-301, làm ở khoang sinh quyển từ mô sinh học) cho mỗi con. Mỗi ngày, mỗi con trưởng thành được cho ăn thì ra một sản phẩm nuôi (BIO của loài đó) vào đầu ngày kế tiếp. Không cho ăn thì không ra sản phẩm, con vật không chết, không yếu đi. Sản phẩm nuôi và Driftlife nuôi chỉ ra Tally khi bán ở giờ giao thương (HC06, HC07, HC11), nên lợi từ nuôi mỗi ngày có trần là số tàu một ca và trần M của danh mục. `Sau MVP`\n50. Hai con cùng loài cùng trưởng thành và được cho ăn trong ngày thì đầu ngày kế tiếp sinh một con non nếu khoang còn ô trống. Một cặp sinh tối đa một con non mỗi ngày. Con non trưởng thành sau số ngày theo tham số. `Sau MVP`\n51. Lấy Driftlife trưởng thành ra khỏi ô bỏ vào lồng thì dùng được như Driftlife bắt sống: bán ở giờ giao thương (HC06), nghiên cứu, thả ra ngoài. Lồng con nuôi có giá bằng 0,5 lần lồng bắt ngoài chuyến cùng loài, mỗi loài tối đa 1 lồng con nuôi mỗi ngày (luật M5 của `vat-pham.md`). Con non chưa trưởng thành không lấy ra được. `Sau MVP`\n52. Nâng cấp khoang sinh quyển thêm ô. Môi trường cho loài dải Xa có ở cấp 3, riêng khoang sinh quyển được nâng cấp 3 từ chương 3 (bảng 2.6). Loài dải Xa không thả được vào khoang chưa có môi trường đó. `Sau MVP`","he-thong/tram-va-cang.md",""],["Luật chế trước và lập danh mục (C9)",3,204,7,6.82,"53. Chế trước: hàng cần chế (CGO-113, HC04, HC08, HC12, HC13) phải chế ở xưởng trước khi Mở giao thương. Xưởng chạy một mẻ một lúc và giữ thêm mẻ chờ trong hàng đợi chế. Mẻ chạy theo thời gian thực kể cả khi người chơi ra chuyến. Mẻ còn trong hàng đợi lúc ngủ thì xong khi sang ngày (chế qua đêm). Mẻ xong sau khi Mở giao thương thì vào kho, không vào danh mục ca đó. `MVP` cho CGO-113\n54. Người đang ở trạm trong lúc đồng đội còn ở ngoài (về sớm, bị kéo về, hoặc chọn ở lại theo C5) không ra lại trong chuyến đó (C9) và được làm mọi việc trạm: chế trước ở xưởng, lập danh mục nháp, sửa khoang, chăm khoang nuôi. Người đó xem vị trí đồng đội trên bản đồ ở khoang liên lạc (hiển thị do gd-ux). `MVP`\n55. Lập danh mục làm được bất cứ lúc nào trước Mở giao thương, ở bảng tàu của khoang liên lạc. Danh mục nháp lưu lại tới khi Mở giao thương, kể cả khi thoát bảng tàu. Co-op có một danh mục chung, ai ở khoang liên lạc cũng sửa được, người Mở giao thương chốt. Chơi một mình áp cùng luật. `MVP`\n56. Danh mục chỉ dùng hàng đã nằm trong kho. Hàng trong túi đồ của đồng đội còn ở ngoài chưa dùng được cho tới khi người đó về qua cửa khí (K3). Kho giảm sau khi lập nháp thì số thùng của loại đó tự hạ về số kho làm được. `MVP`\n57. Bảng tàu giúp lập danh mục: hiện số tàu dự kiến, hàng mỗi loại tàu hôm nay hay gọi, đơn đặt trước, giá thùng từng loại, tổng thùng so với số tàu (cảnh báo khi ít hơn số tàu: ca có thể kết thúc sớm). Bảng tàu không chọn hộ. `MVP`\n58. Chế trước và danh mục rộng được trả bằng việc bán được nhiều tàu hơn và đơn đặt trước giá cao, không có thưởng riêng. Hệ số 1,35 của bậc Hàng chế là giá của loại hàng đó (gd-economy mục 3.1), trả công chế qua giá thùng. `MVP`","he-thong/tram-va-cang.md",""],["Luật buồng ngủ đông và cửa khí (KH01, KH02, C5, K22, K23)",3,204,7,3.98,"59. Sang ngày mới: mỗi người vào chỗ ngủ của mình (luật 62) là xác nhận sẵn sàng. Khi mọi người đang online đã xác nhận thì cả nhóm ngủ, lưu, sang ngày mới. Chơi một mình thì vào buồng là ngủ ngay. `MVP`\n60. Từ lúc người đầu tiên vào buồng, người chưa vào có 30 giây (K23), đồng hồ hiện trên HUD của mọi người. Hết 30 giây, người chưa xác nhận tự tính sẵn sàng và nhân vật tự về buồng. Người đã vào buồng được ra lại để hủy xác nhận, đồng hồ không dừng. `MVP`\n61. Cửa khí: người chưa trả lời xác nhận ra chuyến trong 30 giây kể từ khi người đầu tiên xác nhận thì tự tính là ở lại trạm (C5), chuyến bắt đầu với những người đã xác nhận. Người tự tính ở lại áp luật 54. Người đã xác nhận được hủy xác nhận trước khi chuyến bắt đầu. `MVP`\n62. KH01 có 4 buồng ngủ đông. Lúc tạo thế giới, N buồng chạy cho N người tỉnh, các buồng còn lại hỏng và người trong đó đã chết, không sửa được (B7, `cot-truyen.md`). Người chơi vào sau tới trong buồng ngủ đông của trạm khác, buồng đó đặt ở khu hồi sức cạnh KH01 và là chỗ ngủ của người đó. Người vào sau không lấp buồng tắt. Khu hồi sức không giới hạn số buồng. `MVP`\n63. Cửa khí nạp đầy Oxy cho người về trạm khi chuyến của người đó kết thúc. Một ngày có tối đa 2 chuyến, đi bằng Skiff cũng tính một chuyến. Sau chuyến thứ 2, hoặc khi giờ giao thương đã mở hay đã bỏ, cửa khí khóa tới ngày mới (K22). `MVP`","he-thong/tram-va-cang.md",""],["Luật mở giao thương, sinh lịch và đơn đặt trước (chi tiết luật 19, 24)",3,204,7,12.83,"64. Mở giao thương chỉ được khi không còn ai ở ngoài chuyến. N của ca là số người online lúc mở giao thương. Số tàu và giãn cách chốt theo N đó, không đổi tới hết giờ giao thương (khớp `ky-thuat.md` luật 12). `MVP`\n65. Mỗi ngày có đúng một giờ giao thương. Ca đã kết thúc hoặc đã bỏ thì không mở lại trong ngày. Mở giao thương hoặc Nghỉ giao thương thì cửa khí khóa tới ngày mới (luật 63), vì giờ giao thương là pha sau các chuyến (K22). `MVP`\n66. Khi có từ 2 người online: Nghỉ giao thương, và Mở giao thương lúc nhóm chưa đi đủ 2 chuyến, cần mọi người online xác nhận, không trả lời trong 30 giây tính là đồng ý (cùng cách K23). Mở giao thương sau khi đã đi đủ 2 chuyến không cần xác nhận. `MVP`\n67. Giờ giao thương đầu tiên của thế giới cố định để dạy: danh mục chọn sẵn một loại là thùng phế liệu CGO-101 với mọi thùng kho làm được, người chơi chỉ bấm Mở giao thương. Lịch có 2 tàu TA01 kiên nhẫn Dài, không có đơn đặt trước. Tàu 1 tới đầu ca, không bật bơm khí. Tàu 2 cập khi tay người chơi trống sau lần giao đầu và bật yêu cầu bơm khí ngay. Kho làm được 1 thùng phế liệu thì chỉ có tàu 1. Ca này ngắn hơn mục tiêu thời lượng ca, chủ ý. Kho không có phế liệu thì nút Mở giao thương xám kèm gợi ý mang phế liệu về, Nghỉ giao thương vẫn được. Ca này tính Tally, tip và điểm cảng như mọi ca. Ca thứ hai là ca đầu tiên người chơi tự lập danh mục, từ ca thứ hai lịch sinh theo luật 68 tới 70. `MVP`\n68. Cấu hình lịch (số tàu, giãn cách, chờ ngoài) lấy theo chương, số cửa neo Hoạt động và N, ở bảng \"Cấu hình lịch\" mục 3. Số tàu tăng theo N, giãn cách co lại để tàu vẫn tới trong cửa sổ đến (C8). Số cửa neo không đổi theo N. `MVP` cho chương 1\n69. Chọn loại tàu cho từng chỗ trong lịch: chỗ đầu dành cho tàu có điều kiện truyện đang chờ, tối đa 2 chỗ mỗi ca, theo thứ tự mốc truyện. Chỗ của đơn đặt trước gắn đúng loại tàu đã đặt (luật 71). Chỗ còn lại rút từ túi trộn: mỗi loại tàu đã mở (theo chương, Hạng cảng, mốc truyện, không gồm TA08 và TA11) góp số thẻ bằng trọng số ở bảng 2.4, rút không hoàn lại, hết túi thì trộn lại túi mới. Món mỗi tàu gọi không chọn lúc sinh lịch mà lúc tàu tới, theo danh mục còn lại (luật 24). Tàu có điều kiện truyện (TA03 cho mốc C2.3, TA06 cho mốc C3.2, TA08 hai lần cập bến, TA11 cho mốc C4.7 và C5.2) có trong lịch mỗi ngày tới khi điều kiện truyện đó xong. `MVP`\n70. Giờ đến: tàu đầu tới ở giây thứ 2 của ca. Mọi tàu tới trong cửa sổ đến 225 giây đầu ca: giãn cách trung bình bằng 225 chia số tàu, mỗi khoảng lệch ngẫu nhiên tới 22% (25 tàu là 7 tới 11 giây). Ca kéo tới 300 giây để tàu cập cuối cửa sổ còn đủ kiên nhẫn được phục vụ. Hai tàu cùng giờ đến xếp theo thứ tự trong lịch. `MVP`\n71. Đơn đặt trước: lịch của ngày có đơn đặt trước, hiện ở bảng tàu từ pha chuẩn bị: tàu nào, tàu thứ mấy trong lịch, loại hàng, giá thùng nhân 1,5. Chương 1 có 1 đơn mỗi ngày, ở tàu thứ 9 của lịch, là TA01. Loại hàng chương 1 là thùng đồ Trái Đất CGO-109. Từ ngày có Súng lưới, ngày chẵn đặt 1 lồng sống CGO-121 thay cho đồ Trái Đất. Từ chương 2 có 1 tới 2 đơn mỗi ngày, loại hàng rút từ hàng tàu đó hay gọi đã mở, ưu tiên hàng phải ra ngoài mới có. `MVP`\n72. Lúc Mở giao thương, danh mục có loại hàng đặt thì 1 thùng được giữ riêng cho đơn đó. Tàu đặt tới thì gọi đúng thùng đó. Danh mục không có loại hàng đặt thì tàu đó gọi món khác như tàu thường, đơn đặt trước không đạt, không có phạt ngoài mất phần giá cao. Tàu đặt rời chưa giao thì đơn không đạt, thùng giữ riêng về kho. `MVP`\n73. Đơn đặt trước đạt thì ghi vào bảng tổng kết giao thương và vào số lần phục vụ xong của thương nhân có tên (mục 6, Lưu). Phần lợi của đơn chỉ là giá nhân 1,5 và tip tính trên giá đó. `MVP`","he-thong/tram-va-cang.md",""],["Trạng thái và chuyển tiếp",3,204,7,2.45,"Khoang và chỗ trong cảng:\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Hỏng | Bắt đầu game | Sửa xong | Không có chức năng, đi qua được | Khoang tối, mảnh vỡ, khung đỏ khi đứng gần kèm danh sách vật liệu |\n| Hoạt động | Sửa xong, xử lý xong sự cố, hết giờ giao thương | Bắt đầu nâng cấp, có sự cố | Đủ chức năng theo cấp | Khoang sáng, người vớt đứng làm việc |\n| Đang nâng cấp | Giữ phím nâng cấp lần đầu | Nâng cấp xong | Vẫn đủ chức năng cấp hiện tại | Giàn giáo, thanh tiến độ |\n| Đang sự cố | Sự cố xảy ra trong ca ở cửa neo, ô quầy hoặc khoang sinh quyển | Xử lý xong hoặc hết giờ giao thương | Theo bảng 2.8 | Đèn đỏ nháy, biểu tượng sự cố trên mặt cắt |\n\nTàu:\n| Trạng thái | Vào khi | Ra khi | Hành vi | Người chơi thấy gì |\n|---|---|---|---|---|\n| Trong lịch | Lịch sinh ra đầu ngày | Tới giờ đến | Chưa có trong ca | Loại tàu trên bảng tàu |\n| Không tới | Tới giờ đến mà danh mục không còn thùng tàu đó gọi được | Ngay | Không giữ thùng | Không thấy tàu. Bảng tổng kết giao thương đếm vào tàu không tới |\n| Chờ ngoài | Tới giờ đến, đã giữ 1 thùng, mọi cửa neo bận | Có cửa neo trống (sang Cập), hết đồng hồ chờ ngoài (sang Bỏ đi) | Đồng hồ chờ ngoài chạy, kiên nhẫn chưa chạy | Tàu nhỏ xếp hàng ở mép màn hình, vòng đồng hồ |\n| Cập | Có cửa neo trống | Sau 1 giây (sang Ở cửa neo) | Chưa nhận thùng | Tàu trượt vào cửa neo |\n| Ở cửa neo | Cập xong | Giao đúng (sang Rời xong), hết kiên nhẫn hoặc hết giờ giao thương (sang Rời chưa giao) | Kiên nhẫn giảm, thùng ra quầy sau 3 giây, bật yêu cầu bơm khí theo luật 28 | Bong bóng món gọi, thanh kiên nhẫn, nút bơm khí khi có yêu cầu |\n| Rời xong | Giao đúng | Tàu khuất (khoảng 1,3 giây) | Không nhận gì | Thương nhân vẫy, giá và tip bay lên |\n| Rời chưa giao | Hết kiên nhẫn hoặc hết giờ giao thương | Tàu khuất | Không nhận gì, thùng về danh mục | Thương nhân lắc đầu, bong bóng tắt |\n| Bỏ đi | Hết đồng hồ chờ ngoài | Tàu khuất | Không cập, thùng về danh mục | Tàu quay đầu ở mép màn hình |\n\nThùng: Trong danh mục -> Giữ cho tàu (lúc tàu tới) -> Ở quầy (3 giây sau khi tàu cập) -> Trên tay -> Đã giao. Tàu rời chưa giao hoặc bỏ đi thì thùng từ Giữ cho tàu, Ở quầy hay Trên tay về Trong danh mục. Hết giờ giao thương thì thùng Trong danh mục về kho. Không có thùng nằm trên sàn.","he-thong/tram-va-cang.md",""],["Thứ tự xử lý khi giao thùng",3,204,7,2.98,"1. Người chơi đang mang thùng, đứng ở một cửa neo, nhấn tương tác.\n2. Cửa neo không có tàu ở trạng thái Ở cửa neo thì không nhận, thùng ở lại tay.\n3. Thùng không phải thùng tàu ở cửa neo này đang chờ thì tàu từ chối, thùng ở lại tay, hiện lời từ chối ngắn. Kiên nhẫn không bị trừ thêm.\n4. Nhận thùng: lấy phần kiên nhẫn còn lại lúc nhấn, tính giá thùng (nhân 1,5 nếu là đơn đặt trước), tính tip theo luật 31, cộng Tally, cộng điểm cảng theo luật 40, ghi đơn đặt trước đạt nếu có.\n5. Tàu sang Rời xong, bong bóng và thanh kiên nhẫn tắt, cửa neo trống khi tàu khuất.\n6. Tàu đã sang Rời chưa giao đúng lúc nhấn thì không nhận, thùng đã về danh mục và biến khỏi tay.\n7. Co-op: hai người nhặt cùng một thùng hoặc bơm cùng một cửa neo cùng khung hình thì yêu cầu tới máy chủ trước được nhận, người sau không có gì đổi. Mỗi tàu chỉ có 1 thùng nên không có hai thùng giao cho cùng một tàu.","he-thong/tram-va-cang.md",""],["2.4 Bảng loại tàu",3,204,7,14.54,"Kiên nhẫn Dài là 60 giây, Vừa 45 giây, Ngắn 30 giây (mục 3). Hệ số tip nhân vào tip của mọi thùng (luật 31). Hàng hay gọi là hệ số nhân với độ gọi của bậc giá ở luật 24, áp cho mọi ID kiện trong nhóm, loại hàng không ghi có hệ số 1. \"Chỉ gọi\" nghĩa là tàu chỉ chọn trong các nhóm đó và không tới khi danh mục không còn nhóm nào trong đó. Món mê là hàng giao cho tàu đó được tip gấp đôi. Trọng số cuối bảng dùng cho túi trộn ở luật 69. Tàu chỉ vào túi khi đã mở theo cột Mở. Cột khớp `ShipTypeData` ở `ky-thuat.md` mục 2.1 (kienNhan, tipHeSo, thichHang, mePhan, luatRieng, trongSo).\n| ID | Kiên nhẫn | Hệ số tip | Hàng hay gọi (trọng số) | Món mê | Luật riêng | Trọng số | Mở | Nhãn |\n|---|---|---|---|---|---|---|---|---|\n| TA01 | Dài | 1 | Mọi hàng. Đồ Trái Đất HC10 hệ số 6 (trọng số cuối 6, gấp đôi mỗi loại hàng chợ là 3). Phế liệu hệ số 1 để giữ chất mê đồ Trái Đất | Đồ Trái Đất CGO-109 | Chủ đơn đặt trước của chương 1 (luật 71). Tikko mê đồ Trái Đất | 3 | Chương 1 | MVP |\n| TA02 | Ngắn | 2 | Chỉ gọi băng HC03 và khoáng HC02 | Không | Danh mục không còn băng hay khoáng thì không tới (luật 24) | 1 | Chương 1, Hạng 2 | MVP |\n| TA03 | Vừa | 1 | Băng HC03 3, sản phẩm nuôi HC07 3, vật tư HC08 3 | Không | Từ Hạng 4: giao xong khi còn từ 2/3 kiên nhẫn thì tàu gọi thêm 1 thùng thứ hai trong nhóm nó thích, giá gấp rưỡi, kiên nhẫn không hồi. Tàu truyện cho mốc C2.3: có trong lịch mỗi ngày tới khi một ca phục vụ xong TA03 | 2 | Sau mốc C2.2 | Sau MVP |\n| TA04 | Dài | 1 | Linh kiện HC04 3, kiện tinh dải Giữa HC12 3 | Không | 15 giây đầu là nghi lễ chào: thùng ra quầy sau 15 giây thay vì 3, kiên nhẫn chưa giảm trong 15 giây đó, cửa neo vẫn bị chiếm | 2 | Mốc C2.7. Sau mốc C3.8 ra khỏi túi trộn, không ghé nữa (Sevra ở ẩn trên Ember) | Sau MVP |\n| TA05 | Vừa | 1 | Chỉ gọi lồng sống HC06 và đặc sản HC11 | Lồng sống HC06 | Danh mục không còn hai nhóm đó thì không tới. Chê hàng mẫu đã hạ qua lời thoại | 2 | Mốc C2.4 | Sau MVP |\n| TA06 | Vừa | 1 | Khoáng HC02 3, kiện tinh HC12 3, HC13 3 | Không | Gọi bằng gợi ý (ví dụ \"thứ lạnh\") thay vì tên hàng. Thùng không tự ra quầy: người chơi chọn loại hàng ở ô quầy theo gợi ý. Chọn sai thì tàu từ chối, thùng sai về danh mục, chọn lại được. Bảng tàu ghi rõ TA06 gọi bằng gợi ý | 2, từ chương 4 là 3 | Mốc C3.1 | Sau MVP |\n| TA07 | Dài | 1 | Lồng sống HC06 2, vật tư HC08 2, đặc sản HC11 2, linh kiện đặc biệt HC14 2 | Không | Không bật yêu cầu bơm khí (tàu tự cấp khí). Hỏi về vị trí xác trạm qua lời thoại | 2 | Mốc C3.5 | Sau MVP |\n| TA08 | Dài | 1 | Lần 1 mọi hàng đã mở trừ HC15. Lần 2 đặt trước 1 bản sao HC09 | Không | Luật 38. Không vào túi trộn | Không | Mốc C3.3 | Sau MVP |\n| TA09 | Ngắn | 0 | Chỉ gọi kiện tinh và linh kiện đặc biệt HC04, HC12, HC13, HC14 | Không | Không có tip, giá thùng gấp rưỡi. Danh mục không còn các nhóm đó thì không tới | 1, từ chương 4 là 2 | Hạng 6 | Sau MVP |\n| TA10 | Vừa | 1 | Bản sao HC09 3, kiện tinh HC12 2, HC13 2 | Không | Mỗi ca mua tối đa 1 bản sao. Giao xong kể một tin trên The Lattice, gợi manh mối hành lang an toàn | 1 | Mốc C3.1 | Sau MVP |\n| TA11 | Dài | 1 | Kiện tin mật HC15 như đơn đặt trước tự sinh mỗi ngày. Danh mục không có kiện tin mật thì gọi kiện tinh dải Xa HC13 như tàu thường | Không | Tàu có điều kiện truyện, không vào túi trộn. Có trong lịch mỗi ngày từ ngày kế tiếp sau mốc C3.8 tới khi mốc C5.2 xong, và luôn có trong lịch ngày đầu chương 4 và ngày đầu chương 5. Giao kiện tin mật là một đơn tin mật tới nơi. Mốc C4.7 cần ít nhất 1 đơn, mốc C5.2 cần tổng 2 đơn cộng dồn từ chương 4 (`cot-truyen.md`). Kiện tin mật không sinh thêm Tally so với kiện vỏ bọc (log 87) | Không | Ngày kế tiếp sau C3.8 | Sau MVP |","he-thong/tram-va-cang.md",""],["2.5 Bảng Hạng cảng",3,204,7,0.95,"| Hạng | Trần ở chương | Mở | Nhãn |\n|---|---|---|---|\n| 1 | 1 | TA01, bến 1 với 3 cửa neo, danh mục 4 loại, shop danh mục cơ bản | MVP |\n| 2 | 1 | TA02 | MVP |\n| 3 | 1 | Danh mục bán được kiện mẫu HC05 và đặc sản CGO-106. Mục shop ENG-101 | MVP |\n| 4 | 2 | Danh mục 5 loại, TA03 gọi thùng thứ hai, mục shop bản thiết kế dải Giữa, mục shop Cảng cấp 2 KH07-C2 (cửa neo thứ 4 của bến 1) | Sau MVP |\n| 5 | 2 | Danh mục bán được sản phẩm nuôi HC07, mục shop ENG-102 | Sau MVP |\n| 6 | 3 | TA09, danh mục 6 loại, mục shop tiện ích cảng | Sau MVP |\n| 7 | 3 | TA06 và TA10 gọi được kiện tinh dải Xa HC13, mục shop ENG-103 | Sau MVP |\n| 8 | 4 | Mục shop ENG-104, đơn đặt trước tới 2 mỗi ngày ở mọi chương sau | Sau MVP |\n\nTrần ở chương nghĩa là hạng đó đạt được sớm nhất ở chương ghi trong cột. Chương 5 không mở hạng mới, đúng mạch truyện thương nhân thưa dần.","he-thong/tram-va-cang.md",""],["2.6 Thứ tự mở khoang theo chương",3,204,7,0.68,"| Chương | Khoang sửa được | Người vớt | Giai đoạn động cơ | Nhãn |\n|---|---|---|---|---|\n| 1 | Khoang neo, kho cấp 2, xưởng, khoang liên lạc, cảng bến 1 (3 cửa neo, quầy cảng) | Kỹ sư, Thông dịch viên | 1 | MVP |\n| 2 | Khoang dẫn đường, bến Skiff, phòng nghiên cứu, khoang sinh quyển cấp 1 và 2, xưởng cấp 2, Cảng cấp 2 (cửa neo thứ 4 của bến 1) | Hoa tiêu, Nhà sinh học | 2 | Sau MVP |\n| 3 | Bến 2, tiện ích cảng, khoang sinh quyển cấp 3 (môi trường dải Xa) | Trưởng cảng | 3 | Sau MVP |\n| 4 | Bến 3, quầy phụ, cấp 3 các khoang còn lại | Không | 4 | Sau MVP |\n| 5 | Không có khoang mới | Không | 5 | Sau MVP |","he-thong/tram-va-cang.md",""],["2.6b Sơ đồ mặt cắt",3,204,7,1.14,"Mặt cắt ngang 3 tầng, đọc từ trái sang phải. n ích cảng | Phế liệu, khoáng dải Xa, linh kiện | Bản thiết kế tiện ích | Sau MVP |\n| Động cơ chính giai đoạn 1 đến 5 | Tài nguyên dải mới của chương, giai đoạn 1 thêm 1 hạch hoặc 1 mẫu boss BS-1 (SMP-191 hoặc SMP-192), linh kiện Warden ở giai đoạn 4 và 5 | ENG-101 tới ENG-104 ở giai đoạn 1 tới 4. ENG-105 chế, không mua | MVP giai đoạn 1 |","he-thong/tram-va-cang.md",""],["2.7 Người vớt và tính năng lớn dần",3,204,7,1.45,"| Người vớt | Khoang | Tính năng khi mở | Lớn dần theo cấp khoang và chương | Nhãn |\n|---|---|---|---|---|\n| Kỹ sư | Xưởng | Chế dụng cụ cơ bản, chế trước khối nước tinh khiết COM-105 cho CGO-113, nâng cấp bộ đồ bậc 1 | Cấp 2 (chương 2): chế 2 mẻ song song, bậc 2. Cấp 3: bậc cao nhất, chế HC08 | MVP cấp 1 |\n| Thông dịch viên | Khoang liên lạc, cảng | Bảng tàu, lập danh mục, đóng thùng tự động lúc Mở giao thương, giờ giao thương, shop | Chương 2: gọi xuồng Lantern, mở TA04, TA05. Chương 3: hiểu ngôn ngữ Veyl Waypost, mở TA06, TA07, TA10, dịch lời tàu lạ. Chương 4: liên lạc với The Kindling, nhận Gói tin mật STY-701 mỗi ngày | MVP chương 1 |\n| Hoa tiêu | Khoang dẫn đường, bến Skiff | Mở dải Xa (dải Giữa đã mở khi xong chương 1), Skiff tới map nhánh đã tìm ra | Mỗi lõi dẫn đường đọc được mở một map nhánh hoặc một dải | Sau MVP |\n| Nhà sinh học (Amara Okafor) | Phòng nghiên cứu, khoang sinh quyển | Tới bằng xuồng TA03 sau ca đầu tiên phục vụ xong TA03 (C2.3). Nghiên cứu mẫu, nuôi Driftlife | Cấp 2: thêm ô, cấp 3: môi trường dải Xa. Mốc chương 3: cú lật Driftlife | Sau MVP |\n| Trưởng cảng (Yusuf Demir) | Bến 2, bến 3, tiện ích cảng | Về bằng Skiff sau ca đầu tiên có TA06 cập bến (C3.2). Bến 2 | Tiện ích: quầy phụ 3 ô cạnh bến 2 và bến 3 (thùng của tàu ở bến xa ra quầy sát bến đó), bến 3 ở chương 4 | Sau MVP |","he-thong/tram-va-cang.md",""],["2.8 Bảng sự cố",3,204,7,1.16,"| Sự cố | Ảnh hưởng | Xử lý | Bỏ mặc thì | Từ chương |\n|---|---|---|---|---|\n| Rò khí | Một cửa neo bị rò. Tàu ở cửa neo đó mất kiên nhẫn nhanh gấp đôi, yêu cầu bơm khí ở đó k ông tới, kho giữ nguyên vì chưa đóng thùng, không đổi Hạng cảng |\n| Hết giờ giao thương (300 giây) khi tàu đang ở cửa neo | Tàu rời ngay, áp luật 32. Hiếm vì tàu cuối tới trước giây 225 |\n| Mọi tàu rời chưa giao | Ca vẫn kết thúc bình thường, bảng tổng kết giao thương không có chữ thất bại, chỉ ghi số |\n| Đơn đặt trước mà kho không có loại hàng đặt | Bảng tàu đánh dấu thiếu. Tàu đặt gọi món khác, đơn không đạt, không phạt |\n| Hai đơn đặt trước cùng loại hàng | Giữ 2 thùng nếu đủ. Thiếu thì đơn của tàu tới trước được giữ |\n| Hàng cần chế còn trong xưởng lúc Mở giao thương | Mẻ chạy tiếp, xong thì vào kho, không vào danh mục ca này (luật 53) |\n| Kho giảm sau khi lập danh mục nháp (đem đi sửa khoang) | Số thùng của loại đó tự hạ về số kho làm được, về 0 thì loại đó rời danh mục (luật 56) |\n| Người chơi rời phiên giữa ca | Nhân vật ở lại trạm, thùng trên tay về ô quầy của nó |\n| Host rời phiên giữa ca | Phiên kết thúc với mọi người, thế giới về điểm tự lưu gần nhất là lúc mọi người về trạm sau chuyến cuối (K23, C10, log 65, `ky-thuat.md` luật 17). Ca đang dở không tính, kho trở về trước lúc đóng thùng |\n| Người rời phiên khi đang đếm 30 giây sang ngày | Người rời không còn tính trong \"mọi người online\", nhóm sang ngày khi những người còn lại đã xác nhận |\n| Người vào phiên khi đang đếm 30 giây sang ngày | Người mới vào tính chưa xác nhận, đồng hồ không đặt lại |\n| Người vào phiên giữa ca | Vào trạm với tay không, làm việc ngay, số tàu không đổi |\n| TA06 bị chọn sai loại hàng | Tàu từ chối, thùng sai về danh mục, người chơi chọn lại ở quầy, kiên nhẫn vẫn giảm |\n| TA05 hoặc TA09 mà danh mục không còn hàng nó gọi | Không tới, bảng tổng kết giao thương đếm vào tàu không tới |\n| Thả phím sửa khoang giữa chừng | Tiến độ giữ, vật liệu đã trừ không hoàn |\n| Sửa khoang khi kho thiếu một vật liệu | Không bắt đầu được, khung khoang liệt kê vật liệu thiếu |\n| Driftlife sổng khi quầy trống | Không ôm gì, vẫn chạy trong cảng tới khi bị tóm hoặc hết giờ giao thương |\n| Rò khí hoặc chập điện khi kho hết Keo vá, Cầu chì | Vẫn xử lý được, thời gian xử lý gấp 3 |\n| Khoang sinh quyển đầy, cặp sinh sản đủ điều kiện | Không sinh con non, không mất gì |\n| Không cho ăn nhiều ngày | Không ra sản phẩm, không sinh con non, con vật không chết |\n| Chương chưa mở khoang của người vớt đã tỉnh | Không xảy ra: người vớt chỉ nằm ở map nhánh của chương mở khoang đó |\n| Người chơi chưa qua mốc C3.4 | TA08 lần 2 chưa vào lịch (luật 38) |\n| Nghỉ giao thương ở ngày có TA08 hoặc TA11 | Lần cập bến không tính, tàu có lại trong lịch ngày sau tới khi điều kiện truyện xong, không mất mốc |\n| TA03 rời chưa giao ở chương 2 | Amara chưa tới, TA03 có lại trong lịch ngày sau tới khi có một ca phục vụ xong TA03 |\n| Nghỉ giao thương ở ngày có TA06 | TA06 không tính đã cập bến, Yusuf chưa về, TA06 có lại trong lịch ngày sau |\n| Đủ điểm cảng nhưng chạm trần hạng của chương | Điểm cộng dồn, lên hạng ngay khi chương sau mở |\n| Mở giao thương khi một người còn ngoài chuyến | Không mở được, nút Mở giao thương xám kèm lý do (luật 64) |\n| Muốn ra chuyến sau khi ca đã mở hoặc đã đi 2 chuyến | Cửa khí khóa tới ngày mới (luật 63) |\n| Hai tàu truyện cùng chờ | Tối đa 2 chỗ cho tàu truyện, theo thứ tự mốc, tàu truyện còn lại sang ngày sau (luật 69) |\n| Bến 2 chưa sửa ở chương 3 | Lịch dùng cấu hình chỉ có bến 1 (luật 68) |","he-thong/tram-va-cang.md",""],["5. Ràng buộc vật lý của luật",2,201,7,1.2,"| Ràng buộc | Số hoặc lý do |\n|---|---|\n| Thông lượng một người | Một tàu cần ít nhất 3 giây chờ thùng ra quầy, cộng đường chạy quầy tới cửa neo 1,1 tới 2,3 giây và quay về. Sim GD-054: một người với 25 tàu rảnh 44%, 23%, 4% ở trễ 1, 2, 3 giây. Tới 30 tàu vẫn đạt, từ 35 tàu thì tàu rời chưa giao tăng nhanh vì một người không giao nhanh hơn khoảng 29 tàu mỗi ca |\n| Thông lượng 3 cửa neo | Một tàu chiếm cửa neo từ lúc cập tới lúc khuất, ít nhất khoảng 6 giây. Sim GD-054 vòng 2: 3 cửa neo đạt mục tiêu ở 1 tới 4 người với 25, 55, 55, 60 tàu. 3 và 4 người dừng ở khoảng 55 tới 60 tàu vì 3 ô quầy và 3 cửa neo chung, bơm khí lấp phần rảnh |\n| Trần thời gian | Cửa sổ đến 225 giây, ca tối đa 300 giây. Tàu cập cuối cửa sổ với kiên nhẫn Dài 60 giây vẫn kịp phục vụ |\n| Kho không giới hạn | Không có ràng buộc kho trong ca. Ràng buộc nằm ở trần M loại và lượng hàng mang về. Sim GD-054 bảng 5: danh mục thiếu hàng làm Tally hụt 13 tới 16% |\n| Tải mặt cắt | Quầy tới cửa neo 3 dưới 2,5 giây chạy. Bến 2, bến 3 khác tầng, xa hơn, là cách tạo độ khó mới ở chương 3, 4 mà không đổi luật |","he-thong/tram-va-cang.md",""],["6. Yêu cầu cho engineer / tool",2,201,7,3.97,"| Hạng mục | Nội dung |\n|---|---|\n| Dữ liệu khoang | ID, tên, chương mở, danh sách vật liệu theo cấp, thời gian sửa, người vớt, vị trí trên mặt cắt |\n| Dữ liệu tàu | ID loại, kiên nhẫn, bảng trọng số sở thích theo nhóm hàng hoặc danh sách chỉ gọi, hệ số tip theo loại hàng, luật riêng, có bật bơm khí không, chương và hạng mở, trọng số túi trộn |\n| Danh mục | Danh sách {ID kiện, số thùng}, trần M theo Hạng cảng, chốt lúc Mở giao thương. Đổi kho sang thùng theo công thức đóng thùng của gd-items (0,4 kiện mỗi thùng, hàng không chia là 1) |\n| Sinh lịch | Đầu ngày theo luật 67 tới 73, có seed để tái hiện. Túi trộn loại tàu giữ qua các ngày (lưu cùng thế giới). Món gọi chọn lúc tàu tới bằng RNG có seed của ca |\n| Thùng | Vật thể có ID kiện, tàu chủ, vị trí (giữ cho tàu, ô quầy, tay, đã giao). Không có thùng trên sàn |\n| Sự kiện cho Event Tracking | Lập danh mục (số loại, tổng thùng), mở giao thương (N, số tàu), nghỉ giao thương, tàu tới, tàu không tới, tàu cập, tàu bỏ đi, tàu rời chưa giao, giao thùng (kiên nhẫn còn, giá, tip), giao sai cửa neo, bơm khí, đơn đặt trước đạt hay không, hết danh mục, kết thúc giờ giao thương, lên hạng, sự cố bắt đầu, sự cố xử lý, khoang sửa xong, người vớt tỉnh, con non sinh ra. Tên event do gd-tech đặt |\n| Đồng bộ co-op | Máy chủ giữ danh mục, thùng, kiên nhẫn, yêu cầu bơm khí, cửa neo, ô quầy. Máy người chơi chỉ gửi host ba yêu cầu: nhặt thùng ở ô quầy, giao thùng ở cửa neo, bắt đầu hoặc dừng giữ bơm khí (`ky-thuat.md` bảng đồng bộ mục 2.2 và luật 29 tới 31) |\n| Lưu | Danh mục nháp. Số đơn tin mật đã tới nơi (TA11). Số tàu phục vụ xong của từng thương nhân có tên (mở chuyện riêng ở lần 3, 6, 10 theo `cot-truyen.md` mục 2.6). Bản lưu ngày cuối trước rời neo giữ sau cảnh kết (K24). Trạng thái và cấp mọi khoang, giai đoạn động cơ, hàng đợi xưởng, điểm và hạng cảng, ô nuôi (loài, tuổi, đã cho ăn), người vớt đã tỉnh, quest mở, số chuyến đã đi và ca đã mở trong ngày. Tự lưu sau mỗi chuyến khi mọi người đã về trạm, sau giờ giao thương, và lúc ngủ (K23). Giờ giao thương không lưu giữa chừng |\n| Nơi phải cùng đổi khi đổi luật | GDD này, tab Customer, sim giờ giao thương, dữ liệu tàu và khoang, ITEM LIST, Recipe, tab Shop (mục mở theo hạng), WIREFRAME, Tutorials, Event Tracking |","he-thong/tram-va-cang.md",""],["Đề sim giờ giao thương cho gd-tech (GD-054 đã chạy, việc vòng sau)",3,229,7,3.14,"Kết quả sim GD-054 vòng 2 cho các mục gd-quan đề, bản đầy đủ ở `tools/ket-qua/sim-ca-cang.md`:\n\n| Phần | Nội dung |\n|---|---|\n| Bơm khí lúc cập | Bơm khí chiếm 3,5%, 3,9%, 7,2% Tally ở 1, 2, 4 người. Người một mình có gặp. Tip kể cả bơm khí 26 tới 29% sau khi hạ tip tối đa xuống 25% |\n| Trần ca 300 giây | 0% ca chạm trần ở mọi số người, kể cả trễ 3 giây |\n| Ca đầu tiên | 2 tàu xong trong 23 tới 33 giây (sim GD-054 vòng 2 mục 1) |\n| Trọng số theo bậc giá | Danh mục 5 thùng đồ Trái Đất bán hết trước tàu thứ 9 ở 22% số ca một người. Đơn đặt trước vẫn đạt 100% vì thùng đặt được giữ riêng lúc Mở giao thương |\n| Tàu vội chỉ gọi băng, khoáng | Thiếu cả băng và quặng thì hụt 16,6 tới 20,6% Tally. Chỉ thiếu băng thì hụt dưới 5%. Đạt ý đồ: bỏ hẳn hai nhóm thì mất Tàu vội và tip gấp đôi |\n| Còn mở | Chương 2 tới 5 và hai mục dưới |\n| Hạng 1 chỉ có TA01 | So với có TA02 (sim vòng đầu có TA02 từ đầu) |\n| Kiên nhẫn Vừa 45 giây | Một cấu hình thử cho tàu chương 2 |\n| Chạy | Tối thiểu 200 seed mỗi cấu hình, in bảng theo N và trễ phản xạ |","he-thong/tram-va-cang.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,201,7,2.76,"| Sự kiện | Hình (VFX, trạng thái) | Âm (SFX) | Text / tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Khoang sửa xong | Khoang sáng dần từ tối, mảnh vỡ biến mất, người vớt bước vào | Máy khởi động, tiếng ù nền của khoang | Tên khoang và chức năng mới | Cao |\n| Mở giao thương, Thông dịch viên đóng thùng | Thùng xếp ra quầy thành hàng nhỏ theo màu loại hàng trong 1 giây | Tiếng băng chuyền ngắn | Danh mục còn hiện ở góc HUD | Cao |\n| Tàu cập cửa neo | Tàu trượt vào cửa neo, kẹp neo đóng, vạch màu cửa neo sáng. Mỗi cửa neo có số lớn kèm màu, bộ màu khác nhau cả độ sáng để người mù màu vẫn phân biệt (gd-ux, Artist) | Kẹp neo, chuông cửa neo | Bong bóng món gọi bật lên trên tàu | Cao |\n| Thùng ra quầy | Thùng hiện ở ô quầy, viền màu cửa neo | Tiếng đặt hàng nhẹ | Không | Cao |\n| Thanh kiên nhẫn | Thanh trên tàu: xanh trên 2/3, vàng trên 1/3, đỏ dưới 1/3 | Tích tắc nhanh dần dưới 1/3 | Không | Cao |\n| Yêu cầu bơm khí | Nhãn \"Bơm khí\" nảy cạnh tàu, vòng tiến độ 1 giây khi giữ | Tiếng xì khí khi xong | Lần đầu: gợi ý giữ phím ở cửa neo | Cao |\n| Giao thùng | Thùng trượt vào khoang hàng, giá và tip bay lên hai màu | Tiếng nhận hàng, tiếng xu, tip có thêm tiếng chuông nhỏ | Không | Cao |\n| Giao sai cửa neo | Thùng bật nhẹ về tay, cửa neo đúng nháy màu | Tiếng từ chối trầm | \"Sai cửa neo\" | Cao |\n| Tàu rời chưa giao | Thương nhân lắc đầu, bong bóng tắt | Hợp âm trung tính, không chói | Không có chữ thất bại | Cao |\n| Tàu chờ ngoài | Tàu nhỏ xếp hàng ở mép màn hình kèm vòng chờ | Còi xa | Không | Vừa |\n| Đơn đặt trước tới | Bong bóng có nhãn \"đặt trước\" | Âm riêng ngắn | Lời Tikko | Vừa |\n| Hết danh mục | Bảng danh mục ở HUD tắt dần | Âm kết | \"Hết hàng, ca kết thúc sớm\" | Vừa |\n| Lên hạng cảng | Bảng hạng sáng, liệt kê thứ mới mở | Chuông dài | Danh sách mở khóa | Vừa |\n| Sự cố | Đèn đỏ nháy ở cửa neo hoặc ô quầy, biểu tượng trên mặt cắt và HUD | Còi báo động ngắn, không lặp liên tục | Tên sự cố và cách xử lý lần đầu | Vừa |\n| Driftlife sinh con non | Con non cạnh bố mẹ trong ô | Âm sinh vật | Không | Thấp |\n\n- Tutorial cần có (gd-ux viết): giờ giao thương đầu tiên theo luật 67: danh mục chọn sẵn, chỉ bấm Mở giao thương, đọc bong bóng, nhặt thùng ở quầy, giao đúng cửa neo, bơm khí lần đầu ở tàu thứ 2. Ca thứ hai: lập danh mục lần đầu (chọn loại, đặt số thùng, đọc đơn đặt trước). Lần đầu có tàu chờ ngoài. Lần đầu có hàng cần chế trước ca: hướng dẫn chế ở xưởng trước khi Mở giao thương. Lần đầu có TA02 (kiên nhẫn ngắn, tip gấp đôi). Lần đầu sự cố mỗi loại. Lần đầu ghim hàng của đơn đặt trước.","he-thong/tram-va-cang.md",""],["7b. Cảm giác (game feel)",2,201,7,0.62,"- Tham chiếu cảm giác: Dave the Diver ở nhịp ca bán ngắn, bong bóng món, tip khi phục vụ nhanh, và khoảnh khắc cuối ca hiện tổng doanh thu và lời khách. Overcooked ở khoảnh khắc thả món vào ô giao, phản hồi tức thì kèm số.\n- Phản tham chiếu là game co-op party kiểu ném đồ hỗn loạn: giờ giao thương không có đếm ngược ồn ào, không có màn hình thua ca.\n- Phản hồi: giao thùng tới khi số Tally hiện dưới 150 ms. Tip bay riêng, màu khác giá. Bến rung nhẹ khi tàu cập. Chuỗi giao liên tiếp khi còn từ 2/3 kiên nhẫn thì âm giao cao dần, đứt chuỗi khi một tàu rời chưa giao.","he-thong/tram-va-cang.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,201,7,7.03,"Chỉ số kết quả gồm tỉ lệ tàu phục vụ xong, Tally mỗi ca, phần tip, tỉ lệ đơn đặt trước đạt, số ngày tới mỗi hạng, tỉ lệ ca bị bỏ. Chỉ số trải nghiệm gồm phần trăm thời gian rảnh mỗi người trong ca, số loại trong danh mục, người chơi có đổi dải theo đơn đặt trước không, đo bằng event ghim.\n\nTiêu chí nghiệm thu:\n\nGiờ giao thương:\n- Sim chương 1, trễ phản xạ 2 giây: tàu phục vụ xong 85 tới 100%, rảnh không quá 30%, ca 180 tới 300 giây, tip 20 tới 30% Tally. sim GD-054 vòng 2 mục 4, 3 cửa neo: 1 người 25 tàu (99%, rảnh 14%, ca 230 giây, tip 26%), 2 người 55 tàu (99%, rảnh 6%, ca 251 giây, tip 26%), 3 người 55 tàu (99%, rảnh 19%, ca 241 giây, tip 29%), 4 người 60 tàu (97%, rảnh 27%, ca 252 giây, tip 29%). Đạt.\n- Bơm khí lúc cập: người một mình gặp, bơm khí chiếm 3,5% Tally ở 1 người (sim vòng 2). Trần ca 300 giây: 0% ca chạm trần. Ca đầu 2 tàu xong trong 23 tới 33 giây (sim GD-054 vòng 2 mục 1). Đạt.\n- Lập danh mục: thiếu cả băng và quặng hụt 16,6 tới 20,6% Tally, thiếu một trong hai hụt dưới 5%. Đồ Trái Đất 5 thùng hết trước tàu thứ 9 ở 22% số ca một người, đơn đặt trước đạt 100% (sim vòng 2).\n- Tàu rời chưa giao hoặc bỏ đi: Tally không giảm, thùng về danh mục, hết giờ giao thương thùng về kho đúng số, Hạng cảng không đổi, kiểm bằng log event.\n- Danh mục: không vượt M loại, không vượt số thùng kho làm được. Mở giao thương trừ kho đúng số thùng nhân 0,4 kiện. Hết giờ giao thương số thùng chưa bán về kho đúng, kiểm bằng log.\n- Nghỉ giao thương: tàu không tới, kho không đổi, không có dòng log trừ gì, cửa khí khóa tới ngày mới.\n- Hết danh mục: tàu còn lại trong lịch không tới, ca kết thúc khi tàu cuối ở cửa neo rời, kiểm bằng log.\n- Ca đầu tiên của thế giới: đúng 2 tàu TA01 (1 tàu nếu kho chỉ làm được 1 thùng phế liệu), chỉ gọi thùng phế liệu, không có đơn đặt trước, tàu 2 cập khi tay trống và bật bơm khí ngay (luật 67).\n- Đơn đặt trước: danh mục có loại hàng đặt thì tàu thứ 9 gọi đúng thùng đó, giá nhân 1,5. Danh mục không có thì tàu thứ 9 gọi món khác, bảng tổng kết giao thương ghi không đạt.\n- Giao sai cửa neo: tàu từ chối, thùng ở lại tay, kiên nhẫn không bị trừ thêm.\n- Điểm cảng: tàu phục vụ xong còn từ 2/3 kiên nhẫn cho 2 điểm, dưới 2/3 cho 1 điểm, tàu rời chưa giao cho 0 (luật 40).\n- Ở 2 người, hai người nhặt cùng một thùng cùng khung hình: đúng 1 người cầm thùng.\n- Co-op: người thứ hai vào phiên ở pha chuẩn bị thì bảng tàu đổi số tàu dự kiến. Sau Mở giao thương, người vào thêm không đổi số tàu (luật 64).\n- Mở giao thương: khi còn người ngoài chuyến thì không mở được. Mỗi ngày có đúng 1 lượt giao thương. Sau khi mở giao thương, cửa khí khóa, kiểm bằng log event.\n- Mang thùng không đổi tốc độ chạy. Mỗi người chỉ mang 1 thùng, thùng đã nhặt không đặt xuống được.\n- Mọi loại tàu có ít nhất một trục khác loại khác ngoài số (đọc bảng 2.4).\n- Mọi ID kiện CGO trong ITEM LIST thuộc đúng một nhóm hàng HC01 tới HC15 (validator gd-tech).\n\nTrạm, người vớt, Hạng:\n- Sửa khoang: thiếu một vật liệu thì không bắt đầu được. Thả phím giữa chừng giữ tiến độ, vật liệu không hoàn. Sửa xong thấy khoang đổi hình (chơi, log).\n- Người vớt: kéo buồng về cửa khí, người vớt tỉnh đầu ngày kế, khoang của người đó sửa được sau khi tỉnh và không sửa được trước đó, sửa xong thì thấy tính năng mở (chơi, log).\n- Hạng cảng: điểm cộng đúng luật 40 ở mọi N, không giảm, chạm trần thì dồn, lên hạng khi chương sau mở (sim và log).\n- Mọi khoang trong bảng 2.6 có danh sách vật liệu chỉ gồm ID có trong ITEM LIST (validator gd-tech).\n\nCo-op và một ngày:\n- Sang ngày khi 2 người, một người treo máy: nhóm sang ngày sau 30 giây (K23).\n- Ra chuyến khi 2 người, một người treo máy: chuyến bắt đầu sau 30 giây, người đó tính ở lại.\n- Một ngày đi được đúng 2 chuyến, chuyến thứ 3 bị cửa khí chặn (K22).\n- Co-op 2 người, một người về sớm: người đó chế được ở xưởng và sửa danh mục nháp khi đồng đội còn ở ngoài, không ra lại được, hàng chế xong trước Mở giao thương vào được danh mục cùng ngày.\n- Người vào sau: có chỗ ngủ ở khu hồi sức, buồng tắt của KH01 vẫn tắt (luật 62).\n\nSau MVP:\n- Không có sự cố trước chương 3 trong 100 lượt giao thương sim chương 1 và 2.\n- Driftlife sổng bỏ mặc tới hết giờ giao thương: 0 thùng và 0 đơn vị hàng bị mất.\n- Khoang sinh quyển không cho ăn 5 ngày: 0 con chết, 0 sản phẩm.","he-thong/tram-va-cang.md",""],["10. Câu hỏi mở",2,201,7,0.84,"| Câu hỏi | Phương án đề xuất | Ai quyết |\n|---|---|---|\n| Danh mục có sửa được giữa ca không | Không, chốt lúc Mở giao thương. Sửa giữa ca làm mất quyết định trước ca | GDM |\n| Ca đầu tiên khi kho không có phế liệu | Nút Mở giao thương xám kèm gợi ý (luật 67). Không cho Tikko mang hàng bù để không sinh hàng miễn phí | GDM, gd-ux |\n| Trần ca 300 giây thay 240 | Nâng (luật 34, mục 3). Cửa sổ đến giữ 225 giây nên người chơi thường không thấy khác, người chậm không bị đuổi tàu vì đồng hồ | GDM duyệt, sửa `so-hien-hanh.md` |\n| Có cho từ chối từng tàu ngay khi cập không | Không, giữ luật bỏ cả ca. Từ chối từng tàu thêm thao tác mà không thêm quyết định | GDM |\n| Tên loài, thương nhân, lời thoại quest người vớt và lời tàu trong ca | Theo `cot-truyen.md` | gd-story |","he-thong/tram-va-cang.md",""],["Co-op 1 đến 4 người",2,201,7,1.6,"| Phần | 1 người | 2 người | 3 người | 4 người |\n|---|---|---|---|---|\n| Sửa khoang | Một người giữ phím | Nhiều người giữ cùng khoang: tốc độ nhân (1 + 0,5 nhân số người thêm), trần 2 lần | Như 2 người, trần 2 lần | Như 2 người, trần 2 lần |\n| Số tàu chương 1 | 25 | 55 | 55 | 60 |\n| Cửa neo bến 1 | 3 | 3 | 3 | 3 |\n| Danh mục | Một danh mục | Một danh mục chung, ai ở khoang liên lạc cũng sửa, người Mở giao thương chốt | Như 2 người | Như 2 người |\n| Mang thùng | 1 thùng | Mỗi người 1 thùng | Như 2 người | Như 2 người |\n| Bơm khí | Một người | Một người mỗi cửa neo một lúc | Như 2 người | Như 2 người |\n| Tạm dừng | Được | Không | Không | Không |\n| Sự cố mỗi ca | Theo bảng tham số | Theo bảng tham số | Cộng 1 | Cộng 1 |\n| Tally, Hạng cảng, kho, ô nuôi | Chung | Chung | Chung | Chung |\n| Ai mở giao thương | Người chơi, khi không ở ngoài chuyến | Bất kỳ ai ở khoang liên lạc khi không còn ai ngoài chuyến. Nghỉ giao thương hoặc mở giao thương sớm cần mọi người xác nhận, 30 giây không trả lời là đồng ý (luật 64 tới 66) | Như 2 người | Như 2 người |\n| Ở lại hoặc về sớm khi người khác còn ở ngoài | Giữa hai chuyến được chế trước và lập danh mục nháp (luật 55) | Không ra lại, được chế trước, lập danh mục nháp, sửa khoang, chăm khoang nuôi, xem vị trí đồng đội (luật 53 tới 58, C9) | Như 2 người | Như 2 người |\n\nKhông có luật nào cần đúng N người, vì một người phục vụ được mọi tàu (số tàu co theo N), mỗi tàu chỉ cần 1 thùng, và mọi thao tác giờ giao thương một người làm được.","he-thong/tram-va-cang.md",""],["Kinh tế và tiến trình",1,0,8,29.01,"- Hệ thống này đặt giá cho mọi thứ trao đổi bằng Tally, quyết nhịp mở khóa theo chương và đo bằng sim rằng game đạt mục tiêu thời lượng của khung với 1 tới 4 người. Tầng: lõi. Ưu tiên: bản đầu (MVP chương 1), số cho cả 5 chương. Phụ thuộc chính: GTĐ của gd-items (`vat-pham.md`), luật giờ giao thương và Hạng cảng của gd-quan (`tram-va-cang.md`), sim giờ giao thương và sim chuyến của gd-tech (`tools/ket-qua/`), bậc bộ đồ của gd-character (`nguoi-choi.md`), nhịp chuyến và k(N) của gd-world (`map.md`).","he-thong/kinh-te-tien-trinh.md","GDD hệ thống: Kinh tế và tiến trình"],["Hiện hành",2,236,8,1.8,"| Mục | Giá trị | Nhãn |\n|---|---|---|\n| Đồng tiền | Tally duy nhất, chỉ đến từ giờ giao thương (K18) | MVP |\n| Đơn vị bán | Thùng. 1 kiện = 2,5 thùng, lồng sinh vật sống là một đơn vị không chia (Lead chốt, D0) | MVP |\n| Giá thùng | GTĐ một thùng nhân 10 nhân hệ số bậc giá. 5 bậc: chợ 0,75, sinh học 1,0, chế 1,35, sống 1,3, hiếm 1,5. Thùng chương 1 từ 40 tới 80 Tally, lồng 55 tới 75 (mục 3.1) | MVP |\n| Tip | Tip tối đa 25% giá thùng nhân phần kiên nhẫn còn lại. Tàu vội gấp đôi, Tikko gọi đồ Trái Đất gấp đôi, bơm khí cộng 10 Tally Sim đo tip chiếm 26% Tally (tệ 21%, tốt 30%) | MVP |\n| Điểm cảng | 1 mỗi tàu phục vụ xong, thêm 1 nếu còn trên 2/3 kiên nhẫn (Lead chốt). Một ca một người trung bình 46 điểm | MVP |\n| Ngưỡng Hạng cảng 2 tới 8 | 70, 135, 285, 400, 560, 680, 910 (mục 3.5, gd-quan đã nhận (luật 41)) | MVP hạng 2, 3 |\n| Giá Tally của nâng cấp, ENG, Shop | Ngân sách chương chia theo tỉ lệ. Ngân sách chương bằng β nhân ngày mục tiêu nhân thu nhập tham chiếu một ngày, hệ số ngân sách β bằng 0,54 | MVP |\n| Thời lượng đo được, trung bình, một người | Chương 1 1,89 giờ, cả game 13,9 giờ (mục tiêu 1,5 đến 2 và 12 đến 15) | MVP |\n| Co-op | Số tàu một ca 25, 55, 55, 60 cho 1 tới 4 người, 3 cửa neo (luật gd-quan, sim giờ giao thương gd-tech, C8). k(N) bằng 1 cộng a nhân (N trừ 1), a bằng 0,30 ở dải Gần, 0,25 ở Giữa, 0,38 ở Xa (gd-world). Nhóm 4 tới hết game bằng 73% thời gian một mình, trong mục tiêu 60 đến 75% (GDM, log 69) | MVP 2 người |\n| Túi và bình | Túi 80, 100, 126, 168, 216 Khối, bình 330, 450, 600, 780, 1000 (GDM chốt, log 54). Phút và GTĐ một chuyến đọc từ sim chuyến gd-tech (mục 8.5) | MVP bậc 0 và 1 |","he-thong/kinh-te-tien-trinh.md",""],["1. Mục đích với người chơi",2,236,8,1.07,"- Người chơi cảm thấy: mỗi giờ giao thương là ngày lương, mỗi nâng cấp mua về làm chuyến sau khác đi thấy rõ (túi to hơn, Oxy dài hơn, vào được dải mới). Tally không bao giờ thành số vô nghĩa trước chương 5.\n- Quyết định chính: đem hàng trong kho đi sửa trạm hay lập danh mục bán (P2). Lập danh mục nào: hàng chợ rẻ mà tàu nào cũng gọi, hay hàng chuẩn bị trước (bắt sống, chế nước, đồ Trái Đất) đắt mà ít. Mua nâng cấp nào trước.\n- Pillar: P2 (mọi thứ mang về có hai chỗ tiêu nhìn thấy được: trạm và cảng, giá theo bậc làm hai chỗ tiêu kéo ngược nhau), P1 (giữ 1 món khi ngạt là mất thật, đo ở mục 8), P3 (một mình vẫn xong game trong 12 đến 15 giờ, có bạn thì nhanh hơn mà không ai nghèo).\n- 30 giây đầu của giờ giao thương đầu tiên: thùng phế liệu đầu tiên lên tàu, số Tally nhảy lên 42 cộng tip. Lồng Driftmoth bắt sống ở chuyến sáng lên tàu được 65. Cuối ngày đó người chơi mở Xưởng thấy T-TUI bậc 1 giá 1450 Tally cộng 24,2 GTĐ vật liệu, biết phải để dành Tally qua vài giờ giao thương.","he-thong/kinh-te-tien-trinh.md",""],["2. Luật",2,236,8,8.48,"","he-thong/kinh-te-tien-trinh.md",""],["2.1 Tally và giá ở giờ giao thương",3,239,8,5.93,"1. Tally là đồng tiền duy nhất, dùng chung cả nhóm (K18, C3). `MVP`\n2. Nguồn Tally duy nhất là giờ giao thương: giá thùng khi tàu nhận thùng, tip theo kiên nhẫn còn lại, bơm khí (K13, luật ca của gd-quan ở `tram-va-cang.md`). Không có Tally từ quest, hòm, bán ở Shop. `MVP`\n3. Đơn vị bán là thùng: 1 kiện = 2,5 thùng (D0). Giá một kiện bằng giá một thùng nhân 2,5. Lồng sinh vật sống không chia, giá theo loài bên trong. `MVP`\n4. Giá một thùng bằng GTĐ một thùng (GTĐ kiện của gd-items chia 2,5, `vat-pham.md` mục 2.6b) nhân 10 Tally mỗi GTĐ nhân hệ số bậc giá của kiện (mục 3.1), làm tròn tới số chẵn để giá kiện là số nguyên. Giá lồng bằng GTĐ mẫu sống nhân 10 nhân hệ số Hàng sống, làm tròn 5. Không nhân theo Hạng cảng, không nhân theo số người. `MVP`\n5. Bậc giá gắn với độ gọi: hàng rẻ thì độ gọi cao, hàng đắt thì độ gọi thấp. Khi tàu chọn món trong danh mục, trọng số của món là độ gọi nhân độ ưa của loại tàu (gd-quan giữ độ ưa). `MVP`\n6. Tip một tàu bằng giá thùng nhân 25% nhân phần kiên nhẫn còn lại lúc giao. Tàu vội nhân 2. Tikko (Loose Bolt) nhận đồ Trái Đất nhân 2. Bơm khí xong cộng 10 Tally. Tàu hết kiên nhẫn rời đi thì không trả gì, thùng về kho (luật ca của gd-quan). `MVP`\n7. Đơn đặt trước trả giá thùng nhân 1,5 (gd-quan giữ luật đơn đặt trước, file này giữ hệ số). `MVP`","he-thong/kinh-te-tien-trinh.md",""],["2.2 Shop là bảng giá duy nhất (K20)",3,239,8,4.54,"8. Mọi giá Tally của game nằm ở mục 3.1 và 3.2 của file này (tab Shop và Upgrade khi dán Sheet). Tab khác ghi tên và trỏ về, không ghi lại số. `MVP`\n9. Giá Tally của mọi thứ mua mở ở chương c lấy từ ngân sách chương: Ngân sách(c) = β x Ngày mục tiêu(c) x Thu nhập tham chiếu một ngày(c). Giá một thứ = Ngân sách(c) x Tỉ lệ của loại / Tổng tỉ lệ các thứ mở ở chương c. Công thức đủ ở mục 3.3. `MVP`\n10. Nâng cấp bộ đồ (5 trục của `nguoi-choi.md` mục 2.6) và nâng cấp dụng cụ tốn hai phần: vật liệu đúng bằng cột Σ GTĐ vào của bảng UPG trong `vat-pham.md` và Tally theo luật 9. Chương mở lấy từ cột Mở bằng của bảng UPG. UPG-RACK-1 không tốn Tally vì là thưởng quest Kỹ sư đi kèm Dùi xung. Làm ở Xưởng, xong qua đêm (`vat-pham.md` luật C2). `MVP` bậc 1\n11. Linh kiện động cơ ENG-101 tới ENG-104 chỉ mua ở Shop. ENG-10c mở khi Hạng cảng đạt hạng trần của chương c: ENG-101 hạng 3, ENG-102 hạng 5, ENG-103 hạng 7, ENG-104 hạng 8. ENG-105 không bán (`vat-pham.md` luật E1). `MVP` ENG-101\n12. Shop bán thêm: cảng cấp 2 KH07-C2 (cửa neo thứ 4 của bến 1, Hạng 4, chương 2, không theo số người), bản thiết kế BPR-103 (Hạng 4), BPR-106 (Hạng 6), BPR-105 (chương 3, cũng có ở hòm Station Flint). Danh mục mở theo Hạng cảng và chương (K20). Shop không bán tài nguyên, kiện, vật tiêu hao. `Sau MVP` cảng cấp 2\n13. Giá không đổi theo số người (C8). Giá không giảm và không tăng theo thời gian. `MVP`","he-thong/kinh-te-tien-trinh.md",""],["2.3 Tiến trình và mở khóa",3,239,8,5.59,"14. Qua chương theo K25: chương đóng và vùng mới mở khi mốc đóng chương của truyện xong (gd-story), mốc đó chỉ kích hoạt khi giai đoạn động cơ của chương đã lắp. Kinh tế không có cổng chương riêng. Ba mốc kinh tế là gợi ý tiến độ. Sim ước ngày đóng chương khi: sửa xong mọi khoang và giai đoạn động cơ của chương (vật liệu theo `vat-pham.md` mục 2.7), đã lắp ENG-10c (c từ 1 tới 4), đã đi đủ chuyến map nhánh (số chuyến 2, 3, 2, 4, 3 theo `map.md` mục 2.10, trong 2 chuyến mỗi ngày của K22), và đã qua sàn ngày truyện của chương. T-VO không chặn chương: thiếu cấp vẫn vào dải mới nhưng thời gian làm việc chỉ còn khoảng 27% (K6, `map.md` mục 3.2), nên sim mua T-VO trước tiên khi chương mở nó. `MVP` chương 1\n15. Mọi nâng cấp khác không chặn chương. Sim mua theo thứ tự: ENG và T-VO trước, rồi các dòng còn lại của bảng 3.2 theo chương mở, khi đủ Tally và vật liệu.\n16. Mỗi chương mở các thứ mua mới đúng một lần. Thứ chương trước chưa mua vẫn mua được với giá cũ.\n17. Hạng cảng theo luật của gd-quan, Hạng không giảm. Nguồn điểm: 1 mỗi tàu phục vụ xong, thêm 1 nếu còn trên 2/3 kiên nhẫn. Ngưỡng Hạng 2 tới 8 ở mục 3.5, đặt để ngày đủ điểm giữ nhịp mở theo chương đã duyệt. `MVP` hạng 2, 3\n\n- Thắng khi, thua khi: hệ thống không có trạng thái thắng thua. Người chơi không thể mất Tally (K2). Tally không âm.\nCam kết với người chơi: giá in trên Shop không đổi, không có chi phí duy trì, không có cách nào làm Tally giảm ngoài mua.","he-thong/kinh-te-tien-trinh.md",""],["Trạng thái của một thứ mua",3,239,8,0.9,"| Trạng thái |
