,5,0.87,"| Ràng buộc | Số | Lý do |\n|---|---|---|\n| Thời lượng chuyến tối đa khi Oxy là giới hạn | 85% dung lượng bình (giây) | Dự trù quay về là ngưỡng người chơi tự đặt, thời lượng không vượt dung lượng bình |\n| Xa cột cuối, bình bậc 0, bộ đẩy bậc 0 | Bay ra có đường vòng 156 giây trên bình 330 | Tới được nhưng còn ít Oxy làm việc: Xa thực tế cần bình bậc 2 trở lên |\n| Thiếu 1 cấp ở Giữa, bình bậc 1 | 74 giây làm việc | Cổng mềm rất đắt, đúng ý K6: vẫn vào được dải mới |\n| Số mảnh khác nhau gặp trong một chuyến | tối đa 54 ô | 12 + 18 + 24 ô |\n| Số map nhánh cả game | 8 | 4 xác hoặc trạm con dùng chung bộ nội thất Seed Station (Cinder, Wick, Flint, phần ngoài Lantern) |\n| Người chơi không lạc | Mốc cố định nhìn được từ mọi cột của dải | Xác lớn cố định và Ember luôn chỉ trên la bàn |","he-thong/map.md",""],["6. Yêu cầu cho engineer và tool",2,141,5,4.24,"","he-thong/map.md",""],["6.1 Dữ liệu",3,167,5,0.97,"| Dữ liệu | Trường | Ghi chú |\n|---|---|---|\n| Mảnh | ID, dải, loại, cổng bốn cạnh (mở, đóng), cờ nửa ngoài, danh sách khe (loại, vị trí, danh sách cho phép, hướng cho SP-H đẩy, điểm neo cho SP-D) | Một prefab mỗi mảnh, khe là marker không va chạm |\n| Bảng dải | Số cột, số hàng, môi trường, tỉ lệ kích hoạt, số beacon, danh sách loài và nhóm tài nguyên theo chương | gd-tech đưa vào ScriptableObject |\n| Bảng hazard | Theo bảng 3.5 | |\n| Map nhánh | Scene riêng, trạng thái lưu: cửa, vách, boss, đường tắt, vật kể chuyện, buồng đã vớt | Lưu theo thế giới (C3) |\n| Chuyến | Seed (từ thế giới, số ngày, số thứ tự chuyến), danh sách ô và mảnh, khe đã kích hoạt, beacon, ô mỗi người đã vào | Bố cục lưu theo ngày và số thứ tự chuyến (K23), nạp lại không đổi. Đồng bộ co-op bằng seed và danh sách khe đã dùng. Ô đã vào gộp cả nhóm, cấp cho bản đồ chuyến (UI-33 của gd-ux) |","he-thong/map.md",""],["6.2 Sự kiện cần bắn",3,167,5,0.3,"Chuyến bắt đầu (seed, N, chương), vào dải, ra dải, thấy beacon, kích beacon bắt đầu, kích beacon hủy, kích beacon xong, trúng hazard (mã, Oxy trừ), vào map nhánh, ra map nhánh, mở khóa map nhánh, chuyến kết thúc (cách kết thúc, Oxy còn, dải xa nhất). gd-tech giữ tên event.","he-thong/map.md",""],["6.3 Tool cần",3,167,5,0.36,"1. Trình xem bố cục: nhập seed, chương, N, in lưới mảnh và đường chính, đánh dấu lỗi hợp lệ. Dùng cho QA và cân bằng.\n2. Validator kho mảnh: mỗi mảnh có cổng tối thiểu theo loại, khe SP-R cách vùng gây hại của hazard ít nhất 2 u, mảnh Thưởng có cờ nửa ngoài, kho đủ tỉ lệ loại.\n3. Sim chuyến (đợt 2, gd-tech): đề sim ở mục 8.","he-thong/map.md",""],["6.4 Spec greybox MVP: dải Gần",3,167,5,3.41,"- Đơn vị Unity: 1 u, nhân vật cao 1 u. Gốc tọa độ: x = 0 ở cửa khí của Ember, y = 0 ở biên dưới map. Camera cao 10 u, rộng 17,8 u ở 16:9, mở ngang tới 21:9 (gd-ux). Một mảnh 40 x 24 u bằng khoảng 2,2 x 2,4 màn hình.\n\n| Phần | Tọa độ (u) | Ghi chú |\n|---|---|---|\n| Ember (vỏ ngoài) | x từ âm 40 tới 0, y từ 24 tới 48 | Không vào lưới. Cửa khí ở (0, 36) |\n| Lưới Gần | x từ 0 tới 160, y từ 0 tới 72 | 4 cột x 3 hàng, mỗi ô 40 x 24 |\n| Ô Ember Mooring (cố định) | Cột 1 hàng giữa: x từ 0 tới 40, y từ 24 tới 48 | Cổng 1111. 6 SP-R phế liệu và 1 SP-D loài hiền luôn kích hoạt (không nhân tỉ lệ), không hazard, không loài săn mồi |\n| Ô lối vào Station Cinder (cố định) | Cột 3 hàng trên: x từ 80 tới 120, y từ 48 tới 72 | Cổng 1101 (Trái, Phải, Dưới mở, Trên là biên map). Vỏ xác 32 x 16 u, cửa vào ở cạnh dưới vỏ |\n| Rạn vụn chương 1 | x từ 160 tới 168, y từ 0 tới 72 | 8 u đầu cột 1 dải Giữa. Va chạm cứng, khe mở ở chương 2 tại hàng đường chính ra khỏi cột 4 của Gần |\n| Biên trên, biên dưới | y = 0 và y = 72 | Va chạm vô hình kèm lớp hình mảnh vỡ dày |\n\nLớp va chạm:\n\n| Lớp | Dùng cho | Va với người chơi | Va với Driftlife |\n|---|---|---|---|\n| Rắn | Vỏ xác, thiên thạch lớn, Rạn vụn, biên | Có | Có |\n| Vụn | Vật trôi nhỏ đẩy được (Rigidbody2D) | Có, đẩy được | Có |\n| Hazard | Vùng gây hại hoặc đẩy | Trigger | Trigger |\n| Khe | Marker điểm sinh | Không | Không |\n| Lối | Cửa khí, beacon, cửa map nhánh | Trigger | Không |\n\n- Kho mảnh MVP Gần (16 mảnh). Cổng ghi theo thứ tự Trái, Phải, Trên, Dưới, 1 là mở:\n\n| ID | Loại | Cổng | SP-R | SP-D | SP-H cho phép | SP-B | Nửa ngoài |\n|---|---|---|---|---|---|---|---|\n| G-M01 | Mở | 1111 | 8 | 2 | H01 | 1 | Không |\n| G-M02 | Mở | 1110 | 8 | 2 | H01, H03 | 1 | Không |\n| G-M03 | Mở | 1101 | 8 | 2 | H01 | 1 | Không |\n| G-M04 | Mở | 1111 | 8 | 2 | H03 | 1 | Có |\n| G-M05 | Mở | 0111 | 8 | 2 | H01 | 1 | Không |\n| G-H01 | Hành lang | 1100 | 3 | 1 | H02 | 0 | Không |\n| G-H02 | Hành lang | 1100 | 3 | 1 | H01, H03 | 0 | Không |\n| G-H03 | Hành lang | 0011 | 3 | 1 | H03 | 0 | Không |\n| G-O01 | Ổ | 1100 | 4 | 4 | H01 | 0 | Không |\n| G-O02 | Ổ | 1010 | 4 | 4 | không | 0 | Có |\n| G-O03 | Ổ | 1101 | 4 | 4 | H02 | 0 | Có |\n| G-X01 | Xác lớn | 1100 | 10 | 1 | H02 | 1 | Không |\n| G-X02 | Xác lớn | 1110 | 10 | 1 | H01 | 1 | Có |\n| G-X03 | Xác lớn | 1101 | 10 | 1 | H02 | 1 | Không |\n| G-T01 | Thưởng | 1000 | 6 | 2 | H01, H02 | 0 | Có |\n| G-T02 | Thưởng | 0100 | 6 | 2 | H02, H03 | 0 | Có |\n\n- Cột \"Nửa ngoài\": \"Có\" chỉ đặt ở cột 3 và 4, \"Không\" đặt mọi cột (luật 2.1.8). Khe SP-D của mảnh Mở và Ổ neo \"mảnh vỡ nhỏ\" (Driftmoth, Sting Krill, Skitter Ray). Khe SP-D của mảnh Xác lớn và mảnh có H02 neo \"xác có điện hoặc cạnh Cáp chập\" (Arc Eel).\n\n- Bố cục dự phòng dải Gần (dựng tay, đã kiểm bằng `sim/bo_cuc.py`), đường chính đi hàng giữa từ cột 1 tới cột 4:\n\n| Hàng | Cột 1 | Cột 2 | Cột 3 | Cột 4 |\n|---|---|---|---|---|\n| 3 (trên) | G-H03 | G-X01 | Lối vào Cinder | G-M04 (beacon nếu chuyến trước không ở đây) |\n| 2 (giữa) | Ember Mooring | G-H01 | G-X03 | G-M01 |\n| 1 (dưới) | G-M05 | G-H02 | G-O03 | G-X02 (beacon thay thế) |","he-thong/map.md",""],["6.5 Spec greybox MVP: Station Cinder",3,167,5,3.43,"- Scene riêng. Gốc tọa độ ở góc dưới trái của vỏ xác. Nội thất 64 x 24 u, hai tầng, mỗi tầng cao 12 u.\n\n| Khu | x (u) | y (u) | Ghi chú dựng |\n|---|---|---|---|\n| C1 Cửa khí hỏng | 0 tới 8 | 0 tới 12 | Cửa ra map tổng ở x = 0. Beacon B1 tại (4, 4) |\n| C2 Hành lang trục | 8 tới 40 | 0 tới 12 | Giếng lên tầng trên ở x từ 10 tới 13. Hai H01 trôi dọc hành lang, không đi qua bán kính an toàn 8 u của B3. Beacon B3 tại (34, 4) |\n| C3 Khoang ngủ đông trái | 8 tới 24 | 12 tới 24 | Buồng Ingrid tại (16, 15), buồng tắt M1 tại (20, 15), khe M4 (STY-101) tại (12, 20) |\n| C4 Vách sập | 24 tới 26 | 12 tới 24 | Rắn, không phá |\n| C5 Khoang ngủ đông phải | 26 tới 40 | 12 tới 24 | Buồng Linh tại (32, 15), buồng tắt M2 tại (36, 15) |\n| D1 Cửa khóa nguồn | x = 40 | 0 tới 12 | Cửa 1 x 6 u, trigger dùng Bộ kích nguồn |\n| C6 Khoang máy | 40 tới 56 | 0 tới 12 | Đấu trường boss 16 x 12 u, H02 tại (44, 10) và (52, 2), lõi năng lượng ở giữa |\n| C7 Khoang lái | 56 tới 64 | 0 tới 24 | Giếng hai tầng. Khe M3 tại (60, 18), khe V1 (STY-102) tại (58, 10). Beacon B2 tại (60, 4), bật sau boss |\n| C8 Hành lang trên | 40 tới 56 | 12 tới 24 | Nối C7 sang C5 |\n| Cửa D1 và vách C6 sang C7 | x = 40 và x = 56 | 0 tới 12 | D1 mở bằng TOL-401 thì giữ mở ở mọi chuyến sau. Vách tại x = 56 mở sau boss và giữ mở |","he-thong/map.md",""],["7. Yêu cầu cho art, UI, tutorial, audio",2,141,5,1.82,"| Sự kiện | Hình (VFX, trạng thái) | Âm (SFX) | Text, tutorial | Ưu tiên |\n|---|---|---|---|---|\n| Qua ranh dải | Đổi màu nền, hạt bụi môi trường đổi | Tầng nhạc nền đổi | Tên dải hiện 2 giây | MVP |\n| Vào dải thiếu cấp | Viền màn hình theo màu môi trường, thanh Oxy chạy nhanh | Tiếng cảnh báo bộ đồ | Một dòng: thiếu cấp vỏ, Oxy hao nhanh | Sau MVP |\n| Thấy beacon lần đầu | Cột sáng từ beacon, ghim lên la bàn | Tiếng bíp phát hiện | Tutorial lần đầu: giữ phím để về trạm | MVP |\n| Đang giữ beacon | Vòng tiến độ quanh nhân vật | Âm tăng dần | | MVP |\n| Giữ beacon bị hủy | Vòng vỡ | Tiếng tắt | | MVP |\n| Báo trước từng hazard | Theo bảng 3.5. Chỉ báo ở mép màn hình cho H01, H04, H07 (mũi tên theo hướng tới) | Mỗi hazard một tiếng báo riêng, tiếng chỉ báo mép có hướng trái phải | Lần đầu gặp mỗi hazard: một dòng gợi ý | MVP cho H01 đến H03 |\n| Rạn vụn | Tường mảnh vỡ dày, chớp nhẹ ở khe khi dải mở | | Khi chạm lần đầu ở chương 1: chưa có đường qua | MVP |\n| Bản đồ chuyến (phím M, không dừng thời gian) | Lưới mảnh, ô đã vào sáng, ô chưa vào tối, ghim beacon đã thấy, lối vào map nhánh, vị trí đồng đội | | Tutorial lần đầu ở Ember Mooring | MVP |\n| Mốc cố định | Silhouette lớn, đèn nháy riêng của mỗi xác | | | MVP |\n| Kéo buồng ngủ đông | Dây kéo, buồng phát sáng nhịp tim | Tiếng máy buồng | Tutorial lần 1 ở Cinder | MVP |\n| Skiff đi | Cảnh xuồng tách bến, bay qua các dải | Động cơ | | Sau MVP |\n\nArt 2D vector, một artist: map tổng dựng từ một bộ kit dùng chung cho mỗi dải (khối vỏ tàu, thiên thạch, băng, mây khí). Mảnh là cách xếp kit, không phải tranh vẽ riêng. Map nhánh xác Seed Station dùng chung một bộ nội thất.","he-thong/map.md",""],["7b. Cảm giác",2,141,5,0.61,"Tham chiếu cảm giác: khoảnh khắc thấy vỏ xác lớn hiện dần từ bóng tối khi bay tới, tiếng thở trong mũ đổi nhịp khi Oxy thấp, Recall Beacon kéo người chơi đi trong một nhịp sáng ngắn rồi cắt về trạm.\nPhản tham chiếu: không để map tổng trông như lưới ô vuông. Mối nối giữa hai mảnh phải bị che bằng vật trôi và mảnh vỡ. Không để hazard giật hình hay rung màn hình liên tục.\nPhản hồi: trúng hazard thì nhân vật nháy và bị đẩy ngay trong khung hình đó, thanh Oxy rơi kèm số trừ. Báo trước của hazard luôn dài hơn thời gian phản ứng tối thiểu ở bảng 3.5.","he-thong/map.md",""],["8. Cách đo thành công và tiêu chí nghiệm thu",2,141,5,2.04,"Chỉ số kết quả: thời lượng chuyến theo chương, tỉ lệ chuyến hết Oxy, tỉ lệ chuyến kết thúc bằng beacon, cửa khí, bị kéo về. Chỉ số trải nghiệm: số lần dùng vòng của dải, số mảnh Thưởng được vào, thời gian từ khi thấy beacon tới khi dùng.\n\nĐề sim cho gd-tech (đợt 2):\n\n| Câu hỏi | Đầu vào | Đầu ra |\n|---|---|---|\n| Thời lượng chuyến và tỉ lệ bị kéo về theo chương | Bảng 3.1 đến 3.7, số của gd-character, gd-combat, 4 kịch bản của sim (tệ, trung bình, tốt, tham). Kịch bản \"cẩn thận\" của khung là trung bình và tốt | p10, p50, p90 thời lượng, tỉ lệ bị kéo về |\n| Tài nguyên mỗi chuyến theo N | Bảng 3.6, 3.8 | Tài nguyên mỗi người, mỗi nhóm |\n| Bố cục hợp lệ | Kho mảnh MVP, 1000 seed | Tỉ lệ hợp lệ lần đầu, số lần rơi vào dự phòng, độ trùng mảnh giữa hai chuyến |\n\nTiêu chí nghiệm thu:\n1. Trình xem bố cục chạy 1000 chuyến liền nhau dải Gần: 100% bố cục cuối hợp lệ, dưới 1% rơi vào bố cục dự phòng. Bản tham chiếu `sim/bo_cuc.py` đo 0,00% rơi dự phòng ở 3 seed (`sim/bo-cuc.md`).\n2. Hai chuyến liền nhau bất kỳ: số ô có cùng mảnh ở cùng ô không vượt 5 trên 10 ô ghép, và không beacon nào ở cùng ô với chuyến trước. Bản tham chiếu đo lớn nhất 5, trung bình 1,4, beacon trùng ô 0%.\n3. Sim chương 1, chính sách trung bình: p50 thời lượng chuyến nằm trong 4 đến 6 phút.\n4. Sim chương 5, chính sách trung bình: p50 thời lượng chuyến nằm trong 10 đến 12 phút.\n5. Sim kịch bản cẩn thận: tỉ lệ chuyến bị kéo về dưới 5%. Sim kịch bản tham: 15 đến 40% (log 56). Playtest đo lại cả hai.\n6. Mỗi hazard gây hại có báo trước đo được trên build ít nhất 1 giây.\n7. Một người chơi một mình vào Station Cinder, đi hết lần 1 và lần 2, vớt đủ Ingrid và Linh, hạ hoặc xua BS-1, không cần người thứ hai.\n8. Mở map nhánh đã xong lần 2: cửa D1 vẫn mở, boss không còn, beacon B2 bật.\n9. Mỗi map nhánh có ít nhất một lối ra được kiểm bằng tay trên greybox.","he-thong/map.md",""],["10. Câu hỏi mở",2,141,5,0.74,"| Câu | Phương án đề xuất | Ai quyết |\n|---|---|---|\n| Bay ra Xa ở chương 5 chiếm khoảng 16% chuyến, có thấy lặp không | Giữ, đo ở playtest. Nếu lặp thì đặt Dòng trôi xuôi về Xa trên đường chính của Giữa | gd-world sau playtest |\n| Recall Beacon có hiện ngay khi vào dải không | Không, phải vào bán kính phát hiện. Giữ ý đồ dò đường | GDM |\n| Trọng số các trục độ khó | Đã chốt: Oxy bay ra 35%, mật độ đe dọa 30%, hazard 20%, môi trường 15% (log 79) | GDM |\n| Bản đồ chuyến (UI-33) trong MVP | Có. Map cấp ô đã vào, beacon đã thấy, lối vào map nhánh đã biết | gd-world, gd-ux đã thống nhất |\n| Rớt mạng của host giữa chuyến | Theo luật chung của gd-tech | gd-tech |","he-thong/map.md",""],["Co-op 1 đến 4 người",2,141,5,1.8,"| Luật | 1 người | 2 người | 3 người | 4 người |\n|---|---|---|---|---|\n| Kích thước map, số mảnh, số beacon | Giữ nguyên | Giữ nguyên | Giữ nguyên | Giữ nguyên |\n| Tỉ lệ kích hoạt SP-R, SP-D | x 1,00 | Gần x 1,27, Giữa x 1,25, Xa x 1,38 | Gần x 1,54, Giữa x 1,50, Xa x 1,76 | Gần x 1,81, Giữa x 1,75, Xa x 2,14 |\n| Hazard | Như nhau, trúng ai trừ người đó | Như nhau | Như nhau | Như nhau |\n| Máu máy phát Hàng rào cắt | Theo bảng 3.5 | x 1,6 | x 2,2 | x 2,8 (hệ số boss và The Wardens của gd-combat, 1 + 0,6 x (N trừ 1)) |\n| Recall Beacon | Một người kích | Mỗi người kích riêng, cùng beacon được | Như 2 người | Như 2 người |\n| Beacon đã thấy | Ghim cho mình | Ghim cho cả nhóm | Như 2 người | Như 2 người |\n| Khóa map nhánh | Một người mở được | Một người mở, người khác dọn đường | Như 2 người | Như 2 người |\n| Kéo buồng ngủ đông | Hệ số kéo 0,50 | 0,65 khi cùng kéo | 0,80 | 0,95 (gd-character) |\n| Boss map nhánh | Sinh lực x 1 | x 1,6 | x 2,2 | x 2,8 (gd-combat) |\n| Driftlife thường | Sinh lực, ngưỡng choáng, ngưỡng mê x 1 | N chia k(N) của dải | N chia k(N) của dải | N chia k(N) của dải, gánh mỗi người bằng 1. Bảng số ở gd-combat mục 6b |\n| Skiff | Chở 1 | Chở cả nhóm đã xác nhận | Như 2 người | Như 2 người |\n| Tách nhau | Không áp | Mỗi người tự do ở dải hoặc map nhánh khác nhau | Như 2 người | Như 2 người |\n| Về trước đồng đội | Không áp | Không ra lại trong cùng chuyến (C9), xem vị trí đồng đội và beacon đã thấy trên bản đồ chuyến | Như 2 người | Như 2 người |\n\nKhông có luật cần đúng N người: không cửa nào cần hai người cùng đứng, không công tắc đôi, không boss có cơ chế bắt buộc nhiều người.","he-thong/map.md",""],["Vật phẩm",1,0,6,41.53,"Hệ thống này định nghĩa mọi thứ người chơi nhặt, chế, mang, đóng thùng và bán: tài nguyên theo dải, mẫu Driftlife, dụng cụ, vật tiêu hao, công thức xưởng và nghiên cứu, kiện hàng cảng, linh kiện động cơ. Hệ thống nối nửa đi ra ngoài (nhặt, khai thác, hạ hoặc bắt) với nửa ở trạm (sửa, chế, nuôi, lập danh mục bán) theo pillar P2: mọi thứ nhặt được đều có chỗ dùng nhìn thấy được. Tầng: lõi. Ưu tiên: bản đầu (MVP chương 1) rồi đầy đủ. Phụ thuộc chính: gd-combat (loài, drop, hành vi dụng cụ), gd-world (vị trí điểm khai thác), gd-quan (khoang, đơn hàng cảng), gd-character (túi, Oxy, bậc bộ đồ), gd-economy (giá Tally).\n\nNguồn dữ liệu duy nhất của mọi bảng số trong file này là `projects/game-moi/sim/vat-pham.mjs`. Bảng giữa các dấu `` do script sinh, không sửa tay. Đổi số thì sửa script rồi chạy `node projects/game-moi/sim/vat-pham.mjs --ghi`.","he-thong/vat-pham.md","GDD hệ thống: Vật phẩm, tài nguyên, dụng cụ, công thức, hàng hóa cảng"],["Hiện hành",2,178,6,2.01,"- ID là khóa duy nhất. Tiền tố: RES tài nguyên thô, SLV điểm khai thác, SMP mẫu đã hạ, LIV mẫu sống, BIO sản phẩm nuôi, COM vật liệu chế, CON vật tiêu hao, CGO kiện, ENG linh kiện động cơ, BPR bản thiết kế, STY vật kể chuyện, BNG buồng ngủ đông, BPS mẫu sinh thiết, FED thức ăn nuôi, TOL dụng cụ và chìa, UPG nâng cấp, RCP công thức.\n- Đơn vị giá trị là GTĐ (giá trị tương đối, RES-101 bằng 1,0). Không phải Tally. gd-economy quy đổi GTĐ ra Tally (xem `kinh-te-tien-trinh.md` mục 3.1), file này không ghi giá.\n- Túi tính bằng Khối. Dụng cụ và nâng cấp là mở khóa cho cả nhóm, không vào kho. Kiện nằm trong kho, không vào túi. Trong giờ giao thương người chơi mang thùng, mỗi lần một thùng (1 kiện = 2,5 thùng, lồng sinh vật sống là một đơn vị không chia, luật G2). Mẫu sống cỡ S đi trong Lồng mẫu (TOL-501) kéo theo, cỡ M gửi về kho bằng Phao kéo, buồng ngủ đông là vật kéo.\n- Mỗi dải có tài nguyên riêng. Chuỗi giá trị: thô, luyện thành COM (hệ số 1,25 đến 1,5), đóng kiện (thô hệ số 1,0, tinh 1,1 đến 1,25). Mẫu sống cỡ S và M bằng 1,5 đến 2,0 lần giá trị hạ, mẫu sinh thiết cỡ L bằng 0,45 lần (luật M1, log 66). Chìa mở lối map nhánh là cổng cứng, không cần mang theo.\n- MVP (chương 1): dải Gần, 6 tài nguyên, 7 điểm khai thác, 5 COM, 9 kiện (gồm 1 kiện đặc sản, 1 lồng sinh vật sống và đúng 1 kiện phải chế trước khi đóng là CGO-113, chốt cuối với gd-quan), 6 nâng cấp (OXY-1, BAG-1, THR-1, RACK-1, MIN-2, HAR-2), 2 vật tiêu hao (Bình Oxy nhỏ, Lưới cuộn), 5 dụng cụ (Dụng cụ khai thác, Lao từ, Dùi xung, Súng lưới, Lồng mẫu) cộng chìa Bộ kích nguồn, 4 loài Driftlife (3 loài cỡ S DL-G01, G02, G04 bắt sống được bằng Súng lưới, log 49). Phần còn lại nhãn Sau MVP.\n- Số trong file là khởi điểm ước, chưa đo. Cổng kiểm máy: 0 lỗi nhất quán (ID, nguồn, tiêu, biên lợi, chi phí nâng cấp). Chưa có sim cân bằng (đợt 2).","he-thong/vat-pham.md",""],["1. Mục đích với người chơi",2,178,6,1.05,"- Người chơi cảm thấy: mỗi thứ nhặt được đều có hình dạng và chỗ dùng. Túi là giới hạn thứ hai sau Oxy (K3), nên mỗi lần nhặt là một lựa chọn \"đồ nào đáng chỗ này\". Về trạm thấy kho đầy lên, thấy xưởng biến phế liệu thành đồ có ích, thấy thùng hàng ra quầy cảng rồi lên tàu.\n- Quyết định chính: nhặt đồ dày giá trị (hiếm, nhỏ) hay đồ rẻ nhưng chiếm chỗ, hạ hay bắt sống, đem nguyên liệu thô bán thẳng hay luyện rồi mới đóng kiện, dùng vật liệu cho nâng cấp hay cho kiện.\n- Phục vụ pillar: P2 (mọi thứ nhặt đều có chỗ dùng, mỗi vật phẩm có nguồn tiêu và không có vật phẩm chỉ để bán lấy số), P1 (túi và vật tiêu hao Oxy đặt giá cho từng hơi thở), P3 (mọi luật chạy đúng với 1 đến 4 người).\n- 30 giây đầu: người chơi nhặt Mảnh vỡ trôi bằng tay (SLV-101, không cần dụng cụ), thấy túi đầy lên bằng thanh Khối, khoan một mạch quặng (SLV-102) bằng Dụng cụ khai thác khởi đầu, nạy một hòm bằng cùng dụng cụ đó rồi dùng Lao từ ở ô thứ hai khi gặp Driftlife.","he-thong/vat-pham.md",""],["2. Luật",2,178,6,54.64,"","he-thong/vat-pham.md",""],["2.1 Nhóm vật phẩm và nơi chứa",3,181,6,20.68,"| Nhóm | Ví dụ | Chứa ở đâu | Tính Khối | Mất khi bị kéo về (K2) |\n|---|---|---|---|---|\n| Tài nguyên thô, Mẫu hạ, Vật tiêu hao | RES, SMP, CON | Túi trong chuyến, kho ở trạm | Có | Mất trừ 1 món tự chọn |\n| Vật nhiệm vụ | STY-102, 103, 301, 401, 501, 701 | Túi như vật thường | Có (1 Khối) | Mất cùng túi, nhưng không mất vĩnh viễn: về lại vị trí gốc ở chuyến sau (luật V4). Có thể chọn làm món giữ lại theo K2 |\n| Vật manh mối | STY-101, 104, 105, 111, 211 đến 213, 311 đến 313, 411, 412, 414, 502, 601 | Tự ghi vào Sổ tay khi nhặt, không chiếm túi | Không | Không mất, đã ghi thì giữ |\n| Mẫu sống, mẫu sinh thiết | LIV (cỡ S vào Lồng mẫu kéo theo, cỡ M gửi về kho bằng Phao kéo), BPS (vào túi như mẫu thường) | Lồng mẫu (tối đa 3 con, mỗi người 1 lồng, gd-combat), kho | LIV không tính Khối (nằm trong lồng). BPS 1 Khối | LIV trong lồng mất cùng túi trừ 1 món. LIV đã gửi kho không mất |\n| Vật kéo | BNG (buồng ngủ đông) | Kéo theo người chơi, không vào túi | Không (gd-character định cách kéo) | Bỏ lại chỗ cũ, chuyến sau còn ở điểm cũ vì là map nhánh. Riêng kén BNG-102 (vật kéo lớp Nặng): rơi thì nằm lại chỗ thả, lưu ở beacon cố định gần nhất đã qua, chưa qua beacon nào thì ở cửa N4, ngoài K2 (combat luật 42, 43, map 2.7.9) |\n| Kiện | CGO | Kho ở trạm, tính ra thùng lúc Mở giao thương. Trong ca mang 1 thùng mỗi lần | Không | Không có ngoài trạm |\n| Vật liệu chế, Sản phẩm nuôi | COM, BIO | Kho ở trạm (không nhặt ngoài không gian, trừ COM trong hòm Seed) | Có nếu mang ra | Mất trừ 1 món |\n| Linh kiện động cơ, Bản thiết kế | ENG, BPR | Kho, học ngay (BPR) | Không | Không có ngoài trạm |\n| Dụng cụ, Nâng cấp bộ đồ | TOL, UPG | Mở khóa cho cả nhóm (C4), không có dạng vật | Không | Không áp dụng |\n\n- Luật V1 (log 57): Lồng mẫu chọn làm món giữ thì chỉ giữ con sao cao nhất trong lồng. Món giữ lại khi bị kéo về (K2) là món người chơi ghim (nguoi-choi.md điểm 5): 1 đơn vị vật phẩm của một loại, hoặc 1 vật đang kéo. Mặc định ghim vật có độ hiếm cao nhất vừa nhặt. Vật nhiệm vụ ghim được (luật V4). (Nhãn: MVP.)\n- Luật V2: kho có giới hạn 999 đơn vị mỗi loại và không giới hạn số loại. Kho dùng chung cả nhóm (C3). (Nhãn: MVP.)\n- Luật V3: túi tính bằng Khối. Tổng Khối của vật phẩm trong túi không vượt sức chứa (do gd-character quyết, giá trị tham chiếu ở mục 3). Túi đầy thì không nhặt thêm được, người chơi thả vật phẩm để nhặt vật khác. Thả vật phẩm xuống tạo vật nhặt được tại chỗ trong 30 giây. (Nhãn: MVP.)\n- Luật V4: vật manh mối tự ghi vào Sổ tay khi nhặt, không chiếm túi, không thể mất. Vật nhiệm vụ (chỉ 6 thứ: mảnh lõi Cinder và Wick, mẫu mang dấu săn bắt, hộp ghi hành trình Cradle, bản đồ sao thật, gói tin mật) chiếm túi như vật thường. Nếu người mang bị kéo về mất túi hoặc thả xuống thì vật nhiệm vụ nằm lại vị trí gốc ở map nhánh (nơi dựng tay cố định, K7) và có lại ở chuyến sau, không mất vĩnh viễn. Người chơi có thể chọn vật nhiệm vụ làm món được giữ khi bị kéo về (K2). Khớp luật 5 của gd-story. Ngoại lệ: STY-701 không có vị trí gốc ở map nhánh, mất thì về khoang liên lạc và nhận lại ngày sau (mỗi ngày tối đa 1 gói, luật C7). \"Nộp\" là bỏ vào kho ở nơi nhận, không tiêu vật, trừ khi vật nằm trong danh sách vật liệu của một việc sửa hoặc công thức (STY-102 ở sửa KH08, STY-401 và STY-501 ở RCP-207). RCP-141 chỉ sao từ STY-101 và STY-401, không sao từ STY-502. Lý do: P4 cấm manh mối bắt buộc nằm ở nơi mất được hoặc sinh lại ngẫu nhiên, và vẫn giữ áp lực của túi (P1). (Nhãn: MVP.)\n- Luật V5: vật kể chuyện không bán cho tàu. Với loại dữ liệu (STY-101, STY-401) khoang liên lạc sao ra Bản sao dữ liệu (CGO-131) để bán, vật gốc ở lại trạm (RCP-141, mỗi vật gốc sao một lần). Thẻ tên buồng ngủ đông (STY-601) treo ở khoang buồng ngủ đông, đổi hình trạm, không có công dụng chơi, vẫn thỏa P2 vì có chỗ dùng nhìn thấy được. (Nhãn: Sau MVP.)","he-thong/vat-pham.md",""],["2.2 Tài nguyên theo dải và điểm khai thác",3,181,6,10.31,"- Luật S1: tài nguyên thô gắn với dải (K5). Mỗi dải có ít nhất 2 tài nguyên chỉ dải đó có. Gần có 6, Giữa 4, Xa 5 (kèm 1 tài nguyên Cradle). Vật phẩm của dải trước vẫn có sink ở mọi giai đoạn: sửa khoang, luyện COM, kiện thô, nâng cấp bậc thấp. (Nhãn: MVP.)\n- Luật S2: tài nguyên và Driftlife sinh lại mỗi chuyến, không cạn (K8). Điểm khai thác không có số lần dùng giữa các chuyến, chỉ biến mất trong chuyến sau khi khai thác xong. (Nhãn: MVP.)\n- Luật S3: điểm khai thác (SLV) có độ cứng 0 đến 3 (vật liệu) hoặc cấp khóa 1 đến 3 (hòm). Dụng cụ khai thác (TOL-102) có bậc 1 đến 3: khoan vật liệu và nạy hòm dùng chung một dụng cụ cho gọn ô. Nếu bậc dụng cụ nhỏ hơn độ cứng hoặc cấp khóa thì vẫn làm được nhưng thời gian dài gấp 4 (cổng mềm, cùng tinh thần K6). Nếu bậc bằng hoặc lớn hơn thì thời gian chia cho hệ số bậc (mục 3). (Nhãn: MVP.)\n- Luật S4: mỗi điểm khai thác có bảng rơi theo trọng số. Mỗi lần quay chọn một dòng theo trọng số rồi cho số lượng ghi ở dòng đó. Số lần quay cố định theo loại điểm. (Nhãn: MVP.)\n- Luật S5: độ hiếm 4 bậc: Thường, Ít gặp, Hiếm, Đặc biệt. Mật độ giá trị mỗi Khối (GTĐ trên Khối) tăng theo bậc để món hiếm đáng chỗ trong túi (mục 3). Số lượng điểm khai thác và vị trí do gd-world quyết, gd-items chỉ định nghĩa loại điểm và thứ chúng nhả ra. (Nhãn: MVP.)\n- Luật S6: khai thác một điểm có người khác cùng khai thác: người đến trước giữ điểm, người sau không thấy tương tác tới khi điểm xong hoặc người trước rời. Mỗi điểm chỉ một người khai thác cùng lúc. Người giữ điểm không có tiến độ khai thác trong 10 giây thì thả điểm. Phần thưởng thuộc người khai thác, tự vào túi người đó. (Nhãn: MVP.)","he-thong/vat-pham.md",""],["2.3 Mẫu Driftlife",3,181,6,16.92,"- Luật M1 (K9, log 66): hạ một Driftlife cho nguyên liệu sinh học của dải (SMP-101, 201, 301, số lượng theo loài) và có xác suất rơi đặc sản của loài (SMP-111 và các số tương ứng). Bắt sống cho mẫu sống (LIV), chỉ với loài cỡ S và M. K9 chỉ áp cho loài bắt sống được: giá mẫu sống bằng k nhân giá trị kỳ vọng khi hạ, k từ 1,5 đến 2,0 theo loài (cỡ M dùng 1,5), gồm cả GTĐ vật tiêu hao kỳ vọng của lần bắt, nên tỉ lệ ròng đúng bằng k. Loài cỡ L (DL-M01, DL-M05, DL-X03, DL-X04) không bắt sống được, chỉ lấy mẫu sinh thiết (BPS) bằng Kim sinh thiết, đứng ngoài K9: giá ròng 0,45 lần E(hạ) cùng loài (nhanh mà ít, hạ lâu mà nhiều). DL-M01 không hạ được nên không có đặc sản và giữ giá cố định. Thứ tự và mã loài theo gd-combat. (Nhãn: MVP, cỡ S.)\n- Luật M2: mẫu sống có 3 nơi tiêu: nuôi trong khoang sinh quyển (chương 2, BIO mỗi ngày, mỗi con cần 1 thức ăn nuôi FED mỗi ngày), nghiên cứu (chương 2, đổi ra bản thiết kế, RCP-301 và RCP-302), bán ở giờ giao thương giá cao (lồng sinh vật sống, MVP chương 1). Mẫu sinh thiết đi vào kiện đặc sản và nghiên cứu Hồ sơ loài. Mẫu đã hạ chỉ có nguồn tiêu thô: kiện mô, kiện đặc sản, vật liệu cho vật tiêu hao. (Nhãn: Sau MVP.)\n- Luật M3: chất lượng mẫu 1 đến 3 sao do gd-combat định: mẫu sống theo Sinh lực còn lại lúc bắt (từ 70% là 3 sao, 30% đến dưới 70% là 2 sao, dưới 30% là 1 sao), mẫu sinh thiết luôn 3 sao, hạ thường cho 1 sao và Kết nhanh (hạ con đang bất lực) cho 2 sao. Hệ số giá trị 1,0 / 1,25 / 1,5. Ràng buộc K9 của gd-combat: mẫu sống 1 sao không thấp hơn nguyên liệu hạ 2 sao của cùng loài, script kiểm. Phẩm cấp kiện sinh học bằng sao thấp nhất trong đầu vào. Đơn hàng có thể đòi phẩm cấp tối thiểu (gd-quan). (Nhãn: MVP.)\n- Luật M4: boss có hai cách kết ở chương 1 và 2 (hạ hoặc xua đi). BS-1: hạ rơi Hạch thủ lĩnh Gần (SMP-191) cộng 5 SMP-101, xua đi rơi Mẫu boss Gần (SMP-192) cộng 2 SMP-101. BS-2: hạ rơi Đặc sản Tempest Gulper (SMP-291), xua đi rơi Mẫu boss Giữa (SMP-292). Chương 1 và 2 dùng một trong hai (khoang dẫn đường nhận SMP-191 hoặc SMP-192). Vật rơi boss chưa dùng được ở chương đang chơi (hạch, mẫu boss dùng cho khoang dẫn đường ở chương 2) nằm trong kho, trạm báo \"dùng được khi mở khoang dẫn đường\". Mẫu boss và hạch chỉ để sửa khoang, không dùng để nghiên cứu. Đặc sản loài Gần (SMP-111 đến 114) có chỗ dùng ở MVP là Kiện đặc sản Gần (CGO-106, RCP-124, 1 đặc sản mỗi kiện). BS-3 và BS-4 chỉ hạ: rơi Linh kiện Warden (RES-305) và Linh kiện Cradle (RES-401). BS-5 không rơi vật phẩm: sau khi khuất phục Daskel, Data Core của Warden Rig mở ra, trong đó nhặt được Bản đồ sao thật (STY-501, khe V1) và Lệnh phục kích Cradle mang dấu Daskel (STY-502, khe M1). Tọa độ hành tinh thật do Sevra trao ở mốc C5.6 chỉ là cảnh truyện. (Nhãn: MVP cho BS-1 và đặc sản loài Gần. BS-2 đến BS-5, STY-501 và STY-502: Sau MVP.)\n- Luật M5: con nuôi lấy ra khỏi ô bỏ vào lồng giao đơn (HC06) được tính là mẫu sống của loài đó nhưng lồng có giá bằng 0,5 lần giá lồng bắt thật cùng loài, và mỗi ngày tối đa 1 lồng từ nuôi cho mỗi loài, để nuôi rồi bán lồng không vượt giá bắt thật. gd-quan khớp `tram-va-cang.md`. (Nhãn: Sau MVP.)","he-thong/vat-pham.md",""],["2.4 Dụng cụ, bậc, nâng cấp bộ đồ",3,181,6,17.39,"- Luật T1: dụng cụ là trang bị mở khóa cho cả nhóm. Chế một lần ở Xưởng, mọi người chơi trong nhóm đều dùng được, mỗi người tự chọn dụng cụ mang theo. Lý do: C4 và C3. (Nhãn: MVP.)\n- Luật T2: dụng cụ không có độ bền, không tốn chi phí duy trì (K17). Chi phí dùng dụng cụ là vật tiêu hao (Súng lưới tốn Lưới cuộn, Súng gây mê tốn Ống gây mê, Phao kéo, Kim sinh thiết) hoặc cooldown (Lao từ, Dùi xung). gd-combat chốt cooldown và chỉ số theo bậc. (Nhãn: MVP.)\n- Luật T7: chìa mở lối map nhánh (Bộ kích nguồn TOL-401, Máy cắt thân tàu TOL-402) là cổng cứng: chưa mở khóa thì không mở được lối, không có chế độ chậm. Chìa không cần mang theo và không chiếm ô dụng cụ: nhóm đã mở khóa thì ai tương tác với cửa cũng mở được. Lý do: không có người quên mang chìa, co-op công bằng (C4), không khóa chết. Bộ kích nguồn là công thức đầu tiên của Xưởng sau khi vớt Kỹ sư (RCP-205, chỉ dùng tài nguyên thô): Station Cinder vớt người hai lần, lần một vào khu ngoài chưa cần chìa (vớt Kỹ sư), lần hai mở cửa D1 bằng chìa này (gd-world, `map.md` mục 2.10). (Nhãn: MVP.)\n- Luật T8 (K26): Oxy hồi từ vật tiêu hao trong một chuyến không quá 25% dung lượng bình của người đó, không dùng được khi đang ngạt, không hồi vượt dung lượng. Bình Oxy nhỏ (CON-101) hồi 40 điểm (khoảng 12% bình bậc 0), mỗi người mang tối đa 2 bình trong túi mỗi chuyến, tối đa 80 Oxy mỗi chuyến là 24,2% bình bậc 0 (330), thấp hơn ở bậc cao, nên đạt K26 (script kiểm). Chi phí chế 1 Bình Oxy nhỏ là 9,1 GTĐ (RCP-131, 10 giây), 2 bình 18,2 GTĐ. Số hồi và trần gd-character ghi ở `nguoi-choi.md` mục 2.3. Sim đợt 2 kiểm bình có phá P1 không.\n- Luật T3: dụng cụ nâng cấp theo bậc 1 đến 3 bằng công thức ở Xưởng (UPG-MIN, UPG-HAR, UPG-NET). Dụng cụ đánh số bậc 1 là khởi điểm (theo gd-combat), còn trục bộ đồ đánh số bậc 0 là khởi điểm (theo gd-character). Mỗi nâng cấp là một công thức riêng tốn vật liệu, và tốn Tally ở tab Upgrade (gd-economy, không ghi ở đây). Hiệu ứng UPG-HAR-2 và HAR-3 (Lao từ bậc 2 và 3) do gd-combat ghi ở bảng 3.3 `combat-driftlife.md`. Đã có: Lao từ bậc 2 (UPG-HAR-2, MVP) 14 sát thương, nhịp 0,75 giây, tầm 9 u. Bậc 3 (UPG-HAR-3, Sau MVP) 20 sát thương, nhịp 0,7 giây, tầm 10 u. UPG-NET-2 bán kính 2,2 u, nạp lại 2,5 giây, tầm 8 u, tối đa 3 con. (Nhãn: MVP.)\n- Luật T4: nâng cấp bộ đồ có 5 trục theo `nguoi-choi.md`: Bình Oxy (OXY, bậc 0 đến 4), Túi đồ (BAG, bậc 0 đến 4), Bộ đẩy (THR, bậc 0 đến 3), Vỏ bộ đồ tức cấp môi trường theo dải (ENV, cấp 0 đến 3), Đai dụng cụ (RACK, bậc 0 đến 2). Bậc 0 là khởi điểm, không có công thức. Vật liệu của bậc n bằng 25 nhân 1,8 mũ (lớp chi phí trừ 2) GTĐ, sai số 20%. Lớp chi phí bằng n cộng 1 cho OXY, BAG, THR, RACK, bằng n cộng 2 cho ENV (vỏ mở theo dải nên đắt hơn một lớp), bằng n cho dụng cụ. Hiệu ứng mỗi bậc (túi, số ô dụng cụ, Oxy, vỏ) ở `nguoi-choi.md` mục 2.6, không lặp số ở đây. (Nhãn: MVP, bậc 1.)\n- Luật T5: bộ vật liệu mỗi nâng cấp luôn gồm ít nhất một COM của dải vừa mở. Người chơi phải đi tới dải mới mới nâng được bậc kế tiếp, nối tiến trình dải với tiến trình bộ đồ. (Nhãn: Sau MVP.)\n- Luật T6: số ô dụng cụ theo Đai dụng cụ của gd-character (`nguoi-choi.md`): bậc 0 là 3 ô, bậc 1 là 4 ô (UPG-RACK-1, chương 1, đi kèm Dùi xung), bậc 2 là 5 ô (UPG-RACK-2, chương 2). Bộ khởi điểm: ô 1 Dụng cụ khai thác (TOL-102), ô 2 Lao từ (TOL-211), ô 3 để trống cho Dùi xung hoặc Súng lưới (mở bằng quest Kỹ sư ở chương 1). Chìa và Lồng mẫu không chiếm ô. Vật tiêu hao nằm trong túi, chiếm Khối, không có ô riêng. Dụng cụ không tốn Oxy (nguoi-choi.md điểm 9). (Nhãn: MVP.)","he-thong/vat-pham.md",""],["2.5 Công thức",3,181,6,20.94,"- Luật C1: công thức có 4 nơi chế: Xưởng (Kỹ sư mở, chương 1), Cảng (đóng thùng tự động lúc Mở giao thương, Thông dịch viên mở), Phòng nghiên cứu (Nhà sinh học, chương 2), khoang sinh quyển (nuôi, chương 2, do gd-quan). (Nhãn: MVP, Xưởng và Cảng.)\n- Luật C2: chế có hai kiểu thời gian. Nhanh (không quá 20 giây): người chơi đứng tại chỗ làm, ngoài giờ giao thương (trong ca không chế, K13). Qua đêm: đặt vào hàng đợi, hoàn thành khi ngủ, nhận ở pha chuẩn bị. Nâng cấp và dụng cụ luôn qua đêm. Hàng đợi qua đêm có 2 chỗ ở MVP, mở rộng do gd-quan. Mẻ xếp theo thứ tự người chơi đặt, mẻ thiếu vật liệu không bắt đầu và không trừ nguyên liệu. (Nhãn: MVP.)\n- Luật C3: công thức vật liệu chế (COM) và kiện đều mở theo vai (Kỹ sư, Thông dịch viên, Nhà sinh học) và theo chương, không cần bản thiết kế. Dụng cụ mới và bản nghiên cứu cần bản thiết kế (BPR), học một lần cho cả nhóm. (Nhãn: MVP.)\n- Luật C4: bản thiết kế có ba nguồn: nghiên cứu mẫu sống (BPR-101 Súng lưới bậc 2 từ DL-G01, BPR-102 Súng gây mê từ DL-G04, chương 2), Shop (K19), hòm cố định trong map nhánh (gd-world). Học BPR tiêu BPR. Số bản thiết kế giữa 103 và 105 để trống, không tái dùng, vì Dùi xung mở bằng quest Kỹ sư thay vì bản thiết kế. Súng lưới bậc 1, Dùi xung, Lồng mẫu không cần BPR vì mở bằng quest Kỹ sư ở chương 1. (Nhãn: Sau MVP.)\n- Luật C5: biên lợi chuỗi giá trị (hệ số GTĐ đầu ra trên GTĐ đầu vào). COM từ 1,25 đến 1,5 (luyện tốn thời gian). Kiện thô đúng 1,0 (chỉ đóng gói, tiện, không thêm giá trị). Kiện tinh từ 1,1 đến 1,25. Lồng sinh vật sống mang đúng GTĐ của mẫu sống bên trong, theo loài (bảng giá lồng ở mục 3, khối LONG), nên một giá phẳng không làm sập hệ số k của mẫu sống. Bản sao dữ liệu từ 1,5 đến 2,5 (thông tin đắt hơn vật liệu, giá do gd-economy). Vật tiêu hao bằng 1,0 (không bán). Kiểm bằng script. (Nhãn: MVP.)\n- Luật C7 (log 87, GD-033): kiện tin mật CGO-421 là loại kiện của nối tình báo. Đóng tự động lúc Mở giao thương bằng RCP-422: 1 gói tin mật STY-701 cộng 1 kiện vỏ bọc là một kiện hàng thường dải Xa (CGO-311, 312, 313, 306 hoặc 307), tin đi lẫn trong hàng. STY-701 là vật nhiệm vụ không giá: khoang liên lạc nhận từ mạng lưới, tối đa 1 gói mỗi ngày từ khi mốc nối tình báo mở, không mua bán, bị tiêu khi đóng. Giá trị CGO-421 bằng đúng kiện vỏ bọc rẻ nhất (hệ số 1,0), thêm sức nặng truyện và một bước đóng mà không thêm Tally. Đơn của mạng lưới thuộc nhóm hàng HC15 của gd-quan. (Nhãn: Sau MVP.)\n- Luật C6: mọi công thức chỉ dùng vật phẩm có trong ITEM LIST. Chiều ngược lại: thức ăn nuôi rẻ hơn sản phẩm nuôi từ 1,5 lần trở lên (script kiểm) để nuôi có lời. Nguyên liệu \"một trong n loài\" ghi dạng nhóm loài cùng dải, giá trị tính theo loài rẻ nhất. (Nhãn: MVP.)","he-thong/vat-pham.md",""],["2.6 Hàng hóa cảng (kiện)",3,181,6,7.79,"- Luật G1 (K13): giờ giao thương là nửa chơi tay thứ hai. gd-quan sở hữu luật ca, đơn và tàu. Hệ thống này cung cấp loại kiện, nguyên liệu và quy đổi thùng. Ca không có bước chế hay đóng. (Nhãn: MVP.)\n- Luật G2: đơn vị bán trong ca là thùng, 1 kiện = 2,5 thùng (Lead chốt 2026-11-20, D0). Giá trị một thùng bằng GTĐ kiện chia 2,5 (bảng ở mục 2.6b). Giá Tally của thùng do gd-economy đặt, file này không ghi giá. Lồng sinh vật sống, Bản sao dữ liệu (CGO-131) và Kiện tin mật (CGO-421) không chia: một cái là một đơn vị bán (Lead chốt 2026-11-20). Có ba loại kiện. Kiện thô (CGO-101..105 và CGO-109 Kiện đồ Trái Đất): đóng thẳng từ tài nguyên thô hoặc mô sinh học, hệ số 1,0. Kiện tinh (CGO-111..113 và các kiện sau): làm từ COM, COM luyện ở Xưởng phải xong trước Mở giao thương (hàng đợi qua đêm hoặc chế nhanh ban ngày). CGO-113 là kiện duy nhất ở chương 1 có bước chế trước. Kiện sinh học và đặc biệt (CGO-106, 107, 121, 131, 141 và các bản dải sau): đặc sản, sản phẩm nuôi, lồng sinh vật sống, bản sao dữ liệu, kiện vật tư (nhóm đồ chế HC08 của gd-quan). Khớp nhóm hàng cảng HC01 đến HC09 của gd-quan: HC07 là CGO-107, 207, 307, HC08 là CGO-141, HC09 là CGO-131. Cách đóng: các công thức đóng kiện (RCP-111 đến RCP-128 và các bản dải sau) chạy tự động lúc Mở giao thương, Thông dịch viên làm, không tốn thời gian ca. Mỗi lần đóng cho 2,5 thùng, đóng đủ số thùng danh mục còn thiếu, làm tròn lên số kiện. Thùng thừa và thùng chưa bán ở lại kho cho ca sau. Lồng giao Driftlife sống (RCP-126, 128, 226, 326) do người chơi làm ở cảng trước Mở giao thương, 8 giây, nhớ loài và sao. Giá trị một kiện bằng khoảng một phần mười giá trị đơn một ca của chương (khoảng 13,6 GTĐ chương 1, 42,5 chương 2, 104 chương 3, gd-economy đặt), nên một ca một người khoảng 10 kiện, tức 25 thùng (demo bot 2026-11-20). Số đơn vị đầu vào mỗi kiện từ 1 đến 14. (Nhãn: MVP.)\n- Luật G3: không có cỡ kiện. Trong ca mọi thùng và lồng mang như nhau: một lần một thứ, tốc độ chạy không đổi, không khiêng chung (gd-quan, `tram-va-cang.md`). Hệ số 0,75 và 0,50 ở `nguoi-choi.md` chỉ áp cho kéo vật ngoài không gian. (Nhãn: MVP.)\n- Luật G4: tàu chỉ mua (K13). Mỗi tàu gọi 1 thùng còn trong danh mục bán, loại thùng lấy từ danh sách kiện của mục này. Luật ca, danh mục, giao sai cửa neo do gd-quan. Giá Tally của thùng do gd-economy. (Nhãn: MVP.)\n- Luật G5: lồng sinh vật sống nhớ loài và sao: GTĐ của lồng bằng GTĐ mẫu sống bên trong nhân hệ số sao (1,0 / 1,25 / 1,5). gd-economy ghi giá lồng theo loài. Các kiện khác không nhớ nguồn gốc. Lồng không chia thùng. (Nhãn: MVP.)","he-thong/vat-pham.md",""],["2.6b Thùng mỗi kiện",3,181,6,1.27,"| Kiện | GTĐ kiện | Thùng mỗi kiện | GTĐ mỗi thùng |\n|---|---|---|---|\n| CGO-101 | 14,0 | 2,5 | 5,60 |\n| CGO-102 | 13,2 | 2,5 | 5,28 |\n| CGO-103 | 13,2 | 2,5 | 5,28 |\n| CGO-104 | 14,0 | 2,5 | 5,60 |\n| CGO-105 | 13,5 | 2,5 | 5,40 |\n| CGO-109 | 12,5 | 2,5 | 5,00 |\n| CGO-111 | 13,4 | 2,5 | 5,36 |\n| CGO-112 | 16,1 | 2,5 | 6,44 |\n| CGO-113 | 12,0 | 2,5 | 4,80 |\n| CGO-106 | 13,2 | 2,5 | 5,28 |\n| CGO-107 | 42,9 | 2,5 | 17,16 |\n| CGO-121 | theo loài | 1 đơn vị, không chia | bằng GTĐ lồng |\n| CGO-141 | 46,9 |
