<title>Bản đồ tri thức The Novent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Bầu trời đêm một giao diện: canvas sao toàn màn, khung tìm kiếm nổi góc trên trái, bảng đọc bên phải (tấm dưới ở màn hẹp). Sao chỉ hiện khi sao cha đã mở */
:root {
  --void: #03050b; --glass: rgba(10, 15, 30, .86); --glass-2: rgba(22, 31, 56, .8);
  --rim: rgba(160, 185, 255, .14); --rim-2: rgba(160, 185, 255, .3);
  --ink: #e9edf7; --ink-2: #aab4cb; --ink-3: #6f7b96; --gold: #ffd48a;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font: 14px/1.6 var(--f-body); overflow: hidden; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#sky.hover { cursor: pointer; }
#sky:active { cursor: grabbing; }

.dock { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: min(370px, calc(100vw - 32px)); display: grid; gap: 8px; z-index: 5; }
.brand { padding: 11px 14px; background: var(--glass); border: 1px solid var(--rim); border-radius: 14px; }
.brand h1 { margin: 0; font: 700 17px/1.2 var(--f-display); letter-spacing: .05em; }
.brand h1 span { color: var(--gold); }
.brand p { margin: 3px 0 0; color: var(--ink-2); font-size: 12.5px; }
.brand kbd { font: 11px var(--f-mono); padding: 0 5px; border: 1px solid var(--rim-2); border-radius: 4px; color: var(--ink); }
.find { position: relative; }
.find input { width: 100%; padding: 9px 14px 9px 34px; background: var(--glass); border: 1px solid var(--rim); border-radius: 12px; color: var(--ink); font: 13.5px var(--f-body); }
.find input::placeholder { color: var(--ink-3); }
.find svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.res { margin: 6px 0 0; padding: 4px; list-style: none; background: var(--glass); border: 1px solid var(--rim); border-radius: 12px; max-height: 46vh; overflow: auto; }
.res button { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 1px 10px; align-items: baseline; padding: 7px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; font: 13px/1.35 var(--f-body); cursor: pointer; }
.res button:hover, .res button:focus-visible { background: var(--glass-2); outline: none; }
.res i { width: 7px; height: 7px; border-radius: 50%; }
.res small { grid-column: 2; color: var(--ink-3); font: 11px var(--f-mono); }

.hud { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 5; }
.hud button { height: 32px; padding: 0 12px; border: 1px solid var(--rim); border-radius: 10px; background: var(--glass); color: var(--ink); font: 500 12.5px var(--f-body); cursor: pointer; }
.hud button:hover { border-color: var(--rim-2); }
.hud span { color: var(--ink-3); font: 11.5px var(--f-mono); }

.tip { position: fixed; z-index: 6; pointer-events: none; padding: 6px 10px; background: var(--glass); border: 1px solid var(--rim-2); border-radius: 9px; font-size: 13px; max-width: 320px; }
.tip small { display: block; color: var(--ink-3); font: 11px var(--f-mono); }

.panel { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(480px, 40vw); display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--rim); border-radius: 18px; z-index: 5; overflow: hidden; transition: transform .3s ease, opacity .3s ease; }
.panel.off { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.ph { padding: 16px 48px 12px 18px; border-bottom: 1px solid var(--rim); display: grid; gap: 8px; }
.crumb { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font: 12px var(--f-mono); color: var(--ink-3); }
.crumb button { border: 0; background: none; color: var(--ink-2); font: inherit; padding: 1px 3px; border-radius: 4px; cursor: pointer; }
.crumb button:hover { color: var(--gold); }
.ttl { display: flex; gap: 12px; align-items: flex-start; }
.orb { flex: none; width: 12px; height: 12px; margin-top: 8px; border-radius: 50%; background: #fff; }
.ph h2 { margin: 0; font: 600 21px/1.25 var(--f-display); text-wrap: balance; }
.ph .full { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { padding: 2px 9px; border: 1px solid var(--rim); border-radius: 999px; color: var(--ink-2); font: 11.5px var(--f-mono); }
.pb { overflow: auto; padding: 14px 18px 22px; display: grid; gap: 18px; align-content: start; }
.sec h3 { margin: 0 0 8px; font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.kids { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.kids button { width: 100%; display: flex; gap: 10px; align-items: center; padding: 7px 8px; border: 0; border-radius: 9px; background: none; color: var(--ink); text-align: left; font: 13.5px/1.35 var(--f-body); cursor: pointer; }
.kids button:hover, .kids button:focus-visible { background: var(--glass-2); outline: none; }
.kids .dot { flex: none; display: grid; place-items: center; width: 16px; }
.kids .dot i { border-radius: 50%; background: #fff; }
.kids em { margin-left: auto; font: normal 11px var(--f-mono); color: var(--ink-3); white-space: nowrap; padding-left: 8px; }
.md { font-size: 14px; line-height: 1.65; overflow-wrap: anywhere; }
.md > *:first-child { margin-top: 0; }
.md p, .md ul, .md ol { margin: 0 0 10px; }
.md ul, .md ol { padding-left: 20px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--ink-3); }
.md strong { color: #fff; font-weight: 600; }
.md code { font: 12.5px var(--f-mono); color: var(--gold); background: rgba(255, 212, 138, .07); padding: 1px 4px; border-radius: 4px; }
.md h4 { font: 600 14px var(--f-display); margin: 14px 0 6px; }
.md .tw { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--rim); border-radius: 10px; }
.md table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; width: max-content; }
.md th, .md td { padding: 6px 9px; border-bottom: 1px solid var(--rim); text-align: left; vertical-align: top; min-width: 90px; max-width: 300px; }
.md th { font: 600 11px var(--f-mono); color: var(--ink-2); background: rgba(255, 255, 255, .03); white-space: nowrap; }
.md tr:last-child td { border-bottom: 0; }
.more { border: 1px solid var(--rim); background: none; color: var(--ink-2); font: 12.5px var(--f-body); padding: 6px 12px; border-radius: 9px; cursor: pointer; justify-self: start; }
.note { color: var(--ink-3); font-size: 12.5px; }
.x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font: 18px var(--f-mono); cursor: pointer; }
.x:hover { background: var(--glass-2); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-3); font: 13px var(--f-mono); }

@media (max-width: 820px) {
  .dock { width: calc(100vw - 32px); }
  .brand p { font-size: 12px; }
  .panel { left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); top: auto; width: auto; height: 55vh; border-radius: 18px 18px 12px 12px; }
  .panel.off { transform: translateY(calc(100% + 24px)); }
  .hud span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>

<canvas id="sky" aria-label="Bản đồ sao các hệ thống thiết kế của The Novent" role="img"></canvas>
<div class="loading" id="loading">Đang dựng bầu trời…</div>

<div class="dock">
  <div class="brand">
    <h1>THE NOVENT <span>·</span> bản đồ sao</h1>
    <p>Bấm vào ngôi sao để đọc nội dung. Bấm nút <kbd>›</kbd> cạnh sao để mở nhánh, <kbd>‹</kbd> để thu lại. Sao càng to, càng nhiều phần khác dẫn tới.</p>
  </div>
  <div class="find">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Tìm: Oxy, ca cảng, Sevra, Recall Beacon" aria-label="Tìm trong GDD" autocomplete="off">

  </div>
</div>

<div class="hud">
  <button type="button" id="fit">Xem mọi sao đang mở</button>
  <button type="button" id="fold">Thu hết về lõi</button>
  <span>Kéo để trôi, cuộn để phóng</span>
</div>

<div class="tip" id="tip" hidden></div>

<aside class="panel off" id="panel" aria-live="polite">
  <button class="x" id="close" type="button" aria-label="Đóng bảng">×</button>
  <div class="ph" id="ph"></div>
  <div class="pb" id="pb"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(async function () {
  const TINT = ['#ffe2a8', '#ff9ec7', '#c9a7ff', '#8fd0ff', '#ff8a6b', '#7fe3c4', '#ffd166', '#ffb36b', '#b8f27a', '#9fb3ff', '#7fd8ff'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mob = () => innerWidth <= 820;

  let D;
  try { D = await (await fetch('sao.json')).json(); }
  catch (e) { $('loading').textContent = 'Không tải được dữ liệu. Tải lại trang thử lần nữa.'; return; }
  $('loading').remove();

  const S = D.n.map((a, i) => ({ i, t: a[0], lv: a[1], p: a[2], sys: a[3], w: a[4], body: a[5], f: a[6], full: a[7], kids: [], link: [] }));
  S.forEach((s) => { if (s.p >= 0) S[s.p].kids.push(s.i); });
  S.forEach((s) => s.kids.sort((a, b) => S[b].w - S[a].w));
  D.x.forEach(([a, b, c]) => { S[a].link.push([b, c]); S[b].link.push([a, c]); });
  const SYS = S.filter((s) => s.lv === 1);
  const tint = (s) => s.lv === 0 ? '#fff6e0' : TINT[s.sys % TINT.length];
  const plain = (s) => s.lv === 0 ? 'The Novent' : s.lv === 1 ? s.t : s.t.replace(/^\d+[a-z]?\.\s*/, '');
  const sysOf = (s) => { let k = s.i; while (k >= 0 && S[k].lv > 1) k = S[k].p; return S[k]; };
  const fb = S.map((s) => fold(s.t + ' ' + s.body));

  // độ quan trọng trong cùng tầng, kéo giãn để sao lớn nổi hẳn lên
  const maxW = [1, 1, 1, 1];
  S.forEach((s) => { maxW[s.lv] = Math.max(maxW[s.lv], s.w); });
  S.forEach((s) => { s.imp = s.lv === 0 ? 1 : Math.pow(Math.min(1, s.w / maxW[s.lv]), 0.8); });
  const RANGE = [[46, 46], [26, 48], [4.5, 17], [2.8, 9]];
  S.forEach((s) => { const [a, b] = RANGE[s.lv]; s.r = s.lv === 0 ? a : a + (b - a) * s.imp; s.lum = s.lv <= 1 ? 1 : 0.45 + 0.55 * s.imp; });

  // bố cục kiểu bầu trời thật: hệ thống nằm lệch ngẫu nhiên quanh lõi, sao con rải lộn xộn,
  // mỗi chùm kéo dài theo một hướng riêng, không sao nào đè sao nào. Hạt giống cố định nên lần nào mở cũng ra cùng một bầu trời
  const rng = d3.randomLcg(20261123);
  S[0].x = 0; S[0].y = 0;
  const placed = [S[0]];
  const far = (c, x, y, gap) => placed.every((o) => Math.hypot(o.x - x, o.y - y) > (c.r + o.r) * 2 + gap);
  SYS.forEach((s, k) => {
    for (let t = 0; t < 200; t++) {
      const a = -Math.PI / 2 + (k / SYS.length) * Math.PI * 2 + (rng() - 0.5) * 0.5;
      const rr = 1300 + rng() * 1300;
      const x = Math.cos(a) * rr * 1.15, y = Math.sin(a) * rr * 0.8;
      if (far(s, x, y, 900) || t === 199) { s.x = x; s.y = y; break; }
    }
    placed.push(s);
  });
  function scatter(par, depth) {
    const n = par.kids.length; if (!n) return;
    const rot = rng() * Math.PI * 2, ax = 0.55 + rng() * 1.05, ay = 0.55 + rng() * 0.6;
    const base = depth === 1 ? 110 : 30 + par.r * 1.5, spread = depth === 1 ? 160 + 38 * Math.sqrt(n) : 36 + 17 * Math.sqrt(n);
    par.kids.forEach((ci, j) => {
      const c = S[ci]; let x = par.x, y = par.y, grow = 1;
      for (let t = 0; t < 60; t++) {
        const d = (base + spread * Math.sqrt(rng()) * (0.35 + 0.65 * (j + 1) / n)) * grow;
        const a = rng() * Math.PI * 2;
        const lx = Math.cos(a) * d * ax, ly = Math.sin(a) * d * ay;
        x = par.x + lx * Math.cos(rot) - ly * Math.sin(rot); y = par.y + lx * Math.sin(rot) + ly * Math.cos(rot);
        if (far(c, x, y, depth === 1 ? 26 : 9)) break;
        grow *= 1.04;
      }
      c.x = x; c.y = y; placed.push(c);
    });
    par.kids.forEach((ci) => scatter(S[ci], depth + 1));
  }
  SYS.forEach((s) => scatter(s, 1));
  // đường chòm sao: cây khung ngắn nhất qua sao cha và các sao con đang hiện, ra hình gấp khúc như chòm thật
  function mst(pts) {
    const n = pts.length, inT = new Array(n).fill(false), best = new Array(n).fill(Infinity), from = new Array(n).fill(-1), out = [];
    best[0] = 0;
    for (let it = 0; it < n; it++) {
      let u = -1; for (let v = 0; v < n; v++) if (!inT[v] && (u < 0 || best[v] < best[u])) u = v;
      inT[u] = true; if (from[u] >= 0) out.push([from[u], u]);
      for (let v = 0; v < n; v++) { if (inT[v]) continue; const d = Math.hypot(pts[u][0] - pts[v][0], pts[u][1] - pts[v][1]); if (d < best[v]) { best[v] = d; from[v] = u; } }
    }
    return out;
  }
  S.forEach((s) => { s.ph = Math.random() * Math.PI * 2; s.sp = 0.6 + Math.random() * 1.2; s.v = s.lv <= 1 ? 1 : 0; });

  // trạng thái: chòm nào đang mở. Không tự đóng, chỉ đóng khi nháy đúp
  const open = new Set([0]);
  const shown = (s) => { let k = s.p; while (k >= 0) { if (!open.has(k)) return false; k = S[k].p; } return true; };
  let sel = null, hov = null;

  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const DUST = Array.from({ length: 1300 }, () => ({ x: rnd(), y: rnd(), r: rnd() < 0.93 ? 0.4 + rnd() * 0.7 : 1 + rnd() * 0.9, a: 0.12 + rnd() * 0.5, d: 0.15 + rnd() * 0.35 }));

  const cv = $('sky'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, T = d3.zoomIdentity;
  function size() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  size(); addEventListener('resize', size);
  const zoom = d3.zoom().scaleExtent([0.05, 9]).on('zoom', (e) => { T = e.transform; });
  const sky = d3.select(cv).call(zoom).on('dblclick.zoom', null);

  const onPath = (s) => { if (sel == null) return false; let k = sel; while (k >= 0) { if (k === s.i) return true; k = S[k].p; } return false; };
  function draw(now) {
    const t = now / 1000;
    // sao hiện dần khi mở, mờ dần khi thu
    for (const s of S) { const tg = shown(s) ? 1 : 0; s.v += (tg - s.v) * (reduce ? 1 : 0.14); if (Math.abs(tg - s.v) < 0.01) s.v = tg; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#0b1124'); g.addColorStop(0.6, '#060914'); g.addColorStop(1, '#020309');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const d of DUST) {
      const x = ((d.x * W * 1.6 + T.x * d.d) % (W * 1.6) + W * 1.6) % (W * 1.6) - W * 0.3;
      const y = ((d.y * H * 1.6 + T.y * d.d) % (H * 1.6) + H * 1.6) % (H * 1.6) - H * 0.3;
      ctx.globalAlpha = d.a * (reduce ? 1 : 0.75 + 0.25 * Math.sin(t * 1.3 + d.x * 40));
      ctx.fillStyle = '#cfd8ff'; ctx.fillRect(x, y, d.r, d.r);
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(dpr * T.k, 0, 0, dpr * T.k, dpr * T.x, dpr * T.y);
    // tinh vân, sáng hơn ở hệ thống đang mở
    for (const s of SYS) {
      const rr = 640; const c = d3.color(tint(s)); const lit = open.has(s.i) ? 0.15 : 0.06;
      const ng = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rr);
      ng.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${lit})`); ng.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ng; ctx.fillRect(s.x - rr, s.y - rr, rr * 2, rr * 2);
    }
    // đường chòm sao
    ctx.lineCap = 'round';
    const P = (s) => { const p = s.p >= 0 ? S[s.p] : s; return [p.x + (s.x - p.x) * ease(s.v), p.y + (s.y - p.y) * ease(s.v)]; };
    for (const par of S) {
      if (!par.kids.length || !open.has(par.i) || par.v <= 0) continue;
      const kids = par.kids.map((k) => S[k]).filter((k) => k.v > 0);
      if (!kids.length) continue;
      const pts = [par, ...kids].map((s) => P(s));
      const a = Math.min(...kids.map((k) => k.v));
      const c = d3.color(tint(par));
      // đường sáng: một lớp quầng màu của hệ thống, một lõi sáng mảnh ở giữa. Lõi tỏa thẳng ra 11 hệ thống
      const edges = par.lv === 0 ? kids.map((_, j) => [0, j + 1]) : mst(pts);
      const path = () => { ctx.beginPath(); for (const [u, v] of edges) { ctx.moveTo(pts[u][0], pts[u][1]); ctx.lineTo(pts[v][0], pts[v][1]); } };
      // mảnh và dịu hơn sao nhỏ nhất: quầng mờ 1px, lõi sáng nửa pixel
      ctx.globalAlpha = a; ctx.shadowColor = `rgb(${c.r},${c.g},${c.b})`; ctx.shadowBlur = 4;
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${par.lv === 0 ? 0.16 : par.lv === 1 ? 0.26 : 0.2})`; ctx.lineWidth = (par.lv <= 1 ? 1.1 : 0.8) / T.k; path(); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,248,232,${par.lv === 0 ? 0.22 : 0.38})`; ctx.lineWidth = (par.lv <= 1 ? 0.5 : 0.4) / T.k; path(); ctx.stroke();
    }
    // đường vàng mảnh từ sao đang chọn ngược về hệ thống của nó
    if (sel != null && S[sel].lv >= 2) {
      ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(255,212,138,.6)'; ctx.lineWidth = 1.3 / T.k; ctx.setLineDash([3 / T.k, 4 / T.k]);
      ctx.beginPath(); let k = sel; ctx.moveTo(S[k].x, S[k].y); while (S[k].lv > 1) { k = S[k].p; ctx.lineTo(S[k].x, S[k].y); } ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
    // liên hệ chéo của sao đang chọn
    if (sel != null) {
      ctx.setLineDash([6 / T.k, 7 / T.k]); ctx.lineWidth = 1.2 / T.k; ctx.strokeStyle = 'rgba(127,227,196,.55)';
      for (const [j] of S[sel].link) { if (S[j].v < 0.5) continue; ctx.beginPath(); ctx.moveTo(S[sel].x, S[sel].y); ctx.lineTo(S[j].x, S[j].y); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    // sao
    const minPx = 1.2 / T.k;
    for (const s of S) {
      if (s.v <= 0) continue;
      const [x, y] = P(s);
      const tw = reduce ? 1 : 0.84 + 0.16 * Math.sin(t * s.sp + s.ph);
      // sao chính giữ cỡ tối thiểu trên màn hình để luôn nổi bật cả khi nhìn xa
      const floor = s.lv === 0 ? 11 / T.k : s.lv === 1 ? (7 + 6 * s.imp) / T.k : s.lv === 2 ? (2.6 + 2 * s.imp) / T.k : (1.8 + 1.2 * s.imp) / T.k;
      const r = Math.max(s.r, floor) * (0.4 + 0.6 * s.v);
      const c = d3.color(tint(s));
      const hl = s.i === sel || s.i === hov;
      const a = s.v * s.lum;
      const halo = r * (s.lv <= 1 ? 5.5 : 3.2 + 2.2 * s.imp) * (hl ? 1.5 : 1);
      const hg = ctx.createRadialGradient(x, y, 0, x, y, halo);
      hg.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${0.6 * tw * a})`); hg.addColorStop(0.25, `rgba(${c.r},${c.g},${c.b},${0.2 * tw * a})`); hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, y, halo, 0, 7); ctx.fill();
      if (s.lv <= 1 || s.imp > 0.6) { // tia chữ thập cho sao lớn
        ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.35 * tw * a})`; ctx.lineWidth = Math.max(0.6 / T.k, r * 0.07);
        const L = r * (s.lv <= 1 ? 3.4 : 2.6) * tw; ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
      }
      ctx.globalAlpha = a * (0.9 + 0.1 * tw); ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 7); ctx.fill();
      ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`; ctx.globalAlpha = 0.55 * a;
      ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      if (open.has(s.i) && s.kids.length && s.lv > 0) { ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},.45)`; ctx.lineWidth = 1 / T.k; ctx.beginPath(); ctx.arc(x, y, r + 5 / T.k, 0, 7); ctx.stroke(); }
      if (s.i === sel) { ctx.strokeStyle = 'rgba(255,212,138,.95)'; ctx.lineWidth = 1.6 / T.k; ctx.beginPath(); ctx.arc(x, y, r + 9 / T.k, 0, 7); ctx.stroke(); }
    }
    // nhãn
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const boxes = [];
    // chữ chỉ hiện khi đã phóng đủ gần: sao lớn hiện trước, sao nhỏ hiện sau, ở xa thì chỉ còn sao
    const SHOW = [0.12, 0.12, 0.45, 1.05];
    const za = (s) => Math.max(0, Math.min(1, (T.k - SHOW[s.lv] * 0.8) / (SHOW[s.lv] * 0.2)));
    const order = S.filter((s) => s.v > 0.35 && za(s) > 0)
      .sort((a, b) => (a.i === sel ? -1 : b.i === sel ? 1 : a.lv - b.lv || b.w - a.w));
    for (const s of order) {
      const [wx, wy] = P(s); const x = wx * T.k + T.x, y = wy * T.k + T.y;
      if (x < -200 || x > W + 200 || y < -40 || y > H + 40) continue;
      const big = s.lv <= 1;
      ctx.font = big ? `600 ${s.lv === 0 ? 12 : 11.5}px "Chakra Petch", sans-serif` : `${s.i === sel || s.imp > 0.6 ? 600 : 400} ${s.lv === 2 ? 12 : 11}px "Be Vietnam Pro", sans-serif`;
      let txt = s.lv === 0 ? 'THE NOVENT' : big ? s.t.toUpperCase() : plain(s);
      const tw2 = Math.min(ctx.measureText(txt).width, 230);
      const off = Math.max(s.r * T.k, 2) + 7;
      const box = [x - tw2 / 2 - 4, y + off - 2, tw2 + 8, 18];
      if (!big && s.i !== sel && boxes.some((b) => b[0] < box[0] + box[2] && box[0] < b[0] + b[2] && b[1] < box[1] + box[3] && box[1] < b[1] + b[3])) continue;
      boxes.push(box);
      ctx.globalAlpha = za(s) * Math.min(1, s.v * (big ? 0.92 : 0.55 + 0.45 * s.lum + (s.i === sel ? 1 : 0)));
      ctx.fillStyle = big ? (s.lv === 0 ? '#fff3d6' : tint(s)) : s.i === sel ? '#ffd48a' : '#e3e9f8';
      ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = 6;
      if (big) ctx.letterSpacing = '0.1em';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(txt, x, y + off, 230);
      ctx.letterSpacing = '0px'; ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    // nút mở nhánh kiểu NotebookLM: › kèm số nhánh khi đang thu, ‹ khi đã mở. Bấm sao để đọc, bấm nút để mở hoặc thu
    badges = [];
    for (const s of S) {
      if (!s.kids.length || s.lv === 0 || s.v < 0.6) continue;
      const vis = s.lv === 1 || s.i === sel || s.i === hov || za(s) > 0.3;
      if (!vis) continue;
      const [wx, wy] = P(s); const sx = wx * T.k + T.x, sy = wy * T.k + T.y;
      const rs = Math.max(s.r * T.k * (s.lv === 1 ? 1 : 0.9), s.lv === 1 ? (7 + 6 * s.imp) : 3);
      const bx = sx + rs + 15, by = sy;
      if (bx < -20 || bx > W + 20 || by < -20 || by > H + 20) continue;
      const isOpen = open.has(s.i); const c = d3.color(tint(s)); const hot = badgeHov === s.i;
      ctx.globalAlpha = Math.min(1, s.v);
      ctx.fillStyle = hot ? 'rgba(30,40,70,.95)' : 'rgba(12,17,32,.9)';
      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${hot ? 1 : 0.75})`; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(bx, by, 9, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#f2f5fc'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      if (isOpen) { ctx.moveTo(bx + 2, by - 4); ctx.lineTo(bx - 2, by); ctx.lineTo(bx + 2, by + 4); }
      else { ctx.moveTo(bx - 2, by - 4); ctx.lineTo(bx + 2, by); ctx.lineTo(bx - 2, by + 4); }
      ctx.stroke();
      if (!isOpen) { ctx.font = '500 11px "JetBrains Mono", monospace'; ctx.fillStyle = '#aab4cb'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(String(s.kids.length), bx + 13, by + 0.5); }
      ctx.globalAlpha = 1;
      badges.push({ i: s.i, x: bx, y: by });
    }
    requestAnimationFrame(draw);
  }
  let badges = [], badgeHov = null;
  function ease(v) { return 1 - Math.pow(1 - v, 3); }

  // camera
  function fly(list, dur = 850, padIn) {
    const xs = list.map((s) => s.x), ys = list.map((s) => s.y);
    const pad = padIn || (mob() ? 150 : 110); const panelW = mob() ? 0 : Math.min(480, innerWidth * 0.4) + 32; const panelH = mob() ? innerHeight * 0.55 : 0;
    const top = mob() ? document.querySelector('.dock').getBoundingClientRect().bottom : 0;
    const vw = W - panelW, vh = H - panelH - top;
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad + 30;
    // nhãn có cỡ cố định trên màn hình, chừa lề màn hình cho chúng ngoài lề theo tọa độ sao
    const mx = mob() ? 40 : 160, my = 60;
    const k = Math.max(0.05, Math.min(3.2, (vw - mx * 2) / (x1 - x0), (vh - my * 2) / (y1 - y0)));
    const tr = d3.zoomIdentity.translate(vw / 2, top + vh / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    sky.transition().duration(reduce ? 0 : dur).ease(d3.easeCubicInOut).call(zoom.transform, tr);
  }
  const visibleStars = () => S.filter(shown);

  // một cú bấm: chọn, mở chòm con, đọc. Nháy đúp: thu chòm đó lại
  // bấm sao: chọn và đọc, mở đường tới sao đó nếu đang ẩn, không mở nhánh con của nó
  function choose(i, move = true) {
    const s = S[i];
    let k = s.p; while (k >= 0) { open.add(k); k = S[k].p; }
    sel = i; render();
    if (!move) return;
    if (s.lv === 0) fly(visibleStars());
    else if (open.has(i) && s.kids.length) fly([s, ...s.kids.map((c) => S[c])]);
    else if (s.lv === 1) fly([s], 850, 650);
    else fly([s, S[s.p]]);
  }
  // nút › ‹ cạnh sao: mở hoặc thu nhánh con, các nhánh khác giữ nguyên
  function toggle(i) {
    const s = S[i];
    if (open.has(i)) { collapse(i); return; }
    open.add(i);
    fly([s, ...s.kids.map((c) => S[c])]);
  }
  function collapse(i) {
    const s = S[i]; if (!s.kids.length) return;
    const shut = (k) => { open.delete(k); S[k].kids.forEach(shut); };
    if (i === 0) { open.clear(); open.add(0); } else shut(i);
    if (sel != null && !shown(S[sel])) { sel = i; }
    if (sel != null) render();
  }

  function render() {
    const s = S[sel]; const p = $('panel'); p.classList.remove('off');
    const chain = []; let k = s.i; while (k >= 0) { chain.unshift(S[k]); k = S[k].p; }
    const c = tint(s);
    $('ph').innerHTML = `<nav class="crumb" aria-label="Nhánh">${chain.slice(0, -1).map((n) => `<button type="button" data-go="${n.i}">${esc(plain(n))}</button><span>›</span>`).join('')}</nav>
      <div class="ttl"><span class="orb" style="box-shadow:0 0 10px 3px ${c}, 0 0 20px 6px ${c}55"></span><div><h2>${esc(plain(s))}</h2>${s.full ? `<p class="full">${esc(s.full.replace(/^GDD hệ thống:\s*/, ''))}</p>` : ''}</div></div>
      <div class="meta">${s.lv > 1 ? `<span>${esc(sysOf(s).t)}</span>` : ''}${s.kids.length ? `<span>${s.kids.length} nhánh${open.has(s.i) ? ' đang mở' : ''}</span>` : ''}${s.link.length ? `<span>${s.link.length} liên hệ</span>` : ''}${s.f ? `<span>${esc(s.f.replace('he-thong/', ''))}</span>` : ''}</div>`;
    const list = (ids, label) => ids.length ? `<div class="sec"><h3>${label}</h3><ul class="kids">${ids.map((j) => { const n = S[j]; const d = 3 + 8 * n.imp; return `<li><button type="button" data-go="${j}"><span class="dot"><i style="width:${d}px;height:${d}px;box-shadow:0 0 ${3 + 7 * n.imp}px 1px ${tint(n)};opacity:${0.5 + 0.5 * n.lum}"></i></span>${esc(plain(n))}${n.kids.length ? `<em>${n.kids.length} nhánh</em>` : ''}</button></li>`; }).join('')}</ul></div>` : '';
    const body = s.body.trim(); let html = '';
    if (body) {
      const long = body.length > 9000; const part = long ? body.slice(0, body.lastIndexOf('\n', 9000)) : body;
      html = `<div class="sec"><h3>${s.lv <= 1 ? 'Tóm tắt' : 'Nội dung'}</h3><div class="md" id="md">${md(part)}</div>${long ? '<button class="more" type="button" id="more">Đọc hết mục này</button>' : ''}</div>`;
    } else if (s.lv >= 2) html = '<p class="note">Mục này gom các nhánh con bên dưới.</p>';
    const cross = s.link.slice().sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    $('pb').innerHTML = (s.lv <= 1 ? list(s.kids, s.lv === 0 ? 'Các hệ thống' : 'Các nhánh') + html : html + list(s.kids, 'Đọc sâu hơn')) + list(cross, 'Liên hệ với phần khác');
    $('pb').scrollTop = 0;
    const more = $('more'); if (more) more.onclick = () => { $('md').innerHTML = md(body); more.remove(); };
  }
  function md(t) {
    return marked.parse(t, { gfm: true }).replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, '</table></div>').replace(/<h[1-6]/g, '<h4').replace(/<\/h[1-6]>/g, '</h4>');
  }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) { choose(+b.dataset.go); $('res').hidden = true; } });
  $('close').onclick = () => $('panel').classList.add('off');
  $('fit').onclick = () => fly(visibleStars());
  $('fold').onclick = () => { collapse(0); sel = 0; render(); fly(visibleStars()); };
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.activeElement !== $('q') && sel != null && S[sel].p >= 0) choose(S[sel].p); });

  // chuột: dò sao đang hiện gần nhất, đo trên màn hình
  const HIT = [28, 22, 12, 8];
  function pick(ev) {
    const [mx, my] = d3.pointer(ev, cv); const wx = (mx - T.x) / T.k, wy = (my - T.y) / T.k;
    let best = null, bs = Infinity;
    for (const s of S) {
      if (s.v < 0.6) continue;
      const d = Math.hypot(s.x - wx, s.y - wy) * T.k; const lim = Math.max(s.r * T.k * 1.8, HIT[s.lv]);
      if (d < lim && d / lim < bs) { bs = d / lim; best = s; }
    }
    return best;
  }
  const tip = $('tip');
  function pickBadge(ev) {
    const [mx, my] = d3.pointer(ev, cv);
    let best = null, bd = 13;
    for (const b of badges) { const d = Math.hypot(b.x - mx, b.y - my); if (d < bd) { bd = d; best = b.i; } }
    return best;
  }
  const place = (ev) => { tip.style.left = Math.min(ev.clientX + 14, innerWidth - 330) + 'px'; tip.style.top = ev.clientY + 14 + 'px'; };
  cv.addEventListener('pointermove', (ev) => {
    const b = pickBadge(ev); badgeHov = b;
    if (b != null) {
      hov = null; cv.classList.add('hover'); tip.hidden = false;
      tip.innerHTML = open.has(b) ? `Thu nhánh của ${esc(plain(S[b]))}` : `Mở ${S[b].kids.length} nhánh của ${esc(plain(S[b]))}`; place(ev); return;
    }
    const s = pick(ev); hov = s ? s.i : null; cv.classList.toggle('hover', !!s);
    if (s) { tip.hidden = false; tip.innerHTML = `${esc(plain(s))}<small>${s.lv >= 1 ? esc(sysOf(s).t) : 'lõi'} · bấm để đọc</small>`; place(ev); }
    else tip.hidden = true;
  });
  cv.addEventListener('pointerleave', () => { hov = null; badgeHov = null; tip.hidden = true; });
  let downAt = null;
  cv.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
  cv.addEventListener('pointerup', (ev) => {
    if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
    const b = pickBadge(ev); if (b != null) { toggle(b); return; }
    const s = pick(ev); if (s) choose(s.i);
  });

  // tìm kiếm
  $('q').addEventListener('input', (e) => {
    const q = fold(e.target.value.trim()); const ul = $('res');
    if (q.length < 2) { ul.hidden = true; return; }
    const hits = S.map((s) => [s, (fold(s.t).includes(q) ? 3 : 0) + (fb[s.i].includes(q) ? 1 : 0) + s.imp]).filter((x) => x[1] >= 1).sort((a, b) => b[1] - a[1]).slice(0, 14);
    ul.innerHTML = hits.length ? hits.map(([s]) => `<li><button type="button" data-go="${s.i}"><i style="background:${tint(s)};box-shadow:0 0 6px ${tint(s)}"></i>${esc(plain(s))}<small>${s.lv >= 1 ? esc(sysOf(s).t) : ''}</small></button></li>`).join('') : '<li class="note" style="padding:8px">Không có mục nào khớp.</li>';
    ul.hidden = false;
  });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.target.value = ''; $('res').hidden = true; e.target.blur(); } if (e.key === 'Enter') { const b = $('res').querySelector('button'); if (b) b.click(); } });

  // mở đầu: lõi và 11 hệ thống, màn rộng mở sẵn bảng đọc ở lõi
  sel = 0; if (!mob()) render();
  const st = visibleStars(); const xs = st.map((s) => s.x), ys = st.map((s) => s.y);
  const panelW = mob() ? 0 : Math.min(480, innerWidth * 0.4) + 32;
  const top0 = mob() ? document.querySelector('.dock').getBoundingClientRect().bottom : 0;
  const leftPad = mob() ? 0 : 110;
  // mở đầu đủ gần để đọc tên 11 hệ thống, màn nhỏ thì kéo để xem phần còn lại
  const k0 = Math.max(0.13, Math.min((W - panelW - leftPad) / (Math.max(...xs) - Math.min(...xs) + (mob() ? 1500 : 800)), (H - top0) / (Math.max(...ys) - Math.min(...ys) + 600)));
  sky.call(zoom.transform, d3.zoomIdentity.translate(leftPad + (W - panelW - leftPad) / 2, top0 + (H - top0) / 2 + (mob() ? 0 : 20)).scale(k0));
  requestAnimationFrame(draw);
})();
</script>
