<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Novent Wiki</title>
<!-- File sinh từ khuon.html bằng tools/xuat-wiki.mjs. Sửa GDD hoặc khuon.html, không sửa index.html. -->
<!-- Rà giao diện theo unslop của Damir Sokolovsky: https://github.com/heydamir/unslop -->
<script>
  (() => {
    let theme = null;
    try { theme = localStorage.getItem('novent-wiki-theme'); } catch {}
    const root = document.documentElement;
    root.dataset.theme = theme || root.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.43" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style>
[data-theme="dark"] #wiki {
  color-scheme: dark;
  --nen: #171716;
  --mat: #201f1e;
  --nang: #2a2927;
  --vien: #363431;
  --chu: #f1ede7;
  --phu: #c3bcb2;
  --mo: #a49d92;
  --ember: #f26b1d;
  --lien: #f5a67c;
}
[data-theme="light"] #wiki {
  color-scheme: light;
  --nen: #f2f0eb;
  --mat: #fcfbf8;
  --nang: #eeebe5;
  --vien: #ded9d0;
  --chu: #25221e;
  --phu: #514a41;
  --mo: #6c6358;
  --ember: #a44116;
  --lien: #963910;
}

#wiki {
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  margin: 0;
  min-height: 100vh;
  background: var(--nen);
  color: var(--chu);
  font: 400 15px/1.6 "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
}
#wiki :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
#wiki button:not(:disabled), #wiki summary { cursor: pointer; }
#wiki .khung { width: min(100%, 1440px); margin-inline: auto; }
#wiki .tien-ich { position: sticky; top: 0; z-index: 10; background: var(--mat); border-bottom: 1px solid var(--vien); }
#wiki .thanh-dau { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; padding-inline: 32px; }
#wiki .ten-wiki, #wiki .actions { display: flex; align-items: center; gap: 8px; }
#wiki .ten-wiki { width: fit-content; white-space: nowrap; font-size: 18px; font-weight: 600; }
#wiki .ten-wiki span { color: var(--mo); font-size: 12px; font-weight: 400; }
#wiki .actions { justify-self: end; min-width: 0; }
#wiki .bieu-tuong { flex: none; width: 16px; height: 16px; color: var(--phu); }
#wiki #loai { display: flex; gap: 20px; }
#wiki #loai a {
  display: flex; align-items: center; gap: 8px; min-height: 64px;
  position: relative; color: var(--phu); font-size: 14px; white-space: nowrap;
}
#wiki #loai a:hover, #wiki #loai a[aria-current] { color: var(--chu); }
#wiki #loai a[aria-current]::after {
  content: ""; position: absolute; inset: auto 0 -1px; height: 2px; background: var(--ember);
}
#wiki .so, #wiki .ma {
  color: var(--mo); font: 400 12px/1.4 var(--mono); font-variant-numeric: tabular-nums;
}
#wiki .tim {
  display: flex; align-items: center; gap: 8px; width: min(24vw, 288px); min-height: 40px;
  padding-inline: 12px; border: 1px solid var(--vien); border-radius: 8px; background: var(--nen);
}
#wiki .tim input { flex: 1; min-width: 0; width: 100%; border: 0; padding: 0; background: transparent; font-size: 14px; outline: none; }
#wiki .tim input::placeholder { color: var(--mo); }
#wiki .tim:focus-within { border-color: var(--ember); outline: 1px solid var(--ember); }
#wiki .phim {
  color: var(--mo); background: var(--mat); border: 1px solid var(--vien);
  border-radius: 4px; padding-inline: 4px; font: 400 12px/18px var(--mono);
}
#wiki .nut {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding-inline: 12px; border: 1px solid var(--vien);
  border-radius: 8px; background: var(--mat); font-size: 14px;
}
#wiki .nut:hover { background: var(--nang); }
#wiki .nut-icon { width: 40px; padding: 0; }
[data-theme="dark"] #wiki .trang, [data-theme="light"] #wiki .mat-troi { display: none; }

#wiki .bo-cuc {
  display: grid; grid-template-columns: 280px minmax(0, 1fr);
  align-items: start; gap: 24px; padding: 24px 32px 48px;
}
#wiki #ben, #wiki .ho-so { border: 1px solid var(--vien); border-radius: 12px; background: var(--mat); }
#wiki #ben { position: sticky; top: 88px; min-width: 0; overflow: clip; }
#wiki .loc {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px; border-bottom: 1px solid var(--vien);
}
#wiki .loc-nhom { display: flex; gap: 4px; }
#wiki .loc button {
  min-height: 32px; padding-inline: 8px; color: var(--phu); border-radius: 6px; font-size: 12px; white-space: nowrap;
}
#wiki .loc button[aria-pressed="true"] { background: var(--nang); box-shadow: inset 0 0 0 1px var(--vien); color: var(--chu); }
#wiki .loc button:hover { color: var(--chu); }
#wiki #ds { max-height: calc(100dvh - 172px); overflow-y: auto; overscroll-behavior: contain; padding: 8px; }
#wiki .nhom { padding-block: 4px; }
#wiki .nhom + .nhom { border-top: 1px solid var(--vien); }
#wiki .nhom summary {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  min-height: 36px; padding: 4px 8px; border-radius: 6px; color: var(--phu); font-size: 13px;
  list-style: none;
}
#wiki .nhom summary::-webkit-details-marker { display: none; }
#wiki .nhom summary::before {
  content: ""; width: 6px; height: 6px; margin-inline: 2px; border: solid currentColor;
  border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg);
}
#wiki .nhom[open] summary::before { transform: rotate(45deg); }
#wiki .nhom summary:hover, #wiki .dong:hover { background: var(--nang); }
#wiki .dong {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center;
  gap: 8px; padding: 4px 8px; min-height: 48px; border-radius: 6px; font-size: 13px;
}
#wiki .dong[aria-current] { background: var(--nang); box-shadow: inset 2px 0 var(--ember); }
#wiki .ten-muc { line-height: 1.4; overflow-wrap: anywhere; }
#wiki .ten-muc .ma { display: block; margin-top: 2px; }
#wiki .nhan { color: var(--mo); font-size: 12px; white-space: nowrap; }
#wiki .anh-nho {
  display: grid; place-items: center; width: 32px; height: 32px; border-radius: 5px;
  background-color: var(--nang); color: var(--phu); font: 500 12px/1 var(--mono);
  background-repeat: no-repeat; background-position: 7% 80%; background-size: 520%;
}
#wiki .khong-khop { padding: 16px 8px; color: var(--phu); font-size: 14px; }

#wiki .ho-so { overflow: clip; }
#wiki .dau-ho-so { display: grid; border-bottom: 1px solid var(--vien); padding: 32px; }
#wiki .dau-ho-so.co-anh { grid-template-columns: minmax(0, 1fr) minmax(208px, 36%); align-items: center; gap: 32px; border: 0; }
#wiki .dau-chu { min-width: 0; }
#wiki .duong-dan { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--phu); font-size: 13px; }
#wiki .duong-dan a:hover { text-decoration: underline; }
#wiki .duong-dan li + li::before { content: "/"; margin-inline-end: 8px; color: var(--mo); }
#wiki .tieu-de { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-top: 8px; }
#wiki h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); line-height: 1.16; font-weight: 500; letter-spacing: -.025em; overflow-wrap: anywhere; }
#wiki .ten-phu { color: var(--phu); margin-top: 8px; }
#wiki .dau-chu .phan { padding-top: 16px; }
#wiki .concept { width: 100%; border-radius: 8px; overflow: hidden; background: var(--nang); text-align: start; }
#wiki .concept img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
#wiki .concept span {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; color: var(--phu); font-size: 13px;
}
#wiki .concept:hover span { color: var(--chu); }
#wiki .than-ho-so { padding: 0 32px 24px; }
#wiki .phan { padding-top: 16px; }
#wiki h2 { margin-bottom: 8px; font-size: 20px; line-height: 1.4; font-weight: 500; }
#wiki .truong {
  display: grid; grid-template-columns: minmax(128px, 23%) minmax(0, 1fr); gap: 4px 24px;
  padding: 12px 0; border-top: 1px solid var(--vien);
}
#wiki .truong dt { color: var(--phu); font-size: 13px; padding-top: 2px; }
#wiki .truong dd { max-width: 76ch; overflow-wrap: anywhere; }
#wiki .lien { color: var(--lien); text-decoration: underline; text-underline-offset: 3px; }
#wiki code { font: .85em var(--mono); padding: 2px 4px; border-radius: 4px; background: var(--nang); }
#wiki .ke-ho-so {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
  margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--vien);
}
#wiki .ke-ho-so .nut { width: fit-content; max-width: 100%; }
#wiki .ke-ho-so .nut span { overflow-wrap: anywhere; }
#wiki .ke-ho-so .sau { grid-column: 2; justify-self: end; text-align: end; }

#wiki #nut-lui { display: none; }
#wiki #phong { color: var(--chu); }
#wiki #phong::backdrop { background: rgb(0 0 0 / .72); }
#wiki .anh-lon { width: max-content; max-width: min(92vw, 960px); padding: 8px; background: var(--mat); }
#wiki .anh-lon img { display: block; max-height: calc(100dvh - 104px); width: auto; margin-inline: auto; object-fit: contain; border-radius: 4px; }
#wiki .dong-anh { display: flex; justify-content: end; margin-top: 8px; }

@media (max-width: 959px) {
  #wiki .thanh-dau { column-gap: 16px; padding-inline: 24px; }
  #wiki .bo-cuc { display: block; padding: 16px 24px 32px; }
  #wiki #ben { position: static; }
  #wiki #ds { max-height: none; }
  #wiki.chi-tiet #ben, #wiki:not(.chi-tiet) #xem { display: none; }
  #wiki #nut-lui { display: inline-flex; margin-bottom: 12px; }
  #wiki .nut, #wiki .tim, #wiki .loc button { min-height: 44px; }
  #wiki .nut-icon { width: 44px; }
  #wiki .nhom summary { min-height: 44px; }
}
@media (max-width: 679px) {
  #wiki .thanh-dau { grid-template-columns: auto 1fr; gap: 4px 12px; padding: 8px 16px 0; }
  #wiki .ten-wiki { font-size: 16px; gap: 4px; }
  #wiki .actions { width: min(100%, 296px); }
  #wiki .tim { width: auto; flex: 1; }
  #wiki .phim { display: none; }
  #wiki #loai { grid-row: 2; grid-column: 1 / -1; gap: 16px; justify-content: space-between; }
  #wiki #loai a { min-height: 44px; gap: 4px; font-size: 13px; }
  #wiki .bo-cuc { padding-inline: 12px; }
  #wiki .dau-ho-so, #wiki .dau-ho-so.co-anh { display: block; padding: 20px; }
  #wiki .concept { margin-top: 20px; }
  #wiki .than-ho-so { padding: 0 20px 20px; }
  #wiki .truong { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  #wiki .nut, #wiki .dong, #wiki .nhom summary { transition: background-color 140ms ease-out; }
}
</style>
</head>
<body id="wiki">

<header class="tien-ich">
  <div class="khung thanh-dau">
    <a href="#" aria-label="Trang đầu wiki The Novent" class="ten-wiki">The Novent <span>Wiki</span></a>
    <nav id="loai" aria-label="Loại thông tin"></nav>
    <div class="actions">
      <label class="tim">
        <svg class="bieu-tuong" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/></svg>

        <svg class="bieu-tuong trang" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>

</header>

<main class="khung bo-cuc">

      </div>
      <span id="dem" class="so" role="status"></span>
    </div>
    <div id="ds"></div>
  </aside>
  <section id="xem" class="min-w-0" aria-label="Hồ sơ"></section>
</main>

<dialog id="phong" class="modal" aria-label="Ảnh concept">
  <figure class="modal-box anh-lon">
    <div id="khung-anh"></div>
    <form method="dialog" class="dong-anh"><button type="submit" class="nut">Đóng</button></form>
  </figure>
  <form method="dialog" class="modal-backdrop"><button aria-label="Đóng ảnh concept" tabindex="-1"></button></form>
</dialog>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const chuan = (s) => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replaceAll('đ', 'd');

// Bảng mã dùng chung cho link giữa các loại hồ sơ.
const MUC = [];
for (const l of DATA.loai) for (const g of l.nhom) for (const m of g.muc) {
  m.loai = l; m.nhom = g;
  m.tim = chuan([m.ma, m.ten, m.tenPhu, g.ten, ...m.phan.flatMap((p) => p.truong.map(([, v]) => v))].join(' '));
  MUC.push(m);
}
const THEO_MA = new Map(MUC.map((m) => [m.ma, m]));
const RE_MA = new RegExp(`\\b(${[...THEO_MA.keys()].sort((a, b) => b.length - a.length).join('|')})\\b`, 'g');

// Mã mục thành link và giữ định dạng Markdown ngắn.
const md = (s, bo = '') => esc(s)
  .replace(RE_MA, (ma) => ma === bo ? ma : `<a class="lien" href="#${THEO_MA.get(ma).loai.id}--${ma}" title="${esc(THEO_MA.get(ma).ten)}">${ma}</a>`)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const laMvp = (n) => /^MVP/.test(n);
const chuCai = (t) => t.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const bieuTuong = (d) => `<svg class="bieu-tuong" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON = {
  lui: bieuTuong('m15 18-6-6 6-6'),
  toi: bieuTuong('m9 18 6-6-6-6'),
  phong: bieuTuong('M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7'),
};
const anhNho = (m) => m.anh
  ? `<span class="anh-nho" style="background-image:url('${esc(m.anh)}')" aria-hidden="true"></span>`
  : `<span class="anh-nho" aria-hidden="true">${esc(chuCai(m.ten))}</span>`;

const mobile = matchMedia('(max-width: 959px)');
let loc = '', tu = '';

function duongDan() {
  // Artifact giữ hash dạng chữ, số và gạch nối.
  let hash = location.hash.slice(1);
  try { hash = decodeURIComponent(hash); } catch {}
  const [id, ma] = hash.split('--');
  const loai = DATA.loai.find((l) => l.id === id) || DATA.loai[0];
  const muc = THEO_MA.get(ma);
  return { loai, muc: muc?.loai === loai ? muc : null };
}

$('#loai').innerHTML = DATA.loai.map((l) =>
  `<a href="#${l.id}" data-loai="${l.id}">${esc(l.ten)}</a>`).join('');

function veDanhSach() {
  const { loai, muc: dangXem } = duongDan();
  const macDinh = mobile.matches ? null : loai.nhom[0].muc[0];
  const dangChon = dangXem || macDinh;
  const nhieu = loai.nhom.length > 6;
  let tong = 0;
  const html = loai.nhom.map((g) => {
    const muc = g.muc.filter((m) => (!loc || (loc === 'mvp') === laMvp(m.nhan)) && m.tim.includes(tu));
    tong += muc.length;
    if (!muc.length) return '';
    const mo = !nhieu || tu || muc.includes(dangChon);
    return `<details class="nhom" ${mo ? 'open' : ''}>
      <summary><span>${esc(g.ten)}</span><span class="so">${muc.length}</span></summary>
      <ul>${muc.map((m) => `<li>
        <a class="dong" href="#${loai.id}--${m.ma}" ${m === dangChon ? 'aria-current="page"' : ''}>
          ${anhNho(m)}
          <span class="ten-muc">${esc(m.ten)}<span class="ma">${esc(m.ma)}</span></span>
        </a></li>`).join('')}</ul></details>`;
  }).join('');
  $('#ds').innerHTML = html || '<p class="khong-khop">Không có mục nào khớp</p>';
  $('#dem').textContent = `${tong} mục`;
}

function veHoSo(loai, daChon) {
  const m = daChon || (mobile.matches ? null : loai.nhom[0].muc[0]);
  $('#wiki').classList.toggle('chi-tiet', !!daChon);
  if (!m) { $('#xem').innerHTML = ''; document.title = 'The Novent Wiki'; return; }
  const cung = m.nhom.muc, i = cung.indexOf(m);
  const ke = (x, huong) => x ? `<a href="#${loai.id}--${x.ma}" class="nut ${huong === 'toi' ? 'sau' : ''}">
    ${huong === 'lui' ? ICON.lui : ''}<span>${esc(x.ten)}</span>${huong === 'toi' ? ICON.toi : ''}</a>` : '';
  const noiDung = m.phan.map((p) => `<div class="phan">
    ${m.phan.length > 1 ? `<h2>${esc(p.ten)}</h2>` : ''}
    <dl>${p.truong.map(([k, v]) => `<div class="truong"><dt>${esc(k)}</dt><dd>${md(v, m.ma)}</dd></div>`).join('')}</dl>
  </div>`).join('');
  document.title = `${m.ten} - The Novent Wiki`;
  $('#xem').innerHTML = `
    <a id="nut-lui" class="nut" href="#${loai.id}">${ICON.lui} Danh sách</a>
    <article class="ho-so" aria-labelledby="ten-ho-so">
      <header class="dau-ho-so ${m.anh ? 'co-anh' : ''}">
        <div class="dau-chu">
          <ol class="duong-dan" aria-label="Vị trí trong danh mục">
            <li><a href="#${loai.id}">${esc(loai.ten)}</a></li><li>${esc(m.nhom.ten)}</li><li class="ma">${esc(m.ma)}</li>
          </ol>
          <div class="tieu-de"><h1 id="ten-ho-so" tabindex="-1">${esc(m.ten)}</h1>${m.nhan ? `<span class="nhan">${esc(m.nhan)}</span>` : ''}</div>
          ${m.tenPhu ? `<p class="ten-phu">${md(m.tenPhu)}</p>` : ''}
          ${m.anh ? noiDung : ''}
        </div>
        ${m.anh ? `<button id="anh-concept" class="concept" type="button" aria-haspopup="dialog">
          <img src="${esc(m.anh)}" alt="Concept ${esc(m.ten)}">
          <span>Phóng to concept ${ICON.phong}</span>
        </button>` : ''}
      </header>
      ${!m.anh || cung.length > 1 ? `<div class="than-ho-so">
        ${m.anh ? '' : noiDung}
        ${cung.length > 1 ? `<nav class="ke-ho-so" aria-label="Hồ sơ cùng nhóm">${ke(cung[i - 1], 'lui')}${ke(cung[i + 1], 'toi')}</nav>` : ''}
      </div>` : ''}
    </article>`;
  $('#anh-concept')?.addEventListener('click', () => {
    $('#khung-anh').innerHTML = `<img src="${esc(m.anh)}" alt="Concept ${esc(m.ten)}">`;
    $('#phong').showModal();
  });
}

function ve() {
  const { loai, muc } = duongDan();
  $('#loai [aria-current]')?.removeAttribute('aria-current');
  $(`#loai [data-loai="${loai.id}"]`).setAttribute('aria-current', 'true');
  veDanhSach();
  veHoSo(loai, muc);
}
addEventListener('hashchange', () => {
  ve();
  const { muc } = duongDan();
  const dich = muc ? $('#ten-ho-so') : $('#loai [aria-current]');
  dich?.focus({ preventScroll: true });
  $('.dong[aria-current]')?.scrollIntoView({ block: 'nearest' });
  scrollTo(0, 0);
});
mobile.addEventListener('change', ve);
$('#tim').addEventListener('input', (e) => { tu = chuan(e.target.value.trim()); veDanhSach(); });
addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !$('#phong').open && document.activeElement !== $('#tim')) {
    e.preventDefault(); $('#tim').focus();
  }
  if (e.key === 'Escape' && document.activeElement === $('#tim')) { $('#tim').value = ''; tu = ''; veDanhSach(); }
});
document.querySelectorAll('[data-loc]').forEach((b) => b.addEventListener('click', () => {
  loc = b.dataset.loc;
  document.querySelectorAll('[data-loc]').forEach((x) => x.setAttribute('aria-pressed', x === b));
  veDanhSach();
}));
$('#doi-theme').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('novent-wiki-theme', t); } catch {}
});
ve();
$('.dong[aria-current]')?.scrollIntoView({ block: 'nearest' });
</script>
</body>
</html>
