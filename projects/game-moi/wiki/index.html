<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Novent Wiki</title>
<!-- File sinh từ khuon.html bằng tools/xuat-wiki.mjs. Sửa GDD hoặc khuon.html, không sửa index.html. -->
<style>
:root {
  --nen: #f4f1ea; --mat: #fffdf8; --mat-2: #efebe2; --vien: #ddd6c8; --chu: #1b1530; --chu-2: #5c5670; --chu-3: #8a8499;
  --nhan: #f26b1d; --nhan-chu: #fff; --mvp: #1f7a4d; --mvp-nen: #dcf1e5; --sau: #6b6580; --sau-nen: #e9e6f0;
  --bong: 0 1px 2px rgb(27 21 48 / .06), 0 4px 16px rgb(27 21 48 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nen: #0f0d17; --mat: #181524; --mat-2: #211d31; --vien: #2e2943; --chu: #ece8f6; --chu-2: #aba4c0; --chu-3: #7c7594;
    --mvp: #6fd6a0; --mvp-nen: #173527; --sau: #b3adc6; --sau-nen: #26223a; --bong: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  }
}
:root[data-theme="dark"] {
  --nen: #0f0d17; --mat: #181524; --mat-2: #211d31; --vien: #2e2943; --chu: #ece8f6; --chu-2: #aba4c0; --chu-3: #7c7594;
  --mvp: #6fd6a0; --mvp-nen: #173527; --sau: #b3adc6; --sau-nen: #26223a; --bong: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--nen); color: var(--chu); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif; }
button, input { font: inherit; color: inherit; }
code { font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--mat-2); padding: 1px 5px; border-radius: 4px; }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--nen) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--vien); }
.dau { max-width: 1280px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo { font-weight: 700; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; margin-right: 8px; }
.logo i { width: 12px; height: 12px; border-radius: 3px; background: var(--nhan); transform: rotate(45deg); }
.logo small { color: var(--chu-3); font-weight: 500; }
nav.loai { display: flex; gap: 4px; }
nav.loai a { text-decoration: none; color: var(--chu-2); padding: 6px 12px; border-radius: 8px; font-weight: 600; }
nav.loai a[aria-current="page"] { background: var(--chu); color: var(--nen); }
.tim { margin-left: auto; position: relative; flex: 0 1 280px; }
.tim input { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--vien); background: var(--mat); outline: none; }
.tim input:focus-visible { border-color: var(--chu-2); }

main { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
aside { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; padding-right: 4px; }
.loc { display: flex; gap: 6px; margin-bottom: 14px; }
.loc button { border: 1px solid var(--vien); background: var(--mat); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--chu-2); }
.loc button[aria-pressed="true"] { background: var(--chu); color: var(--nen); border-color: var(--chu); }
.nhom-ds { margin-bottom: 18px; }
.nhom-ds > summary { list-style: none; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--chu-3); margin: 0 0 6px; padding: 2px 8px; font-weight: 700; display: flex; gap: 6px; }
.nhom-ds > summary::-webkit-details-marker { display: none; }
.nhom-ds > summary::before { content: "▸"; transition: transform .12s; }
.nhom-ds[open] > summary::before { transform: rotate(90deg); }
.nhom-ds > summary span { font-weight: 500; margin-left: auto; }
.dong { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; text-decoration: none; color: var(--chu); }
.dong:hover { background: var(--mat-2); }
.dong[aria-current="true"] { background: var(--mat); box-shadow: var(--bong); }
.cham { width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 1px rgb(0 0 0 / .35); background: var(--c, var(--chu-3)); overflow: hidden; }
/* shortcut: khung mặt cắt theo bố cục tấm concept GPT (bust đầu tiên ở góc trái dưới), đổi khi artist có avatar riêng */
.cham.co-anh { background: var(--mat-2) no-repeat 7% 80% / 520%; }
.dong b { font-weight: 600; display: block; line-height: 1.25; }
.dong small { color: var(--chu-3); font-size: 12px; }
.dong .the { margin-left: auto; }
.rong { color: var(--chu-3); padding: 8px; }

.the { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.the.mvp { color: var(--mvp); background: var(--mvp-nen); }
.the.sau { color: var(--sau); background: var(--sau-nen); }

.lui { display: none; border: 0; background: none; color: var(--chu-2); padding: 0; margin-bottom: 12px; cursor: pointer; font-weight: 600; }
.ho-so { background: var(--mat); border: 1px solid var(--vien); border-radius: 16px; box-shadow: var(--bong); overflow: hidden; }
.dau-hs { display: grid; grid-template-columns: minmax(220px, 380px) 1fr; border-bottom: 1px solid var(--vien); }
.anh { background: var(--mat-2); position: relative; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
.anh::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); }
.anh button { all: unset; cursor: zoom-in; position: relative; width: 100%; height: 100%; }
.anh button:focus-visible { outline: 2px solid var(--c); outline-offset: -4px; }
.anh img { width: 100%; height: 100%; object-fit: contain; display: block; }
.chu-cai { position: relative; font-size: 72px; font-weight: 800; color: var(--c); opacity: .9; }
.chua-anh { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: var(--chu-3); font-size: 12px; }
/* Mục chưa có ảnh: ô chữ cái nhỏ, không chiếm nửa thẻ */
.dau-hs.khong-anh { grid-template-columns: 1fr; }
.dau-hs.khong-anh .anh { display: none; }
.dau-hs.khong-anh .tom { flex-direction: row; flex-wrap: wrap; align-items: flex-start; column-gap: 20px; }
.o-chu { width: 88px; height: 88px; border-radius: 20px; flex: none; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: var(--c);
  background: color-mix(in srgb, var(--c) 16%, var(--mat-2)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.dau-hs:not(.khong-anh) .o-chu { display: none; }
.cot-tom { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
a.lien { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--chu-2) 45%, transparent); text-underline-offset: 2px; }
a.lien:hover { text-decoration-color: currentColor; }
.cuon { overflow-x: auto; border: 1px solid var(--vien); border-radius: 10px; }
table.bang-con { border-collapse: collapse; width: 100%; font-size: 13px; }
.bang-con th, .bang-con td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--vien); }
.bang-con th { background: var(--mat-2); color: var(--chu-2); font-weight: 600; white-space: nowrap; }
.bang-con tr:last-child td { border-bottom: 0; }
.tom { padding: 24px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ma { color: var(--chu-3); font: 600 13px ui-monospace, Consolas, monospace; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tom h1 { margin: 0; font-size: 34px; line-height: 1.1; letter-spacing: -.01em; }
.phu { color: var(--chu-2); margin-top: -6px; }
.mau { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--chu-2); }
.mau i { width: 18px; height: 18px; border-radius: 5px; background: var(--c); border: 1px solid rgb(0 0 0 / .1); }
.nhanh { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 4px; }
.nhanh div { background: var(--mat-2); border-radius: 10px; padding: 8px 12px; }
.nhanh dt { font-size: 11px; color: var(--chu-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.nhanh dd { margin: 2px 0 0; font-weight: 600; }

.than { padding: 8px 28px 24px; }
.than h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--chu-3); margin: 20px 0 6px; }
dl.truong { margin: 0; display: grid; grid-template-columns: 210px 1fr; }
dl.truong dt, dl.truong dd { padding: 10px 0; border-top: 1px solid var(--vien); margin: 0; }
dl.truong dt { color: var(--chu-2); font-size: 13px; padding-right: 16px; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; }
.chip i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); border: 1px solid rgb(0 0 0 / .15); display: inline-block; }
details.ghi-chu { margin-top: 18px; border: 1px solid var(--vien); border-radius: 12px; padding: 0 16px; }
.ghi-chu summary { cursor: pointer; padding: 12px 0; font-weight: 600; color: var(--chu-2); }
.ghi-chu p { margin: 0 0 12px; color: var(--chu-2); }
.nguon { margin-top: 18px; font-size: 12px; color: var(--chu-3); }

dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
dialog::backdrop { background: rgb(10 8 20 / .8); }
dialog img { display: block; max-width: 96vw; max-height: 92vh; border-radius: 12px; }
dialog button { position: fixed; top: 16px; right: 16px; border: 0; border-radius: 999px; padding: 8px 14px; background: #fff; color: #111; cursor: pointer; font-weight: 700; }

@media (max-width: 860px) {
  .dau { padding: 10px 16px; }
  .tim { flex: 1 1 100%; order: 3; }
  main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  aside { position: static; max-height: none; }
  body.chi-tiet aside { display: none; }
  body:not(.chi-tiet) section#xem { display: none; }
  .lui { display: inline-block; }
  .dau-hs { grid-template-columns: 1fr; }
  .tom, .than { padding-left: 18px; padding-right: 18px; }
  .tom h1 { font-size: 28px; }
  dl.truong { grid-template-columns: 1fr; }
  dl.truong dd { border-top: 0; padding-top: 0; }
}
@media (prefers-reduced-motion: no-preference) { .dong { transition: background .12s; } }
</style>
</head>
<body>
<header><div class="dau">
  <div class="logo"><i></i>The Novent <small>Wiki</small></div>
  <nav class="loai" id="loai" aria-label="Loại thông tin"></nav>
  <label class="tim"><input id="tim" type="search" placeholder="Tìm tên, mã, nhóm, công dụng..." aria-label="Tìm"></label>
</div></header>
<main>
  <aside aria-label="Danh sách">
    <div class="loc" role="group" aria-label="Lọc theo phiên bản">
      <button data-loc="" aria-pressed="true">Tất cả</button><button data-loc="mvp" aria-pressed="false">MVP</button><button data-loc="sau" aria-pressed="false">Sau MVP</button>
    </div>
    <div id="ds"></div>
  </aside>
  <section id="xem" aria-live="polite"></section>
</main>
<dialog id="phong"><button type="button" onclick="this.closest('dialog').close()">Đóng</button></dialog>
<script>
const DATA = {"loai":[{"id":"nhan-vat","ten":"Nhân vật","nhanh":["Vai","Vai truyện","Chủng","Chiều cao","Chiều cao, tỉ lệ","Tên, quốc gia","Giới tính, tuổi","Chương"],"nhom":[{"ten":"Người chơi","ghiChu":["Vai: người sống sót của Ember, kíp vận hành trạm, không ai là chuyên gia (chuyên gia là những người vớt). Bộ đồ có màu và hình slot. Người tỉnh dậy ban đầu chọn một preset và đổi tên được, preset không ai chọn rơi vào buồng hỏng là người đã chết, tên trên buồng giữ tên mặc định. Nhân vật người chơi không có lời thoại riêng. Người vào sau theo luật 11 mục 2 (biến thể B, đặt tên mới, không lấp buồng tắt).","Nhân dạng để art dựng (khớp `cot-truyen.md` khối GD-079, GD-079 Lead chốt 2026-11-25: bốn PC ngang nhau về luật, không vai trò hay kỹ năng riêng, 2 nam 2 nữ, không ai da màu, PC-1 là nam chính người Việt Nam):","Cả bốn dùng chung rig, chung chỉ số, chung kỹ năng. Ngoại hình ở bảng trên chỉ là hình, không chi tiết nào gợi vai gameplay.","Trong trạm: nhân vật không mặc bộ đồ ngoài, mặc đồ trạm màu xám than với một mảng màu slot ở vai và ống tay để vẫn nhận ra slot. Mặt thấy rõ nên cần biểu cảm đầy đủ.","Biểu cảm cần có (8, mặt thấy trong trạm và qua tấm kính mũ ngoài không gian): bình thường, vui, lo, đau (trúng đòn), sợ và ngạt, mệt, quyết tâm, ngạc nhiên. Cảm xúc phụ cho emote: vẫy, ngón cái (hai emote MVP).","Yêu cầu art: rig chung, 4 skin. Mỗi người có hai bộ màu (bộ đồ ngoài và đồ trạm), mỗi bộ tối đa 6 màu chính cộng 2 nhấn. Biến thể bộ đồ: bình Oxy 5 bậc, vỏ 4 cấp, bộ đẩy 4 bậc, túi 5 bậc, đai dụng cụ 3 bậc, xem bảng 7."],"nguon":"ho-so-nhan-vat.md mục 2b.1","muc":[{"ma":"PC-1","ten":"Nguyễn Việt","tenPhu":"","nhan":"MVP","mau":"#F26B1D","anh":"../../../art/C/05-nhan-vat/demo-pc/pc1.webp","phan":[{"ten":"Nhân vật người chơi (PC-1 đến PC-4) và người vào sau","truong":[["Slot, màu nhận diện","Slot 1 ○, cam Ember `#F26B1D`"],["Tên mặc định","Nguyễn Việt"],["Vai truyện","Kíp vận hành trạm"],["Chiều cao","1,0 u"],["Silhouette (khi tô đen)","Mũ tròn có ăng-ten chữ den"],["Vai","Độc tài cầm quyền Sennar, đứng đầu The Wardens, boss BS-5 (chương 3 đến 5, qua lời Maro và tín hiệu, tới Warden Rig ở chương 5). Ghét loài người vì cha là sĩ quan chết trong cuộc chiến vũ trụ đầu tiên giữa các hành tinh (tên cuộc chiến ở `cot-truyen.md` mục Tên mới), cái nhìn phiến diện của hắn"],["Chiều cao","2,0 u (cao hơn Ilsume nhờ giáp và bục), rất gầy"],["Silhouette","Cao, tay dài quá gối, vòng sáng tròn sau gáy (halo), mặt nạ nhẵn, vai giáp nhọn đối xứng"],["Ngoại hình","Áo giáp choàng trắng xương không một vết bẩn, đường lục acid chạy dọc áo, huy hiệu chế độ trên ngực, không thấy mắt. Sạch vì hắn tin mình đang dọn dẹp"],["Màu nhận diện","Trắng xương và lục acid"],["Biểu cảm cần có","Bình thản, khinh miệt nhẹ, cuồng tín (mặt nạ nứt khi mất bình tĩnh), thương hại giả, giận lạnh khi nhắc tên Sevra hay cha mình"],["Nhãn","Sau MVP"]]}],"bangCon":[]},{"ma":"WD-P2","ten":"Maro","tenPhu":"","nhan":"Sau MVP","mau":"#A3A8A0","anh":"","phan":[{"ten":"The Wardens: chế độ của Daskel (WD-P1, WD-P2, lính)","truong":[["Tên","Maro"],["Vai","Gián điệp của Daskel săn Sevra, chỉ huy toán bắt cóc. Người Sennari, giả thương nhân của một thương hội Sennari không có thật (tàu TA08), hai lần cập bến khi còn cải trang, lộ mặt ở N4 khi chỉ huy toán bắt cóc (C3.8)"],["Chiều cao","1,7 u khi cải trang (khom người), 2,0 u sau khi lộ"],["Silhouette","Cải trang: dáng thương nhân Sennari, áo choàng nghi lễ rút gọn, che đầu bằng khăn, sạch hơn hẳn thương nhân thật. Lộ mặt: dáng cao gầy cùng kiểu Daskel, ít chi tiết hơn, giáp chế độ"],["Ngoại hình","Khi cải trang: áo xám không vết, đường lục acid mờ 10 phần trăm ở gáy, chi tiết thưởng cho người tinh ý, không ai cần nó để hiểu truyện (P4). Lộ mặt: đường lục 100 phần trăm, bỏ khăn, huy hiệu The Wardens"],["Màu nhận diện","Xám nhạt `#A3A8A0`, lục acid mờ khi cải trang, lục acid sáng khi lộ"],["Biểu cảm cần có","Vồn vã, hào phóng, hỏi quá nhiều, khi lộ mặt thì phẳng lặng, soi mói"],["Nhãn","Sau MVP"]]}],"bangCon":[]}]},{"ten":"Người "","nhan":"MVP","mau":"","anh":"","phan":[{"ten":"Danh mục sơ bộ (cho vai khác đọc sớm)","truong":[["Tên","Scrapmaw"],["Dải","Map nhánh Station Cinder (Vành đai ngoài), khoang máy C6 sau cửa D1"],["Cỡ","Boss"],["Kiểu","Driftlife làm tổ quanh lõi năng lượng"],["Bắt sống","Hai cách kết: hạ hoặc xua đi"],["Nuôi","Không"],["Rơi khi hạ (nhóm)","Theo cách kết"],["Nhãn","MVP"]]},{"ten":"Điểm sinh và rơi (cho gd-world, gd-items)","truong":[["Chương","1"],["Nơi (gd-world, gd-story)","Station Cinder, khoang máy C6 sau cửa D1"],["Rơi khi hạ","SMP-191 Hạch thủ lĩnh Vành đai ngoài, cộng 5 SMP-101"],["Rơi khi xua đi","SMP-192 Mẫu boss Vành đai ngoài, cộng 2 SMP-101"]]},{"ten":"Combat trên mặt phẳng top-down 45 độ (MVP)","truong":[["Cần thêm ngoài quy ước tối thiểu","Không thêm hướng vẽ. Pha 1 một tư thế cuộn quanh lõi, không cần hướng. Pha 2 theo quy ước tối thiểu. Xúc tu Neo và Dây nối là sprite kéo giãn nằm trên mặt phẳng"],["Lý do","Pha 1 boss không di chuyển, hướng quét chỉ bằng vệt nón. Mặt bằng phòng ở mục 3.7"]]},{"ten":"Boss","truong":[["Nơi","Station Cinder, khoang máy C6 (phòng lõi năng lượng) sau cửa D1"],["Sinh lực (một mình)","600"],["Pha","2"],["Cơ chế chính","Pha 1 (từ đầy tới khi đứt hết 3 Neo hoặc Sinh lực dưới 50%): quấn quanh lõi, thân giữ bằng 3 Neo xúc tu trên tường. Bắn Lao từ vào một Neo rồi giữ 2 s để giật đứt (bị đánh thì hủy). Mỗi Neo đứt thì Scrapmaw Choáng 4 s, thân đánh được. Ở pha 1 thân chỉ nhận sát thương khi đang Choáng (xúc tu quấn che thân). Đòn: quét xúc tu nón 120 độ tầm 4 (8 Oxy, báo trước 0,8, hồi chiêu 4), phun 2 DL-G04 (hồi chiêu 20, tối đa 3 con sống). Pha 2: rời lõi, thân nhận sát thương mọi lúc, vẫn nối với lõi bằng một Dây nối (xúc tu dài, gốc cố định sát lõi giữa phòng). Đuổi người chơi, lao húc thẳng 5 u với 10 u/s (10 Oxy, báo trước 1,0, hồi chiêu 5). Không phun bầy. Lõi phóng điện vòng bán kính 4 u quanh lõi mỗi 10 s (8 Oxy, báo trước 1,3 bằng lõi sáng dần, vòng đỏ trên sàn hiện bán kính). Scrapmaw dính phóng điện thì Choáng 6 s: đây là cách duy nhất làm nó Bất lực ở pha 2, người chơi dụ nó vào vùng lõi lúc lõi sáng"],["Cách kết","Hạ: Sinh lực về 0 bằng Lao từ. Xua đi: Dây nối có 2 đoạn. Mỗi lần Scrapmaw Choáng 6 s ở pha 2 do phóng điện, Tương tác giữ 3 s ở gốc Dây nối (sát lõi, tầm 1,5 u) cắt được 1 đoạn. Cắt đoạn thứ hai khi Sinh lực boss dưới 50% thì boss bỏ đi. Đoạn đầu cắt được ở mọi mức Sinh lực. Đoạn thứ hai chỉ cắt được khi Sinh lực boss dưới 50%, kiểm lúc bắt đầu giữ phím: còn từ 50% trở lên thì gốc Dây nối hiện dấu khóa và giữ Tương tác không chạy. Đoạn đã cắt giữ tới hết trận, chỉ về lại 2 đoạn khi boss hồi đầy theo luật 36. Cắt đoạn đầu không đổi hành vi boss: vẫn đuổi, húc và dính phóng điện như cũ. Như vậy Xua đi cần cùng lượng giao chiến như hạ, không phải đường tắt. Phóng điện đã tắt và boss đang choáng nên không có đòn nào hủy thao tác, trừ DL-G04 còn sót từ pha 1. Không cần dụng cụ chương 2"],["Thời lượng mục tiêu một mình","1 đến 2 phút"]]},{"ten":"Phòng boss","truong":[["Phòng","Station Cinder, khoang máy C6"],["Kích thước","16 x 12 u"],["Thứ trong phòng gd-combat cần","3 điểm neo xúc tu trên tường, lõi năng lượng giữa phòng"]]}],"bangCon":[]},{"ma":"BS-2","ten":"Tempest Gulper","tenPhu":"","nhan":"Sau MVP","mau":"","anh":"","phan":[{"ten":"Danh mục sơ bộ (cho vai khác đọc sớm)","truong":[["Tên","Tempest Gulper"],["Dải","Map nhánh Station Lantern (Vành đai trong), vành ngoài trạm"],["Cỡ","Boss"],["Kiểu","Gulper đầu đàn vây Lantern, cắt đường tiếp tế"],["Bắt sống","Hai cách kết"],["Nuôi","Không"],["Rơi khi hạ (nhóm)","Theo cách kết"],["Nhãn","Sau MVP"]]},{"ten":"Điểm sinh và rơi (cho gd-world, gd-items)","truong":[["Chương","2"],["Nơi (gd-world, gd-story)","Station Lantern, vành ngoài trạm"],["Rơi khi hạ","SMP-291 Đặc sản Tempest Gulper, cộng phế liệu nó đã nuốt"],["Rơi khi xua đi","SMP-292 Mẫu boss Vành đai trong"]]},{"ten":"Boss","truong":[["Nơi","Station Lantern, bến cập hàng ở vành ngoài"],["Sinh lực (một mình)","900"],["Pha","2"],["Cơ chế chính","Pha 1: nuốt kiện hàng const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// Gắn loại và nhóm cho từng mục, bảng mã -> mục để mã trong chữ thành link.
const MUC = [];
for (const l of DATA.loai) for (const g of l.nhom) for (const m of g.muc) {
  m.loai = l; m.nhom = g; m.truong = m.phan.flatMap((p) => p.truong);
  m.tim = [m.ma, m.ten, m.tenPhu, ...m.truong.map((t) => t[1])].join(' ').toLowerCase();
  MUC.push(m);
}
const THEO_MA = new Map(MUC.map((m) => [m.ma, m]));
const RE_MA = new RegExp(`\\b(${[...THEO_MA.keys()].sort((a, b) => b.length - a.length).join('|')})\\b`, 'g');

// Chữ trong GDD: mã thành link, `mã` thành code, mã màu thành ô màu, **đậm**.
const md = (s, bo = '') => esc(s)
  .replace(RE_MA, (ma) => ma === bo ? ma : `<a class="lien" href="#${THEO_MA.get(ma).loai.id}/${ma}" title="${esc(THEO_MA.get(ma).ten)}">${ma}</a>`)
  .replace(/`(#[0-9A-Fa-f]{6})`/g, '<span class="chip" style="--c:$1"><i></i><code>$1</code></span>')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
const laMvp = (n) => /^MVP/.test(n);
const theNhan = (n) => n ? `<span class="the ${laMvp(n) ? 'mvp' : 'sau'}">${esc(n.length > 14 ? (laMvp(n) ? 'MVP' : 'Sau MVP') : n)}</span>` : '';
const chuCai = (t) => t.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
// Mục không có màu nhận diện lấy màu theo tên nhóm, cùng nhóm cùng màu.
const mauNhom = (t) => `hsl(${[...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7)} 45% 55%)`;
const mauCua = (m) => m.mau || mauNhom(m.nhom.ten);

let loc = '', tu = '';

function duongDan() {
  const [l, ma] = decodeURIComponent(location.hash.slice(1)).split('/');
  const loai = DATA.loai.find((x) => x.id === l) || DATA.loai[0];
  return { loai, ma };
}

function veDanhSach() {
  const { loai, ma } = duongDan();
  $('#loai').innerHTML = DATA.loai.map((l) => `<a href="#${l.id}" ${l === loai ? 'aria-current="page"' : ''}>${esc(l.ten)}</a>`).join('');
  const q = tu.trim().toLowerCase();
  const nhieu = loai.nhom.length > 6;
  const html = loai.nhom.map((g) => {
    const muc = g.muc.filter((m) => (!loc || (loc === 'mvp') === laMvp(m.nhan)) && (!q || m.tim.includes(q)));
    if (!muc.length) return '';
    // Loại nhiều nhóm thì chỉ mở nhóm đang xem, trừ khi đang tìm.
    const mo = !nhieu || q || muc.some((m) => m.ma === ma);
    return `<details class="nhom-ds" ${mo ? 'open' : ''}><summary>${esc(g.ten)} <span>${muc.length}</span></summary>${muc.map((m) => `
      <a class="dong" href="#${loai.id}/${m.ma}" ${m.ma === ma ? 'aria-current="true"' : ''}>
        ${m.anh
          ? `<span class="cham co-anh" style="background-image:url('${esc(m.anh)}')" aria-hidden="true"></span>`
          : `<span class="cham" style="--c:${mauCua(m)}" aria-hidden="true">${esc(chuCai(m.ten))}</span>`}
        <span><b>${esc(m.ten)}</b><small>${esc(m.ma)}</small></span>${theNhan(m.nhan)}
      </a>`).join('')}</details>`;
  }).join('');
  $('#ds').innerHTML = html || '<div class="rong">Không có mục nào khớp.</div>';
}

function veHoSo() {
  const { loai, ma } = duongDan();
  const m = THEO_MA.get(ma)?.loai === loai ? THEO_MA.get(ma) : (matchMedia('(max-width: 860px)').matches ? null : loai.nhom[0].muc[0]);
  document.body.classList.toggle('chi-tiet', !!ma && !!m);
  if (!m) { $('#xem').innerHTML = ''; document.title = 'The Novent Wiki'; return; }
  const c = mauCua(m);
  // Ô nhanh chỉ cho giá trị ngắn, giá trị dài đã có ở các phần bên dưới.
  const nhanh = loai.nhanh.map((k) => m.truong.find((t) => t[0] === k && t[1].length <= 60)).filter(Boolean).slice(0, 4);
  const mauTruong = m.truong.find((t) => /màu nhận diện/i.test(t[0]));
  document.title = `${m.ten} - The Novent Wiki`;
  $('#xem').innerHTML = `
    <button class="lui" onclick="location.hash='${loai.id}'">&larr; Danh sách</button>
    <article class="ho-so" style="--c:${c}">
      <div class="dau-hs ${m.anh ? '' : 'khong-anh'}">
        <div class="anh">${m.anh ? `<button type="button" aria-label="Xem ảnh lớn" onclick="phongTo('${esc(m.anh)}')"><img src="${esc(m.anh)}" alt="Concept ${esc(m.ten)}"></button>` : ''}</div>
        <div class="tom">
          <div class="o-chu" aria-hidden="true">${esc(chuCai(m.ten))}</div>
          <div class="cot-tom">
            <div class="ma">${esc(m.ma)} · ${esc(m.nhom.ten)} ${theNhan(m.nhan)}</div>
            <h1>${esc(m.ten)}</h1>
            ${m.tenPhu ? `<div class="phu">${md(m.tenPhu)}</div>` : ''}
            ${mauTruong ? `<div class="mau">${m.mau ? '<i></i>' : ''}<span>${md(mauTruong[1])}</span></div>` : ''}
            ${nhanh.length ? `<dl class="nhanh">${nhanh.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${md(v, m.ma)}</dd></div>`).join('')}</dl>` : ''}
          </div>
        </div>
      </div>
      <div class="than">
        ${m.phan.map((p) => `<h2>${esc(p.ten)}</h2>
          <dl class="truong">${p.truong.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${md(v, m.ma)}</dd>`).join('')}</dl>`).join('')}
        ${m.bangCon.map((b) => `<h2>${esc(b.ten)}</h2><div class="cuon"><table class="bang-con">
          <thead><tr>${b.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${b.rows.map((r) => `<tr>${b.head.map((_, k) => `<td>${md(r[k] || '', m.ma)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('')}
        ${m.nhom.ghiChu.length ? `<details class="ghi-chu"><summary>Ghi chú chung cho nhóm ${esc(m.nhom.ten)}</summary>${m.nhom.ghiChu.map((p) => `<p>${md(p)}</p>`).join('')}</details>` : ''}
        <div class="nguon">Nguồn: ${esc(m.nhom.nguon)}. Trang sinh từ GDD, sửa ở GDD rồi chạy lại tools/xuat-wiki.mjs.</div>
      </div>
    </article>`;
}

function phongTo(src) {
  const d = $('#phong');
  d.querySelector('img')?.remove();
  d.insertAdjacentHTML('beforeend', `<img src="${esc(src)}" alt="Concept phóng to">`);
  d.showModal();
}
